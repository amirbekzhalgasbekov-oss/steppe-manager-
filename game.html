<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Прототип</title>
<style>
  :root { --bg:#14181d; --panel:#1d232b; --line:#2c3541; --text:#e8edf2; --blue:#2f6bff; --red:#e23b3b; --dim:#8b97a5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.25 system-ui, sans-serif; overflow:hidden; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  canvas { display:block; background:#000; touch-action:none;
    image-rendering:crisp-edges; image-rendering:pixelated; }
  #ui { background:var(--panel); border-top:1px solid var(--line); padding:8px;
    padding-bottom:max(8px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:6px; }
  .row > button { flex:1; }
  #rowTools { flex-wrap:wrap; }
  #rowTools > button { flex:1 1 30%; min-height:38px; font-size:12px; }
  button { min-height:42px; border:1px solid var(--line); border-radius:10px; background:#262e38;
    color:var(--text); font:inherit; font-weight:600; padding:0 8px; }
  button:active { filter:brightness(1.3); }
  button.on { background:#34404e; box-shadow:inset 0 0 0 2px #fff; }
  .tab[data-team="0"].on { box-shadow:inset 0 0 0 2px var(--blue); }
  .tab[data-team="1"].on { box-shadow:inset 0 0 0 2px var(--red); }
  button.go { background:#2a8a52; border-color:#2a8a52; }
  #btnMenu, #btnSnd, #btnErase { flex:0 0 48px; }
  .sq { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; }
  .sq.b { background:var(--blue); } .sq.r { background:var(--red); }

  /* главное меню */
  #menu { position:fixed; inset:0; z-index:10; background:var(--bg); overflow:auto; }
  .menu-inner { max-width:520px; margin:0 auto; padding:18px 14px 28px; display:flex; flex-direction:column; gap:10px; }
  h1 { margin:6px 0 0; font:800 24px/1.1 ui-monospace, Menlo, monospace; letter-spacing:.5px; text-align:center; }
  .sub { margin:0 0 6px; text-align:center; color:var(--dim); }
  h2 { margin:10px 0 0; font-size:13px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .cards, .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { padding:6px; text-align:left; display:flex; flex-direction:column; gap:4px; height:auto; }
  .card canvas { width:100%; height:auto; aspect-ratio:16/9; border-radius:6px; }
  .card .nm, .chip .nm { font-weight:700; }
  .card .ds, .chip .ds { font-weight:400; font-size:12px; color:var(--dim); }
  .chip { padding:8px 10px; text-align:left; display:flex; flex-direction:column; gap:2px; height:auto; }
  .chips.b .chip.on { box-shadow:inset 0 0 0 2px var(--blue); }
  .chips.r .chip.on { box-shadow:inset 0 0 0 2px var(--red); }
  .card.on { box-shadow:inset 0 0 0 2px #fff; }
  .hint { font-size:12px; color:var(--dim); min-height:15px; }
  button.big { min-height:52px; font-size:17px; margin-top:12px; }
  button:disabled { opacity:.4; }
  .cam { position:absolute; top:6px; right:6px; display:flex; flex-direction:column; flex-wrap:wrap-reverse; align-content:flex-start; max-height:calc(100% - 12px); gap:6px; z-index:2; }
  .cam button { width:40px; height:40px; min-height:40px; padding:0; font-size:20px; background:rgba(29,35,43,.85); }
  .modes { display:flex; gap:6px; } .modes button { flex:1; }
  .chip.done .nm::after { content:' ✓'; color:#5fd38a; }
  .chips .chip.on { box-shadow:inset 0 0 0 2px #fff; }
  #campBox, #sandBox { display:flex; flex-direction:column; gap:10px; }
  /* одержимость: джойстик слева, кнопки справа */
  #possUI { position:absolute; inset:0; z-index:3; pointer-events:none; }
  #possUI > * { pointer-events:auto; touch-action:none; }
  #joy { position:absolute; left:12px; bottom:12px; width:104px; height:104px; border-radius:50%;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35); }
  #joyKnob { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%;
    background:rgba(255,225,74,.75); border:2px solid #fff; pointer-events:none; }
  #possUI .pb { position:absolute; border-radius:50%; min-height:0; padding:0; font-size:22px; line-height:1;
    background:rgba(29,35,43,.88); border:2px solid rgba(255,255,255,.5); }
  #pAtk { right:12px; bottom:12px; width:74px; height:74px; font-size:30px; background:rgba(226,59,59,.85); }
  #pDash { right:96px; bottom:14px; width:50px; height:50px; }
  #pVol { right:78px; bottom:72px; width:50px; height:50px; }
  #pShout { right:14px; bottom:96px; width:50px; height:50px; }
  #pExit { left:8px; top:8px; width:auto; border-radius:10px; font-size:13px; padding:8px 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="480" height="270"></canvas>
    <div class="cam">
      <button id="camIn" title="Приблизить">＋</button>
      <button id="camOut" title="Отдалить">－</button>
      <button id="camRotL" title="Повернуть влево">↺</button>
      <button id="camRot" title="Повернуть вправо">↻</button>
      <button id="camView" title="Вид: мягко / 2:1">◇</button>
      <button id="camReset" title="Сбросить вид">◎</button>
    </div>
    <div id="possUI" hidden>
      <button id="pExit" class="pb">✖ Выйти</button>
      <div id="joy"><div id="joyKnob"></div></div>
      <button id="pDash" class="pb">⚡</button>
      <button id="pVol" class="pb">💥</button>
      <button id="pShout" class="pb">📣</button>
      <button id="pAtk" class="pb">⚔</button>
    </div>
  </div>
  <div id="ui">
    <div class="row">
      <button class="tab" data-team="0"><i class="sq b"></i><span class="nm"></span> <b id="c0">0</b></button>
      <button class="tab" data-team="1"><i class="sq r"></i><span class="nm"></span> <b id="c1">0</b></button>
      <button id="btnErase" title="Стереть">⌫</button>
    </div>
    <div class="row" id="rowTools"></div>
    <div class="row">
      <button id="btnMenu">☰</button>
      <button id="btnSnd">🔊</button>
      <button id="btnAuto">Авто</button>
      <button id="btnClear">Очистить</button>
      <button id="btnGo" class="go">⚔ Старт</button>
      <button id="btnSpeed" hidden>×1</button>
      <button id="btnPoss" hidden>👁 Одержимость</button>
      <button id="btnReset" hidden>Заново</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="menu-inner">
    <h1 id="title"></h1>
    <p class="sub">Песочница массовых сражений</p>
    <div class="modes"><button id="btnModeCamp">Кампания</button><button id="btnModeSand">Песочница</button></div>
    <h2>Вид камеры</h2>
    <div class="chips" id="viewChips"></div>
    <div class="hint">Камера: щипок двумя пальцами — зум, двумя пальцами по кругу — поворот. Кнопки ↺ ↻ и ◇ справа, на клавиатуре Q/E.</div>
    <div id="sandBox">
    <h2>Карта</h2>
    <div class="cards" id="mapCards"></div>
    <h2><i class="sq b"></i>Синие · слева</h2>
    <div class="chips b" id="facBlue"></div>
    <div class="chips b" id="eraBlue"></div>
    <div class="hint" id="hintBlue"></div>
    <h2><i class="sq r"></i>Красные · справа</h2>
    <div class="chips r" id="facRed"></div>
    <div class="chips r" id="eraRed"></div>
    <div class="hint" id="hintRed"></div>
    </div>
    <div id="campBox" hidden>
      <h2>Эпоха</h2>
      <div class="chips" id="campEras"></div>
      <h2>Уровни</h2>
      <div class="chips" id="campLevels"></div>
      <h2><i class="sq b"></i>Ваша армия</h2>
      <div class="chips b" id="campFacs"></div>
      <div class="hint" id="hintCamp"></div>
    </div>
    <button id="btnSndMenu"></button>
    <button id="btnPlay" class="go big">▶ Играть</button>
  </div>
</div>

const MAP_SCALE = 1.5;   // размер поля относительно базового 480x270: 1.5 даёт 720x405
const W = Math.round(480 * MAP_SCALE), H = Math.round(270 * MAP_SCALE), CELL = 16;
const COLS = Math.ceil(W / CELL), ROWS = Math.ceil(H / CELL);

const cam = { x: W / 2, y: H / 2, z: 1, ang: 0, angT: 0 };   // ang: текущий угол поворота, angT: к какому углу он плавно едет
const ZMIN = 0.25, ZMAX = 6, UNIT_SX = 0.85, UNIT_SY = 0.85, SLIM_FRONT = 0.6, SLIM_SIDE = 0.8, TAU = Math.PI * 2, SNAP_ROT = true;      // SNAP_ROT: после жеста поворота камера доезжает до ближайших 90°
// Вид: K = во сколько раз сплюснута глубина. 0.5 = классическая изометрия 2:1, 0.7 = мягче (камера выше).
const VIEWS = { iso: { K: 0.5, nm: '2:1', ds: 'Классическая изометрия' }, soft: { K: 0.7, nm: 'Мягко', ds: 'Камера выше, больше обзора' } };
let viewMode = 'soft';
try { const v = localStorage.getItem('ula-view'); if (VIEWS[v]) viewMode = v; } catch (e) { /* localStorage может быть недоступен */ }
let viewK = VIEWS[viewMode].K;
// Размер экрана (холста) не равен размеру мира: на телефоне поле стоит вертикально (армии сверху и снизу) и занимает весь экран.
let SW = 480, SH = 270, PORTRAIT = false;
function fitZoom() { const w = (W + H) * Math.SQRT1_2, h = w * VIEWS[viewMode].K + 10; return Math.max(ZMIN, Math.min(SW / w, SH / h) * 0.96); }
function resetCam() { cam.x = W / 2; cam.y = H / 2; cam.ang = ((cam.ang % TAU) + TAU + Math.PI) % TAU - Math.PI; cam.angT = 0; cam.z = fitZoom(); }
// Мир -> экран: поворот на угол камеры + 45°, затем сплющивание по вертикали в K раз. cos/sin кэшируем.
let _ta = NaN, _tc = 1, _ts = 0;
function trig() { if (_ta !== cam.ang) { _ta = cam.ang; const t = cam.ang + Math.PI / 4; _tc = Math.cos(t); _ts = Math.sin(t); } }
function rv(dx, dy) {   // вектор мира -> направление на экране
  trig(); return [dx * _tc - dy * _ts, (dx * _ts + dy * _tc) * viewK];
}

function calcCost(t) {       // цена из характеристик: живучесть × эффективный урон в секунду
  const eff = Math.min(t.dmg, 40) * Math.min(t.pierce || 1, 3) * (t.salvo || 1) * (t.acc || 1) * (t.splash ? 1.5 : 1) * (t.burn ? 1.4 : 1);
  const dps = eff / t.cd, rm = t.range <= 10 ? 1 : 1 + t.range / 200, sm = 1 + t.speed / 100;
  return Math.max(3, Math.round(Math.sqrt(t.hp * dps * rm * sm) * 0.9));
}

  return scaledRoles(fac, scale).reduce((a, r) => a + r.n * FACTIONS[fac].units[r.type].cost, 0);

}

function setMap(i) {
  MAP = MAPS[i];
  for (let y = 0; y <= H; y++) { rcLUT[y] = mapCx(MAP, y); rhLUT[y] = mapHw(MAP, y); }
  resetCam();
  crossPen = !MAP.river ? 0 : MAP.bridges ? 3600 : 625;
  resetTerrain();
}
setMap(0);

// Вода ли в точке. m > 0: «глубокая» вода (для утопления): на мосту допускается заступ за край.
// Мосты: вода везде в русле, кроме полос мостов. Лёд: вода только на обрушенных отрезках.
function isWater(x, y, m = 0) {
  if (!MAP.river) return false;
  const c = riverCenter(y), h = riverHalf(y);
  if (Math.abs(x - c) >= h - (MAP.bridges ? m : 0)) return false;
  if (MAP.bridges) {
    const hb = MAP.bridgeW / 2 + m;
    for (const by of MAP.bridges) if (Math.abs(y - by) <= hb) return false;
    return true;
  }
  return iceBroken[iceSeg(y)] === 1;
}

// Можно ли пересечь реку на высоте y: на мосту или по целому льду.
function canCross(y) {
  if (MAP.bridges) { const hb = MAP.bridgeW / 2; for (const by of MAP.bridges) if (Math.abs(y - by) <= hb) return true; return false; }
  return !iceBroken[iceSeg(y)];
}

// Куда идти юниту, чтобы добраться до цели. null: идти прямо; false: пути нет;
// иначе точка-маршрут (подход к мосту или шаг поперёк реки). Вода юнитам не путь.
function routeGoal(u, tg) {
  const cu = riverCenter(u.y), su = u.x < cu;
  if (su === (tg.x < riverCenter(tg.y))) return null;
  const dir = su ? 1 : -1;
  if (Math.abs(u.x - cu) < riverHalf(u.y) + 6 && canCross(u.y)) { goal.x = u.x + dir * 30; goal.y = u.y; return goal; }
  let best = -1, bs = Infinity;
  for (const cy of crossList) {
    const c = riverCenter(cy);
    const s = Math.hypot(u.x - c, u.y - cy) + Math.hypot(tg.x - c, tg.y - cy);
    if (s < bs) { bs = s; best = cy; }
  }
  if (best < 0) return false;
  goal.x = riverCenter(best) - dir * (riverHalf(best) + 4.5); goal.y = best;
  return goal;
}

// Шаг с учётом воды: в воду не заходим, вдоль берега скользим.
function tryMove(u, mx, my) {
  if (!MAP.river) { u.x += mx; u.y += my; return; }
  const nx = u.x + mx, ny = u.y + my;
  if (MAP.bridges && isWater(u.x, u.y)) {   // зашёл за край моста (давка): выбираемся обратно на доски, а не бредём по воде
    let by = MAP.bridges[0];
    for (const b of MAP.bridges) if (Math.abs(b - u.y) < Math.abs(by - u.y)) by = b;
    u.y += Math.max(-0.8, Math.min(0.8, by - u.y));
    return;
  }
  if (!isWater(nx, ny) || isWater(u.x, u.y)) { u.x = nx; u.y = ny; }
  else if (!isWater(nx, u.y)) u.x = nx;
  else if (!isWater(u.x, ny)) u.y = ny;
}

const units = [], ghosts = [], projs = [], parts = [], blasts = [];
let shake = 0;   // тряска экрана от взрывов
const alive = [0, 0];
const gridAll = Array.from({ length: COLS * ROWS }, () => []);
const gridTeam = [0, 1].map(() => Array.from({ length: COLS * ROWS }, () => []));

function sideOK(team, x, y) {
  if (x < 6 || x > W - 6 || y < 6 || y > H - 6) return false;
  const c = riverCenter(y), h = riverHalf(y) + 7;
  return team === 0 ? x < c - h : x > c + h;
}

function colorOf(u) { return SIDE_COLORS[u.team][u.t.shade]; }

function makeUnit(team, fac, typeIdx, x, y) {
  const t = FACTIONS[fac].units[typeIdx];
  return { team, fac, typeIdx, t, x, y, hp: t.hp, target: null, dead: false,
           retarget: Math.random() * 0.4, atk: Math.random() * t.cd, flash: 0, kvx: 0, kvy: 0, fx: team === 0 ? 1 : -1, fy: 0, swing: 0, mv: 0, ph: (Math.random() * 2) | 0 };
}

function countAlive() {
  alive[0] = alive[1] = 0; spent = 0;
  for (const u of units) { alive[u.team]++; if (u.team === 0) spent += u.t.cost; }
}

function cellIndex(x, y) {
  let cx = (x / CELL) | 0, cy = (y / CELL) | 0;
  if (cx < 0) cx = 0; else if (cx >= COLS) cx = COLS - 1;
  if (cy < 0) cy = 0; else if (cy >= ROWS) cy = ROWS - 1;
  return cy * COLS + cx;
}

function rebuildGrids() {
  for (const g of gridAll) g.length = 0;
  for (const t of gridTeam) for (const g of t) g.length = 0;
  for (const u of units) {
    const c = cellIndex(u.x, u.y);
    gridAll[c].push(u);
    gridTeam[u.team][c].push(u);
  }
}

// Ближайший враг: обходим кольца клеток сетки от юнита наружу.
function nearestEnemy(u) {
  const g = gridTeam[1 - u.team];
  const c0 = cellIndex(u.x, u.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
  const maxR = Math.max(COLS, ROWS);
  let best = null, bd = Infinity;
  const pen = (crossPen && u.t.range <= 10) ? crossPen : 0, su = u.x < riverCenter(u.y);   // ближний бой предпочитает врагов на своём берегу
  for (let r = 0; r <= maxR; r++) {
    for (let gy = cy - r; gy <= cy + r; gy++) {
      if (gy < 0 || gy >= ROWS) continue;
      const edge = (gy === cy - r || gy === cy + r);
      const stepX = edge ? 1 : 2 * r;
      for (let gx = cx - r; gx <= cx + r; gx += stepX) {
        if (gx < 0 || gx >= COLS) continue;
        const cell = g[gy * COLS + gx];
        for (let i = 0; i < cell.length; i++) {
          const o = cell[i];
          if (o.dead) continue;
          const dx = o.x - u.x, dy = o.y - u.y;
          let d = dx * dx + dy * dy;
          if (pen && (o.x < riverCenter(o.y)) !== su) d += pen;
          if (d < bd) { bd = d; best = o; }
        }
      }
    }
    if (best && bd <= r * CELL * r * CELL) break;
  }
  return best;
}

// ---- эффекты боя ----
// Частица: цвет c меняется на c2 во второй половине жизни; top — рисуется поверх юнитов; fade — плавно тает.
function fx(x, y, vx, vy, life, c, c2, sz, o) {
  if (parts.length >= 2000) return;
  parts.push({ wx: x, wy: y, x: 0, y: 0, vx, vy, life, max: life, c, c2: c2 || c, sz, g: o && o.g || 0, d: o && o.d || 0.96,
               grow: o && o.grow || 0, top: !!(o && o.top), fade: !!(o && o.fade) });
}
const rnd = () => Math.random();

// Пыль и дым от земли: мягкие облачка, которые растут и тают.
function puff(x, y, n, color) {
  for (let i = 0; i < n; i++)
    fx(x + (rnd() - 0.5) * 3, y, (rnd() - 0.5) * 14, -2 - rnd() * 8, 0.5 + rnd() * 0.4, color, color, 2, { g: 12, d: 0.94, grow: 2.5, fade: true });
}
function smoke(x, y, n, sz, vx, vy) {
  const cols = ['#e6e6e6', '#c4c4c4', '#9a9a9a'];
  for (let i = 0; i < n; i++)
    fx(x + (rnd() - 0.5) * 3, y + (rnd() - 0.5) * 3, vx + (rnd() - 0.5) * 12, vy + (rnd() - 0.5) * 12 - 4, 0.6 + rnd() * 0.5,
       cols[(rnd() * 3) | 0], '#7d7d7d', sz, { d: 0.93, grow: 5, fade: true });
}
// Искры: яркие короткие чёрточки, летят по направлению удара.
function sparks(x, y, n, dx, dy, sp) {
  [dx, dy] = rv(dx, dy);
  const cols = ['#ffffff', '#fff2a8', '#ffc83a'];
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, v = sp * (0.4 + rnd() * 0.6);
    fx(x, y, Math.cos(a) * v + dx * sp * 0.6, Math.sin(a) * v + dy * sp * 0.6, 0.12 + rnd() * 0.16,
       cols[(rnd() * 3) | 0], '#ff8a1e', 1, { d: 0.88, top: true });
  }
}
// Осколки убитого юнита: пиксели цвета его стороны разлетаются и падают.
function shards(u, dx, dy, knock) {
  [dx, dy] = rv(dx, dy);
  const cols = [SIDE_COLORS[u.team][u.t.shade], SIDE_COLORS[u.team][1], '#ffffff'];
  for (let i = 0; i < 6; i++) {
    const a = rnd() * 6.283, v = 22 + rnd() * 50;
    fx(u.x, u.y, Math.cos(a) * v + dx * knock * 0.3, Math.sin(a) * v + dy * knock * 0.3 - 18, 0.35 + rnd() * 0.3,
       cols[(rnd() * 3) | 0], cols[0], rnd() < 0.35 ? 2 : 1, { g: 75, d: 0.94, top: true });
  }
}
// Вспышка выстрела: белая вспышка у дула, искры вперёд и дым.
function muzzle(x, y, ux, uy, gun) {
  const [rx, ry] = rv(ux, uy);
  const big = gun === 2, px = x + ux * (big ? 5 : 3), py = y + uy * (big ? 5 : 3);
  fx(px, py, 0, 0, big ? 0.1 : 0.07, '#ffffff', '#ffb02e', big ? 5 : 3, { top: true });
  const n = big ? 7 : 3;
  for (let i = 0; i < n; i++) {
    const a = Math.atan2(ry, rx) + (rnd() - 0.5) * (big ? 0.7 : 0.4), v = (big ? 70 : 90) * (0.5 + rnd() * 0.7);
    fx(px, py, Math.cos(a) * v, Math.sin(a) * v, 0.1 + rnd() * 0.12, i % 2 ? '#fff2a8' : '#ffc83a', '#ff8a1e', 1, { d: 0.9, top: true });
  }
  smoke(px, py, big ? 6 : 3, big ? 3 : 2, rx * (big ? 18 : 10), ry * (big ? 18 : 10));
}
// Взрыв ядра: огненный шар, ударная волна, искры, дым и тряска экрана.
function blast(x, y, R, big) {
  blasts.push({ x, y, R, life: big ? 0.42 : 0.28, max: big ? 0.42 : 0.28, big });
  const n = big ? 16 : 6;
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, v = (big ? 25 : 15) + rnd() * (big ? 55 : 30);
    fx(x, y, Math.cos(a) * v, Math.sin(a) * v, 0.25 + rnd() * 0.25, i % 2 ? '#ffe27a' : '#ff9a2e', '#c24a1c', 2, { d: 0.9, top: true });
  }
  sparks(x, y, big ? 10 : 4, 0, 0, big ? 130 : 90);
  smoke(x, y, big ? 7 : 2, big ? 3 : 2, 0, -6);
  shake = Math.min(1.6, shake + (big ? 0.5 : 0.12));
}
// Хвост дыма за летящим ядром.
function trail(x, y) { fx(x, y, 0, -3, 0.35, '#b4b4b4', '#6e6e6e', 2, { d: 0.9, grow: 3, fade: true }); }

// dx, dy, knock: направление и сила выстрела, убитый юнит отлетает в эту сторону.
function hit(target, dmg, dx = 0, dy = 0, knock = 0) {
  if (target.dead) return;
  target.hp -= dmg;
  target.flash = 0.09;
  if (target.hp <= 0) {
    target.dead = true;   // без крови: юнит просто тает и поднимает пыль
    ghosts.push({ x: target.x, y: target.y, size: target.t.size, color: colorOf(target), life: GHOST_LIFE,
                  vx: dx * knock, vy: dy * knock });
    puff(target.x, target.y, 3, MAP.dust);
    shards(target, dx, dy, knock);
    sparks(target.x, target.y, 3, dx, dy, 50);
    Snd.play('death', target.x);
  } else sparks(target.x, target.y, 2, dx, dy, 40);
}

// Попадание ядра: полный урон цели и половина соседним врагам в радиусе.
function ignite(u, b) {   // стрела застряла: горит, урон тиками; новые стрелы усиливают и продлевают огонь
  if (u.dead) return;
  u.burnN = Math.min(4, (u.burnN || 0) + 1);
  u.burnD = b.dps * u.burnN; u.burnT = b.dur;
  if (u.burnTick === undefined || u.burnTick <= 0) u.burnTick = 0.5;
}
function splash(p) {
  hit(p.target, p.dmg);
  const g = gridTeam[1 - p.team];
  const c0 = cellIndex(p.x, p.y), cx = c0 % COLS, cy = (c0 / COLS) | 0, r2 = p.splash * p.splash;
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      const cell = g[gy * COLS + gx];
      for (let i = 0; i < cell.length; i++) {
        const o = cell[i];
        if (o.dead || o === p.target) continue;
        const dx = o.x - p.x, dy = o.y - p.y;
        if (dx * dx + dy * dy <= r2) hit(o, p.dmg * (p.smul || 0.5));
      }
    }
  }
  blast(p.x, p.y, Math.max(8, p.splash || 10), true);
  puff(p.x, p.y, 3, MAP.dust);
}

// Случайный живой враг рядом с целью (в соседних клетках сетки): по ним разлетаются стрелы залпа.
function pickNear(tg, team) {
  const g = gridTeam[1 - team], c0 = cellIndex(tg.x, tg.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
  const pool = [];
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      for (const o of g[gy * COLS + gx]) if (!o.dead) pool.push(o);
    }
  }
  return pool.length ? pool[(Math.random() * pool.length) | 0] : tg;
}

// Пуля или ядро летит по прямой и убивает до p.pierce врагов на пути. Шаг мелкий, чтобы не проскочить сквозь юнита.
// Возвращает true, когда снаряд закончил полёт.
function stepLine(p, dt) {
  const dist = Math.min(p.speed * dt, p.left);
  const n = Math.max(1, Math.ceil(dist / 3)), sd = dist / n;
  const g = gridTeam[1 - p.team], rr = p.gun === 2 ? 2.5 : 1.5;
  let done = false;
  for (let s = 0; s < n && !done; s++) {
    p.x += p.dx * sd; p.y += p.dy * sd; p.left -= sd;
    const c0 = cellIndex(p.x, p.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
    for (let gy = cy - 1; gy <= cy + 1 && !done; gy++) {
      if (gy < 0 || gy >= ROWS) continue;
      for (let gx = cx - 1; gx <= cx + 1 && !done; gx++) {
        if (gx < 0 || gx >= COLS) continue;
        const cell = g[gy * COLS + gx];
        for (let i = 0; i < cell.length; i++) {
          const o = cell[i];
          if (o.dead || o.hitBy === p) continue;
          const ex = o.x - p.x, ey = o.y - p.y, reach = o.t.size / 2 + rr;
          if (ex * ex + ey * ey > reach * reach) continue;
          o.hitBy = p; p.hits++;
          hit(o, p.dmg, p.dx, p.dy, p.knock);
          if (p.burn) ignite(o, p.burn);
          Snd.play(p.hitSfx || (p.gun === 2 ? 'boom' : 'bullet'), o.x);
          puff(o.x, o.y, 2, MAP.dust);
          if (p.gun === 2) blast(o.x, o.y, 6, false);
          if (--p.pierce <= 0) { done = true; break; }
        }
      }
    }
    if (p.left <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) done = true;
  }
  if (p.gun === 2 && Math.random() < 0.7) trail(p.x - p.dx * 2, p.y - p.dy * 2);
  if (done && !p.hits && p.gun === 1) Snd.play('whiz', p.x);   // пуля ушла мимо
  return done;
}

function separate(u) {
  const c0 = cellIndex(u.x, u.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      const cell = gridAll[gy * COLS + gx];
      for (let i = 0; i < cell.length; i++) {
        const o = cell[i];
        if (o === u || o.dead) continue;
        const dx = u.x - o.x, dy = u.y - o.y;
        const md = (u.t.size + o.t.size) / 2 + 0.5;
        const d2 = dx * dx + dy * dy;
        if (d2 >= md * md) continue;
        if (d2 < 0.0001) { u.x += Math.random() - 0.5; u.y += Math.random() - 0.5; continue; }
        const d = Math.sqrt(d2), push = (md - d) * 0.5;
        u.x += dx / d * push; u.y += dy / d * push;
      }
    }
  }
}

function drown(u) {
  u.dead = true;
  ghosts.push({ x: u.x, y: u.y, size: u.t.size, color: colorOf(u), life: GHOST_LIFE, vx: 0, vy: 0 });
  puff(u.x, u.y, 4, '#e4f4fb');
  for (let i = 0; i < 8; i++)
    fx(u.x, u.y, (rnd() - 0.5) * 36, -30 - rnd() * 40, 0.45 + rnd() * 0.3, i % 2 ? '#cfeefc' : '#ffffff', '#6fb8d6', 1 + (i % 3 === 0), { g: 110, d: 0.97, top: true });
  Snd.play('splash', u.x);
}

function breakIce(s) {
  iceBroken[s] = 1; iceStress[s] = 1;
  updateCrossings();
  const y0 = s * ICE_SEG, y1 = Math.min(H, y0 + ICE_SEG);
  for (let k = 0; k < 34; k++) {
    const y = y0 + Math.random() * (y1 - y0), h = riverHalf(y), x = riverCenter(y) + (Math.random() * 2 - 1) * h;
    const a = rnd() * 6.283, v = 15 + rnd() * 55;
    fx(x, y, Math.cos(a) * v, Math.sin(a) * v - 25, 0.5 + rnd() * 0.5, k % 3 ? '#e4f4fb' : '#ffffff', '#9fd0e6', 2, { g: 80, d: 0.95, top: true });
  }
  shake = Math.min(1.6, shake + 0.5);
  Snd.play('icebreak', riverCenter((y0 + y1) / 2));
  toast('Лёд проломился!');
}

// Опасности реки: нагрузка на лёд и утопление (упали с моста в давке, провалились под лёд).
function terrainStep(dt) {
  if (!MAP.river) return;
  if (MAP.ice) {
    iceLoad.fill(0);
    let aliveAll = 0;
    for (const u of units) if (!u.dead) aliveAll++;
    if (aliveAll > icePeak) icePeak = aliveAll;
    ICE_CAP = Math.max(4, Math.round(icePeak / ICE_RATIO));
    for (const u of units) {
      if (u.dead) continue;
      if (Math.abs(u.x - riverCenter(u.y)) < riverHalf(u.y)) iceLoad[iceSeg(u.y)]++;
    }
    for (let s = 0; s < ICE_N; s++) {
      if (iceBroken[s]) continue;
      const before = iceStress[s], over = iceLoad[s] - ICE_CAP;
      iceStress[s] = over > 0 ? before + over * ICE_RATE * dt : Math.max(0, before - 0.25 * dt);
      if (before < 0.4 && iceStress[s] >= 0.4) Snd.play('crack', riverCenter((s + 0.5) * ICE_SEG));
      if (iceStress[s] >= 1) breakIce(s);
    }
  }
  for (const u of units) if (!u.dead && isWater(u.x, u.y, 1.5)) drown(u);
}

// Удар или выстрел юнита u по цели tg. tt: тип с изменёнными свойствами (для умений), по умолчанию тип юнита.
function doAttack(u, tg, tt) {
  const t = tt || u.t;
  if (t.range > 10) {
    const miss = t.acc && !u.player ? Math.random() > t.acc : false;
    const ox = miss ? (Math.random() - 0.5) * 16 : 0, oy = miss ? (Math.random() - 0.5) * 16 : 0;
    if (t.pierce) {
      // прямой выстрел: летит мимо цели дальше на pen пикселей и пробивает всех на линии
      const ax = tg.x + ox - u.x, ay = tg.y + oy - u.y, ad = Math.hypot(ax, ay) || 0.001;
      const ux = ax / ad, uy = ay / ad, shots = t.salvo || 1;
      for (let k = 0; k < shots; k++) {   // залп: снаряды расходятся веером
        const a = shots > 1 ? (k / (shots - 1) - 0.5) * (t.fan || 0.5) + (Math.random() - 0.5) * 0.06 : 0;
        const c = Math.cos(a), s = Math.sin(a), rx = ux * c - uy * s, ry = ux * s + uy * c;
        projs.push({ x: u.x, y: u.y, line: true, dx: rx, dy: ry, left: ad + (t.pen || 10), hits: 0,
                     pierce: t.pierce, dmg: t.dmg, team: u.team, speed: t.pspeed || 150,
                     gun: t.gun || 0, knock: t.knock || 0, hitSfx: t.hitSfx, fire: !!t.fire, burn: t.burn });
      }
      u.kvx -= ux * (t.recoil || 0) * 6; u.kvy -= uy * (t.recoil || 0) * 6;   // отдача назад
    } else {
      const shots = t.salvo || 1;   // залп стрел: первая в цель, остальные по врагам рядом
      for (let k = 0; k < shots; k++) {
        projs.push({ x: u.x, y: u.y, target: k ? pickNear(tg, u.team) : tg, dmg: t.dmg, team: u.team,

    s.start(t, Math.random() * 2); s.stop(t + dur + 0.02);

  function tone(d, t, dur, type, f0, f1, vol, att = 0.004) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); env(g, t, dur, vol, att);
    o.connect(g); g.connect(d);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // духовая нота: два слегка расстроенных пилообразных голоса + раскрывающийся фильтр
  function brass(t, f, dur, vol) {
    const d = bus(0, 1);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1;
    lp.frequency.setValueAtTime(f * 2, t);
    lp.frequency.linearRampToValueAtTime(f * 6, t + Math.min(0.2, dur / 2));
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.06);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(d);
    for (const det of [-7, 7]) {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    }
  }

  // дробь барабана, ускоряется и нарастает, в конце акцент
  function drumRoll(t) {
    const d = bus(0, 0.9);
    let tt = t;
    for (let i = 0; i < 16; i++) {
      noise(d, tt, 0.06, 'bandpass', 1700, 900, 1.1, 0.25 + i * 0.035);
      tone(d, tt, 0.06, 'triangle', 190, 120, 0.25);
      tt += 0.075 - i * 0.002;
    }
    noise(d, tt, 0.3, 'lowpass', 1200, 120, 0.8, 0.9);
    tone(d, tt, 0.35, 'sine', 90, 40, 0.9);
  }

  // ---- каталог звуков ----
  const SFX = {
    melee:  { gap: 0.03, vol: 0.30, dur: 0.12, fn(d, t, r) {         // копьё, меч, сабля
      noise(d, t, 0.07, 'bandpass', 2200 * r, 900 * r, 1.2, 0.9);
      tone(d, t, 0.08, 'triangle', 210 * r, 90 * r, 0.7);
      if (Math.random() < 0.4) tone(d, t, 0.06, 'sine', 1500 * r, 1100 * r, 0.18);  // лязг металла
    } },
    bow:    { gap: 0.05, vol: 0.28, dur: 0.20, fn(d, t, r) {         // выстрел из лука
      noise(d, t, 0.16, 'bandpass', 900 * r, 2600 * r, 1.5, 0.5, 0.02);
      tone(d, t, 0.09, 'triangle', 260 * r, 150 * r, 0.35);
    } },
    arrow:  { gap: 0.04, vol: 0.25, dur: 0.08, fn(d, t, r) {         // попадание стрелы
      noise(d, t, 0.05, 'bandpass', 2800 * r, 1800 * r, 2, 0.7);
      tone(d, t, 0.05, 'sine', 320 * r, 200 * r, 0.3);
    } },
    musket: { gap: 0.04, vol: 0.50, dur: 0.32, fn(d, t, r) {         // залп мушкета
      noise(d, t, 0.28, 'lowpass', 4200 * r, 350, 0.7, 1.0, 0.002);
      tone(d, t, 0.18, 'sine', 150 * r, 45, 0.9, 0.002);
    } },
    bullet: { gap: 0.035, vol: 0.22, dur: 0.10, fn(d, t, r) {        // попадание пули
      noise(d, t, 0.06, 'bandpass', 1500 * r, 700, 1.5, 0.8);
      tone(d, t, 0.05, 'sine', 240 * r, 130, 0.4);
    } },
    whiz:   { gap: 0.08, vol: 0.12, dur: 0.12, fn(d, t, r) {         // пуля пролетела мимо
      noise(d, t, 0.1, 'bandpass', 3200 * r, 1800 * r, 3, 0.8, 0.01);
    } },
    cannon: { gap: 0.12, vol: 0.90, dur: 1.00, fn(d, t, r) {         // выстрел пушки
      noise(d, t, 0.9, 'lowpass', 1400 * r, 70, 0.7, 1.0, 0.004);
      tone(d, t, 0.8, 'sine', 85 * r, 28, 1.2, 0.004);
      tone(d, t, 0.25, 'sawtooth', 120 * r, 40, 0.25);
    } },
    boom:   { gap: 0.06, vol: 0.55, dur: 0.42, fn(d, t, r) {         // разрыв ядра
      noise(d, t, 0.38, 'lowpass', 900 * r, 90, 0.7, 1.0);
      tone(d, t, 0.3, 'sine', 100 * r, 38, 1.0);
    } },
    ballista: { gap: 0.15, vol: 0.45, dur: 0.30, fn(d, t, r) {       // баллиста: щелчок и гулкий бросок
      tone(d, t, 0.2, 'triangle', 140 * r, 70, 0.9, 0.002);
      noise(d, t, 0.12, 'bandpass', 700 * r, 300, 1.2, 0.7);
      tone(d, t, 0.08, 'sawtooth', 900 * r, 300, 0.2, 0.002);
    } },
    trebuchet: { gap: 0.2, vol: 0.5, dur: 0.60, fn(d, t, r) {        // требюше: скрип и глухой удар
      noise(d, t, 0.4, 'bandpass', 300 * r, 900 * r, 3, 0.5, 0.05);
      tone(d, t, 0.3, 'sine', 90 * r, 45, 1.0, 0.01);
    } },
    splash: { gap: 0.05, vol: 0.30, dur: 0.30, fn(d, t, r) {         // упал в воду
      noise(d, t, 0.25, 'lowpass', 1800 * r, 300, 0.8, 0.9, 0.01);
      tone(d, t, 0.2, 'sine', 300 * r, 120, 0.3);
    } },
    crack:  { gap: 0.12, vol: 0.35, dur: 0.15, fn(d, t, r) {         // лёд трещит
      noise(d, t, 0.05, 'highpass', 2500 * r, 4000, 2, 0.9, 0.001);
      tone(d, t, 0.06, 'square', 1800 * r, 700, 0.2, 0.001);
    } },
    icebreak: { gap: 0.2, vol: 0.7, dur: 0.8, fn(d, t, r) {          // лёд проламывается
      noise(d, t, 0.6, 'lowpass', 2200 * r, 150, 0.8, 1.0, 0.002);
      tone(d, t, 0.5, 'sine', 120 * r, 35, 1.0, 0.003);
      noise(d, t, 0.15, 'highpass', 3000, 5000, 1.5, 0.6, 0.001);
    } },
    death:  { gap: 0.05, vol: 0.20, dur: 0.16, fn(d, t, r) {         // гибель юнита
      tone(d, t, 0.14, 'sine', 170 * r, 60, 0.7);
      noise(d, t, 0.1, 'lowpass', 700, 200, 0.7, 0.4);
    } },
    click:  { gap: 0.03, vol: 0.12, dur: 0.06, fn(d, t, r) {         // кнопки интерфейса
      tone(d, t, 0.04, 'square', 560 * r, 400, 0.8, 0.002);
    } },
    place:  { gap: 0.035, vol: 0.18, dur: 0.07, fn(d, t, r) {        // поставить юнита
      tone(d, t, 0.05, 'triangle', 380 * r, 300, 0.8, 0.002);
    } },
    hwacha: { gap: 0.15, vol: 0.5, dur: 0.6, fn(d, t, r) {           // хвачха: свист залпа огненных стрел
      noise(d, t, 0.5, 'bandpass', 600 * r, 2800 * r, 1.2, 0.8, 0.03);
      for (let i = 0; i < 4; i++) tone(d, t + i * 0.03, 0.1, 'triangle', 300 * r, 150, 0.25);
    } },
    mg:     { gap: 0.045, vol: 0.30, dur: 0.09, fn(d, t, r) {        // пулемёт: короткая сухая очередь
      noise(d, t, 0.06, 'lowpass', 3800 * r, 500, 0.8, 1.0, 0.001);
      tone(d, t, 0.05, 'sine', 190 * r, 70, 0.6, 0.001);
    } },
    erase:  { gap: 0.06, vol: 0.25, dur: 0.10, fn(d, t, r) {         // стереть
      noise(d, t, 0.08, 'bandpass', 1200 * r, 500, 1, 0.8);
    } },
  };

  function take(dur) {   // общий лимит голосов, чтобы армия в 800 юнитов не убила телефон
    const now = ac.currentTime;
    for (let i = ends.length - 1; i >= 0; i--) {
      if (ends[i] <= now) { ends[i] = ends[ends.length - 1]; ends.pop(); }
    }
    if (ends.length >= MAX_VOICES) return false;
    ends.push(now + dur);
    return true;
  }

  function play(name, x = W / 2) {
    if (ac && !muted && ac.state !== 'running') wake();
    if (!ac || muted || ac.state !== 'running') return;
    const s = SFX[name];
    if (!s) return;
    const now = ac.currentTime;
    if (now - (lastAt[name] === undefined ? -1 : lastAt[name]) < s.gap * gapMul) return;
    if (!take(s.dur)) return;
    lastAt[name] = now;
    const r = 0.88 + Math.random() * 0.24;
    const pan = Math.max(-1, Math.min(1, (x / W * 2 - 1) * 0.75));
    try { s.fn(bus(pan, s.vol), now + 0.005, r); } catch (e) { /* не даём одному звуку убить остальные */ }
  }

  // старт боя: рог в древности, барабанная дробь в эпоху пороха
  function start(modern) {
    if (!ac || muted || ac.state !== 'running') return;
    const t = ac.currentTime + 0.02;
    if (modern) drumRoll(t);
    else { brass(t, 110, 1.1, 0.35); brass(t + 0.5, 165, 1.3, 0.35); }
  }

  // конец боя: фанфара победителя или низкий долгий гудок при ничьей
  function end(winner, modern) {
    if (!ac || muted || ac.state !== 'running') return;
    const t = ac.currentTime + 0.1;
    if (winner < 0) { brass(t, 98, 1.6, 0.3); return; }
    if (modern) {
      [[261.6, 0], [329.6, 0.22], [392, 0.44], [523.3, 0.66]].forEach(([f, dt], i) => brass(t + dt, f, i === 3 ? 1.4 : 0.3, 0.28));
    } else {
      [[146.8, 0], [220, 0.5], [293.7, 1.0]].forEach(([f, dt], i) => brass(t + dt, f, i === 2 ? 1.6 : 0.6, 0.3));
    }
  }

  function applyScene() {
    if (!ac) return;
    const now = ac.currentTime, windy = scene.windy;
    ambF.type = windy ? 'lowpass' : 'bandpass';
    ambF.Q.value = windy ? 0.7 : 0.6;
    ambF.frequency.setTargetAtTime(windy ? 500 : 900, now, 0.3);
    ambG.gain.setTargetAtTime(scene.on ? (windy ? 0.10 : 0.06) : 0, now, 0.5);
  }

  return {
    init, play, start, end,
    scene(on, windy) { scene = { on, windy: !!windy }; applyScene(); },   // фон: ветер (windy) или река
    din(n) { if (ac) dinG.gain.setTargetAtTime(Math.min(1, n / 500) * 0.16, ac.currentTime, 0.4); },
    speed(s) { gapMul = s; },
    isMuted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('ula-mute', muted ? '1' : '0'); } catch (e) { /* не страшно */ }
      if (!muted) { if (!ac) init(); else { wake(); setTimeout(() => { if (ac && !muted && ac.state !== 'running') rebuild(); }, 300); } }
      if (master && ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(muted ? 0 : VOL, ac.currentTime, 0.05); master.gain.value = muted ? 0 : VOL; }
      return muted;
    },
    suspend() { if (ac && ac.state === 'running') ac.suspend(); },
    resume() { wake(); },
    watchdog,
    rebuild,
  };
})();

// Браузер даёт включить звук только после жеста пользователя.
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => Snd.init(), { capture: true, passive: true }));
window.addEventListener('focus', () => Snd.resume());
window.addEventListener('pageshow', () => Snd.resume());
setInterval(() => Snd.watchdog(), 1000);   // сторож: звук не должен молча пропадать
document.addEventListener('visibilitychange', () => { document.hidden ? Snd.suspend() : (Snd.resume(), setTimeout(Snd.watchdog, 700)); });

const rowTools = document.getElementById('rowTools');

const btn = id => document.getElementById(id);
const tabs = document.querySelectorAll('.tab');

let mode = 'camp', msgNew = '';   // camp: кампания, sand: песочница
let state = 'menu';             // menu → setup → battle → done

let speed = 1, acc = 0, winner = -1, snapshot = null, msg = null;

try {
  const s = JSON.parse(localStorage.getItem('ula-cfg6'));
  const a = s && s.fac ? FI(s.fac[0]) : -1, b = s && s.fac ? FI(s.fac[1]) : -1;
  if (s && MAPS[s.map] && a >= 0 && b >= 0) { cfg.map = s.map; cfg.fac = [a, b]; }
} catch (e) { /* localStorage может быть недоступен */ }

// Эпоха пороха, если хоть у одной стороны не древность: от этого зависят рог/барабан и фанфара.
function isModern() { return cfg.fac.some(f => FACTIONS[f].modern); }

// Фон каждой карты рисуем один раз: земля, берега, река, декор.
function paintBackground(map) {
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  let bctx = bg.getContext('2d');
  const bgCtx = bctx; map.decor = []; let curSpr = null;
  const sprBegin = () => { curSpr = document.createElement('canvas'); curSpr.width = 16; curSpr.height = 14; bctx = curSpr.getContext('2d'); };
  const sprEnd = (wx, wy, ax, ay, ns) => { map.decor.push({ x: wx, y: wy, c: curSpr, ax, ay, ns }); bctx = bgCtx; };
  const img = bctx.createImageData(W, H);
  const px = new Uint32Array(img.data.buffer);
  let seed = 12345;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const pack = h => (255 << 24) | (parseInt(h.slice(5, 7), 16) << 16) | (parseInt(h.slice(3, 5), 16) << 8) | parseInt(h.slice(1, 3), 16);
  const hexShade = (h, k) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * k))).toString(16).padStart(2, '0')).join('');
  const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], texSeed = map.name.length * 7919;
  const gh = (i, j) => { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + texSeed) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const vn = (x, y, s) => { const gx = x / s, gy = y / s, i = Math.floor(gx), j = Math.floor(gy), fx = gx - i, fy = gy - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = gh(i, j), b = gh(i + 1, j), c = gh(i, j + 1), d = gh(i + 1, j + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  const deepG = pack(hexShade(map.ground[1], 0.82));   // самые тёмные пятна
  const ground = map.ground.map(pack), bank = map.bank.map(pack), water = map.water.map(pack), ripple = pack(map.ripple);
  for (let y = 0; y < H; y++) {
    const c = mapCx(map, y), h = mapHw(map, y);
    for (let x = 0; x < W; x++) {
      const dist = Math.abs(x - c), r = rnd();
      let col;
      if (dist < h) col = r < 0.04 ? ripple : water[r < 0.5 ? 0 : 1];
      else if (map.river && dist < h + 5 + rnd() * 2) col = bank[r < 0.5 ? 0 : 1];
      else {
        const nz = vn(x, y, 56) * 0.55 + vn(x, y, 22) * 0.33 + vn(x, y, 8) * 0.12;   // крупные пятна + мелкая зернистость
        const lv = nz + (B4[(x & 3) + ((y & 3) << 2)] / 16 - 0.5) * 0.2 + (r - 0.5) * 0.05;   // дизеринг на границах пятен
        col = lv < 0.3 ? deepG : lv < 0.42 ? ground[1] : lv > 0.68 ? ground[2] : ground[0];
      }
      px[y * W + x] = col;
    }
  }
  bctx.putImageData(img, 0, 0);

  if (map.bridges) {   // мосты: доски поперёк движения, перила по краям
    for (const by of map.bridges) {
      const y0 = Math.round(by - map.bridgeW / 2), y1 = Math.round(by + map.bridgeW / 2);
      for (let y = y0; y <= y1; y++) {
        const c = mapCx(map, y), h = mapHw(map, y);
        const x0 = Math.round(c - h) - 3, x1 = Math.round(c + h) + 3;
        const rail = y <= y0 + 1 || y >= y1 - 1;
        for (let x = x0; x <= x1; x++) {
          const k = x & 3;
          bctx.fillStyle = rail ? (k === 0 ? '#3a2a18' : '#4a3622') : k === 3 ? '#6b4f2c' : k === 1 ? '#a3824d' : '#92713f';
          bctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }
  if (map.ice) {   // трещинки и блики на льду
    for (let i = 0; i < 70; i++) {
      const y = rnd() * H, c = mapCx(map, y), h = mapHw(map, y);
      const x = c - h + 2 + rnd() * (h * 2 - 8), len = 3 + ((rnd() * 5) | 0);
      bctx.fillStyle = rnd() < 0.5 ? '#8fc0d8' : '#ffffff';
      bctx.fillRect(Math.round(x), Math.round(y), len, 1);
    }
  }

  if (map.firs) {   // ёлки по краям поля (просто украшение, не мешают войскам)
    const pts = [];
    for (let i = 0; i < 110 && pts.length < 70; i++) {
      const zone = (rnd() * 4) | 0;
      const x = zone === 2 ? rnd() * 14 : zone === 3 ? W - 8 - rnd() * 14 : rnd() * (W - 8);
      const y = zone === 0 ? rnd() * 14 : zone === 1 ? H - 12 - rnd() * 14 : rnd() * (H - 12);
      if (Math.abs(x + 3 - mapCx(map, y)) < mapHw(map, y) + 16) continue;
      pts.push([Math.round(x), Math.round(y)]);
    }
    pts.sort((a, b) => a[1] - b[1]);
    for (const [x0, y0] of pts) {
      const x = 0, y = 0; sprBegin();
      bctx.fillStyle = '#4a3622'; bctx.fillRect(x + 3, y + 9, 1, 2);
      bctx.fillStyle = '#2f6b3f';
      bctx.fillRect(x + 3, y, 1, 1); bctx.fillRect(x + 2, y + 1, 3, 1); bctx.fillRect(x + 1, y + 2, 5, 1);
      bctx.fillRect(x + 2, y + 3, 3, 1); bctx.fillRect(x + 1, y + 4, 5, 1); bctx.fillRect(x, y + 5, 7, 1);
      bctx.fillRect(x + 1, y + 6, 5, 1); bctx.fillRect(x, y + 7, 7, 1); bctx.fillRect(x, y + 8, 7, 1);
      bctx.fillStyle = '#ffffff';
      bctx.fillRect(x + 3, y, 1, 1); bctx.fillRect(x + 2, y + 2, 1, 1); bctx.fillRect(x + 4, y + 4, 1, 1); bctx.fillRect(x + 1, y + 7, 2, 1);
      sprEnd(x0 + 3.5, y0 + 11, 3.5, 11);
    }
  }
  if (map.yurts) {   // юрты на степных краях поля (украшение)
    const pts = [];
    for (let i = 0; i < 80 && pts.length < 14; i++) {
      const zone = (rnd() * 4) | 0;
      const x = zone === 2 ? rnd() * 16 : zone === 3 ? W - 12 - rnd() * 16 : rnd() * (W - 12);
      const y = zone === 0 ? rnd() * 14 : zone === 1 ? H - 10 - rnd() * 14 : rnd() * (H - 10);
      if (Math.abs(x + 4 - mapCx(map, y)) < mapHw(map, y) + 18) continue;
      if (pts.some(p => Math.abs(p[0] - x) < 14 && Math.abs(p[1] - y) < 10)) continue;
      pts.push([Math.round(x), Math.round(y)]);
    }
    pts.sort((a, b) => a[1] - b[1]);
    for (const [x0, y0] of pts) {
      const x = 0, y = 0; sprBegin();
      bctx.fillStyle = '#d8d0b8';
      bctx.fillRect(x + 3, y, 3, 1); bctx.fillRect(x + 2, y + 1, 5, 1);
      bctx.fillStyle = '#e8e2d0';
      bctx.fillRect(x + 1, y + 2, 7, 1); bctx.fillRect(x, y + 3, 9, 3);
      bctx.fillStyle = '#b9a67a'; bctx.fillRect(x + 1, y + 2, 7, 1);
      bctx.fillStyle = '#5a4630'; bctx.fillRect(x + 4, y + 4, 2, 2);
      sprEnd(x0 + 4.5, y0 + 6, 4.5, 6);
    }
  }
  // новые карты: деревья по краям поля (украшение, не мешают войскам). Число в карте = сколько деревьев.
  const TREES = {
    olives(x, y) {
      bctx.fillStyle = '#6b5237'; bctx.fillRect(x + 3, y + 5, 1, 3);
      bctx.fillStyle = '#7d8f4a';
      bctx.fillRect(x + 1, y + 1, 5, 1); bctx.fillRect(x, y + 2, 7, 3); bctx.fillRect(x + 1, y + 5, 5, 1);
      bctx.fillStyle = '#a3b36a'; bctx.fillRect(x + 2, y + 2, 1, 1); bctx.fillRect(x + 4, y + 3, 1, 1);
    },
    poplars(x, y) {
      bctx.fillStyle = '#5a4630'; bctx.fillRect(x + 2, y + 9, 1, 2);
      bctx.fillStyle = '#3f7a3a'; bctx.fillRect(x + 2, y, 2, 10); bctx.fillRect(x + 1, y + 2, 4, 6);
      bctx.fillStyle = '#6fae5a'; bctx.fillRect(x + 2, y + 1, 1, 3); bctx.fillRect(x + 1, y + 4, 1, 2);
    },
    sakura(x, y) {

// Знак на казахском знамени: симметричный узор из рогов барана (внизу), узла и крыльев, венчает трёхзубая «корона»
const KZ_EMB = ['...X...', '.X.X.X.', '.XXXXX.', 'XX.X.XX', 'X.XXX.X', '.XX.XX.', 'X.X.X.X', 'XX...XX'];
function drawFlag(u, now, z, dir8) {
  const F = FLAGS[u.t.fname]; if (!F) return;
  const front = dir8 === 0 || dir8 === 1, left = dir8 === 3 || dir8 === 5 || dir8 === 7, right = !left;   // в профиль полотнище тянется назад
  const px = Math.round(u._sx + (front ? 4 : (left ? -1 : 1)) * z), pyB = Math.round(u._sy - 8 * z), pyT = Math.round(u._sy - 34 * z);
  const k = Math.max(1, Math.round(z));
  ctx.fillStyle = '#5a3c1e'; ctx.fillRect(px, pyT, k, pyB - pyT);
  ctx.fillStyle = '#e8c33a'; ctx.fillRect(px - k, pyT - 2 * k, 3 * k, 2 * k);   // навершие
  if (F.fin === 'wolf') {   // золотая волчья голова на навершии (кыпчаки)
    const W = ['X.X..', 'XXXX.', '.XXXX', '..XX.'], d = (front || !left) ? 1 : -1;
    ctx.fillStyle = '#e8c33a';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) if (W[r][c] === 'X') ctx.fillRect(px + (d > 0 ? c - 2 : 2 - c) * k, pyT - (6 - r) * k, k, k);
  }
  const cw = 13, ch = 9, dir = front ? 1 : (left ? 1 : -1);
  for (let i = 0; i < cw; i++) {
    const wave = Math.sin(now * 5 + i * 0.55 + u.ph * 2) * (0.4 + i * 0.12);
    const x0 = px + dir * (k + Math.round(i * z)) - (dir < 0 ? Math.round(z) : 0);
    for (let j = 0; j < ch; j++) {
      const nn = F.c.length, idx = F.v ? Math.min(nn - 1, Math.floor(i / (cw / nn))) : Math.min(nn - 1, Math.floor(j / (ch / nn)));
      ctx.fillStyle = F.c[idx];
      if (F.bd && (j === 0 || j === ch - 1 || i === cw - 1)) ctx.fillStyle = F.bd;   // кайма по краю
      if (F.em) { const E = F.em === 1 ? KZ_EMB : F.em, r = E[j - (F.ey || 0)]; const ch2 = r && r[i - (F.ex === undefined ? 3 : F.ex)]; if (ch2 && F.pal && F.pal[ch2]) ctx.fillStyle = F.pal[ch2]; else if (ch2 === 'X') ctx.fillStyle = F.ec || '#ffffff'; }   // белый знак в центре (7×8 клеток)
      ctx.fillRect(x0, Math.round(pyT + (j + wave) * z), Math.max(1, Math.round(z)) + 1, Math.max(1, Math.round(z)));
    }
  }
}

    const open = eraOpen(e), n = eraLevels(e).length;
    const ds = !campAvail(e) ? '🔒 скоро' : !open ? '🔒 пройдите прошлую эпоху' : 'Пройдено ' + eraSt(e).best + ' / ' + n;
    er.appendChild(chip(e, ds, (open && eraDone(e) ? 'done ' : '') + (e === camp.era ? 'on' : ''), !open, () => { camp.era = e; saveCamp(); refreshCamp(); }));
  });
  btn('btnPlay').disabled = !camp.era;
  if (!camp.era) { btn('hintCamp').textContent = ''; return; }
  const e = camp.era, st = eraSt(e);
  eraLevels(e).forEach((L, i) => {
    const locked = i > st.best;
    lv.appendChild(chip((i + 1) + '. ' + MAPS[L.map].name + ' · ' + FACTIONS[L.enemy].name,
      locked ? '🔒 пройдите предыдущий' : 'Бюджет ' + Math.round(armyCost(L.enemy, L.es) * L.pr) + ' · враг ' + Math.round(armyCost(L.enemy, L.es)),
      (i < st.best ? 'done ' : '') + (i === st.sel ? 'on' : ''), locked, () => { st.sel = i; refreshCamp(); }));
  });
  eraFacs(e).forEach(i => {
    const f = FACTIONS[i], ok = st.unlocked.includes(i);
    fc.appendChild(chip(ok ? f.name : '🔒 ' + f.name, ok ? f.nation : 'откроется победой над ней', i === st.fac ? 'on' : '', !ok,
      () => { st.fac = i; saveCamp(); refreshCamp(); }));
  });
  const f = FACTIONS[st.fac];
  btn('hintCamp').textContent = (f.trait ? f.trait + '. ' : '') + f.units.map(u => u.name + ' ' + u.cost).join(' · ');
}
function startLevel() {
  if (!camp.era || !eraOpen(camp.era)) return;
  const e = camp.era, st = eraSt(e), L = eraLevels(e)[st.sel];
  if (!L) return;
  curLevel = L; curEra = e;
  cfg.map = L.map; cfg.fac = [st.fac, L.enemy];
  setMap(cfg.map); clearField();
  autoFormation(1, L.enemy, L.es);
  budget = Math.round(armyCost(L.enemy, L.es) * L.pr);
  countAlive(); snapshot = null; msgNew = '';
  tool = { team: 0, type: 0 }; speed = 1; state = 'setup';
  menu.hidden = true;
  Snd.scene(true, MAP.wind);
  renderTools(); refreshUI(); resize();
  toast(e + ', уровень ' + (st.sel + 1) + ': расставьте армию');
}
function onBattleEnd() {
  if (mode !== 'camp' || winner !== 0 || !curLevel) return;
  const L = curLevel, e = curEra, st = eraSt(e), lv = eraLevels(e), i = lv.indexOf(L);
  msgNew = '';
  if (i === st.best) { st.best++; if (i < lv.length - 1) st.sel = i + 1; }
  if (!st.unlocked.includes(L.enemy)) { st.unlocked.push(L.enemy); msgNew = 'Открыта армия: ' + FACTIONS[L.enemy].name; }
  if (st.best >= lv.length) {   // эпоха пройдена: открылась ли следующая?
    const nx = ERAS.find(x => eraNo(x) > eraNo(e) && campAvail(x));
    if (nx && eraOpen(nx)) toast('Открыта эпоха: ' + nx);
  }
  saveCamp();
}

btn('btnPlay').onclick = () => {
  if (mode === 'camp') { startLevel(); return; }
  sandCfg = { map: cfg.map, fac: [cfg.fac[0], cfg.fac[1]] };
  try { localStorage.setItem('ula-cfg6', JSON.stringify({ map: cfg.map, fac: cfg.fac.map(i => FACTIONS[i].name) })); } catch (e) { /* не страшно */ }
  setMap(cfg.map);
  clearField();
  autoFormation(0, cfg.fac[0]); autoFormation(1, cfg.fac[1]);
  countAlive(); snapshot = null;
  tool = { team: 0, type: 0 }; speed = 1; state = 'setup';
  menu.hidden = true;
  Snd.scene(true, MAP.wind);   // Сибирь и Хуанхэ: ветер, Нил: река
  renderTools(); refreshUI(); resize();
};

function resize() {
  const r = stage.getBoundingClientRect();
  if (r.width < 50 || r.height < 50) return;
  const port = r.height > r.width, base = port ? 480 : 270;   // короткая сторона мира выбирает масштаб: поле всегда заполняет экран
  const changed = port !== PORTRAIT;
  PORTRAIT = port;
  SW = Math.max(160, Math.min(900, Math.round(base * r.width / r.height))); SH = base;
  if (canvas.width !== SW || canvas.height !== SH) { canvas.width = SW; canvas.height = SH; }
  canvas.style.width = Math.floor(r.width) + 'px';
  canvas.style.height = Math.floor(r.height) + 'px';
  if (changed || !resize.done) { resetCam(); resize.done = true; }
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

// ---- главный цикл ----
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  { const k = Math.min(1, dt * 9), da = cam.angT - cam.ang;   // плавный доворот камеры и плавная смена вида
    if (Math.abs(da) > 0.0005) cam.ang += da * k; else cam.ang = cam.angT;
    const dk = VIEWS[viewMode].K - viewK; viewK = Math.abs(dk) > 0.002 ? viewK + dk * k : VIEWS[viewMode].K; }
  if (state !== 'menu') {
    if (state === 'battle') {
      acc += dt * speed;
      let n = 0;
      while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
      if (n === 6) acc = 0;
      kbJoy();
      if (poss.u) {
        if (poss.u.dead) possEnd('Одержимый юнит погиб. Выбери нового кнопкой «Одержимость»');
        else {   // камера плавно следует за юнитом
          const k = Math.min(1, dt * 8);
          cam.x += (poss.u.x - cam.x) * k; cam.y += (poss.u.y - cam.y) * k; clampCam();
          updatePossHud();
        }
      }
      Snd.din(alive[0] + alive[1]);
      if (alive[0] === 0 || alive[1] === 0) {
        winner = alive[0] > 0 ? 0 : (alive[1] > 0 ? 1 : -1);
        state = 'done'; possEnd();
        onBattleEnd(); Snd.din(0); Snd.end(winner, isModern());
      }
      refreshUI();
    }
    updateFx(dt);
    if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
    draw();
  }
  requestAnimationFrame(frame);
}

setMap(cfg.map);
buildMenu(); refreshMenu();
requestAnimationFrame(frame);
</script>
