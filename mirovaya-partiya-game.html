<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Мировая партия</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=PT+Sans:wght@400;700&family=Russo+One&display=swap">
<style>
/* Раскладка: карта на весь экран, поверх неё плашка страны слева сверху, ресурсы справа сверху, круглые кнопки внизу и большая кнопка «следующий ход». Карточка выбранной страны снизу. Единая тёмная тема. */
:root{
  --deep:#0a1522; --ocean:#1c3a58; --panel:#0e1d2e; --panel2:#16304b; --line:#27496c;
  --ink:#eef4fa; --mute:#92abc4; --gold:#f3c14f; --you:#4cc0ff; --foe:#ff6a5c; --ok:#58d6a6;
  --f-d:"Russo One","Arial Black",Impact,sans-serif; --f-b:"PT Sans","Segoe UI",system-ui,sans-serif; --f-n:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --chip:rgba(10,21,34,.88);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--ink);font:15px/1.35 var(--f-b);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:var(--you)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;position:relative;min-height:0}
.board{background:repeating-conic-gradient(#12304d 0 25%,#173a5c 0 50%) 0 0/18px 18px}

#stage{position:relative;flex:1;min-height:0;background:var(--ocean);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* верхние плашки поверх карты */
.hud{position:absolute;left:0;right:0;top:0;padding-top:max(8px,env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;padding-bottom:4px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:10px;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.civ{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;min-width:0;max-width:56%}
#tFlag{font-size:28px;line-height:1;flex:none}
.civ .tx{min-width:0}
#tName{font:15px var(--f-d);letter-spacing:.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tSub{color:var(--mute);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-direction:column;gap:0;padding:4px 10px;font:700 13px var(--f-n);min-width:96px}
.stats[hidden]{display:none}
.stats div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 0}
.stats small{font:11px var(--f-b);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#sGold b{color:var(--gold)}
#sGold span{color:var(--ok);font-weight:500}
#prog{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(0,0,0,.35);pointer-events:none}
#prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--you)}
#prog u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold)}

/* нижние кнопки */
.dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock>*{pointer-events:auto}
.left{display:flex;flex-direction:column;gap:10px}
.topbtns{flex-basis:100%;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
.tb{font:500 12px/1 'PT Sans',system-ui,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tb:hover{border-color:var(--you)}
.rbtn{width:50px;height:50px;border-radius:50%;background:var(--chip);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4);padding:0}
.rbtn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.right{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.zoom{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.zoom button{width:44px;height:42px;border:0;background:none;font:700 20px var(--f-b);cursor:pointer}
.zoom button+button{border-top:1px solid var(--line)}
#bEnd{width:76px;height:76px;border-radius:50%;border:3px solid #fff2c9;background:var(--gold);color:#241a05;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.5);padding:0;gap:0}
#bEnd svg{width:30px;height:30px;stroke:#241a05;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#bEnd b{font:700 12px var(--f-n);margin-top:-1px}
#bEnd:active{transform:scale(.96)}
#toast{position:absolute;left:50%;top:max(64px,calc(env(safe-area-inset-top,0px) + 56px));transform:translateX(-50%);max-width:88%;background:var(--chip);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;z-index:5}
#toast.on{opacity:1}

/* карточка страны */
#sheet{flex:none;max-height:46%;overflow:auto;background:var(--panel);border-top:2px solid var(--line);border-radius:14px 14px 0 0;margin-top:-12px;position:relative;padding-top:12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));overscroll-behavior:contain;z-index:3}
#sheet .hint{color:var(--mute);margin:0;padding-block:4px}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h .fl{font-size:32px;line-height:1}
.sh-h h2{margin:0;font:18px var(--f-d);letter-spacing:.01em}
.sh-h small{display:block;color:var(--mute);font-size:12px}
.tag{display:inline-block;font:700 11px var(--f-n);padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.tag.you{background:var(--you);color:#04202f}.tag.foe{background:var(--foe);color:#2b0803}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.nums div{background:var(--panel2);padding:6px 8px;border-radius:6px}
.nums small{display:block;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.nums b{font:700 16px var(--f-n)}
.rl{display:flex;flex-direction:column;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.rl span{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:10px 12px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px;text-align:center}
.btn small{display:block;font:500 11px var(--f-n);color:var(--mute);margin-top:1px}
.btn.pri{background:var(--gold);color:#1b1405;border-color:transparent}
.btn.pri small{color:#4a3a10}
.btn.atk{background:#42191a;border-color:#8a2f2b}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.rbtn:focus-visible,#bEnd:focus-visible,.zoom button:focus-visible,.prow:focus-visible,#q:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.sec{font:700 11px var(--f-n);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:12px 0 4px}.cl{font-size:13px;margin:0 0 6px;line-height:1.4}.cl small{color:var(--mute);font-size:12px}.cl.mute{color:var(--mute)}.resbar{height:5px;background:var(--deep);border-radius:3px;margin:3px 0;overflow:hidden}.resbar i{display:block;height:100%;background:var(--foe)}.occ{margin-top:8px;font-size:13px}.occ-h{display:flex;justify-content:space-between;gap:8px}.occ-h b{font:700 13px var(--f-n);color:var(--foe)}
.tech{padding:7px 0;border-top:1px solid var(--line)}.tech-h{display:flex;justify-content:space-between;align-items:center}.tech small{color:var(--mute);font-size:12px}.pips{display:flex;gap:4px}.pips i{width:14px;height:8px;border-radius:2px;background:var(--deep);border:1px solid var(--line)}.pips i.on{background:var(--gold);border-color:var(--gold)}
.warn{color:var(--foe);font-size:13px;margin:8px 0 0}

/* выбор страны в начале партии */
#startp{display:none;flex:none;height:52%;background:var(--panel);border-top:2px solid var(--line);flex-direction:column;min-height:0;position:relative;z-index:3}
.starting #startp{display:flex}.starting #sheet,.starting .dock,.starting #prog{display:none}
#startp .hd{padding-block:10px 8px}
#startp h1{margin:0;font:21px var(--f-d);letter-spacing:.04em}
#startp p{margin:3px 0 0;color:var(--mute);font-size:13px}
#q{width:100%;margin-top:8px;background:var(--deep);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:8px;font:15px var(--f-b)}
#plist{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.prow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #15304b;padding:8px max(16px,env(safe-area-inset-left,0px));text-align:left;cursor:pointer}
.prow.on{background:var(--panel2)}
.prow .fl{font-size:22px;width:30px;text-align:center}
.prow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .st{font:500 12px var(--f-n);color:var(--mute);white-space:nowrap}
#startact{padding-block:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;gap:8px;border-top:1px solid var(--line)}
#startact .btn{flex:1}
#go{font-family:var(--f-d);letter-spacing:.03em}

#modal{position:fixed;inset:0;background:rgba(3,8,14,.78);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
#modal .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:440px;max-height:86%;display:flex;flex-direction:column}
#modal h2{margin:0;padding:14px 16px 8px;font:18px var(--f-d)}
#modal .body{padding:0 16px;overflow:auto;font-size:14px}
#modal .body p{margin:0 0 8px}
#modal .ev{padding:5px 0;border-top:1px solid var(--line);font-size:14px}
#modal .ev.you{color:var(--you)}
#modal .ev small{color:var(--mute);font-family:var(--f-n);font-size:11px;margin-right:6px}
#modal .macts{display:flex;gap:8px;padding:12px 16px 14px;flex-wrap:wrap}
#modal .macts .btn{flex:1;min-width:120px}
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:18px var(--f-d);letter-spacing:.06em;color:var(--ink)}
#boot small{font:13px var(--f-b);color:var(--mute);letter-spacing:0}
#boot[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.tag{background:#33506e;color:#dbe8f5}
.tag.ally{background:var(--ok);color:#04251a}
#bDip{position:relative}
#bDip.alert::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--foe);border:2px solid var(--deep)}
.armies{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.army{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;min-height:42px}
.army.on{border-color:var(--you);box-shadow:inset 0 0 0 1px var(--you)}
.army:disabled{opacity:.7;cursor:default}
.army b{font:700 14px var(--f-n)}
.opbar{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#d8504a,#e0a547 45%,#9aa6b2 50%,#58d6a6);margin:8px 0 10px}
.opbar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 2px var(--deep)}
.dlist{max-height:52vh;overflow:auto;margin:0 -16px}
.dlist .prow{padding-left:16px;padding-right:16px}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7f93a8;margin-right:6px}
.starting #mapui{display:none}
#mapui{position:absolute;left:0;right:0;top:calc(max(8px,env(safe-area-inset-top,0px)) + 82px);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:3}
#mapui[hidden]{display:none}
.mapbar{display:flex;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.mapbar[hidden]{display:none}
.mapbar::-webkit-scrollbar{display:none}
.mb{flex:none;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 11px;font:13px var(--f-b);cursor:pointer;white-space:nowrap}
.mb.on{background:var(--you);color:#06121f;border-color:var(--you);font-weight:700}
#rescap{margin:0 10px;align-self:flex-start;max-width:calc(100% - 20px);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.35;pointer-events:auto}
#rescap[hidden]{display:none}
.leg{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:4px;color:var(--mute)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mkb{padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:12px;margin-left:4px;cursor:pointer}
.mkb.pri{background:var(--gold);color:#241a05;border:0;font-weight:700}
.mk-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.mkt{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink);cursor:pointer}
.mkt.on{background:var(--you);color:#06121f;border-color:var(--you)}
.mkr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;width:100%;text-align:left;padding:7px 9px;margin:4px 0;border:1px solid var(--line);border-radius:10px;background:rgba(120,160,210,.07);color:var(--ink);cursor:pointer;font-size:13px}
.mkr.on{border-color:var(--you)}
.mkr span:nth-child(2){grid-column:1}.mkr span:nth-child(3){grid-row:1;grid-column:2}
.mkd{border:1px solid var(--you);border-radius:10px;padding:8px 10px;margin:0 0 8px;background:rgba(76,192,255,.07)}
.mkp{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.mk-n{color:var(--mute);font-size:12px;margin:6px 0}
.bad{color:var(--foe)}.ok{color:var(--ok)}
.rr{display:grid;grid-template-columns:1fr 70px 52px;gap:8px;align-items:center;padding:3px 0;font-size:13px}
.rr .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.rr .bar i{display:block;height:100%}
.rr b{text-align:right;font-family:var(--f-n);font-size:12px}
.rsl{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.rsl span{background:rgba(120,160,210,.14);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px}
.rgs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.rgs span{background:rgba(120,160,210,.14);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px}.rgs b{color:var(--mute);font-weight:700}
.sd.vassal,.sd.lord{background:#b58cff}.tag.vas{background:#b58cff;color:#1d0a3a}.sd.war{background:var(--foe)}.sd.ally{background:var(--ok)}.sd.pact,.sd.truce{background:var(--gold)}
</style>

<div id="app" class="starting">
  <main id="stage">
    <canvas id="map" tabindex="0" aria-label="Политическая карта мира"></canvas>
    <div id="prog"><i></i><u></u></div>
    <div class="hud gut">
      <div class="chip civ"><span id="tFlag">♜</span><div class="tx"><span id="tName">Мировая партия</span><span id="tSub">Глобальная стратегия</span></div></div>
      <div class="chip stats" id="stats" hidden>
        <div id="sGold"><small>Казна</small><span><b>0</b></span></div>
        <div id="sArmy"><small>Войска</small><b>0</b></div>
        <div id="sShare"><small>Мир</small><b>0%</b></div>
      </div>
      <div class="topbtns">
        <button class="tb" data-st="s">Система</button><button class="tb" data-st="e">Экономика</button><button class="tb" data-st="i">Идеология</button><button class="tb" id="bState">Территории</button>
      </div>
    </div>
    <div id="mapui" hidden><div id="rescap" hidden></div></div>
    <div class="dock gut">
      <div class="left">
        <button id="bMenu" class="rbtn" aria-label="Меню"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button id="bDip" class="rbtn" aria-label="Дипломатия"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
        <button id="bTech" class="rbtn" aria-label="Развитие"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/></svg></button>
        <button id="bMap" class="rbtn" aria-label="Карта"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></button>
        <button id="bLog" class="rbtn" aria-label="Журнал"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg></button>
      </div>
      <div class="right">
        <div class="zoom"><button id="zIn" aria-label="Приблизить">+</button><button id="zOut" aria-label="Отдалить">−</button><button id="zHome" aria-label="К моей стране">◎</button></div>
        <button id="bEnd" aria-label="Следующий ход"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b id="bEndN">1</b></button>
      </div>
    </div>
    <div id="toast" role="status"></div>
  </main>
  <section id="sheet" class="gut"></section>
  <section id="startp">
    <div class="hd gut board">
      <h1>МИРОВАЯ ПАРТИЯ</h1>
      <p>Выберите страну в списке или нажмите на карте</p>
      <input id="q" type="search" placeholder="Поиск страны" autocomplete="off">
    </div>
    <div id="plist"></div>
    <div id="startact" class="gut"><button id="cont" class="btn" hidden>Продолжить</button><button id="go" class="btn pri" disabled>Выберите страну</button></div>
  </section>
</div>
<div id="modal" hidden><div class="card"><h2 id="mT"></h2><div class="body" id="mB"></div><div class="macts" id="mA"></div></div></div>
<div id="boot" class="board"><span>МИРОВАЯ ПАРТИЯ</span><small>Рисую карту мира…</small></div>
<script>
(function(){'use strict';
/* ---------- Береговые линии (lon,lat), упрощённо ---------- */

/* ================= КАРТА: сетка, страны, соседи ================= */
const CPD=6,GW=360*CPD,GH=140*CPD,S=2,LAT0=83,BW=GW*S,BH=GH*S;
let C=[],CT=null,LANDM=null,baseC=null,ownC=null,emojiOK=false,flagsOn=false;const flagCache={};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const gx=lon=>(lon+180)*CPD, gy=lat=>(LAT0-lat)*CPD;

function buildLand(){
  const cv=mk(GW,GH),g=cv.getContext('2d');
  const trace=p=>{g.beginPath();for(let i=0;i<p.length;i+=2){const x=gx(p[i]),y=gy(p[i+1]);i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();g.fill();};
  g.fillStyle='#fff';LAND.forEach(trace);
  g.globalCompositeOperation='destination-out';SEAS.forEach(trace);
  const d=g.getImageData(0,0,GW,GH).data,L=new Uint8Array(GW*GH);
  for(let i=0;i<L.length;i++)L[i]=d[i*4+3]>127?1:0;
  return L;
}


function rast(p,arr,val){
  const n=p.length>>1,xs=new Float64Array(n),ys=new Float64Array(n);
  let y0=1e9,y1=-1e9;for(let i=0;i<n;i++){xs[i]=gx(p[i*2]);ys[i]=gy(p[i*2+1]);if(ys[i]<y0)y0=ys[i];if(ys[i]>y1)y1=ys[i];}
  const ya=Math.max(0,Math.floor(y0)),yb=Math.min(GH-1,Math.ceil(y1));
  for(let y=ya;y<=yb;y++){const yc=y+.5,xi=[];
    for(let i=0,j=n-1;i<n;j=i++){const a=ys[i],b=ys[j];if((a<=yc)!==(b<=yc))xi.push(xs[i]+(yc-a)/(b-a)*(xs[j]-xs[i]));}
    xi.sort((u,v)=>u-v);
    for(let k=0;k+1<xi.length;k+=2){const xa=Math.max(0,Math.ceil(xi[k]-.5)),xb=Math.min(GW-1,Math.floor(xi[k+1]-.5));for(let x=xa;x<=xb;x++)arr[y*GW+x]=val;}}
}

function buildCountries(){
  C=RAW.map((r,i)=>({i,iso:r[0],ru:r[1],eco:r[2],mil:r[3],col:r[4],sites:r[5].split('|').map(s=>s.split(',').map(Number)),hos:r[6],hog:r[7],nb:new Set()}));
  const SX=[],SY=[],SW=[],SC=[],MAIN=[];
  C.forEach(c=>c.sites.forEach((s,k)=>{SX.push(s[0]);SY.push(s[1]);SW.push(s[2]*s[2]);SC.push(c.i);if(k===0)MAIN[c.i]=SX.length-1;}));
  const NS=SX.length;
  const near=(lon,lat,cl)=>{let b=1e18,bi=0;for(let i=0;i<NS;i++){const dx=(lon-SX[i])*cl,dy=lat-SY[i];const d=(dx*dx+dy*dy)/SW[i];if(d<b){b=d;bi=i;}}return bi;};
  const CW=GW>>1,CH=GH>>1,co=new Uint16Array(CW*CH);
  for(let y=0;y<CH;y++){const lat=LAT0-(y+.5)*2/CPD,cl=Math.cos(lat*Math.PI/180);for(let x=0;x<CW;x++)co[y*CW+x]=near(-180+(x+.5)*2/CPD,lat,cl);}
  const siteOf=new Uint16Array(GW*GH);CT=new Uint8Array(GW*GH).fill(255);
  const PT=new Uint8Array(GW*GH).fill(255);
  {const idx={};C.forEach(c=>idx[c.iso]=c.i);BORD.forEach(([iso,polys])=>{const k=idx[iso];if(k===undefined)return;polys.forEach(q=>rast(q,PT,k));});}
  const cand=new Uint16Array(9);
  for(let y=0;y<GH;y++){const lat=LAT0-(y+.5)/CPD,cl=Math.cos(lat*Math.PI/180),cy=y>>1;
    for(let x=0;x<GW;x++){const i=y*GW+x;if(!LANDM[i])continue;
      if(PT[i]!==255){CT[i]=PT[i];siteOf[i]=MAIN[PT[i]];continue;}
      const lon=-180+(x+.5)/CPD,cx=x>>1;let n=0,b=1e18,bi=0;
      for(let yy=cy-1;yy<=cy+1;yy++){if(yy<0||yy>=CH)continue;for(let xx=cx-1;xx<=cx+1;xx++){if(xx<0||xx>=CW)continue;const s=co[yy*CW+xx];let dup=false;for(let k=0;k<n;k++)if(cand[k]===s){dup=true;break;}if(dup)continue;cand[n++]=s;
        const dx=(lon-SX[s])*cl,dy=lat-SY[s],d=(dx*dx+dy*dy)/SW[s];if(d<b){b=d;bi=s;}}}
      siteOf[i]=bi;CT[i]=SC[bi];}}
  // анклавы: куски страны, оторванные от основного и без собственной площадки, отдаём соседям по суше
  {
    const N=GW*GH,lab=new Int32Array(N).fill(-1),ord=new Int32Array(N),comps=[];let tot=0;
    for(let s=0;s<N;s++){if(CT[s]===255||lab[s]>=0)continue;
      const id=comps.length,co=CT[s],start=tot;let h=tot;ord[tot++]=s;lab[s]=id;let nonMain=false;
      while(h<tot){const i=ord[h++];if(siteOf[i]!==MAIN[co]||PT[i]!==255)nonMain=true;const x=i%GW;
        if(x>0&&CT[i-1]===co&&lab[i-1]<0){lab[i-1]=id;ord[tot++]=i-1;}
        if(x<GW-1&&CT[i+1]===co&&lab[i+1]<0){lab[i+1]=id;ord[tot++]=i+1;}
        if(i>=GW&&CT[i-GW]===co&&lab[i-GW]<0){lab[i-GW]=id;ord[tot++]=i-GW;}
        if(i<N-GW&&CT[i+GW]===co&&lab[i+GW]<0){lab[i+GW]=id;ord[tot++]=i+GW;}}
      comps.push({co,start,end:tot,nonMain});}
    const big={};comps.forEach((c,id)=>{if(!big[c.co]||c.end-c.start>comps[big[c.co]].end-comps[big[c.co]].start)big[c.co]=id;});
    comps.forEach((c,id)=>{if(big[c.co]===id||c.nonMain)return;
      const votes={};
      for(let k=c.start;k<c.end;k++){const i=ord[k],x=i%GW;const nb=[x>0?i-1:-1,x<GW-1?i+1:-1,i>=GW?i-GW:-1,i<N-GW?i+GW:-1];
        for(const j of nb){if(j<0)continue;const t=CT[j];if(t!==255&&t!==c.co)votes[t]=(votes[t]||0)+1;}}
      let bt=-1,bv=0;for(const t in votes)if(votes[t]>bv){bv=votes[t];bt=+t;}
      if(bt<0)return;
      for(let k=c.start;k<c.end;k++){CT[ord[k]]=bt;siteOf[ord[k]]=65535;}});
  }
  // убрать страны без клеток
  const cnt=new Int32Array(C.length);for(let i=0;i<CT.length;i++)if(CT[i]!==255)cnt[CT[i]]++;
  const map=new Int16Array(C.length).fill(-1);let k=0;const keep=[];
  C.forEach(c=>{if(cnt[c.i]>0){map[c.i]=k++;keep.push(c);}else console.warn('нет клеток:',c.iso);});
  for(let i=0;i<CT.length;i++)if(CT[i]!==255)CT[i]=map[CT[i]];
  const mainSite=keep.map(c=>MAIN[c.i]);
  C=keep;C.forEach((c,i)=>{c.i=i;});
  // клетки, габариты, якоря
  C.forEach(c=>{c.n=0;c.bb={x0:1e9,y0:1e9,x1:-1,y1:-1};c.ax=0;c.ay=0;c.an=0;});
  for(let i=0;i<CT.length;i++){const t=CT[i];if(t===255)continue;const c=C[t],x=i%GW,y=(i/GW)|0;c.n++;
    if(x<c.bb.x0)c.bb.x0=x;if(x>c.bb.x1)c.bb.x1=x;if(y<c.bb.y0)c.bb.y0=y;if(y>c.bb.y1)c.bb.y1=y;
    if(siteOf[i]===mainSite[t]){c.ax+=x;c.ay+=y;c.an++;}}
  C.forEach(c=>{c.cells=new Int32Array(c.n);c.k=0;if(!c.an){c.ax=(c.bb.x0+c.bb.x1)/2;c.ay=(c.bb.y0+c.bb.y1)/2;}else{c.ax/=c.an;c.ay/=c.an;}});
  for(let i=0;i<CT.length;i++){const t=CT[i];if(t!==255){const c=C[t];c.cells[c.k++]=i;}}
  // анкор: ближайшая клетка страны к среднему
  C.forEach(c=>{const ms=c.sites[0];c.ax=gx(ms[0]);c.ay=gy(ms[1]);let bd=1e18,bx=c.ax,by=c.ay;const step=Math.max(1,(c.n/400)|0);for(let q=0;q<c.n;q+=step){const i=c.cells[q],x=i%GW,y=(i/GW)|0,d=(x-c.ax)**2+(y-c.ay)**2;if(d<bd){bd=d;bx=x;by=y;}}c.ax=bx;c.ay=by;});
  buildProv();
  const PAL=['#c8574f','#d98f3e','#cdb84a','#74ac52','#3f9d88','#4b92c9','#6d70cc','#a566bb','#c96b98','#8f7f5e','#5ca9ab','#9fae4c'],pc=C.map(()=>-1);
  C.map((c,i)=>i).sort((a,b)=>C[b].nb.length-C[a].nb.length||a-b).forEach(i=>{const use=new Array(PAL.length).fill(0);C[i].nb.forEach(j=>{if(pc[j]>=0)use[pc[j]]++;});
    let b=-1;for(let k=0;k<PAL.length;k++){const kk=(k+i*5)%PAL.length;if(b<0||use[kk]<use[b])b=kk;}pc[i]=b;C[i].col=PAL[b];});
}

function flagImg(iso){
  if(flagCache[iso])return flagCache[iso];
  const A=0x1F1E6,ch=String.fromCodePoint(A+iso.charCodeAt(0)-65,A+iso.charCodeAt(1)-65),sz=140,cv=mk(260,260),g=cv.getContext('2d');
  g.font=sz+'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,130,135);
  const d=g.getImageData(0,0,260,260).data;let x0=999,y0=999,x1=-1,y1=-1;
  for(let y=0;y<260;y++)for(let x=0;x<260;x++)if(d[(y*260+x)*4+3]>60){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return flagCache[iso]=null;
  const o=mk(x1-x0+1,y1-y0+1);o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return flagCache[iso]=o;
}
function detectEmoji(){
  try{const cv=mk(120,120),g=cv.getContext('2d');g.font='80px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';g.textBaseline='middle';g.fillText('\u{1F1FA}\u{1F1F8}',4,60);
    const d=g.getImageData(0,0,120,120).data;let red=0,blue=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<100)continue;if(d[i]>150&&d[i+1]<90&&d[i+2]<90)red++;if(d[i+2]>110&&d[i]<110&&d[i+1]<130)blue++;}
    return red>30&&blue>30;}catch(e){return false;}
}

/* ---------- базовый слой карты ---------- */
function buildBase0(){
  if(!baseC)baseC=mk(BW,BH);
  const g=baseC.getContext('2d');g.clearRect(0,0,BW,BH);
  C.forEach(c=>{
    const b=c.bb,w=(b.x1-b.x0+1)*S,h=(b.y1-b.y0+1)*S,tmp=mk(w,h),t=tmp.getContext('2d');
    const fi=(flagsOn&&emojiOK)?flagImg(c.iso):null;
    if(fi)t.drawImage(fi,0,0,w,h);else{t.fillStyle=c.col;t.fillRect(0,0,w,h);}
    t.fillStyle='rgba(6,14,24,.05)';t.fillRect(0,0,w,h);
    const m=mk(w,h),mg=m.getContext('2d');mg.fillStyle='#000';
    for(let q=0;q<c.n;q++){const i=c.cells[q];mg.fillRect((i%GW-b.x0)*S,(((i/GW)|0)-b.y0)*S,S,S);}
    t.globalCompositeOperation='destination-in';t.drawImage(m,0,0);
    g.drawImage(tmp,b.x0*S,b.y0*S);
  });
  g.fillStyle='rgba(4,10,18,.9)';
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;if(!LANDM[i])continue;
    if(x>0&&!LANDM[i-1])g.fillRect(x*S,y*S,1,S);
    if(y>0&&!LANDM[i-GW])g.fillRect(x*S,y*S,S,1);
    if(x<GW-1){if(!LANDM[i+1])g.fillRect(x*S+S-1,y*S,1,S);else if(CT[i+1]!==CT[i]){g.fillStyle='rgba(2,6,12,.95)';g.fillRect(x*S+S-1,y*S,2,S);g.fillStyle='rgba(4,10,18,.9)';}}
    if(y<GH-1){if(!LANDM[i+GW])g.fillRect(x*S,y*S+S-1,S,1);else if(CT[i+GW]!==CT[i]){g.fillStyle='rgba(2,6,12,.95)';g.fillRect(x*S,y*S+S-1,S,2);g.fillStyle='rgba(4,10,18,.9)';}}}
}

function drawProvLines(){
  const g=baseC.getContext('2d');g.fillStyle='rgba(2,6,12,.45)';
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x;if(CT[i]===255)continue;
    if(x<GW-1&&CT[i+1]===CT[i]&&PV[i+1]!==PV[i])g.fillRect(x*S+S-1,y*S,1,S);
    if(y<GH-1&&CT[i+GW]===CT[i]&&PV[i+GW]!==PV[i])g.fillRect(x*S,y*S+S-1,S,1);}
}
function buildBase(){buildBase0();drawProvLines();}

function initMap(){
  LANDM=buildLand();buildCountries();attachDeposits();resStatic();buildSea();emojiOK=detectEmoji();
  try{const f=localStorage.getItem('mp-flags');if(f!==null)flagsOn=f==='1';}catch(e){}
  ownC=mk(BW,BH);buildBase();
}

      if(ok){nbS[a].add(b);nbS[b].add(a);}}}

  SEA_LINKS.forEach(([u,v])=>{if(byIso[u]===undefined||byIso[v]===undefined)return;let bd=1e18,bp=-1,bq=-1;
    C[byIso[u]].prov.forEach(p=>C[byIso[v]].prov.forEach(q=>{const d=(P[p].ax-P[q].ax)**2+(P[p].ay-P[q].ay)**2;if(d<bd){bd=d;bp=p;bq=q;}}));if(bp>=0)link(bp,bq);});
  // связность графа

/* ================= ЯДРО ИГРЫ: провинции, армии, бой ================= */
let G=null,PC=[];
const PEACE=2,REC_COST=40,REC_N=5,WIN_SHARE=0.5,SAVE_KEY='mirovaya-partiya-v8';
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const fname=f=>C[f].ru;

const atWar=(a,b)=>a!==b&&G.war[key(a,b)]!==undefined;

function relOf(k,f){const r=[];for(const s in k){const q=s.split('-');const a=+q[0],b=+q[1];if(a===f)r.push(b);else if(b===f)r.push(a);}return r;}
const enemiesOf=f=>relOf(G.war,f),alliesOf=f=>relOf(G.ally,f),tradersOf=f=>relOf(G.trade,f);
function provsOf(f){const r=[];for(let p=0;p<P.length;p++)if(G.pOwner[p]===f)r.push(p);return r;}
function econ(f){let s=0;for(let p=0;p<P.length;p++){const o=G.pOwner[p],l=G.lease&&G.lease[p];if(o===f){if(!l)s+=G.pEco[p];}else if(l&&l.to===f)s+=Math.ceil(G.pEco[p]*1.5);}return s;}

function income(f){let s=incomeBase(f);if(lnSanc(f))s=Math.floor(s*LN_SANC_TAX);s-=lnPen(f);const l=lordOf(f);if(l>=0&&isAlive(l))s-=Math.floor(s*0.2);vassalsOf(f).forEach(v=>{s+=Math.floor(incomeBase(v)*0.2);});return Math.max(0,s+leaseNet(f));}

/* ================= ЯДЕРНОЕ ОРУЖИЕ ================= */
const NUKE_STATES={US:4,RU:4,CN:3,GB:2,PK:2,KP:1};   /* ядерные державы и стартовый запас бомб */
const NUKE_URAN=20,NUKE_BUILD_URAN=10,NUKE_BUILD_GOLD=300,NUKE_LIMIT=12;

const embOn=(exp,tgt)=>{const t=G.emb&&G.emb[exp+'>'+tgt];return t!==undefined&&t>=G.turn;};

  if(!G.nuke)G.nuke=C.map(c=>NUKE_STATES[c.iso]||0);
  if(!G.ures)G.ures=C.map(c=>NUKE_STATES[c.iso]?NUKE_RES_START:0);
  if(!G.emb)G.emb={};if(!G.rad)G.rad={};if(!G.disarmT)G.disarmT={};
}
function nukeInit(){
  G.nuke=C.map(c=>NUKE_STATES[c.iso]||0);G.ures=C.map(c=>NUKE_STATES[c.iso]?NUKE_RES_START:0);G.emb={};G.rad={};G.disarmT={};
  /* союз Пакистана, Саудовской Аравии и Турции с начала партии */
  const ids=['PK','SA','TR'].map(i=>C.findIndex(c=>c.iso===i));
  if(ids.every(i=>i>=0&&PC[i]>0)){setAlly(ids[0],ids[1]);setAlly(ids[0],ids[2]);setAlly(ids[1],ids[2]);}
}
function nukeInfoHTML(t){
  if(!isNukeSt(t)||!G.rst)return'';
  return '<div class="cl"><b>Ядерный арсенал:</b> '+(G.nuke[t]||0)+' бомб · уран '+Math.floor(G.ures[t]||0)+'</div>';
}
function nukeCanStrike(f,p){
  if(!isNukeSt(f))return{ok:false,why:'Нет ядерного оружия'};
  if(!G.nuke[f])return{ok:false,why:'Бомб не осталось'};
  const o=G.pOwner[p];
  if(o===f)return{ok:false,why:'Своя провинция'};
  if(!atWar(f,o))return{ok:false,why:'Нужна война с владельцем'};
  const u=Math.floor(G.ures[f]||0);
  if(u<NUKE_URAN)return{ok:false,why:'Нужно урана '+NUKE_URAN+' (есть '+u+')'};
  if(G.rad&&G.rad[p]>=G.turn)return{ok:false,why:'Провинция в радиации'};
  return{ok:true,why:''};
}
function nukeStrike(f,p){
  const r=nukeCanStrike(f,p);if(!r.ok)return{ok:false,msg:r.why};
  const o=G.pOwner[p];
  G.nuke[f]--;G.ures[f]-=NUKE_URAN;
  armiesAt(p).forEach(a=>dropArmy(a));
  if(G.bld&&G.bld[p])G.bld[p]=[];
  G.pEco[p]=1;G.rad[p]=G.turn+NUKE_RAD_TURNS;
  G.res[p]=Math.min(100,(G.res[p]||0)+40);
  addOp(o,f,-60);
  for(let c=0;c<C.length;c++)if(c!==f&&c!==o&&PC[c]>0)addOp(c,f,-15);
  addLog('Ядерный удар по «'+P[p].name+'»: '+fname(f)+' → '+fname(o)+'. Провинция уничтожена.',f===G.you||o===G.you);
  sfx('drum');

}
function nukeBuild(f){
  if(!isNukeSt(f))return{ok:false,msg:'Ядерная программа недоступна'};
  if(G.nuke[f]>=NUKE_LIMIT)return{ok:false,msg:'Арсенал полон'};
  if(embOnTarget(f))return{ok:false,msg:'Эмбарго блокирует ядерную программу'};
  if(G.gold[f]<NUKE_BUILD_GOLD)return{ok:false,msg:'В казне не хватает золота ('+NUKE_BUILD_GOLD+')'};
  if(G.ures[f]<NUKE_BUILD_URAN)return{ok:false,msg:'Нужно урана '+NUKE_BUILD_URAN};
  G.gold[f]-=NUKE_BUILD_GOLD;G.ures[f]-=NUKE_BUILD_URAN;G.nuke[f]++;
  addLog('Новая бомба: '+fname(f)+' (в арсенале '+G.nuke[f]+')',f===G.you);

function embargoCanImpose(exp,tgt){

  if(!hasUran(exp))return{ok:false,why:'Нет урановых месторождений'};

}

  addLog('Урановое эмбарго: '+fname(exp)+' против '+fname(tgt)+' на '+NUKE_EMB_TURNS+' ходов',exp===G.you||tgt===G.you);

function demandDisarm(exp,tgt){

function nukeTurn(){
  if(!G.emb)return;
  for(let f=0;f<C.length;f++){
    if(!PC[f]||!isNukeSt(f)||embOnTarget(f)||!G.rst)continue;
    const m=Math.min(NUKE_RES_FEED,Math.floor(G.rst[f][RI.uranium]||0));
    if(m>0&&G.ures[f]<NUKE_RES_MAX){G.rst[f][RI.uranium]-=m;G.ures[f]+=m;}
  }
  for(const k in G.emb){
    if(G.emb[k]<G.turn){delete G.emb[k];continue;}
    const tgt=+k.split('>')[1];
    if(PC[tgt]>0&&G.ures)G.ures[tgt]=Math.floor(G.ures[tgt]*0.9);
  }
  for(let f=0;f<C.length;f++){
    if(!PC[f]||f===G.you||!hasUran(f))continue;
    for(let t=0;t<C.length;t++){
      if(!isNukeSt(t)||!PC[t]||t===f||embOn(f,t)||embOnTarget(t))continue;
      if(G.op[f][t]<-30&&Math.random()<0.15)imposeEmbargo(f,t);
    }
  }
}

const LN_PERM=['US','RU','CN','GB','FR'],LN_ELECTED=10,LN_EVERY=6,LN_SANC_TURNS=8,LN_SANC_TAX=0.85,LN_MAND_TURNS=20,LN_HUM_TURNS=20;

const LN_NOVETO=['ceasefire','arbitrate'];
function lnInit(){G.ln={sanc:{},queue:[],elected:[],rec:{},mand:{},hum:{}};lnElect();}
function lnFix(){if(!G.ln)lnInit();const L=G.ln;if(!L.rec)L.rec={};if(!L.mand)L.mand={};if(!L.hum)L.hum={};}
function lnPerm(){return LN_PERM.map(i=>C.findIndex(c=>c.iso===i)).filter(i=>i>=0&&PC[i]>0);}
function lnElect(){
  const pm=new Set(lnPerm()),cand=[];
  for(let f=0;f<C.length;f++)if(PC[f]>0&&!pm.has(f))cand.push(f);
  cand.sort((a,b)=>strength(b)-strength(a));
  G.ln.elected=cand.slice(0,LN_ELECTED);
}
const lnSanc=f=>!!(G.ln&&G.ln.sanc[f]!==undefined&&G.ln.sanc[f]>=G.turn);
/* 1. Легитимация: занятые территории и непризнанный режим дают штрафы */
const lnPen=f=>{const R=(G.ln&&G.ln.rec)||{};const base=R[f]===true?0:occupiedBy(f).length*2+(R[f]===false?5:0);const st=(G.state&&G.state[f])||'U';const adj=st==='C'?3:st==='T'?4:st==='L'?-2:0;return Math.max(0,base+adj);};
/* 2. Санкции: против агрессора, ядерной державы или нарушителя прав народов */
const lnViol=f=>{let n=0;for(let p=0;p<P.length;p++)if(G.pOwner[p]===f&&G.res[p]>=60)n++;return n>=3;};
function lnInfoHTML(t){
  let h='';
  if(lnSanc(t))h+='<div class="cl"><b>Санкции Лиги наций</b> до хода '+G.ln.sanc[t]+' · доход −'+Math.round((1-LN_SANC_TAX)*100)+'%</div>';
  if(G.ln&&G.ln.hum[t]>=G.turn)h+='<div class="cl"><b>Гуманитарные нормы</b> до хода '+G.ln.hum[t]+'</div>';
  if(lnPen(t)>0)h+='<div class="cl"><b>Без признания Лиги</b> · штраф к доходу −'+lnPen(t)+' и к отношениям</div>';
  return h;
}
function lnCanPropose(by,type,t,p){
  if(by===t&&type!=='mandate')return{ok:false,why:'Нельзя против себя'};
  if(!LN_TYPES[type])return{ok:false,why:'Неизвестная резолюция'};
  if(!PC[t])return{ok:false,why:'Страна не существует'};
  if(type==='ceasefire'&&!atWar(by,t))return{ok:false,why:'Перемирие — только при войне'};
  if(type==='arbitrate'&&!atWar(by,t))return{ok:false,why:'Арбитраж — только при войне'};
  if(type==='disarm'&&!isNukeSt(t))return{ok:false,why:'Разоружение — только для ядерной державы'};
  if(type==='sanction'&&!(atWar(by,t)||isNukeSt(t)||lnViol(t)||occupiedBy(t).length>0))return{ok:false,why:'Санкции — против агрессора, ядерной державы или нарушителя прав'};
  if(type==='recog'&&!(occupiedBy(t).length>0||G.ln.rec[t]===false))return{ok:false,why:'Нечего признавать'};
  if(type==='delegit'&&!(occupiedBy(t).length>0))return{ok:false,why:'Лишать признания — только занявших чужие земли'};
  if(type==='humanitarian'&&!(lnViol(t)||occupiedBy(t).length>0))return{ok:false,why:'Нормы — для стран с занятыми территориями или нарушителей'};
  if(type==='mandate'){
    if(p===undefined||G.pOwner[p]!==t)return{ok:false,why:'Нет такой территории'};
    if(G.core[p]===t)return{ok:false,why:'Своя территория не передаётся под мандат'};
    if(t===by)return{ok:false,why:'Территория уже ваша'};
  }
  if(G.ln.queue.some(q=>q.type===type&&q.t===t&&q.by===by&&q.p===p))return{ok:false,why:'Такое предложение уже внесено'};
  return{ok:true,why:''};
}
function lnPropose(by,type,t,p){
  const r=lnCanPropose(by,type,t,p);if(!r.ok)return{ok:false,msg:r.why};
  G.ln.queue.push({type,t,by,p,you:by===G.you});
  return{ok:true,msg:'Внесено на ближайшую сессию Лиги наций (каждые '+LN_EVERY+' ходов)'};
}
function lnVote(type,m,q){
  const t=q.t,b=q.by;
  if(type==='ceasefire'||type==='arbitrate'||type==='mandate')return !atWar(m,t)&&!atWar(m,b);
  if(type==='disarm')return G.op[m][t]<=-20;
  if(type==='recog')return G.op[m][t]>=0;
  if(type==='delegit')return G.op[m][t]<=-10||atWar(m,t);
  if(type==='humanitarian')return G.op[m][t]<=0;
  return G.op[m][t]<=-10||atWar(m,t);
}
function lnApply(q,members){
  const t=q.t,b=q.by;
  switch(q.type){
    case 'condemn':members.forEach(m=>{if(m!==t)addOp(m,t,-12);});break;
    case 'sanction':G.ln.sanc[t]=G.turn+LN_SANC_TURNS;members.forEach(m=>{if(m!==t)addOp(m,t,-8);});break;
    case 'ceasefire':if(atWar(b,t))makePeace(b,t);break;
    case 'disarm':if(G.nuke[t]>0)G.nuke[t]--;addOp(t,b,-10);break;
    case 'recog':G.ln.rec[t]=true;break;
    case 'delegit':G.ln.rec[t]=false;break;
    case 'humanitarian':G.ln.hum[t]=G.turn+LN_HUM_TURNS;break;
    case 'mandate':{
      const pp=q.p;if(G.pOwner[pp]!==t||G.core[pp]===t||!PC[b])return'Территория уже изменилась';
      setOwner(pp,b);armiesAt(pp).forEach(a=>{a.o=b;});
      G.ln.mand[pp]={to:b,back:t,until:G.turn+LN_MAND_TURNS};break;}
    case 'arbitrate':{
      if(atWar(b,t))makePeace(b,t);
      let n=0;
      for(let p=0;p<P.length;p++){
        if(G.pOwner[p]===t&&G.core[p]===b){setOwner(p,b);n++;}
        else if(G.pOwner[p]===b&&G.core[p]===t){setOwner(p,t);n++;}
      }
      addOp(b,t,5);addOp(t,b,5);
      return'возвращено провинций: '+n;}
  }
  return'';
}
function lnSession(){
  const pm=new Set(lnPerm()),members=[];
  for(let f=0;f<C.length;f++)if(PC[f]>0)members.push(f);
  const q=G.ln.queue.splice(0);
  if(!q.length){
    const wars=[];for(const k in G.war){const [a,b]=k.split('-').map(Number);if(PC[a]>0&&PC[b]>0)wars.push([a,b]);}
    if(wars.length){const [a,b]=wars[(Math.random()*wars.length)|0];const t=Math.random()<0.5?a:b;
      q.push({type:Math.random()<0.6?'ceasefire':'arbitrate',t,by:t===a?b:a,ai:true});}
  }
  for(const p of q.slice(0,3)){
    if(!PC[p.t]||!PC[p.by])continue;
    const noVeto=LN_NOVETO.includes(p.type),yes=[],no=[];let veto=-1;
    if(!noVeto&&pm.has(p.t))veto=p.t;
    for(const m of members){
      if(m===p.t||m===p.by)continue;
      if(!noVeto&&pm.has(m)&&allied(m,p.t)&&veto<0)veto=m;
      (lnVote(p.type,m,p)?yes:no).push(m);
    }
    const pass=veto<0&&yes.length>no.length;
    const yu=p.you||p.t===G.you||p.by===G.you;
    const vt=veto>=0?'вето: '+fname(veto):'голосов '+yes.length+':'+no.length;
    if(!pass){addLog('Лига наций: «'+LN_TYPES[p.type]+'» против '+fname(p.t)+' — отклонено ('+vt+')',yu);continue;}
    const note=lnApply(p,members);
    addLog('Лига наций: «'+LN_TYPES[p.type]+'» — '+fname(p.t)+' — принято ('+vt+')'+(note?' · '+note:''),yu);
  }
}
function lnTurn(){
  if(!G.ln)lnInit();
  for(const k in G.ln.sanc)if(G.ln.sanc[k]<G.turn)delete G.ln.sanc[k];
  /* мандаты: срок истёк или мандатарий исчез — территория возвращается */
  for(const k in G.ln.mand){
    const m=G.ln.mand[k],p=+k;
    if(G.turn>=m.until||!PC[m.to]||G.pOwner[p]!==m.to){
      if(PC[m.back]>0&&G.pOwner[p]===m.to)setOwner(p,m.back);
      if(G.pOwner[p]===m.back)armiesAt(p).forEach(a=>{a.o=m.back;});
      delete G.ln.mand[k];
    }
  }
  if(G.turn%LN_EVERY===0){
    lnElect();lnSession();
    /* гуманитарные нормы: обязательная помощь занятым территориям с восстаниями, штраф за нарушение */
    for(const k in G.ln.hum){
      const f=+k;if(G.ln.hum[f]<G.turn||!PC[f])continue;
      for(let p=0;p<P.length;p++)if(G.pOwner[p]===f&&G.core[p]!==f&&G.res[p]>=60){G.res[p]=Math.max(0,G.res[p]-15);G.gold[f]=Math.max(0,G.gold[f]-5);}
    }
    /* штрафы непризнанным странам: отношения ухудшаются */
    for(let f=0;f<C.length;f++){
      if(!PC[f]||lnPen(f)<=0)continue;
      for(const m of members_()) if(m!==f)addOp(m,f,-2);
    }
  }
}
function members_(){const r=[];for(let f=0;f<C.length;f++)if(PC[f]>0)r.push(f);return r;}

/* ================= СТРОЙ СТРАНЫ (управление территориями) ================= */
function confRevive(f){
  if(!G.colOv)G.colOv={};
  if(!G.vassal)G.vassal={};
  if(!G.confR)G.confR={};
  let any=false;
  for(let X=0;X<C.length;X++){
    if(X===f||PC[X]>0)continue;
    const list=[];for(let p=0;p<P.length;p++)if(G.core[p]===X&&G.pOwner[p]===f)list.push(p);
    if(!list.length)continue;
    G.colOv[X]=C[f].col;C[X].col=C[f].col;
    list.forEach(p=>{
      setOwner(p,X);G.res[p]=0;
      addArmy(X,p,Math.max(1,Math.round(C[X].mil*P[p].n/Math.max(1,C[X].n))),false);
    });
    G.vassal[X]=f;G.confR[X]=f;G.reg[X]=G.reg[f];
    G.gold[X]=Math.max(G.gold[X]||0,C[X].eco*2);
    addLog('Конфедеративный регион «'+C[X].ru+'» возрождён под властью '+fname(f)+': систему, идеологию и экономику задаёт '+fname(f),X===G.you||f===G.you);
    any=true;
  }
  if(any&&ownC){buildBase();rebuildOwn();}
}
const STATES={
  C:{n:'Колониализм',d:'Занятые территории аннексируются через 8 ходов без местной власти: всё решает центр. Лига признаёт хуже (штраф к отношениям +3).'},
  U:{n:'Унитаризм',d:'Всё решает центр. Доход ×1.03, набор ×1.05. Недовольство в провинциях растёт.'},
  F:{n:'Федерализм',d:'Провинции сами строят: улучшения дешевле на 10%. Доход ×1.04. Недовольство падает.'},
  K:{n:'Конфедерация',d:'Регионы держат свои армии (+1 отряд в провинцию каждые 5 ходов) и подчиняются центру. Анексии дешевле вдвое.'},
  L:{n:'Лже-федерализм',d:'Недовольство растёт медленнее, чем при унитаризме. Лига признаёт лучше (штраф −2). Провинции с недовольством 70%+ могут отделиться к соседу.'},
  T:{n:'Тоталитарный контроль',d:'Только для Китая и России. Недовольство подавляется (−3 в ход), отделений нет, армии ×1.10, Лига осуждает (штраф +4).'}
};
const STATE_EFF={C:{inc:1.04},U:{inc:1.03,rec:1.05},F:{inc:1.04,up:0.9},K:{ann:0.5},L:{},T:{inc:0.97,rec:1.10,aggr:0.05}};
const STATE_COST=60,STATE_CD=8;
const stateOf=f=>(G.state&&G.state[f])||'U';
function stateInit(){G.state=C.map(c=>(c.iso==='CN'||c.iso==='RU')?'T':'U');G.stT={};}
function stateFix(){if(!G.state)stateInit();if(!G.stT)G.stT={};if(!G.confR)G.confR={};if(!G.confT)G.confT={};if(!G.colOv)G.colOv={};for(const x in G.colOv)C[+x].col=G.colOv[x];if(Object.keys(G.colOv).length&&ownC){buildBase();rebuildOwn();}}
function canState(f,code){
  if(!STATES[code])return{ok:false,why:'Неизвестный строй'};
  if(code===stateOf(f))return{ok:false,why:'Уже действует'};
  if(code==='T'&&!(C[f].iso==='CN'||C[f].iso==='RU'))return{ok:false,why:'Тоталитарный контроль — только у Китая и России'};
  const t=G.stT[f];if(t!==undefined&&G.turn-t<STATE_CD)return{ok:false,why:'Следующая смена через '+(STATE_CD-(G.turn-t))+' ход.'};
  if(G.gold[f]<STATE_COST)return{ok:false,why:'Нужно '+STATE_COST+' золота'};
  return{ok:true,why:''};
}
function setState(f,code){
  const r=canState(f,code);if(!r.ok)return{ok:false,why:r.why};
  G.gold[f]-=STATE_COST;G.state[f]=code;G.stT[f]=G.turn;
  addLog(fname(f)+': строй → '+STATES[code].n,f===G.you);
  return{ok:true,msg:'Строй: '+STATES[code].n};
}
/* ================= КОНФЕДЕРАТИВНЫЕ РЕГИОНЫ: хозяин задаёт систему, идеологию и экономику ================= */
const CONF_CD=4;
// Хозяин конфедеративного региона: только пока действует вассальная связь с ним
function confLord(t){if(!G.confR||G.confR[t]===undefined||!G.vassal||G.vassal[t]!==G.confR[t])return undefined;return G.confR[t];}
function confCan(t){
  const me=confLord(t);

function setConfAxis(t,k,code){

function strTurn(){
  if(!G.state)return;
  for(let f=0;f<C.length;f++)if(PC[f]>0&&stateOf(f)==='K')confRevive(f);
  for(let f=0;f<C.length;f++){
    if(!PC[f])continue;
    const code=stateOf(f),list=provsOf(f);
    for(const p of list){
      if(G.pOwner[p]!==f)continue;
      if(code==='C'){
        if(G.core[p]!==f&&G.since[p]!==undefined&&G.turn-G.since[p]>=8){G.core[p]=f;G.res[p]=0;addLog('Колония «'+P[p].name+'» аннексирована без местной власти',f===G.you);}
      }else if(code==='U'){G.res[p]=Math.min(100,(G.res[p]||0)+2);}
      else if(code==='F'){G.res[p]=Math.max(0,(G.res[p]||0)-2);}
      else if(code==='K'){G.res[p]=Math.max(0,(G.res[p]||0)-1);if(G.turn%5===0)addArmy(f,p,1,false);}
      else if(code==='T'){G.res[p]=Math.max(0,(G.res[p]||0)-3);}
      else if(code==='L'){
        G.res[p]=Math.min(100,(G.res[p]||0)+1);
        if(G.res[p]>=70&&Math.random()<0.04){
          const nb=C[f].nb.filter(x=>PC[x]>0&&x!==f);
          if(nb.length){const to=nb[(Math.random()*nb.length)|0];
            armiesAt(p).filter(a=>a.o===f).forEach(dropArmy);
            setOwner(p,to);G.res[p]=0;addLog('«'+P[p].name+'» отделилась и перешла к '+fname(to),f===G.you||to===G.you);}
        }
      }
    }
  }
}
function showState(){
  const me=G.you,cur=stateOf(me),acts=[];
  let h='<p style="color:var(--mute);font-size:13px;margin:0 0 8px">Территории: как центр управляет провинциями. Смена стоит '+STATE_COST+' золота и доступна раз в '+STATE_CD+' ходов.</p>';
  Object.keys(STATES).forEach(code=>{
    if(code==='T'&&!(C[me].iso==='CN'||C[me].iso==='RU'))return;

  });

function newGame(you){
  const n=C.length;
  G={you,turn:1,pOwner:P.map(p=>p.c),core:P.map(p=>p.c),res:P.map(()=>0),tech:C.map(()=>[0,0,0]),xcl:{},ev:null,since:P.map(()=>0),rfund:P.map(()=>0),pEco:[],armies:[],nid:1,gold:[],aggr:[],war:{},ally:{},pact:{},truce:{},trade:{},asked:{},op:[],offers:[],log:[],news:[],over:null,vassal:{},ws:{},lease:{},reg:C.map(c=>REG[c.iso]||'HNC'),reformT:{}};
  C.forEach(c=>{
    c.prov.forEach(id=>{const pr=P[id],sh=pr.n/c.n;let e=Math.max(1,Math.round(c.eco*sh)),m=Math.max(1,Math.round(c.mil*sh));
      if(pr.city){const k=pr.city.k;e+=k==='c'?1+Math.round(c.eco*.25):k==='h'?1+Math.round(c.eco*.15):1;m=Math.max(k==='c'?3:2,m);}
      G.pEco[id]=e;G.armies.push({id:G.nid++,o:c.i,p:id,n:m,mv:false});});
    G.gold[c.i]=c.eco*3;G.aggr[c.i]=Math.max(0.1,Math.min(1,0.35+Math.random()*0.5+eff(c.i,'aggr')));});
  for(let i=0;i<n;i++){const row=new Array(n);for(let j=0;j<n;j++)row[j]=Math.max(-100,Math.min(100,((Math.random()*24-12)|0)+(Math.random()<0.2?14:0)-(C[i].nb.includes(j)?3:0)+Math.round(aff(i,j)*0.8)));G.op.push(row);}
  applyReal();scenInit();initLeases();recount();resInit();nukeInit();lnInit();stateInit();save();return G;
}

/* ---------- бой ---------- */
function roll(A,D,fa,fd){const ea=A*(1+0.12*tl(fa,0))*(1+eff(fa,'atk'))*(0.85+Math.random()*0.3),ed=D*(1+0.12*tl(fd,0))*1.25*(0.85+Math.random()*0.3)+0.5;return{ea,ed,win:ea>ed};}
function odds(A,D,fa,fd){let w=0;for(let i=0;i<300;i++)if(roll(A,D,fa,fd).win)w++;return w/300;}
function defStrength(f,p){let D=1+Math.floor(G.pEco[p]/4)+(G.core[p]===G.pOwner[p]?eff(G.pOwner[p],'def'):0)+(P[p].city&&P[p].city.k==='b'?2:0);armiesAt(p).forEach(a=>{if(atWar(f,a.o))D+=uw(a);});return D;}
const sendN=(a,frac)=>frac>=1?a.n:Math.max(1,Math.floor(a.n/2));

function attack(a,t,frac){
  const f=a.o,po=G.pOwner[t],A=sendN(a,frac),full=A>=a.n,from=a.p,D=defStrength(f,t),r=roll(A*ut(a).w,D,f,po);fxBattle(t,r.win,f,po);
  a.n-=A;if(a.n<=0)dropArmy(a);
  if(r.win){
    const left=Math.max(1,Math.round(A*(1-0.75*r.ed/r.ea)));
    armiesAt(t).filter(x=>atWar(f,x.o)).forEach(dropArmy);
    setOwner(t,f);addArmy(f,t,left,true,a.u);onCapture(f,po,t);
    return{win:true,A,D,left};
  }
  const back=Math.floor(A*0.25*r.ea/r.ed);if(back>0)addArmy(f,from,back,full,a.u);
  const dl=Math.min(D-1,Math.round(D*0.55*r.ea/r.ed));
  const en=armiesAt(t).filter(x=>atWar(f,x.o));let tot=0;en.forEach(x=>tot+=x.n);
  if(tot>0)en.forEach(x=>{x.n=Math.max(1,x.n-Math.round(dl*x.n/tot));});
  if(atWar(f,po))addWs(po,f,1);
  if(f===G.you||po===G.you)addLog(fname(f)+' не смогла взять '+P[t].name,true);
  return{win:false,A,D,back,dl};
}
function moveArmy(a,t,frac){return moveStack(a,t,frac).n;}

function onCapture(f,po,t){
  if(atWar(f,po))addWs(f,po,2+Math.round(G.pEco[t]*0.6));
  addLog(fname(f)+' берёт '+P[t].name+(po!==f&&!P[t].name.startsWith(fname(po))?' у '+fname(po):''),f===G.you||po===G.you);
  if(po!==f){addOp(po,f,-12);alliesOf(po).forEach(x=>{if(x!==f)addOp(x,f,-5);});}
  if(PC[po]===0)eliminate(po);
  checkEnd();
}
function eliminate(c){
  {const hs={};for(let p=0;p<P.length;p++)if(G.core[p]===c)hs[G.pOwner[p]]=1;const hn=Object.keys(hs).filter(o=>+o!==c).map(o=>fname(+o));addLog(fname(c)+' пала: земли входят в состав '+(hn.join(', ')||'других держав'),c===G.you);}
  ['war','ally','pact','truce','trade'].forEach(m=>{for(const k in G[m]){const q=k.split('-');if(+q[0]===c||+q[1]===c)delete G[m][k];}});
  G.armies=G.armies.filter(a=>a.o!==c);
  G.offers=G.offers.filter(o=>o.from!==c);
  if(G.vassal)for(const v in G.vassal)if(+v===c||G.vassal[v]===c)delete G.vassal[v];
  if(G.ws)for(const k in G.ws){const q=k.split('-');if(+q[0]===c||+q[1]===c)delete G.ws[k];}
}

/* ---------- действия игрока ---------- */
const upCost=p=>Math.round((20+10*G.pEco[p])*Math.max(.6,eff(G.pOwner[p],'up')));
function recruit(p,f){if(ctrlOf(p)!==f||G.gold[f]<recCost(f))return false;G.gold[f]-=recCost(f);addArmy(f,p,REC_N,false);return true;}
function upgrade(p,f){const c=upCost(p);if(G.pOwner[p]!==f||G.gold[f]<c)return false;G.gold[f]-=c;G.pEco[p]+=Math.max(1,Math.round(G.pEco[p]*0.1));return true;}
/* что можно сделать армией a с соседней провинцией t */
function actionFor(a,t){
  if(!G||G.over||a.mv||a.o!==G.you)return 'none';
  const r=reachOf(a).get(t);return r?r.act:'none';
}
function playerAct(a,t,frac){const r=perform(a,t,frac);if(r)save();return r;}

function checkEnd(){
  if(G.over)return;
  if(PC[G.you]===0){G.over='lose';return;}
  let al=0;for(let f=0;f<C.length;f++)if(PC[f]>0)al++;
  if(share(G.you)>=WIN_SHARE||al===1)G.over='win';
  else{let team=0;allies:{const tm=[G.you,...alliesOf(G.you),...vassalsOf(G.you)];tm.forEach(f=>{team+=share(f);});if(team>=0.75)G.over='win';}}
}

/* ---------- сохранение ---------- */
function save(){try{if(G)localStorage.setItem(SAVE_KEY,JSON.stringify({np:P.length,iso:C.map(c=>c.iso).join(''),ts:Date.now(),g:G}));}catch(e){}cloudQueue();}
const validSave=s=>s&&s.np===P.length&&s.iso===C.map(c=>c.iso).join('')&&s.g&&!s.g.over;
function loadSave(){
  let best=null;try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(validSave(s))best=s;}catch(e){}
  if(validSave(CLOUD.s)&&(!best||(CLOUD.s.ts||0)>(best.ts||0)))best=CLOUD.s;
  if(best){G=best.g;G.news=[];if(!G.lease)G.lease={};if(!G.reg)G.reg=C.map(c=>REG[c.iso]||'HNC');if(!G.reformT)G.reformT={};nukeFix();lnFix();stateFix();recount();if(!G.rst)resInit();return true;}return false;
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}cloudClear();}
/* ================= ДИПЛОМАТИЯ И ИИ ================= */
function declareWar(a,b,noJoin){
  if(a===b||atWar(a,b)||!isAlive(a)||!isAlive(b))return false;
  if(lordOf(a)>=0)return false;
  if(G.vassal&&(G.vassal[a]===b||G.vassal[b]===a))return false;
  const k=key(a,b),brokePact=pactOn(a,b);
  delete G.pact[k];delete G.trade[k];delete G.ally[k];if(G.ws)delete G.ws[k];
  G.war[k]=G.turn;addOp(b,a,-30);addOp(a,b,-10);
  const cb=provsOf(b).some(p=>G.core[p]===a||claimed(p,a));
  for(let f=0;f<C.length;f++)if(f!==a&&f!==b&&PC[f]>0)addOp(f,a,cb?0:brokePact?-8:-2);
  addLog(fname(a)+' объявляет войну: '+fname(b),a===G.you||b===G.you);checkLeases();
  vassalsOf(a).forEach(v=>{if(v!==b&&PC[v]>0&&!atWar(v,b))G.war[key(v,b)]=G.turn;});
  vassalsOf(a).forEach(v=>{if(v!==b&&isAlive(v)&&!atWar(v,b)&&!allied(v,b))declareWar(v,b,true);});
  vassalsOf(b).forEach(v=>{if(v!==a&&isAlive(v)&&!atWar(v,a)&&!allied(v,a))declareWar(v,a,true);});
  if(!noJoin){
    alliesOf(b).forEach(c=>{if(c===a||c===G.you||atWar(c,a)||allied(c,a)||truceOn(c,a))return;if(Math.random()<0.7)declareWar(c,a,true);});
    alliesOf(a).forEach(c=>{if(c===b||c===G.you||atWar(c,b)||allied(c,b))return;if(Math.random()<0.6)declareWar(c,b,true);});
    if(a!==G.you&&alliesOf(b).includes(G.you))addLog('Ваш союзник '+fname(b)+' атакован: '+fname(a),true);
  }
  return true;
}
function makePeace(a,b){
  const k=key(a,b);delete G.war[k];if(G.ws)delete G.ws[k];G.truce[k]=G.turn+4;
  vassalsOf(a).forEach(v=>{delete G.war[key(v,b)];});vassalsOf(b).forEach(v=>{delete G.war[key(v,a)];});addOp(a,b,10);addOp(b,a,10);
  addLog('Мир: '+fname(a)+' и '+fname(b),a===G.you||b===G.you);
}
function setAlly(a,b){const k=key(a,b);G.ally[k]=G.turn;delete G.pact[k];addOp(a,b,10);addOp(b,a,10);addLog('Союз: '+fname(a)+' и '+fname(b),a===G.you||b===G.you);}
function breakAlly(a,b){const k=key(a,b);delete G.ally[k];addOp(b,a,-15);addLog(fname(a)+' разрывает союз с '+fname(b),a===G.you||b===G.you);checkLeases();}
function setPact(a,b){G.pact[key(a,b)]=G.turn+8;addOp(a,b,5);addOp(b,a,5);addLog('Пакт о ненападении: '+fname(a)+' и '+fname(b),a===G.you||b===G.you);}
function setTrade(a,b){G.trade[key(a,b)]=G.turn;addOp(a,b,4);addOp(b,a,4);addLog('Торговый договор: '+fname(a)+' и '+fname(b),a===G.you||b===G.you);}
function giftGold(a,b,g){if(G.gold[a]<g)return false;G.gold[a]-=g;G.gold[b]+=g;addOp(b,a,Math.max(1,Math.round(g/8)));return true;}

/* статус пары для интерфейса */
function statusOf(a,b){
  if(atWar(a,b))return{id:'war',label:'Война'};
  if(G.vassal&&G.vassal[b]===a)return{id:'vassal',label:confLord(b)===a?'Конфедеративный регион':'Вассал'};
  if(G.vassal&&G.vassal[a]===b)return{id:'lord',label:confLord(a)===b?'Хозяин региона':'Сюзерен'};
  if(allied(a,b))return{id:'ally',label:'Союз'};
  if(pactOn(a,b))return{id:'pact',label:'Пакт о ненападении'};
  if(truceOn(a,b))return{id:'truce',label:'Перемирие'};
  return{id:'peace',label:'Мир'};
}
function opLabel(v){return v<=-60?'Враждебное':v<=-20?'Холодное':v<20?'Нейтральное':v<50?'Дружеское':'Очень тёплое';}

/* игрок предлагает ИИ */
function propose(type,t){
  const me=G.you,k=key(me,t)+type;
  if(G.asked[k]===G.turn)return{ok:false,msg:'В этом ходу вы уже предлагали это. Попробуйте в следующем.'};
  G.asked[k]=G.turn;const op=opn(t,me),pk=key(me,t);
  if(type==='peace'){
    if(!atWar(me,t))return{ok:false,msg:'Вы не воюете.'};
    const ratio=armyOf(me)/Math.max(1,armyOf(t)),turns=G.turn-G.war[pk];
    const ch=Math.max(.05,Math.min(.95,.2+.08*turns+(ratio>1.3?.25:0)-(ratio<.7?.15:0)+op/200));
    if(Math.random()<ch){makePeace(me,t);return{ok:true,msg:fname(t)+' согласилась на мир. Перемирие на 4 хода.'};}
    return{ok:false,msg:fname(t)+' отказалась: считает, что может выиграть.'};
  }
  if(atWar(me,t))return{ok:false,msg:'Сначала нужен мир.'};
  if(type==='ally'){
    if(allied(me,t))return{ok:false,msg:'Вы уже союзники.'};
    const common=enemiesOf(me).some(e=>atWar(t,e));
    if(op>=40||(common&&op>=20)){setAlly(me,t);return{ok:true,msg:fname(t)+' принимает союз.'};}
    return{ok:false,msg:'Отказ. Отношение '+op+', нужно от 40 (от 20, если есть общий враг).'};
  }
  if(type==='pact'){
    if(pactOn(me,t)||allied(me,t))return{ok:false,msg:'Пакт уже действует или вы в союзе.'};
    if(op>=-10){setPact(me,t);return{ok:true,msg:'Пакт о ненападении на 8 ходов.'};}
    return{ok:false,msg:'Отказ. Отношение '+op+', нужно от -10.'};
  }
  if(type==='trade'){
    if(hasTrade(me,t))return{ok:false,msg:'Договор уже есть.'};
    if(op>=5){setTrade(me,t);return{ok:true,msg:'Торговый договор заключён. Доход вырастет у обеих сторон.'};}
    return{ok:false,msg:'Отказ. Отношение '+op+', нужно от 5.'};
  }
  return{ok:false,msg:'?'};
}
function playerDeclareWar(t){
  const me=G.you;
  if(lordOf(me)>=0)return{ok:false,msg:'Вассал не может объявлять войну.'};
  if(G.vassal&&G.vassal[t]===me)return{ok:false,msg:'Сначала освободите вассала.'};
  if(allied(me,t))return{ok:false,msg:'Сначала разорвите союз.'};
  if(truceOn(me,t))return{ok:false,msg:'Действует перемирие ещё '+(G.truce[key(me,t)]-G.turn+1)+' хода.'};
  const broke=pactOn(me,t);declareWar(me,t);save();
  return{ok:true,msg:'Война объявлена: '+fname(t)+(broke?'. Нарушение пакта испортило репутацию.':'.')};
}
function acceptOffer(o){
  const me=G.you,f=o.from;if(!isAlive(f))return;
  if(o.type==='peace'&&atWar(me,f)){peaceTreaty(f,me,(o.dem||[]).filter(p=>G.pOwner[p]===me),false,0);rebuildOwn();}
  else if(o.type==='ally'&&!atWar(me,f))setAlly(me,f);
  else if(o.type==='pact'&&!atWar(me,f))setPact(me,f);
  else if(o.type==='trade'&&!atWar(me,f))setTrade(me,f);
  else if(o.type==='lrent'&&canLease(o.p,me,f).ok)startLease(o.p,me,f);
  else if(o.type==='lgive'&&canLease(o.p,f,me).ok)startLease(o.p,f,me);
  save();
}
function pushOffer(f,type,ex){if(G.offers.some(o=>o.from===f&&o.type===type))return;
  const o={from:f,type};if(ex)Object.assign(o,ex);
  if(type==='peace'){const me=G.you,pf=wsOf(f,me);if(pf>=8&&pf>wsOf(me,f)+5)o.dem=pickDemands(f,me,pf);}
  G.offers.push(o);}

function aiDiplo(f){
  enemiesOf(f).forEach(e=>{
    if(G.war[key(f,e)]===1&&G.turn<7)return;
    const turns=G.turn-G.war[key(f,e)];let ch=0.04+0.05*Math.max(0,turns-2);
    if(strength(f)<strength(e)*0.7)ch+=0.2;
    if(Math.random()<ch){if(e===G.you)pushOffer(f,'peace');else aiTreaty(f,e);}
  });
  if(G.turn<=PEACE)return;
  const wars=enemiesOf(f);
  if(lordOf(f)<0&&wars.length<2&&Math.random()<0.05+G.aggr[f]*0.1){
    let best=-1,bs=0;
    C[f].nb.forEach(n=>{if(!isAlive(n)||allied(f,n)||atWar(f,n)||pactOn(f,n)||truceOn(f,n))return;
      const sc=strength(f)/Math.max(1,strength(n))*(0.6+G.aggr[f])*(hasClaimOn(f,n)?1.6:1)-opn(f,n)/60;if(sc>bs){bs=sc;best=n;}});
    if(best>=0&&bs>1.5)declareWar(f,best);
  }
  const nbs=C[f].nb.filter(n=>isAlive(n)&&!atWar(f,n));
  if(alliesOf(f).length<3&&Math.random()<0.09){
    const myEn=enemiesOf(f);
    const cand=nbs.filter(n=>!allied(f,n)&&((opn(f,n)>10&&opn(n,f)>4)||(opn(f,n)>6&&myEn.some(e=>atWar(n,e)))));
    if(cand.length){const n=cand[(Math.random()*cand.length)|0];if(n===G.you)pushOffer(f,'ally');else setAlly(f,n);}}
  if(Math.random()<0.1){
    const cand=nbs.filter(n=>!allied(f,n)&&opn(f,n)>0);
    if(cand.length){const n=cand[(Math.random()*cand.length)|0];
      if(!hasTrade(f,n)&&Math.random()<0.6){if(n===G.you)pushOffer(f,'trade');else setTrade(f,n);}
      else if(!pactOn(f,n)&&!allied(f,n)){if(n===G.you)pushOffer(f,'pact');else setPact(f,n);}}}
  aiLease(f);
}

function aiMilitary(f){
  const wars=enemiesOf(f).filter(isAlive),ps=provsOf(f);
  let guard=0;
  while(G.gold[f]>=recCost(f)&&guard++<10&&ps.length){
    let best=-1,bs=-1e9;
    ps.forEach(p=>{const a=armyAt(f,p),n=a?a.n:0;let th=0;
      P[p].nb.forEach(q=>{const o=G.pOwner[q];if(wars.includes(o))armiesAt(q).forEach(x=>{if(atWar(f,x.o))th+=x.n;});else if(o!==f&&!allied(f,o))th+=1;});
      const sc=th-n+G.pEco[p]*0.1;if(sc>bs){bs=sc;best=p;}});
    if(best<0)break;
    if(bs<-8&&Math.random()<0.4&&G.gold[f]>=upCost(best)*1.3){upgrade(best,f);continue;}
    addArmy(f,best,REC_N,false);G.gold[f]-=recCost(f);
  }
  aiBuyUnits(f,wars,ps);
  if(!wars.length||G.turn<=PEACE)return;
  const isFront=p=>P[p].nb.some(q=>wars.includes(G.pOwner[q]));
  const dist=new Int16Array(P.length).fill(-1),q=[];
  ps.forEach(p=>{if(isFront(p)){dist[p]=0;q.push(p);}});
  for(let h=0;h<q.length;h++){const u=q[h];P[u].nb.forEach(v=>{if(dist[v]<0&&allied(f,G.pOwner[v])){dist[v]=dist[u]+1;q.push(v);}});}
  const my=G.armies.filter(a=>a.o===f).sort((x,y)=>y.n-x.n);
  let attacks=0;const maxAtt=2+((ps.length/5)|0);
  my.forEach(a=>{
    if(a.mv||!G.armies.includes(a))return;
    if((a.u||'inf')!=='inf'){aiUnitMove(a,f,dist);return;}
    let tb=-1,bsc=0;
    P[a.p].nb.forEach(t=>{if(!atWar(f,G.pOwner[t]))return;const sc=a.n/(1.25*defStrength(f,t)+1);if(sc>bsc){bsc=sc;tb=t;}});
    if(tb>=0&&bsc>1.45+(1-G.aggr[f])*0.7&&attacks<maxAtt&&Math.random()<0.55+G.aggr[f]*0.4){attack(a,tb,1);attacks++;return;}
    if(dist[a.p]>0){let bn=-1,bd=dist[a.p];P[a.p].nb.forEach(v=>{if(dist[v]>=0&&dist[v]<bd){bd=dist[v];bn=v;}});if(bn>=0)moveArmy(a,bn,1);}
  });
}

function endRound(){
  if(!G||G.over)return;
  G.news=[];G.offers=[];
  const n=C.length;
  scenarioTurn();vassalTurn();leaseTurn();bldTurn();resTurn();nukeTurn();strTurn();
  for(let a=0;a<n;a++){if(!PC[a])continue;const row=G.op[a];
    for(let b=0;b<n;b++){if(a===b||!PC[b])continue;let v=row[b];
      if(allied(a,b))v+=1;else if(atWar(a,b))v-=2;else if(G.turn%3===0)v+=v>0?-1:v<0?1:0;
      if(G.turn%2===0){const af=aff(a,b);if(af>=4&&v<af*5&&Math.random()<.3)v++;else if(af<=-6&&v>af*4&&Math.random()<.3)v--;}
      row[b]=Math.max(-100,Math.min(100,v));}}
  for(let e=0;e<n;e++){if(!PC[e])continue;const L=enemiesOf(e);for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){addOp(L[i],L[j],1);addOp(L[j],L[i],1);}}
  const fs=[];for(let f=0;f<n;f++)if(f!==G.you&&PC[f]>0)fs.push(f);
  for(let i=fs.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[fs[i],fs[j]]=[fs[j],fs[i]];}
  fs.forEach(f=>{if(PC[f]>0){aiDiplo(f);if(PC[f]>0)aiMilitary(f);if(PC[f]>0){aiAnnex(f);aiProxy(f);aiClaim(f);aiTech(f);}}});
  occupationTurn();aiEvents();
  G.armies.forEach(a=>{a.mv=false;});
  for(let f=0;f<n;f++)if(PC[f]>0)G.gold[f]+=income(f);
  lnTurn();G.turn++;G.ev=makeEvent();checkEnd();save();
}
/* ===== ОККУПАЦИЯ, ПРИТЯЗАНИЯ, СОПРОТИВЛЕНИЕ, ПРОКСИ-ВОЙНА ===== */
const ANNEX_COST=25,ANNEX_AFTER=3,SUP_COST=30,REB_COST=25;
const isOcc=p=>G.pOwner[p]!==G.core[p];
function occupiedBy(f){const r=[];for(let p=0;p<P.length;p++)if(G.pOwner[p]===f&&G.core[p]!==f)r.push(p);return r;}
const restiveOf=t=>{const r=[];for(let p=0;p<P.length;p++)if(G.pOwner[p]===t&&(G.core[p]!==t||P[p].c!==t))r.push(p);return r;};
function claimsOf(f){const r=[];for(let p=0;p<P.length;p++)if(G.core[p]===f&&G.pOwner[p]!==f)r.push(p);return r;}

const annexCost=(p,f)=>claimed(p,f)?10:Math.max(10,Math.round((ANNEX_COST-5*tl(f,2))*scx(f).ann*bx(f).adm*eff(f,'ann')));
function annexInfo(p,f){
  if(G.pOwner[p]!==f||!isOcc(p))return{ok:false,why:'не оккупация'};
  const w=claimed(p,f)?0:ANNEX_AFTER,t=G.turn-G.since[p];if(t<w)return{ok:false,why:'ещё '+(w-t)+' ход.'};
  if(G.res[p]>=50)return{ok:false,why:'сопротивление выше 50%'};
  if(G.gold[f]<annexCost(p,f))return{ok:false,why:annexCost(p,f)+' из казны'};
  return{ok:true};
}
function annex(p,f){
  if(!annexInfo(p,f).ok)return false;
  const c=G.core[p];G.gold[f]-=annexCost(p,f);G.core[p]=f;G.res[p]=0;G.rfund[p]=0;addOp(c,f,-8);
  addLog(fname(f)+' аннексирует '+P[p].name+(PC[c]===0?' ('+fname(c)+' поглощена)':''),f===G.you||c===G.you);
  return true;
}

/* сопротивление: раз в ход */
function occupationTurn(){
  for(let p=0;p<P.length;p++){
    const f=G.pOwner[p],c=G.core[p];
    if(f===c){

function drawPiece(path,px,py,size,color,mineF){

const scr=(p)=>{const q=ND(p);return [(q.ax+.5)*S*V.z-(V.cx*V.z-V.W/2),(q.ay+.5)*S*V.z-(V.cy*V.z-V.H/2)];};
function drawUnits(){
  const z=V.z,occ=new Set(),slot={};
  ctx.textAlign='center';ctx.textBaseline='middle';
  const arr=G.armies.slice().sort((x,y)=>(y.o===G.you)-(x.o===G.you)||y.n-x.n);

    const pr=ND(a.p),[px,py]=scr(a.p);
    if(px<-30||py<-30||px>V.W+30||py>V.H+30)continue;
    const foot=Math.sqrt(pr.n)*S*z*.9,isMine=a.o===G.you,selA=sel.army===a.id,forced=isMine||selA||a.p===sel.focus;
    const size=Math.max(16,Math.min(38,foot*.5));
    if(!forced&&foot<16)continue;
    const off=(slot[a.p]=(slot[a.p]||0)+1)-1,ox=off?(off%2?1:-1)*Math.ceil(off/2)*size*.95:0;
    const k2=((px/24)|0)+','+((py/24)|0);
    if(!forced&&!off&&occ.has(k2))continue;occ.add(k2);
    let x=px+ox,y=py-3;
    const sl=slideOf(a);if(sl){const u=Math.min(1,(now()-sl.t0)/sl.dur),e=1-(1-u)*(1-u),[fx0,fy0]=scr(sl.from);x=fx0+(x-fx0)*e;y=fy0-3+(y-fy0+3)*e;}
    if(selA){ctx.beginPath();ctx.arc(x,y,size*.78,0,6.283);ctx.fillStyle='rgba(76,192,255,.28)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#4cc0ff';ctx.stroke();}
    drawPiece(UPIECE[a.u]||pieceFor(a.n),x,y,size,facColor(a.o),isMine);
    ctx.font='700 11px "JetBrains Mono",monospace';ctx.lineWidth=3;ctx.strokeStyle='#07111c';ctx.fillStyle='#fff';
    const tx=String(a.n);ctx.strokeText(tx,x,y+size/2+7);ctx.fillText(tx,x,y+size/2+7);
    if(a.cargo&&a.cargo.length){const cx='⚓'+cargoUsed(a);ctx.strokeText(cx,x,y-size/2-5);ctx.fillStyle='#ffd166';ctx.fillText(cx,x,y-size/2-5);ctx.fillStyle='#fff';}
    if(isMine&&a.mv){ctx.beginPath();ctx.arc(x+size*.42,y-size*.42,4,0,6.283);ctx.fillStyle='#8a99a8';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#07111c';ctx.stroke();}
  }
  // названия держав у их столиц
  const emp=new Float64Array(C.length);for(let p=0;p<P.length;p++)emp[G.pOwner[p]]+=P[p].n;
  ctx.font='700 12px "PT Sans",sans-serif';const used=[];
  const order=C.map((c,i)=>i).sort((a,b)=>emp[b]-emp[a]);
  for(const f of order){
    if(!emp[f])continue;const cap=C[f].cap;if(G.pOwner[cap]!==f)continue;
    const foot=Math.sqrt(emp[f])*S*z*.9,[px,py0]=scr(cap);
    if(!(foot>62||f===G.you||(sel.focus>=0&&G.pOwner[sel.focus]===f)))continue;
    if(px<-60||px>V.W+60||py0<-20||py0>V.H+20)continue;
    const py=py0-Math.max(16,Math.min(38,Math.sqrt(P[cap].n)*S*z*.45))/2-12,w=ctx.measureText(C[f].ru).width+6;
    if(used.some(r=>Math.abs(r[0]-px)<(r[2]+w)/2&&Math.abs(r[1]-py)<14))continue;used.push([px,py,w]);
    ctx.lineWidth=3.5;ctx.strokeStyle='rgba(5,12,20,.95)';ctx.strokeText(C[f].ru,px,py);ctx.fillStyle='#fff';ctx.fillText(C[f].ru,px,py);
  }
}

function drawCities(pass){
  const z=V.z;if(z<0.1)return;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 11px "PT Sans",sans-serif';
  const used=[];
  for(const p of CITYP){
    const[x,y]=scr(p);if(x<-30||y<-30||x>V.W+30||y>V.H+30)continue;
    const pr=P[p],k=pr.city.k,r=k==='c'?5.5:4.2;
    if(pass===0){
      ctx.beginPath();ctx.arc(x,y,r+1.8,0,6.283);ctx.fillStyle='#07111c';ctx.fill();
      ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle=KCOL[k];ctx.fill();
      if(k==='c'){ctx.beginPath();ctx.arc(x,y,r*.4,0,6.283);ctx.fillStyle='#07111c';ctx.fill();}
    }else if(z>=0.5||p===sel.focus||(G.pOwner[p]===G.you&&z>=0.3)){
      const ly=y+r+9,w=ctx.measureText(pr.city.n).width+6;
      if(used.some(u=>Math.abs(u[0]-x)<(u[2]+w)/2&&Math.abs(u[1]-ly)<12))continue;used.push([x,ly,w]);
      ctx.lineWidth=3;ctx.strokeStyle='rgba(5,12,20,.95)';ctx.strokeText(pr.city.n,x,ly);ctx.fillStyle='#fff';ctx.fillText(pr.city.n,x,ly);

}
function pickAt(sx,sy){
  if(V.z>=0.1&&V.z<1.6){let bp=-1,bd=15*15;for(const p of CITYP){const[x,y]=scr(p),d=(x-sx)**2+(y-sy)**2;if(d<bd){bd=d;bp=p;}}if(bp>=0)return bp;}
  const wx=V.cx+(sx-V.W/2)/V.z,wy=V.cy+(sy-V.H/2)/V.z,x=Math.floor(wx/S),y=Math.floor(wy/S);
  if(x<0||y<0||x>=GW||y>=GH)return -1;
  if(G&&ZI&&!LANDM[y*GW+x]){const z=ZI[((y/BLK)|0)*NBXg+((x/BLK)|0)];if(z>=0)return NP+z;}
  const t=PV[y*GW+x];if(t!==65535)return t;
  const r=Math.ceil(10/(S*V.z));
  for(let d=1;d<=r;d++)for(let dy=-d;dy<=d;dy++)for(let dx=-d;dx<=d;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==d)continue;
    const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=GW||yy>=GH)continue;const u=PV[yy*GW+xx];if(u!==65535)return u;}
  return -1;
}

function showRules(){
  modal('Правила','<p>Вы правите одной страной. Цель: вместе с союзниками контролировать '+Math.round(WIN_SHARE*100)+'% мировой экономики.</p><p><b>Провинции.</b> Большие страны поделены на несколько провинций. Каждая даёт доход.</p><p><b>Армии.</b> Армия — шахматная фигура: чем больше войск, тем сильнее фигура. Нажмите на свою армию, потом на соседнюю провинцию и выберите: пойти всей армией или половиной. Каждая армия ходит один раз за ход.</p><p><b>Бой.</b> Заходить можно в свои и союзные провинции, а в чужие только после объявления войны. Защитник получает бонус 25%. Победитель забирает провинцию.</p><p><b>Дипломатия.</b> Война и мир, союзы, пакты о ненападении, торговые договоры и подарки. ИИ тоже воюет, просит мира и зовёт в союз.</p><p><b>Оккупация.</b> Захваченная земля остаётся оккупированной: она с полосками цвета прежней страны, а прежняя страна на неё притязает. Оккупанту её сопротивление растёт каждый ход, особенно без гарнизона. При 50% доход с провинции пропадает, при 100% начинается восстание. Через 3 хода и при сопротивлении ниже 50% можно аннексировать землю: она навсегда становится частью вашей страны. Оккупированная целиком страна может возродиться из-за восстания. Подробности нажмите «Страна» в карточке провинции.</p><p><b>Прокси-война.</b> В дипломатии можно тайно снабжать оружием страну, которая воюет, или финансировать повстанцев на оккупированных землях, не объявляя войны. Но помощь могут раскрыть.</p><p><b>Реальный мир.</b> Партия стартует с обстановки осени 2026: идут войны Россия–Украина, США и Израиль–Иран, Афганистан–Пакистан, Конго–Руанда. Действуют союзы НАТО и ОДКБ, договоры США с Японией, Кореей, Филиппинами, Австралией, Таиландом и Израилем, а также России и Китая с КНДР и другие. Отношения стран (Индия и Пакистан, Китай и Тайвань и т.д.) взяты из реальной политики. Это упрощение, данные приблизительные.</p><p><b>Притязания.</b> На соседнюю чужую провинцию можно заявить права за 30 золота. Тогда война за неё не портит репутацию, а захваченная земля не оккупируется и аннексируется почти даром. Любую свою оккупированную или аннексированную землю можно освободить: прежняя страна станет вам другом, а погибшая возродится.</p><p><b>Ресурсы.</b> В игре 35 ресурсов: сырьё, продовольствие, энергия, потребительские и военные товары, мягкие ресурсы и стратегические. Месторождения привязаны к реальной географии и достаются тому, кто владеет провинцией. Каждый ход страна добывает и потребляет ресурсы; дефицит еды снижает доход, нехватка топлива и оружия ослабляет армию и удорожает набор, нехватка науки удорожает технологии. Недостающее покупается на рынке (Меню → Рынок ресурсов), излишки можно продавать. Авто-закупка покрывает дефицит за счёт казны (не больше 35% за ход). С воюющими странами торговать нельзя.</p><p><b>Техника.</b> В провинции (кнопка «Техника и флот») можно построить танк, бронемашину, машины, истребитель, корабль, грузовой корабль и катер; нужные исследования открываются в ветке «Военная». Каждая группа ходит на свою дальность: танк до 6 клеток, бронемашина 3 (с ней пехота идёт на 3 клетки вместо 1), машины 5, истребитель 9, катер 5, корабль 6, грузовой корабль 4. Флот ходит только по морским зонам (нажмите на воду), грузовой корабль берёт на борт любые наземные части и высаживает десант на побережье. Дроны есть только у Ирана: после удара исчезают, каждый уничтожает до 5 человек.</p><p><b>Карты.</b> Сверху можно переключать вид: политическая, дипломатия (цвет страны показывает её отношения с выбранной державой), ресурсная (где добывается выбранный ресурс) и физическая (климат и рельеф, схематично).</p><p><b>Строй страны.</b> У каждой державы есть система (демократия, монархия, гибридный режим, тоталитаризм), идеология (коммунизм, либерализм, национализм, фашизм, теократия) и экономика (либеральная, социализм, узкий круг лиц, плановая, капитализм). Они меняют доход, торговлю, цену набора, силу атаки и обороны, агрессивность ИИ и отношения: схожие строи сближаются, противоположные расходятся. Свой строй можно менять в «Меню → Строй страны» за 60 золота раз в 8 ходов. Наведите на плашку строя в карточке страны, чтобы увидеть эффекты.</p><p><b>Города.</b> Столицы и особые города (деловые центры, космодромы, военные базы) — отдельные провинции с повышенным доходом; базы дают защиту +2. Нажмите на значок города на карте.</p><p><b>Аренда.</b> Союзник или вассал может арендовать вашу провинцию (кроме столицы) на 12 ходов. Рента равна доходу провинции, арендатор получает на 50% больше и может набирать там войска. Аренда заканчивается при войне, распаде союза или смене владельца.</p><p><b>Очки войны и мирный договор.</b> За захваты и удержание чужих земель вы копите очки войны. В дипломатии при войне нажмите «Мирный договор»: потратьте очки, чтобы потребовать провинции, сделать врага вассалом или взять контрибуцию. ИИ-победители тоже диктуют условия.</p><p><b>Вассалы.</b> Вассал отдаёт сюзерену 20% дохода, воюет на его стороне и не может сам объявлять войну. Его земли открыты для ваших армий. Если сюзерен ослабнет, вассал может отделиться. Вассала можно освободить: он станет другом.</p><p><b>Технологии и события.</b> Три ветки по три уровня: армия, экономика, администрация. Иногда случаются события, в которых нужно выбрать: заплатить или рискнуть.</p><p style="color:var(--mute)">Границы приблизительные. Правители взяты со страницы <a href="'+LISTURL+'" target="_blank" rel="noopener">Википедии</a>, каждое имя ведёт на статью.</p>');
}

function pinchInit(){const p=[...ptrs.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,z:V.z};}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,rel(e));
  if(ptrs.size===1){down=rel(e);moved=false;t0=performance.now();}else{moved=true;pinchInit();}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const n=rel(e),dx=n.x-p.x,dy=n.y-p.y;p.x=n.x;p.y=n.y;

function up(e){

}

const rfmt=v=>v>=100?String(Math.round(v)):v>=10?v.toFixed(1):v.toFixed(2);
function resTrade(need){
  const n=C.length,you=G.you,alive=[];
  for(let c=0;c<n;c++)if(PC[c]>0)alive.push(c);
  let pBudget=G.gold[you]*.35;const log={};let sellCap=income(you)*.2;
  for(const r of R_TRADE){
    const buyers=[],sellers=[];
    for(const c of alive){const nd=need[c][r];if(nd<=1e-6)continue;const T=G.rst[c][r];if(T<nd)buyers.push(c);else if(T>nd*2.2)sellers.push(c);}
    if(!buyers.length||!sellers.length)continue;
    for(let i=sellers.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[sellers[i],sellers[j]]=[sellers[j],sellers[i]];}
    buyers.sort((a,b)=>G.rst[a][r]/need[a][r]-G.rst[b][r]/need[b][r]);
    for(const b of buyers){
      if(b===you&&!G.rauto.buy)continue;
      let want=need[b][r]*1.4-G.rst[b][r],budget=b===you?pBudget:G.gold[b]*.5;
      for(const s of sellers){
        if(want<.05||budget<1)break;
        if(s===b||(s===you&&!G.rauto.sell)||!resOK(b,s))continue;
        const avail=G.rst[s][r]-need[s][r]*2;if(avail<.05)continue;
        const sd=need[s][r],T=G.rst[s][r],sc=sd>0?1-Math.max(0,Math.min(1,T/(3*sd))):.3,unit=G.rpr[r]*(.65+.9*sc)*1.08;
        let q=Math.min(want,avail),cost=q*unit;
        if(cost>budget){q=budget/unit;cost=budget;}
        if(cost<1||q<.05)continue;
        if(s===you){if(sellCap<=1)continue;if(cost>sellCap){q=q*sellCap/cost;cost=sellCap;}if(q<.05)continue;sellCap-=cost;}
        const pay=Math.round(cost);
        G.rst[s][r]-=q;G.rst[b][r]+=q;G.gold[b]-=pay;G.gold[s]+=pay;budget-=pay;want-=q;
        if(b===you)pBudget-=pay;
        if(Math.random()<.25){addOp(s,b,1);addOp(b,s,1);}
        if(b===you||s===you){const k=(b===you?'+':'-')+r,e=log[k]||(log[k]={r,imp:b===you,q:0,g:0});e.q+=q;e.g+=pay;}
      }
    }
  }
  const parts=Object.values(log).map(e=>(e.imp?'куплено ':'продано ')+RES[e.r][1].toLowerCase()+' '+rfmt(e.q)+' ('+(e.imp?'−':'+')+e.g+')');
  if(parts.length)addLog('Рынок: '+parts.slice(0,4).join(', ')+(parts.length>4?' и ещё '+(parts.length-4):''),true);
}
function resFx(A){
  for(let c=0;c<C.length;c++){
    if(PC[c]<=0)continue;
    const sg=G.rsg[c],g=id=>sg[RI[id]];
    const F=(2*g('grain')+g('meat')+g('dairy')+g('veg')+2*g('wdrink'))/7;
    const Rr=(g('iron')+g('copper')+g('alu')+g('coal')+g('chem')+g('wood')+g('stone')+g('wtech'))/8;
    const E=g('power'),Fu=g('fuel'),Cc=(g('textile')+g('appl')+g('cars')+g('furn')+g('meds'))/5;
    const M=(g('arms')+g('mveh')+g('gear')+g('mmed'))/4;
    G.rfx[c]={
      inc:(.78+.22*F)*(.88+.12*Rr)*(.86+.14*E)*(.94+.06*Cc)*(.96+.04*g('labor'))*(.97+.03*g('polcap')),
      atk:(.88+.12*Fu)*(.9+.1*M),
      rec:1.4-.4*M,
      tech:1.3-.3*g('sci'),
      flat:Math.round(.5*(A.geo[c][RI.gold]+A.geo[c][RI.cult]))
    };
  }
}
function resTurn(){
  if(!G||!G.rst)return;
  const A=resAgg(),prod=resProduction(A),need=resNeeds(A),n=C.length;
  for(let c=0;c<n;c++){if(PC[c]<=0)continue;
    for(let r=0;r<NR;r++){const id=RES[r][0],dec=R_FLOW.has(id)?0:(R_PERISH[id]||1);G.rst[c][r]=G.rst[c][r]*dec+prod[c][r];}}
  resTrade(need);
  for(let c=0;c<n;c++){
    if(PC[c]<=0){for(let r=0;r<NR;r++){G.rsg[c][r]=1;G.rst[c][r]=0;}continue;}
    for(let r=0;r<NR;r++){
      const nd=need[c][r];let T=G.rst[c][r];
      if(nd<=1e-9){G.rsg[c][r]=1;G.rst[c][r]=R_FLOW.has(RES[r][0])?0:Math.round(T*100)/100;continue;}
      if(T>=nd){G.rsg[c][r]=1;T-=nd;}else{G.rsg[c][r]=T/nd;T=0;}
      G.rst[c][r]=Math.round(Math.min(T,8*nd)*100)/100;
    }
  }
  resFx(A);
}
/* --- ручная торговля игрока --- */
function mktPartners(S,r){
  const me=G.you,sellers=[],buyers=[];
  for(let c=0;c<C.length;c++){
    if(c===me||PC[c]<=0||!resOK(me,c))continue;
    const nd=S.need[c][r],T=G.rst[c][r],pm=resPriceS(S,c,r);
    const avail=T-nd*2;if(avail>=.5)sellers.push({c,avail,unit:pm*1.08});
    const room=nd*3-T;if(room>=.5&&G.gold[c]>=1)buyers.push({c,room,unit:pm*.92});
  }
  sellers.sort((a,b)=>a.unit-b.unit);buyers.sort((a,b)=>b.unit-a.unit);
  return{sellers:sellers.slice(0,5),buyers:buyers.slice(0,5)};
}
function mkTrade(kind,c,r,q){
  const me=G.you,S=resSnap();
  if(!resOK(me,c))return{ok:false,msg:'Торговля невозможна: война или вражда'};
  const nd=S.need[c][r],T=G.rst[c][r],pm=resPriceS(S,c,r),nm=RES[r][1];
  if(kind==='buy'){
    const avail=T-nd*2;if(avail<q-1e-6)return{ok:false,msg:C[c].ru+' не может продать столько (доступно '+rfmt(Math.max(0,avail))+')'};
    const cost=Math.ceil(q*pm*1.08);if(G.gold[me]<cost)return{ok:false,msg:'В казне не хватает золота: нужно '+cost};
    G.gold[me]-=cost;G.gold[c]+=cost;G.rst[c][r]-=q;G.rst[me][r]+=q;addOp(c,me,1);
    return{ok:true,msg:'Куплено: '+nm.toLowerCase()+' '+q+' за '+cost};
  }
  if(G.rst[me][r]<q-1e-6)return{ok:false,msg:'На складе только '+rfmt(G.rst[me][r])};
  const room=nd*3-T;if(room<q-1e-6)return{ok:false,msg:C[c].ru+' не нуждается в таком количестве'};
  const pay=Math.floor(q*pm*.92);if(pay<1)return{ok:false,msg:'Слишком маленькая партия'};
  if(G.gold[c]<pay)return{ok:false,msg:C[c].ru+' не может заплатить'};
  G.gold[me]+=pay;G.gold[c]-=pay;G.rst[me][r]-=q;G.rst[c][r]+=q;addOp(c,me,1);
  return{ok:true,msg:'Продано: '+nm.toLowerCase()+' '+q+', получено '+pay};
}

const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function relRGB(S,o){
  if(o===S)return[76,192,255];
  const st=statusOf(S,o).id;
  if(st==='war')return[229,72,77];
  if(st==='vassal'||st==='lord')return[181,140,255];
  if(st==='ally')return[31,191,107];
  const op=(opn(S,o)+opn(o,S))/2,t=Math.max(-1,Math.min(1,op/70)),g=[96,112,128];
  if(t>=0)return[g[0]+(80-g[0])*t,g[1]+(190-g[1])*t,g[2]+(130-g[2])*t];
  const k=-t;return[g[0]+(226-g[0])*k,g[1]+(132-g[1])*k,g[2]+(54-g[2])*k];
}
function provRes(p,r){

  if(k==='geo'){v=PBASE[p][r]*.6;P[p].dep.forEach(d=>{if(d[0]===r)v+=d[1];});}

  else if(id==='polcap')v=.25+(P[p].city?.5:0);
  else if(k==='ind')v=G.pEco[p]*.4*SPECM[G.pOwner[p]][r];

}

    if(oa===ob)return[phys?'rgba(0,0,0,.14)':'rgba(2,6,12,.3)',1];
