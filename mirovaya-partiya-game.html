      else if(k<2){const xx=j%GW,yy=(j/GW)|0,z2=ZI[((yy/BLK)|0)*NBX+((xx/BLK)|0)];if(z2>=0&&z2!==z){const a=Math.min(z,z2),b=Math.max(z,z2),kk=a*4096+b;pc.set(kk,(pc.get(kk)||0)+1);}}}
  }}
  SEA.forEach(Z=>{Z.name=seaName(Z.ax/CPD-180,LAT0-Z.ay/CPD);});
  SEA.forEach(Z=>{const la=Math.round(LAT0-Z.ay/CPD),lo=Math.round(Z.ax/CPD-180);Z.pos=Math.abs(la)+(la>=0?'°с.ш. ':'°ю.ш. ')+Math.abs(lo)+(lo>=0?'°в.д.':'°з.д.');});
  for(const [kk,v] of pc){if(v<3)continue;const a=(kk/4096)|0,b=kk%4096;SEA[a].nb.push(NP+b);SEA[b].nb.push(NP+a);}
  P.forEach(p=>{p.sea=[];});
  const byP={};
  for(const [kk,v] of cc){if(v<2)continue;const p=(kk/4096)|0,z=kk%4096;(byP[p]=byP[p]||[]).push([z,v]);}
  for(const p in byP){byP[p].sort((x,y)=>y[1]-x[1]);byP[p].slice(0,4).forEach(([z])=>{P[p].sea.push(NP+z);SEA[z].coast.push(+p);});}
}
const airNb=n=>n<NP?P[n].nb.concat(P[n].sea):SEA[n-NP].nb.concat(SEA[n-NP].coast);
const foesAt=(f,n)=>armiesAt(n).filter(x=>atWar(f,x.o));
const hasApc=a=>(a.u||'inf')==='inf'&&G.armies.some(x=>x.u==='apc'&&x.o===a.o&&x.p===a.p&&!x.mv);
const mvOf=a=>hasApc(a)?3:ut(a).mv;
const cargoUsed=c=>(c.cargo||[]).reduce((s,x)=>s+x.n*slotOf(x.u),0);
const cargoFree=c=>c.n*SLOT_CAP-cargoUsed(c);
/* что может сделать группа a: Map узел -> {d,act,via} */
function reachOf(a){
  const out=new Map();
  if(!G||G.over||a.mv)return out;
  const f=a.o,U=ut(a),u=a.u||'inf',mv=mvOf(a);
  const fr=n=>n<NP&&allied(f,G.pOwner[n]),enP=n=>n<NP&&atWar(f,G.pOwner[n]);
  const set=(n,d,act,via)=>{const o=out.get(n);if(!o||d<o.d)out.set(n,{d,act,via});};
  if(U.k==='land'){
    if(a.p>=NP)return out;
    const dist=new Map([[a.p,0]]),q=[a.p];
    for(let h=0;h<q.length;h++){const x=q[h],d=dist.get(x);if(d>=mv)continue;
      for(const v of P[x].nb){
        if(fr(v)){if(!dist.has(v)){dist.set(v,d+1);q.push(v);set(v,d+1,'move');}}
        else if(enP(v))set(v,d+1,'attack');
        else if(x===a.p)set(v,1,'peace');
      }}
    for(const s of P[a.p].sea){const c=G.armies.find(x=>x.u==='cargo'&&x.o===f&&x.p===s);if(c&&cargoFree(c)>=slotOf(u))set(s,1,'load');}
  }else if(U.k==='sea'){
    if(a.p<NP)return out;
    const dist=new Map([[a.p,0]]),q=[a.p];
    for(let h=0;h<q.length;h++){const x=q[h],d=dist.get(x);
      for(const c of SEA[x-NP].coast){
        if(u==='cargo'){if(!(a.cargo&&a.cargo.length))continue;if(fr(c))set(c,d,'unload',x);else if(enP(c))set(c,d,'invade',x);}
        else if(U.w>=1&&enP(c)&&foesAt(f,c).length)set(c,d,'strike',x);
      }
      if(d>=mv)continue;
      for(const v of SEA[x-NP].nb){if(dist.has(v))continue;
        if(foesAt(f,v).length){dist.set(v,d+1);if(U.w>=1)set(v,d+1,'strike',x);continue;}
        dist.set(v,d+1);q.push(v);set(v,d+1,'move');}}
  }else{
    const dist=new Map([[a.p,0]]),q=[a.p];
    for(let h=0;h<q.length;h++){const x=q[h],d=dist.get(x);if(d>=mv)continue;
      for(const v of airNb(x)){if(dist.has(v))continue;dist.set(v,d+1);q.push(v);
        if(foesAt(f,v).length)set(v,d+1,'strike');
        else if(v>=NP||fr(v))set(v,d+1,'move');}}
  }
  out.delete(a.p);return out;
}
function addArmy(o,p,n,mv,u,cg){
  u=u||'inf';let a=armyAt(o,p,u);
  if(a){a.n+=n;a.mv=a.mv||!!mv;}else{a={id:G.nid++,o,p,n,mv:!!mv};if(u!=='inf')a.u=u;G.armies.push(a);}
  if(cg&&cg.length){a.cargo=a.cargo||[];cg.forEach(x=>{const e=a.cargo.find(y=>y.u===x.u);if(e)e.n+=x.n;else a.cargo.push({u:x.u,n:x.n});});}
  return a;
}
function moveStack(a,t,frac){
  const A=sendN(a,frac),whole=A>=a.n,cg=whole&&a.cargo?a.cargo:null;
  fxSlide(a.p,t,a.o);a.n-=A;if(a.n<=0)dropArmy(a);
  return addArmy(a.o,t,A,true,a.u,cg);
}
function killW(foes,budget){
  foes.sort((x,y)=>((x.u||'inf')==='inf'?0:1)-((y.u||'inf')==='inf'?0:1));
  let left=budget,dead=0;
  for(const x of foes){const w=Math.max(.5,ut(x).w);while(x.n>0&&left>=w){x.n--;left-=w;dead++;}if(x.n<=0)dropArmy(x);}
  return dead;
}
/* удар с воздуха, моря или дроном: стреляет по войскам в узле t */
function strikeAct(a,t,frac,via){
  const f=a.o,u=a.u||'inf',U=UT[u];
  const foes=foesAt(f,t);if(!foes.length)return {kind:'strike',msg:'Цели нет'};
  const po=t<NP?G.pOwner[t]:foes[0].o;
  if(u==='drone'){
    const A=sendN(a,frac);a.n-=A;if(a.n<=0)dropArmy(a);
    fxBattle(t,true,f,po);
    const dead=killW(foes,5*A);
    if(t<NP&&atWar(f,po))addWs(po,f,1);
    if(f===G.you||po===G.you)addLog(fname(f)+': дроны ударили по «'+ndName(t)+'»',true);
    return {kind:'strike',msg:'Дроны сгорели в атаке, уничтожено '+dead+' ('+A+' дрон.)'};
  }
  let cur=a;
  if(via!==undefined&&via!==a.p){cur=moveStack(a,via,1);cur.mv=false;}
  const A=sendN(cur,u==='ship'||u==='boat'?1:frac),Dm=foes.reduce((s,x)=>s+uw(x),0);
  const r=roll(A*U.w,Dm+.5,f,po);fxBattle(t,r.win,f,po);
  cur.n-=A;if(cur.n<=0)dropArmy(cur);
  let lost,kills;
  if(t>=NP){ // морской бой
    if(r.win){foes.forEach(dropArmy);lost=Math.min(A-1,Math.round(A*.5*r.ed/r.ea));kills=Dm;}
    else{lost=Math.min(A,Math.ceil(A*.6));kills=killW(foes,Dm*.4*r.ea/r.ed);}
    const left=A-lost;if(left>0)addArmy(f,r.win?t:cur.p,left,true,u);
  }else{ // удар по побережью/войскам на суше
    kills=killW(foes,Math.round(Dm*Math.min(1,.8*r.ea/r.ed)));
    lost=Math.min(A,Math.round(A*.2*Math.min(2,r.ed/r.ea)));
    const left=A-lost;if(left>0)addArmy(f,cur.p,left,true,u);
    if(atWar(f,po))addWs(po,f,1);
  }
  if(f===G.you||po===G.you)addLog(fname(f)+': удар по «'+ndName(t)+'»',true);
  return {kind:'strike',msg:(r.win?'Успех: ':'Частично: ')+'уничтожено '+(typeof kills==='number'?kills:0)+', потеряно '+lost};
}
function perform(a,t,frac){
  if(!G||G.over)return null;
  const R=reachOf(a),r=R.get(t);if(!r)return null;
  const f=a.o,u=a.u||'inf',U=UT[u];
  const apc=u==='inf'?G.armies.find(x=>x.u==='apc'&&x.o===f&&x.p===a.p&&!x.mv):null;
  if(r.act==='move'){
    const fr=(u==='cargo')?1:frac;
    const dst=moveStack(a,t,fr);
    if(apc&&dst.p===t&&t<NP)moveStack(apc,t,1);
    return {kind:'move',msg:U.n+' перемещены'+(apc?' вместе с бронемашиной':'')};
  }
  if(r.act==='attack'){
    const rs=attack(a,t,frac);
    if(rs.win&&apc)moveStack(apc,t,1);
    return {kind:'attack',r:rs,cap:rs.win,msg:rs.win?'Победа! '+P[t].name+' взята, осталось '+rs.left+' ед.':'Атака отбита. Потеряно '+(rs.A-rs.back)+', у врага убито '+rs.dl};
  }
  if(r.act==='strike'){const rs=strikeAct(a,t,frac,r.via);return rs;}
  if(r.act==='load'){
    const c=G.armies.find(x=>x.u==='cargo'&&x.o===f&&x.p===t);if(!c)return null;
    const A=sendN(a,frac),take=Math.min(A,Math.floor(cargoFree(c)/slotOf(u)));if(take<1)return {kind:'load',msg:'Нет места на корабле'};
    fxSlide(a.p,t,f);a.n-=take;if(a.n<=0)dropArmy(a);
    addArmy(f,t,0,false,'cargo',[{u,n:take}]);
    return {kind:'load',msg:'Погружено: '+U.n+' ×'+take};
  }
  if(r.act==='unload'||r.act==='invade'){
    let c=a;
    if(r.via!==undefined&&r.via!==a.p)c=moveStack(a,r.via,1);
    const cg=c.cargo||[];c.cargo=[];c.mv=true;
    if(r.act==='unload'){cg.forEach(x=>addArmy(f,t,x.n,true,x.u));fxSlide(c.p,t,f);return {kind:'unload',msg:'Десант высажен в «'+P[t].name+'»'};}
    const po=G.pOwner[t],pw=cg.reduce((s,x)=>s+x.n*UT[x.u].w,0),D=defStrength(f,t),rr=roll(pw,D,f,po);
    fxBattle(t,rr.win,f,po);
    if(rr.win){
      const k=Math.max(.25,1-.75*rr.ed/rr.ea);
      armiesAt(t).filter(x=>atWar(f,x.o)).forEach(dropArmy);
      setOwner(t,f);cg.forEach(x=>addArmy(f,t,Math.max(1,Math.round(x.n*k)),true,x.u));onCapture(f,po,t);
      return {kind:'invade',cap:true,msg:'Десант взял «'+P[t].name+'»!'};
    }
    if(atWar(f,po))addWs(po,f,1);
    return {kind:'invade',msg:'Десант отбит, войска потеряны'};
  }
  return null;
}
function unitCost(f,u){return Math.round(UT[u].c*Math.max(.6,eff(f,'rec')));}
function unitAvail(f,u){const U=UT[u];if(U.only)return C[f].iso===U.only;const L=(G.sci&&G.sci[f])||[];return !U.req||L.includes(U.req);}
function unitSpawn(p,f,u){
  const U=UT[u];if(ctrlOf(p)!==f||!unitAvail(f,u)||G.gold[f]<unitCost(f,u))return false;
  let node=p;if(U.k==='sea'){if(!P[p].sea.length)return false;node=P[p].sea[0];}
  G.gold[f]-=unitCost(f,u);addArmy(f,node,1,false,u);return true;
}
/* ----- ИИ: техника ----- */
function aiUnitMove(a,f,dist){
  const R=reachOf(a);if(!R.size)return;const U=ut(a),u=a.u||'inf';
  let best=-1,bs=0;
  for(const [t,r] of R){
    if(r.act==='attack'){const sc=a.n*U.w/(1.25*defStrength(f,t)+1);if(sc>bs){bs=sc;best=t;}}
    else if(r.act==='strike'){const sc=foesAt(f,t).reduce((s,x)=>s+uw(x),0)*(u==='drone'?.4:1);if(u==='drone'?sc>=1:sc>0){if(sc+.5>bs&&bs<100){bs=sc+.5;best=t;}}}
  }
  if(best>=0){const r=R.get(best);
    if(r.act==='attack'&&bs>1.4&&Math.random()<.6+G.aggr[f]*.3){perform(a,best,1);return;}
    if(r.act==='strike'&&Math.random()<.7){perform(a,best,1);return;}}
  if(U.k==='land'&&dist){let bn=-1,bd=dist[a.p];for(const [t,r] of R){if(r.act==='move'&&dist[t]>=0&&dist[t]<bd){bd=dist[t];bn=t;}}if(bn>=0&&dist[a.p]>0)moveStack(a,bn,1);}
}
function aiBuyUnits(f,wars,ps){
  if(!wars.length||G.turn<=PEACE||Math.random()>.4||!ps.length)return;
  const opts=UORDER.filter(u=>u!=='inf'&&UT[u].k!=='sea'&&unitAvail(f,u)&&G.gold[f]>=unitCost(f,u)+40);
  if(!opts.length)return;
  const u=opts[(Math.random()*opts.length)|0];
  const fronts=ps.filter(p=>P[p].nb.some(q=>wars.includes(G.pOwner[q])));
  const p=(fronts.length?fronts:ps)[(Math.random()*(fronts.length?fronts.length:ps.length))|0];
  unitSpawn(p,f,u);
}

`US DLC|CA DLC|MX DNC|GT HNO|HN HNO|SV HNO|NI TKO|CR DLC|PA DLC|CU TKP|HT HNO|DO DLC|CO DLC|VE TKS|GY DLC|SR DLC|EC DLC|PE DLC|BR DLC|BO DKS|PY DNC|UY DLC|AR DLL|CL DLC|GB DLC|IE DLC|IS DLS|NO DLS|SE DLS|FI DLS|DK DLS|DE DLC|FR DLC|NL DLC|BE DLC|CH DLL|AT DLC|CZ DLC|SK DNC|PL DNC|HU HNO|RO DLC|BG DLC|GR DLC|IT DNC|ES DLC|PT DLC|SI DLC|HR DNC|BA HNO|RS HNO|ME DLC|AL HLO|MK HNC|MD DLC|UA DNC|BY TNP|LT DLC|LV DLC|EE DLL|TR HNC|RU TNO|GE HLC|AM HLC|AZ TNO|KZ HNO|UZ TNO|TM TNP|KG HNO|TJ TNO|AF TTO|PK HNO|IN DNC|NP DKS|BT MNS|BD HNO|LK DNC|MM TNO|TH MNC|LA TKP|KH HNO|VN TKS|MY MNC|ID DNC|PH DLC|TW DLC|CN TKS|KP TKP|KR DLC|JP DLC|MN DNC|IR TTO|IQ HTO|SY HTO|LB HNO|IL DNC|JO MNC|SA MTO|YE HTO|OM MNC|AE MNL|QA MNC|KW MNC|EG TNO|LY HNO|TN HNC|DZ HNO|MA MNC|MR HNO|ML TNO|NE TNO|TD TNO|SD TNO|SS HNO|ET HNO|ER TNP|SO HNO|KE DLC|UG TNO|TZ HKS|RW TNO|BI TNO|CD HNO|CG TNO|CF HNO|CM TNO|GA TNO|NG DNC|BJ HNC|TG HNO|GH DLC|CI DNC|LR DLC|SL DLC|GN TNO|GW HNO|SN DLC|BF TNO|AO HNO|ZM DLC|ZW TNO|MW DLC|MZ HNO|NA DLC|BW DLC|ZA DLC|MG HNO|AU DLC|NZ DLC|PG DLC`.split('|').forEach(t=>{const q=t.split(' ');REG[q[0]]=q[1];});
const SYSN={D:'Демократия',M:'Монархия',H:'Гибридный режим',T:'Тоталитаризм'};
const IDN={K:'Коммунизм',L:'Либерализм',N:'Национализм',F:'Фашизм',T:'Теократия'};
const ECN={L:'Либеральная экономика',S:'Социализм',O:'Узкий круг лиц',P:'Плановая экономика',C:'Капитализм'};
const REGN2={s:SYSN,i:IDN,e:ECN},REGK={s:'Система',i:'Идеология',e:'Экономика'};
const EFF={
  s:{D:{inc:1.05,rec:1.10,aggr:-.15},M:{inc:1.02},H:{rec:.95,aggr:.05},T:{inc:.95,rec:.80,aggr:.15}},
  i:{K:{rec:.95,trade:.85},L:{trade:1.25,inc:1.02},N:{def:1,aggr:.05},F:{atk:.10,aggr:.20,trade:.80},T:{def:1,trade:.90,aggr:.05}},
  e:{L:{inc:1.05,trade:1.30,rec:1.10,up:.90},S:{inc:.97,up:.85},O:{inc:.92,rec:.90},P:{trade:.60,rec:.85,up:.90},C:{inc:1.08,trade:1.10}}
};
const ADD_K={atk:1,def:1,aggr:1};
function eff(f,k){
  const r=(G&&G.reg&&G.reg[f])||'HNC';let v=ADD_K[k]?0:1;
  ['s','i','e'].forEach((t,i)=>{const e=EFF[t][r[i]];if(e&&e[k]!==undefined){if(ADD_K[k])v+=e[k];else v*=e[k];}});
  const sst=G&&G.state&&G.state[f];if(sst&&STATE_EFF[sst]&&STATE_EFF[sst][k]!==undefined){if(ADD_K[k])v+=STATE_EFF[sst][k];else v*=STATE_EFF[sst][k];}
  const fx=G&&G.rfx&&G.rfx[f];if(fx){if(k==='inc'||k==='rec')v*=fx[k];else if(k==='atk')v+=fx.atk-1;}
  if(G&&(k==='inc'||k==='rec'||k==='atk')){const sx=scx(f);if(k==='inc')v*=sx.inc;else if(k==='rec')v*=sx.rec*bx(f).rec;else v+=sx.atk;}
  return v;
}
const recCost=f=>Math.round(REC_COST*Math.max(.6,eff(f,'rec')));
function effText(t,code){
  const e=EFF[t][code]||{},r=[];
  if(e.inc)r.push('доход ×'+e.inc.toFixed(2));if(e.trade)r.push('торговля ×'+e.trade.toFixed(2));
  if(e.rec)r.push('набор ×'+e.rec.toFixed(2));if(e.up)r.push('улучшения ×'+e.up.toFixed(2));
  if(e.atk)r.push('атака +'+Math.round(e.atk*100)+'%');if(e.def)r.push('оборона +'+e.def+' в исконных');
  if(e.aggr)r.push('агрессия ИИ '+(e.aggr>0?'+':'')+e.aggr.toFixed(2));
  return r.length?r.join(' · '):'без особых эффектов';
}
const IDAFF={KK:8,LL:8,NN:8,FF:8,TT:8,KL:-6,KN:-4,KF:-10,KT:-8,LN:-2,LF:-10,LT:-6,NF:2,NT:-1,FT:-4};
const SYAFF={DD:3,MM:3,HH:3,TT:3,DT:-4,DH:-1,DM:1,MT:-1,HM:1,HT:1};
const ECAFF={LL:2,SS:2,OO:2,PP:2,CC:2,LP:-3,CP:-2,LS:-2,CS:-1};
const pairAff=(T,a,b)=>T[a+b]!==undefined?T[a+b]:T[b+a]!==undefined?T[b+a]:0;
function aff(a,b){
  const x=(G.reg&&G.reg[a])||'HNC',y=(G.reg&&G.reg[b])||'HNC';
  return pairAff(SYAFF,x[0],y[0])+pairAff(IDAFF,x[1],y[1])+pairAff(ECAFF,x[2],y[2]);
}
const REFORM_COST=60,REFORM_CD=8;
function canReform(f){
  const t=G.reformT&&G.reformT[f];
  if(t!==undefined&&G.turn-t<REFORM_CD)return{ok:false,why:'Следующая реформа через '+(REFORM_CD-(G.turn-t))+' ход.'};
  if(G.gold[f]<REFORM_COST)return{ok:false,why:'Нужно '+REFORM_COST+' золота'};
  return{ok:true};
}
function doReform(f,k,code){
  const i='sie'.indexOf(k),cur=G.reg[f];if(cur[i]===code||!canReform(f).ok)return false;
  const old=C.map((c,j)=>(j!==f&&PC[j]>0)?aff(f,j):0);
  G.reg[f]=cur.slice(0,i)+code+cur.slice(i+1);G.gold[f]-=REFORM_COST;
  if(!G.reformT)G.reformT={};G.reformT[f]=G.turn;
  for(let j=0;j<C.length;j++){if(j===f||PC[j]<=0)continue;const d=Math.round((aff(f,j)-old[j])*0.8);if(d)addOp(j,f,d);}
  addLog(fname(f)+': реформа ('+REGK[k].toLowerCase()+') → '+REGN2[k][code],f===G.you);
  return true;
}
function regHTML(t){
  const r=(G.reg&&G.reg[t])||'HNC';
  return '<div class="rgs">'+['s','i','e'].map((k,i)=>'<span title="'+esc(effText(k,r[i]))+'"><b>'+REGK[k]+':</b> '+esc(REGN2[k][r[i]])+'</span>').join('')+'</div>';
}
function showRegime(){
  const me=G.you,r=G.reg[me],cr=canReform(me);
  let h='<p style="color:var(--mute);font-size:13px;margin:0 0 8px">Строй влияет на доход, торговлю, набор войск, бой и отношения с другими странами. Реформа стоит '+REFORM_COST+' золота, раз в '+REFORM_CD+' ходов.</p>';
  ['s','i','e'].forEach((k,i)=>{h+='<div class="sec">'+REGK[k]+': '+esc(REGN2[k][r[i]])+'</div><div class="cl">'+esc(effText(k,r[i]))+'</div>';});
  if(!cr.ok)h+='<p class="warn">'+esc(cr.why)+'</p>';
  modal('Строй: '+C[me].ru,h,[
    {label:'Сменить систему',cls:cr.ok?'pri':'',fn:()=>showRegPick('s')},
    {label:'Сменить идеологию',fn:()=>showRegPick('i')},
    {label:'Сменить экономику',fn:()=>showRegPick('e')},
    {label:'Закрыть'}]);
}
function showRegPick(k){
  const me=G.you,cur=G.reg[me]['sie'.indexOf(k)],cr=canReform(me),acts=[];
  let h='<p style="color:var(--mute);font-size:13px;margin:0 0 6px">'+(cr.ok?'Цена: '+REFORM_COST+' золота. Отношения других стран изменятся сразу.':esc(cr.why))+'</p>';
  Object.keys(REGN2[k]).forEach(code=>{
    h+='<div class="cl"><b>'+esc(REGN2[k][code])+(code===cur?' (сейчас)':'')+'</b><br><small>'+esc(effText(k,code))+'</small></div>';
    if(code!==cur)acts.push({label:REGN2[k][code],cls:cr.ok?'pri':'',fn:()=>{if(!cr.ok){toast(cr.why);showRegime();return;}
      if(doReform(me,k,code)){save();renderAll();toast('Реформа проведена: '+REGN2[k][code]);}showRegime();}});
  });
  acts.push({label:'Назад',fn:showRegime});
  modal(REGK[k],h,acts);
}

function offerTxt(o){
  if(o.type==='lrent')return 'арендовать вашу провинцию «'+esc(P[o.p].name)+'»: рента вам '+rentOf(o.p)+'/ход, срок '+LEASE_TURNS+' ходов';
  if(o.type==='lgive')return 'сдать вам в аренду «'+esc(P[o.p].name)+'»: рента '+rentOf(o.p)+'/ход, вам +'+leaseGain(o.p)+', срок '+LEASE_TURNS+' ходов';
  return OFFER_TXT[o.type];
}
function leaseOfferValid(o){
  if(o.type==='lrent')return canLease(o.p,G.you,o.from).ok;
  if(o.type==='lgive')return canLease(o.p,o.from,G.you).ok;
  return true;
}
/* ИИ сам просит аренду или сдаёт свою провинцию */
function aiLease(f){
  if(G.turn<=PEACE||Math.random()>0.08)return;
  let cnt=0;for(const k in G.lease){const l=G.lease[k];if(l.from===f||l.to===f)cnt++;}
  if(cnt>=4)return;
  const ps=leaseParties(f);if(!ps.length)return;
  const n=ps[(Math.random()*ps.length)|0];
  const safe=(p,ow)=>!P[p].nb.some(q=>enemiesOf(ow).includes(G.pOwner[q]));
  const byEco=(a,b)=>G.pEco[b]-G.pEco[a];
  if(Math.random()<0.5){
    if(opn(f,n)<0)return;
    const c=provsOf(n).filter(p=>P[p].nb.some(q=>G.pOwner[q]===f)&&canLease(p,n,f).ok).sort(byEco);
    if(!c.length)return;const p=c[0];
    if(n===G.you)pushOffer(f,'lrent',{p});
    else if(opn(n,f)>=10&&safe(p,n))startLease(p,n,f);
  }else{
    const c=provsOf(f).filter(p=>P[p].nb.some(q=>G.pOwner[q]===n)&&canLease(p,f,n).ok&&safe(p,f)).sort(byEco);
    if(!c.length)return;const p=c[0];
    if(n===G.you)pushOffer(f,'lgive',{p});
    else if(opn(n,f)>=0)startLease(p,f,n);
  }
}
/* стартовые аренды: Байконур у Казахстана арендует Россия */
function initLeases(){
  G.lease={};
  const by={};C.forEach(c=>by[c.iso]=c.i);
  [['KZ','RU','Байконур']].forEach(([a,b,n])=>{
    if(by[a]===undefined||by[b]===undefined)return;
    const p=C[by[a]].prov.find(id=>P[id].city&&P[id].city.n===n);if(p===undefined)return;
    const k=key(by[a],by[b]);delete G.war[k];G.ally[k]=1;
    G.lease[p]={from:by[a],to:by[b],until:9999};
    addLog(n+': аренда '+C[by[b]].ru+' у '+C[by[a]].ru+' действует с начала игры',false);
  });
}

/* ================= ГОРОДА И АРЕНДА ================= */
const LEASE_TURNS=12;
const ctrlOf=p=>{const l=G.lease&&G.lease[p];return l?l.to:G.pOwner[p];};
const leaseOf=p=>G.lease&&G.lease[p];
const rentOf=p=>Math.max(1,G.pEco[p]);
const leaseGain=p=>Math.ceil(G.pEco[p]*1.5)-rentOf(p);
function leaseGate(a,b){return a!==b&&isAlive(a)&&isAlive(b)&&(G.ally[key(a,b)]!==undefined||!!(G.vassal&&(G.vassal[a]===b||G.vassal[b]===a)));}
function leaseParties(f){const r=new Set();alliesOf(f).forEach(x=>{if(leaseGate(f,x))r.add(x);});vassalsOf(f).forEach(x=>r.add(x));const l=lordOf(f);if(l>=0&&isAlive(l))r.add(l);return[...r];}
function canLease(p,from,to){
  if(!G.lease)G.lease={};
  if(G.pOwner[p]!==from)return{ok:false,why:'Это не их провинция'};
  if(G.lease[p])return{ok:false,why:'Уже сдана в аренду'};
  if(!leaseGate(from,to))return{ok:false,why:'Аренда только между союзниками и вассалами'};
  if(C[from].cap===p)return{ok:false,why:'Столицу сдавать нельзя'};
  let n=0;for(const k in G.lease){const l=G.lease[k];if(l.from===from&&l.to===to)n++;}
  if(n>=3)return{ok:false,why:'Не больше 3 аренд между двумя державами'};
  return{ok:true};
}
function startLease(p,from,to){
  G.lease[p]={from,to,until:G.turn+LEASE_TURNS};
  addOp(from,to,3);addOp(to,from,3);
  addLog(fname(to)+' арендует «'+P[p].name+'» у '+fname(from)+' на '+LEASE_TURNS+' ходов',from===G.you||to===G.you);
}
function endLease(p,why){
  const l=G.lease&&G.lease[p];if(!l)return;delete G.lease[p];
  addLog('Аренда «'+P[p].name+'» ('+fname(l.to)+' у '+fname(l.from)+') окончена: '+why,l.to===G.you||l.from===G.you);
}
function cancelLease(p,by){
  const l=G.lease&&G.lease[p];if(!l)return;
  if(by===l.from)addOp(l.to,l.from,-10);
  endLease(p,by===l.to?'арендатор вернул провинцию':'владелец расторг аренду');
}
function checkLeases(){
  if(!G||!G.lease)return;
  for(const k in G.lease){const l=G.lease[k],p=+k;let why=null;
    if(!isAlive(l.from)||!isAlive(l.to))why='держава исчезла';
    else if(G.pOwner[p]!==l.from)why='сменился владелец';
    else if(atWar(l.from,l.to))why='война между ними';
    else if(!leaseGate(l.from,l.to))why='союз распался';
    else if(G.turn>=l.until)why='срок истёк';
    if(why)endLease(p,why);}
}
function leaseTurn(){
  checkLeases();
  if(G.lease)for(const k in G.lease){const l=G.lease[k];addOp(l.from,l.to,1);}
}
function leaseNet(f){let s=0;if(G.lease)for(const k in G.lease){const l=G.lease[k];if(l.to===f)s-=rentOf(+k);else if(l.from===f)s+=rentOf(+k);}return s;}
function tryLease(p,from,to){
  const me=G.you,ai=from===me?to:from,cl=canLease(p,from,to);
  if(!cl.ok)return{ok:false,msg:cl.why};
  const op=opn(ai,me);
  if(ai===from){
    if(op<10)return{ok:false,msg:C[ai].ru+' не доверяет вам настолько (нужно отношение от 10).'};
    if(P[p].nb.some(q=>enemiesOf(ai).includes(G.pOwner[q])))return{ok:false,msg:'Провинция на линии фронта: '+C[ai].ru+' отказывает.'};
  }else if(op<0)return{ok:false,msg:C[ai].ru+' отказывается от аренды.'};
  startLease(p,from,to);
  return{ok:true,msg:'Аренда оформлена: «'+P[p].name+'» на '+LEASE_TURNS+' ходов.'};
}
function leaseLine(p){return esc(P[p].name)+' · рента '+rentOf(p)+'/ход';}
function showLeaseTo(p){
  const me=G.you,ps=leaseParties(me).filter(x=>canLease(p,me,x).ok);
  if(!ps.length){toast('Нет подходящих союзников или вассалов');return;}
  modal('Сдать в аренду: '+P[p].name,'<p>Арендатор платит вам '+rentOf(p)+' в ход (столько провинция давала вам), получает её доход с бонусом +50% и может набирать здесь войска. Срок: '+LEASE_TURNS+' ходов. Отношения растут.</p>',
    ps.slice(0,6).map(x=>({label:flagE(C[x].iso)+' '+C[x].ru+' · отн. '+opn(x,me),cls:'pri',fn:()=>{const r=tryLease(p,me,x);toast(r.msg);if(r.ok)save();renderAll();}})).concat([{label:'Отмена'}]));
}
function showLeases(t){
  const me=G.you,c=C[t],acts=[];
  let h='<div class="sh-h"><span class="fl">'+flagE(c.iso)+'</span><div><h2 style="font-size:17px">Аренда: '+esc(c.ru)+'</h2><small>срок '+LEASE_TURNS+' ходов · рента равна доходу провинции · арендатор получает +50%</small></div></div>';
  if(!leaseGate(me,t)){h+='<p>Аренда возможна только между союзниками и вассалом с сюзереном.</p>';acts.push({label:'Назад',fn:()=>showDip(t)});modal('Аренда',h,acts);return;}
  const act=[];if(G.lease)for(const k in G.lease){const l=G.lease[k];if((l.from===me&&l.to===t)||(l.from===t&&l.to===me))act.push(+k);}
  if(act.length){h+='<div class="sec">Действующие аренды</div>'+act.map(p=>{const l=G.lease[p];return '<div class="cl">'+leaseLine(p)+' <small>· '+(l.to===me?'вы арендуете':'вы сдали')+' до хода '+l.until+'</small></div>';}).join('');
    act.forEach(p=>acts.push({label:(G.lease[p].to===me?'Вернуть':'Расторгнуть')+' «'+P[p].name+'»',fn:()=>{cancelLease(p,me);save();renderAll();showLeases(t);}}));}
  const top=a=>a.sort((x,y)=>G.pEco[y]-G.pEco[x]).slice(0,5);
  const rent=top(provsOf(t).filter(p=>canLease(p,t,me).ok)),give=top(provsOf(me).filter(p=>canLease(p,me,t).ok));
  rent.forEach(p=>acts.push({label:'Арендовать «'+P[p].name+'» · рента '+rentOf(p)+' (+'+leaseGain(p)+' вам)',cls:'pri',fn:()=>{const r=tryLease(p,t,me);toast(r.msg);if(r.ok)save();renderAll();showLeases(t);}}));
  give.forEach(p=>acts.push({label:'Сдать «'+P[p].name+'» · +'+rentOf(p)+'/ход',fn:()=>{const r=tryLease(p,me,t);toast(r.msg);if(r.ok)save();renderAll();showLeases(t);}}));
  if(!rent.length&&!give.length&&!act.length)h+='<p class="cl mute">Нет провинций, доступных для аренды.</p>';
  acts.push({label:'Назад',fn:()=>showDip(t)});
  modal('Аренда',h,acts);
}

/* ================= ОЧКИ ВОЙНЫ, ДОГОВОРЫ, ВАССАЛЫ ================= */
const wsOf=(a,b)=>{const o=G.ws&&G.ws[key(a,b)];return(o&&o[a])||0;};
function addWs(a,b,v){if(!G.ws)G.ws={};const k=key(a,b),o=G.ws[k]||(G.ws[k]={});o[a]=Math.min(150,(o[a]||0)+v);}
const provCost=(p,w)=>Math.max(2,Math.round((2+G.pEco[p]*1.2)*((G.core[p]===w||claimed(p,w))?0.5:1)));
const vassCost=t=>12+4*PC[t];
const lordOf=f=>{const l=G.vassal&&G.vassal[f];return l===undefined?-1:l;};
function vassalsOf(f){const r=[];if(G.vassal)for(const v in G.vassal)if(G.vassal[v]===f&&isAlive(+v))r.push(+v);return r;}
function demandCands(w,l){
  const c=[];for(let p=0;p<P.length;p++){if(G.pOwner[p]!==l)continue;if(!P[p].nb.some(q=>G.pOwner[q]===w))continue;c.push(p);}
  c.sort((a,b)=>G.pEco[b]/provCost(b,w)-G.pEco[a]/provCost(a,w)||provCost(a,w)-provCost(b,w));return c;
}
function pickDemands(w,l,budget){
  const r=[];let left=budget;
  for(const p of demandCands(w,l)){const k=provCost(p,w);if(k<=left&&r.length<4){r.push(p);left-=k;}}
  return r;
}
function takeProv(p,w){
  const o=G.pOwner[p];if(o===w)return;
  armiesAt(p).filter(a=>a.o===o).forEach(dropArmy);
  setOwner(p,w);G.core[p]=w;G.res[p]=0;G.rfund[p]=0;
  addLog(fname(w)+' получает «'+P[p].name+'» по договору ('+fname(o)+')',w===G.you||o===G.you);
  if(PC[o]===0)eliminate(o);
}
function setVassal(w,l){
  if(!G.vassal)G.vassal={};
  const k=key(w,l);delete G.ally[k];delete G.pact[k];delete G.trade[k];
  alliesOf(l).forEach(x=>{if(atWar(w,x))delete G.ally[key(l,x)];});
  G.vassal[l]=w;addOp(l,w,-15);
  addLog(fname(l)+' становится вассалом державы '+fname(w),w===G.you||l===G.you);
}
function releaseVassal(me,v){
  if(G.vassal)delete G.vassal[v];addOp(v,me,35);
  addLog(fname(me)+' освобождает вассала: '+fname(v),true);
}
function peaceTreaty(w,l,provs,vass,gold){
  makePeace(w,l);
  if(gold>0){const g=Math.min(G.gold[l],gold);G.gold[l]-=g;G.gold[w]+=g;}
  provs.forEach(p=>{if(G.pOwner[p]===l)takeProv(p,w);});
  if(vass&&isAlive(l)&&isAlive(w)&&lordOf(w)<0&&lordOf(l)<0)setVassal(w,l);
  addOp(l,w,-5);checkEnd();
}
function aiTreaty(f,e){
  const pf=wsOf(f,e),pe=wsOf(e,f);let w=f,l=e,pts=pf;if(pe>pf){w=e;l=f;pts=pe;}
  let provs=[],vass=false;
  if(pts>=8&&pts-Math.min(pf,pe)>=6){
    if(lordOf(w)<0&&lordOf(l)<0&&isAlive(l)&&pts>=vassCost(l)&&Math.random()<0.45)vass=true;
    else provs=pickDemands(w,l,pts);
  }
  peaceTreaty(w,l,provs,vass,0);
}
function vassalTurn(){
  for(let p=0;p<P.length;p++){const o=G.pOwner[p],c=G.core[p];if(o!==c&&PC[c]>0&&atWar(o,c))addWs(o,c,0.4);}
  if(!G.vassal)return;
  for(const v in G.vassal){const vi=+v,l=G.vassal[v];
    if(!isAlive(vi)||!isAlive(l)){delete G.vassal[v];continue;}
    if(strength(l)<strength(vi)*0.6&&Math.random()<0.12){delete G.vassal[v];addOp(vi,l,-20);addLog(fname(vi)+' освобождается от власти '+fname(l),vi===G.you||l===G.you);}}
}
function doTreaty(t,provs,vass,gold,msg){
  peaceTreaty(G.you,t,provs,vass,gold);save();rebuildOwn();renderAll();toast(msg);
  if(G.over){finish();return;}if(isAlive(t))showDip(t);
}
function showTreaty(t){
  const me=G.you,c=C[t],pm=wsOf(me,t),pe=wsOf(t,me),acts=[];
  const cands=demandCands(me,t),dem=pickDemands(me,t,pm);
  let h='<div class="sh-h"><span class="fl">'+flagE(c.iso)+'</span><div><h2 style="font-size:17px">Мир с '+esc(c.ru)+'</h2><small>Очки войны: вы '+Math.round(pm)+' · враг '+Math.round(pe)+'</small></div></div>';
  h+='<p style="color:var(--mute);font-size:13px">Очки дают за захваты и за удержание чужих земель. Потратьте их на условия: противник обязан принять.</p>';
  if(cands.length)h+='<div class="sec">Пограничные земли врага</div>'+cands.slice(0,6).map(p=>'<div class="cl">'+esc(P[p].name)+' <small>· цена '+provCost(p,me)+'</small></div>').join('');
  else h+='<p class="cl mute">Нет общей границы: требовать нечего.</p>';
  acts.push({label:'Белый мир',fn:()=>dipDone(t,propose('peace',t))});
  if(dem.length)acts.push({label:'Взять всё · '+dem.length+' пров.',cls:'pri',fn:()=>doTreaty(t,dem,false,0,'Договор заключён: земли переданы')});
  cands.filter(p=>provCost(p,me)<=pm).slice(0,3).forEach(p=>acts.push({label:'Взять «'+P[p].name.replace(c.ru+' · ','')+'» · '+provCost(p,me),fn:()=>doTreaty(t,[p],false,0,'Договор заключён: провинция ваша')}));
  if(lordOf(me)<0&&lordOf(t)<0)acts.push({label:'Вассализация · '+vassCost(t),cls:pm>=vassCost(t)?'pri':'',fn:()=>{if(wsOf(me,t)<vassCost(t)){toast('Не хватает очков войны');showTreaty(t);return;}doTreaty(t,[],true,0,fname(t)+' стала вашим вассалом');}});
  acts.push({label:'Контрибуция · 10',fn:()=>{if(wsOf(me,t)<10){toast('Не хватает очков войны');showTreaty(t);return;}doTreaty(t,[],false,Math.round(G.gold[t]*0.5),'Контрибуция получена');}});
  acts.push({label:'Назад',fn:()=>showDip(t)});
  modal('Мирный договор',h,acts);
}

function dipDone(t,r){toast(r.msg);renderAll();showDip(t);}
function showDip(t){
  const me=G.you,c=C[t];
  if(!isAlive(t)){showCountry(t);return;}
  const st=statusOf(me,t),op=opn(t,me),acts=[];
  let h='<div class="sh-h"><span class="fl">'+flagE(c.iso)+'</span><div><h2 style="font-size:17px">'+esc(c.ru)+'<span class="tag '+(st.id==='ally'?'ally':st.id==='war'?'foe':(st.id==='vassal'||st.id==='lord')?'vas':'')+'">'+st.label.toUpperCase()+'</span></h2><small>Отношение к вам: '+opLabel(op)+' ('+op+')</small></div></div>';
  h+='<div class="opbar"><i style="left:'+((op+100)/2)+'%"></i></div>';
  h+='<div class="nums"><div><small>Войска</small><b>'+armyOf(t)+'</b></div><div><small>Доход</small><b>'+income(t)+'</b></div><div><small>Провинций</small><b>'+PC[t]+'</b></div></div>';
  const ex=[];if(hasTrade(me,t))ex.push('торговый договор: +'+Math.min(8,Math.ceil(econ(t)*.12))+' к вашему доходу');
  if(pactOn(me,t))ex.push('пакт действует до хода '+G.pact[key(me,t)]);if(truceOn(me,t))ex.push('перемирие до хода '+G.truce[key(me,t)]);
  const al=alliesOf(t).filter(x=>x!==me).map(x=>C[x].ru),en=enemiesOf(t).map(x=>C[x].ru);
  if(al.length)ex.push('союзники: '+al.slice(0,4).join(', '));if(en.length)ex.push('воюет с: '+en.slice(0,4).join(', '));
  if(st.id==='war')ex.unshift('очки войны: вы '+Math.round(wsOf(me,t))+' / враг '+Math.round(wsOf(t,me)));
  if(st.id==='vassal')ex.unshift('платит вам 20% дохода');if(st.id==='lord')ex.unshift('вы платите дань 20% дохода');
  if(ex.length)h+='<p style="color:var(--mute);font-size:13px;margin:0 0 6px">'+esc(ex.join(' · '))+'</p>';
  h+=nukeInfoHTML(t)+lnInfoHTML(t);h+=countryInfoHTML(t);h+=rulersHTML(c);
  if(st.id==='war')acts.push({label:'Мирный договор',cls:'pri',fn:()=>showTreaty(t)});
  else if(st.id==='vassal'){acts.push({label:'Аренда провинций',fn:()=>showLeases(t)});acts.push({label:'Освободить вассала',fn:()=>{releaseVassal(me,t);save();dipDone(t,{msg:'Вассал освобождён и благодарен вам.'});}});[20,50].forEach(g=>acts.push({label:'Подарить '+g,fn:()=>{if(giftGold(me,t,g)){save();dipDone(t,{msg:'Подарок передан.'});}else dipDone(t,{msg:'В казне не хватает золота.'});}}));}
  else if(st.id==='lord'){acts.push({label:'Аренда провинций',fn:()=>showLeases(t)});}
  else{
    if(st.id==='ally')acts.push({label:'Аренда провинций',cls:'pri',fn:()=>showLeases(t)});
    if(st.id==='ally')acts.push({label:'Разорвать союз',fn:()=>{breakAlly(me,t);save();dipDone(t,{msg:'Союз разорван.'});}});
    else acts.push({label:'Предложить союз',cls:'pri',fn:()=>dipDone(t,propose('ally',t))});
    if(st.id!=='pact'&&st.id!=='ally')acts.push({label:'Пакт о ненападении',fn:()=>dipDone(t,propose('pact',t))});
    if(!hasTrade(me,t))acts.push({label:'Торговый договор',fn:()=>dipDone(t,propose('trade',t))});
    [20,50].forEach(g=>acts.push({label:'Подарить '+g,fn:()=>{if(giftGold(me,t,g)){save();dipDone(t,{msg:'Подарок передан. Отношение улучшилось.'});}else dipDone(t,{msg:'В казне не хватает золота.'});}}));
    if(st.id!=='ally')acts.push({label:'Объявить войну',cls:'atk',fn:()=>confirmWar(t)});
  }
  if(st.id!=='war'){
    if(enemiesOf(t).some(e=>e!==me&&isAlive(e)))acts.push({label:'Прокси: оружие '+SUP_COST,fn:()=>dipDone(t,proxySupply(me,t))});
  }
  if(st.id!=='ally'&&st.id!=='vassal'&&st.id!=='lord'&&restiveOf(t).length)acts.push({label:'Партизаны '+REB_COST,fn:()=>{const r=proxyRebels(me,t);rebuildOwn();dipDone(t,r);}});
  const LNB={condemn:'Лига: осудить',sanction:'Лига: санкции',ceasefire:'Лига: перемирие',disarm:'Лига: разоружение',recog:'Лига: признать',delegit:'Лига: лишить признания',humanitarian:'Лига: гуманитарные нормы',arbitrate:'Лига: арбитраж'};
  for(const ty in LNB){if(lnCanPropose(me,ty,t).ok)acts.push({label:LNB[ty],fn:((ty)=>()=>{const r=lnPropose(me,ty,t);save();dipDone(t,r);})(ty)});}
  if(isNukeSt(t)&&hasUran(me)){
    acts.push({label:embOn(me,t)?'Эмбарго действует':'Урановое эмбарго',fn:()=>{const r=imposeEmbargo(me,t);if(r.ok)save();dipDone(t,r);}});
    if(embOn(me,t))acts.push({label:'Требовать разоружения',fn:()=>{const r=demandDisarm(me,t);save();dipDone(t,r);}});
  }
  if(confLord(t)===me){for(const k of ['s','i','e'])acts.push({label:{s:'Система региона',i:'Идеология региона',e:'Экономика региона'}[k],fn:()=>showConfPick(t,k)});}
  acts.push({label:'Ресурсы',fn:()=>showResBalance(t)});
  acts.push({label:'Закрыть'});
  modal('Дипломатия',h,acts);
}
function confirmWar(t){
  const me=G.you,note=pactOn(me,t)?'<p>Вы нарушите пакт. Другие страны станут хуже к вам относиться.</p>':'';
  if(truceOn(me,t)){toast('Действует перемирие до хода '+G.truce[key(me,t)]);showDip(t);return;}
  modal('Объявить войну?','<p>'+esc(C[t].ru)+' и её союзники могут ответить ударом.</p>'+note,[{label:'Отмена',fn:()=>showDip(t)},{label:'Объявить войну',cls:'atk',fn:()=>{const r=playerDeclareWar(t);toast(r.msg);renderAll();}}]);
}
function dipRows(q){
  const me=G.you,nb=new Set(C[me].nb),ids=[];
  for(let f=0;f<C.length;f++)if(f!==me&&PC[f]>0)ids.push(f);
  const rank=f=>{const s=statusOf(me,f).id;return s==='war'?0:s==='ally'||s==='vassal'||s==='lord'?1:s==='pact'?2:nb.has(f)?3:4;};
  ids.sort((a,b)=>rank(a)-rank(b)||strength(b)-strength(a));
  return ids.filter(f=>!q||C[f].ru.toLowerCase().includes(q)).slice(0,80).map(f=>{const s=statusOf(me,f);
    return '<button class="prow" data-dip="'+f+'"><span class="fl">'+flagE(C[f].iso)+'</span><span class="nm">'+esc(C[f].ru)+'</span><span class="st"><span class="sd '+s.id+'"></span>'+s.label+' · '+opn(f,me)+'</span></button>';}).join('')||'<p>Ничего не найдено.</p>';
}
function showDipList(){
  modal('Дипломатия','<input id="dq" type="search" placeholder="Поиск страны" autocomplete="off" style="width:100%;margin-bottom:8px;background:var(--deep);border:1px solid var(--line);color:var(--ink);padding:9px 10px;border-radius:8px;font:15px var(--f-b)"><div id="dl" class="dlist">'+dipRows('')+'</div>',[{label:'Закрыть'}]);
  const q=$('#dq');q.addEventListener('input',()=>{$('#dl').innerHTML=dipRows(q.value.trim().toLowerCase());});
}
$('#mB').addEventListener('click',e=>{const b=e.target.closest('[data-dip]');if(b&&G){const t=+b.dataset.dip;closeModal();showDip(t);}});
const OFFER_TXT={peace:'заключить мир',ally:'заключить союз',pact:'заключить пакт о ненападении',trade:'заключить торговый договор'};
function showOffers(){
  if(!G||G.over||!G.offers.length)return;
  const o=G.offers[0],f=o.from;
  if(!isAlive(f)||!leaseOfferValid(o)){G.offers.shift();showOffers();return;}
  const next=()=>{G.offers.shift();renderAll();showOffers();};
  modal('Предложение: '+C[f].ru,'<p>'+flagE(C[f].iso)+' <b>'+esc(C[f].ru)+'</b> предлагает '+offerTxt(o)+'.</p>'+(o.dem&&o.dem.length?'<p class="warn">Требует провинции: '+o.dem.map(p=>esc(P[p].name)).join(', ')+'</p>':'')+'<p style="color:var(--mute)">Отношение к вам: '+opLabel(opn(f,G.you))+' ('+opn(f,G.you)+')</p>',
    [{label:'Принять',cls:'pri',fn:()=>{acceptOffer(o);toast('Принято: '+C[f].ru);if(G.over){renderAll();finish();return;}next();}},{label:'Отклонить',fn:next}]);
}
})();
</script>

</body></html>
