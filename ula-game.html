<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unreasonably Large Armies</title>
<meta name="theme-color" content="#14181d">
<link rel="manifest" href="ula.webmanifest">
<link rel="icon" href="ula-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="ula-apple-touch-icon.png">
<style>
  :root { --bg:#14181d; --panel:#1d232b; --line:#2c3541; --text:#e8edf2; --blue:#2f6bff; --red:#e23b3b; --dim:#8b97a5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.25 system-ui, sans-serif; overflow:hidden; overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  canvas { display:block; background:#000; touch-action:none;
    image-rendering:crisp-edges; image-rendering:pixelated; }
  #ui { background:var(--panel); border-top:1px solid var(--line); padding:8px;
    padding-bottom:max(8px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:6px; }
  .row > button { flex:1; }
  #rowTools { flex-wrap:wrap; }
  #rowTools > button { flex:1 1 30%; min-height:38px; font-size:12px; }
  button { min-height:42px; border:1px solid var(--line); border-radius:10px; background:#262e38;
    color:var(--text); font:inherit; font-weight:600; padding:0 8px; }
  button:active { filter:brightness(1.3); }
  button.on { background:#34404e; box-shadow:inset 0 0 0 2px #fff; }
  .tab[data-team="0"].on { box-shadow:inset 0 0 0 2px var(--blue); }
  .tab[data-team="1"].on { box-shadow:inset 0 0 0 2px var(--red); }
  button.go { background:#2a8a52; border-color:#2a8a52; }
  #btnMenu, #btnSnd, #btnErase { flex:0 0 48px; }
  .sq { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; }
  .sq.b { background:var(--blue); } .sq.r { background:var(--red); }

  /* главное меню */
  #menu { position:fixed; inset:0; z-index:10; background:var(--bg); overflow:auto; }
  .menu-inner { max-width:520px; margin:0 auto; padding:18px 14px 28px; display:flex; flex-direction:column; gap:10px; }
  h1 { margin:6px 0 0; font:800 24px/1.1 ui-monospace, Menlo, monospace; letter-spacing:.5px; text-align:center; }
  .sub { margin:0 0 6px; text-align:center; color:var(--dim); }
  h2 { margin:10px 0 0; font-size:13px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .cards, .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card { padding:6px; text-align:left; display:flex; flex-direction:column; gap:4px; height:auto; }
  .card canvas { width:100%; height:auto; aspect-ratio:16/9; border-radius:6px; }
  .card .nm, .chip .nm { font-weight:700; }
  .card .ds, .chip .ds { font-weight:400; font-size:12px; color:var(--dim); }
  .chip { padding:8px 10px; text-align:left; display:flex; flex-direction:column; gap:2px; height:auto; }
  .chips.b .chip.on { box-shadow:inset 0 0 0 2px var(--blue); }
  .chips.r .chip.on { box-shadow:inset 0 0 0 2px var(--red); }
  .card.on { box-shadow:inset 0 0 0 2px #fff; }
  .hint { font-size:12px; color:var(--dim); min-height:15px; }
  button.big { min-height:52px; font-size:17px; margin-top:12px; }
  button:disabled { opacity:.4; }
  .cam { position:absolute; top:6px; right:6px; display:flex; flex-direction:column; flex-wrap:wrap-reverse; align-content:flex-start; max-height:calc(100% - 12px); gap:6px; z-index:2; }
  .cam button { width:40px; height:40px; min-height:40px; padding:0; font-size:20px; background:rgba(29,35,43,.85); }
  .modes { display:flex; gap:6px; } .modes button { flex:1; }
  .chip.done .nm::after { content:' ✓'; color:#5fd38a; }
  .chips .chip.on { box-shadow:inset 0 0 0 2px #fff; }
  #campBox, #sandBox { display:flex; flex-direction:column; gap:10px; }
  /* одержимость: джойстик слева, кнопки справа */
  #possUI { position:absolute; inset:0; z-index:3; pointer-events:none; }
  #possUI > * { pointer-events:auto; touch-action:none; }
  #joy { position:absolute; left:12px; bottom:12px; width:104px; height:104px; border-radius:50%;
    background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35); }
  #joyKnob { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%;
    background:rgba(255,225,74,.75); border:2px solid #fff; pointer-events:none; }
  #possUI .pb { position:absolute; border-radius:50%; min-height:0; padding:0; font-size:22px; line-height:1;
    background:rgba(29,35,43,.88); border:2px solid rgba(255,255,255,.5); }
  #pAtk { right:12px; bottom:12px; width:74px; height:74px; font-size:30px; background:rgba(226,59,59,.85); }
  #pDash { right:96px; bottom:14px; width:50px; height:50px; }
  #pVol { right:78px; bottom:72px; width:50px; height:50px; }
  #pShout { right:14px; bottom:96px; width:50px; height:50px; }
  #pExit { left:8px; top:8px; width:auto; border-radius:10px; font-size:13px; padding:8px 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="480" height="270"></canvas>
    <div class="cam">
      <button id="camIn" title="Приблизить">＋</button>
      <button id="camOut" title="Отдалить">－</button>
      <button id="camRotL" title="Повернуть влево">↺</button>
      <button id="camRot" title="Повернуть вправо">↻</button>
      <button id="camView" title="Вид: мягко / 2:1">◇</button>
      <button id="camReset" title="Сбросить вид">◎</button>
    </div>
    <div id="possUI" hidden>
      <button id="pExit" class="pb">✖ Выйти</button>
      <div id="joy"><div id="joyKnob"></div></div>
      <button id="pDash" class="pb">⚡</button>
      <button id="pVol" class="pb">💥</button>
      <button id="pShout" class="pb">📣</button>
      <button id="pAtk" class="pb">⚔</button>
    </div>
  </div>
  <div id="ui">
    <div class="row">
      <button class="tab" data-team="0"><i class="sq b"></i><span class="nm"></span> <b id="c0">0</b></button>
      <button class="tab" data-team="1"><i class="sq r"></i><span class="nm"></span> <b id="c1">0</b></button>
      <button id="btnErase" title="Стереть">⌫</button>
    </div>
    <div class="row" id="rowTools"></div>
    <div class="row">
      <button id="btnMenu">☰</button>
      <button id="btnSnd">🔊</button>
      <button id="btnAuto">Авто</button>
      <button id="btnClear">Очистить</button>
      <button id="btnGo" class="go">⚔ Старт</button>
      <button id="btnSpeed" hidden>×1</button>
      <button id="btnPoss" hidden>👁 Одержимость</button>
      <button id="btnReset" hidden>Заново</button>
    </div>
  </div>
</div>

<div id="menu">
  <div class="menu-inner">
    <h1 id="title"></h1>
    <p class="sub">Песочница массовых сражений</p>
    <div class="modes"><button id="btnModeCamp">Кампания</button><button id="btnModeSand">Песочница</button></div>
    <h2>Вид камеры</h2>
    <div class="chips" id="viewChips"></div>
    <div class="hint">Камера: щипок двумя пальцами — зум, двумя пальцами по кругу — поворот. Кнопки ↺ ↻ и ◇ справа, на клавиатуре Q/E.</div>
    <div id="sandBox">
    <h2>Карта</h2>
    <div class="cards" id="mapCards"></div>
    <h2><i class="sq b"></i>Синие · слева</h2>
    <div class="chips b" id="facBlue"></div>
    <div class="chips b" id="eraBlue"></div>
    <div class="hint" id="hintBlue"></div>
    <h2><i class="sq r"></i>Красные · справа</h2>
    <div class="chips r" id="facRed"></div>
    <div class="chips r" id="eraRed"></div>
    <div class="hint" id="hintRed"></div>
    </div>
    <div id="campBox" hidden>
      <h2>Эпоха</h2>
      <div class="chips" id="campEras"></div>
      <h2>Уровни</h2>
      <div class="chips" id="campLevels"></div>
      <h2><i class="sq b"></i>Ваша армия</h2>
      <div class="chips b" id="campFacs"></div>
      <div class="hint" id="hintCamp"></div>
    </div>
    <button id="btnSndMenu"></button>
    <button id="btnPlay" class="go big">▶ Играть</button>
  </div>
</div>

<script>

const TITLE = 'Unreasonably Large Armies';   // рабочее название, поменяйте на своё

// ==== SIM START ====  (логика боя, не трогает DOM)
const MAP_SCALE = 3;   // размер поля относительно базового 480x270: 3 даёт 1440x810
const W = Math.round(480 * MAP_SCALE), H = Math.round(270 * MAP_SCALE), CELL = 16;
const COLS = Math.ceil(W / CELL), ROWS = Math.ceil(H / CELL);
const DECOR = (W * H) / (720 * 405);   // во сколько раз больше декора, чем на старой карте 720x405
// Камера: центр в мире, масштаб и поворот (0..3 четверти оборота). Поле на экране повёрнуто, а люди всегда стоят «лицом» к зрителю.
const cam = { x: W / 2, y: H / 2, z: 1, ang: 0, angT: 0 };   // ang: текущий угол поворота, angT: к какому углу он плавно едет
const ZMIN = 0.08, ZMAX = 6, UNIT_SX = 0.85, UNIT_SY = 0.85, SLIM_FRONT = 0.6, SLIM_SIDE = 0.8, TAU = Math.PI * 2, SNAP_ROT = false;      // SNAP_ROT: после жеста поворота камера доезжает до ближайших 90°
// Вид: K = во сколько раз сплюснута глубина. 0.5 = классическая изометрия 2:1, 0.7 = мягче (камера выше).
const VIEWS = { iso: { K: 0.5, nm: '2:1', ds: 'Классическая изометрия' }, soft: { K: 0.7, nm: 'Мягко', ds: 'Камера выше, больше обзора' } };
let viewMode = 'soft';
try { const v = localStorage.getItem('ula-view'); if (VIEWS[v]) viewMode = v; } catch (e) { /* localStorage может быть недоступен */ }
let viewK = VIEWS[viewMode].K;
// Размер экрана (холста) не равен размеру мира: на телефоне поле стоит вертикально (армии сверху и снизу) и занимает весь экран.
let SW = 480, SH = 270, PORTRAIT = false;
const FOCUS = 0.62;   // карта большая: при сбросе камеры на экран помещается эта доля поля (центр с армиями)
function fitZoom() { const w = (W + H) * Math.SQRT1_2 * ((typeof MAP !== 'undefined' && MAP.focus) || FOCUS), h = w * VIEWS[viewMode].K + 10; return Math.max(ZMIN, Math.min(SW / w, SH / h) * 0.96); }
function resetCam() { cam.x = W / 2; cam.y = H / 2; cam.ang = ((cam.ang % TAU) + TAU + Math.PI) % TAU - Math.PI; cam.angT = 0; cam.z = fitZoom(); }

let _ta = NaN, _tc = 1, _ts = 0;
function trig() { if (_ta !== cam.ang) { _ta = cam.ang; const t = cam.ang + Math.PI / 4; _tc = Math.cos(t); _ts = Math.sin(t); } }
function rv(dx, dy) {   // вектор мира -> направление на экране
  trig(); return [dx * _tc - dy * _ts, (dx * _ts + dy * _tc) * viewK];
}
const STEP = 1 / 30;       // шаг логики, сек
const CAP = 800;           // максимум юнитов на сторону
const AUTO_MUL = 4;        // во сколько раз кнопка «Авто» в песочнице увеличивает армию (в пределах CAP)
const CAMP_MUL = 3;        // во сколько раз вражеские армии кампании больше, чем раньше
const GHOST_LIFE = 0.35;   // сколько юнит «растворяется» после гибели

const SIDE_COLORS = [['#2f6bff', '#8db0ff', '#1b3fa8'], ['#e23b3b', '#ff9a9a', '#a11d1d']];
const SIDE_NAMES = ['Синие', 'Красные'];

function calcCost(t) {       // цена из характеристик: живучесть × эффективный урон в секунду
  const eff = Math.min(t.dmg, 40) * Math.min(t.pierce || 1, 3) * (t.salvo || 1) * (t.acc || 1) * (t.splash ? 1.5 : 1) * (t.burn ? 1.4 : 1);
  const dps = eff / t.cd, rm = t.range <= 10 ? 1 : 1 + t.range / 200, sm = 1 + t.speed / 100;
  return Math.max(3, Math.round(Math.sqrt(t.hp * dps * rm * sm) * 0.9));
}

function scaledRoles(fac, scale) {
  return FACTIONS[fac].auto.map((r, i) => ({ ...r, n: scale === 1 ? r.n : (i === 0 ? Math.max(1, Math.round(r.n * scale)) : Math.round(r.n * scale)) }));

// План авто-армии: при большом масштабе строй растягивается в K раз (каждое место занимает K×K юнитов, тяжёлые машины K×1),
// остаток масштаба идёт на число мест. Всего не больше CAP на сторону.
function planRoles(fac, scale) {
  const K = Math.max(1, Math.min(MAP.maxK || 3, Math.round(Math.sqrt(scale)))), us = FACTIONS[fac].units;
  const mult = t => t.size >= 9 ? K : K * K;
  let rest = scale / (K * K), roles;
  for (;;) {
    roles = scaledRoles(fac, rest);
    if (roles.reduce((a, r) => a + r.n * mult(us[r.type]), 0) <= CAP || rest < 0.02) break;
    rest *= 0.93;
  }
  return { K, roles, mult };
}
function armyCost(fac, scale) {
  const p = planRoles(fac, scale), us = FACTIONS[fac].units;
  return p.roles.reduce((a, r) => a + r.n * p.mult(us[r.type]) * us[r.type].cost, 0);
}
function fitScale(fac, bud) {   // наибольший масштаб авто-армии, который укладывается в бюджет
  let s = Math.min(12, bud / armyCost(fac, 1));
  while (s > 0.02 && armyCost(fac, s) > bud) s -= (s > 1 ? 0.02 : 0.01);
  return Math.max(0.02, s);
}

// Карты уровней кампании: Древность, Средневековье, Ренессанс и Джунгарское нашествие получают свои карты (остальные эпохи как были)

  const OLD = ['Нил', 'Сибирь', 'Степь', 'Флоренция', 'Ватерлоо', 'Степь', 'Рим', 'Чанъань'];
  for (const L of LEVELS) L.map = MI(OLD[L.map]);
  const ERA_MAPS = { 'Древность': ['Рим', 'Рынок', 'Степь'], 'Средневековье': ['Замок'], 'Ренессанс': ['Флоренция', 'Османский город'],
    'Джунгарское нашествие': ['Казахская степь', 'Туркестан', 'Русский город'] };
  const OVR = { 'Хань': 'Чанъань', 'Саки': 'Степь', 'Хунну': 'Степь', 'Германские племена': 'Степь', 'Когурё': null, 'Корея': null, 'Япония': null, 'Мин': null,

    'Калмыцкое ханство': 'Казахская степь', 'Джунгары': 'Казахская степь', 'Цин': 'Казахская степь' };
  const cnt = {};
  for (const L of LEVELS) {
    const names = ERA_MAPS[L.era]; if (!names) continue;
    const en = FACTIONS[L.enemy].name, i = cnt[L.era] = (cnt[L.era] === undefined ? 0 : cnt[L.era] + 1);
    let nm = (en in OVR) ? OVR[en] : names[i % names.length];
    if (L.era === 'Средневековье') nm = 'Замок';
    if (nm) L.map = MI(nm);
  }
  // Наполеоновские войны: Бородино, Аустерлиц, Ватерлоо; Первая мировая: Окопы, Танненберг, Галлиполи, Изонцо, Руины Ипра
  const NAPO = { 'Россия': 'Бородино', 'Франция': 'Аустерлиц', 'Итальянское королевство': 'Аустерлиц', 'Британия Ватерлоо': 'Ватерлоо', 'Пруссия': 'Ватерлоо',

// Река есть только на Ниле (мосты) и в Сибири (лёд). На остальных картах map.river === false: сплошная суша.
function mapCx(m, y) { return m.river ? m.cx(y) : W / 2; }
function mapHw(m, y) { return m.river ? m.hw(y) : 0; }

let MAP = MAPS[0];

// ---- Препятствия и обход (города) ----
// Карта делится на клетки по NAV пикселей. NAVB: клетки, куда юнит не заходит (кварталы + запас 5 px), WALLB: сами стены (для пуль).
// Для каждой стороны раз в 0.3 с считается поле расстояний до ближайшего врага; юнит без прямой видимости цели идёт по спуску поля.
const NAV = 8, NW = Math.ceil(W / NAV), NH = Math.ceil(H / NAV), NC = NW * NH, NAVM = 5;
let NAVB = null, WALLB = null;   // null: на карте нет препятствий
const navDist = [new Uint16Array(NC), new Uint16Array(NC)], navQ = new Int32Array(NC);
let navT = 0;
function navI(x, y) {
  let cx = (x / NAV) | 0, cy = (y / NAV) | 0;
  if (cx < 0) cx = 0; else if (cx >= NW) cx = NW - 1;
  if (cy < 0) cy = 0; else if (cy >= NH) cy = NH - 1;
  return cy * NW + cx;
}
function buildNav() {
  NAVB = WALLB = null; navT = 0; MAP.posts = null;
  if (!MAP.rects) { MAP.pieces = null; return; }
  NAVB = new Uint8Array(NC); WALLB = new Uint8Array(NC);
  for (const r of MAP.rects) {
    for (let cy = Math.max(0, ((r.y - NAVM) / NAV) | 0); cy <= Math.min(NH - 1, ((r.y + r.h + NAVM) / NAV) | 0); cy++)
      for (let cx = Math.max(0, ((r.x - NAVM) / NAV) | 0); cx <= Math.min(NW - 1, ((r.x + r.w + NAVM) / NAV) | 0); cx++) {
        const mx = cx * NAV + NAV / 2, my = cy * NAV + NAV / 2;
        if (mx > r.x - NAVM && mx < r.x + r.w + NAVM && my > r.y - NAVM && my < r.y + r.h + NAVM) NAVB[cy * NW + cx] = 1;
        if (mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h) WALLB[cy * NW + cx] = 1;
      }
  }
  if (!MAP.pieces) MAP.pieces = buildPieces(MAP.rects);
  buildPosts();
}
// Посты стрелков у зданий: углы (z 0), окна и балконы по стенам (z - высота над землёй). Пост на 3 px снаружи стены, чтобы не стрелять сквозь свой дом.
function buildPosts() {
  if (!MAP.garrison) return;
  const P = [], o = 3;
  for (const r of MAP.rects) {
    if (!MAP.garrison[r.k]) continue;

}
// Осколки убитого юнита: пиксели цвета его стороны разлетаются и падают.
function shards(u, dx, dy, knock) {

  for (let i = 0; i < 6; i++) {

// Вспышка выстрела: белая вспышка у дула, искры вперёд и дым.
function muzzle(x, y, ux, uy, gun) {

  const n = big ? 7 : 3;
  for (let i = 0; i < n; i++) {

    fx(px, py, Math.cos(a) * v, Math.sin(a) * v, 0.1 + rnd() * 0.12, i % 2 ? '#fff2a8' : '#ffc83a', '#ff8a1e', 1, { d: 0.9, top: true });

}
// Взрыв ядра: огненный шар, ударная волна, искры, дым и тряска экрана.
function blast(x, y, R, big) {
  pondHit(x, y, big ? 0.35 : 0.12);
  blasts.push({ x, y, R, life: big ? 0.42 : 0.28, max: big ? 0.42 : 0.28, big });
  const n = big ? 16 : 6;
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, v = (big ? 25 : 15) + rnd() * (big ? 55 : 30);
    fx(x, y, Math.cos(a) * v, Math.sin(a) * v, 0.25 + rnd() * 0.25, i % 2 ? '#ffe27a' : '#ff9a2e', '#c24a1c', 2, { d: 0.9, top: true });
  }
  sparks(x, y, big ? 10 : 4, 0, 0, big ? 130 : 90);
  smoke(x, y, big ? 7 : 2, big ? 3 : 2, 0, -6);
  shake = Math.min(1.6, shake + (big ? 0.5 : 0.12));
}
// Хвост дыма за летящим ядром.
function trail(x, y) { fx(x, y, 0, -3, 0.35, '#b4b4b4', '#6e6e6e', 2, { d: 0.9, grow: 3, fade: true }); }

// dx, dy, knock: направление и сила выстрела, убитый юнит отлетает в эту сторону.
// Классы оружия: arrow стрела, bolt тяжёлый болт или огненная стрела, bullet пуля, shell ядро и снаряд, bomb ручная бомба,
// pike длинное древко (range 3+), blade меч и топор, charge удар конницы. Классы брони цели: light, heavy (тяжёлая пехота, гвардия),
// cav, hcav (латная конница), tank. Таблица: во сколько раз меняется урон.
const WMUL = {
  arrow:  { light: 1, heavy: 0.6, cav: 0.85, hcav: 0.5, tank: 0.15 },
  bolt:   { light: 1, heavy: 0.9, cav: 1,    hcav: 0.8, tank: 0.45 },
  bullet: { light: 1, heavy: 1,   cav: 1,    hcav: 1,   tank: 0.3 },
  shell:  { light: 1, heavy: 1,   cav: 1,    hcav: 1,   tank: 1 },
  bomb:   { light: 1, heavy: 1,   cav: 1,    hcav: 1,   tank: 0.5 },
  pike:   { light: 1, heavy: 0.9, cav: 1.6,  hcav: 1.4, tank: 0.2 },
  blade:  { light: 1, heavy: 0.8, cav: 0.9,  hcav: 0.7, tank: 0.25 },
  charge: { light: 1.15, heavy: 0.9, cav: 1, hcav: 0.85, tank: 0.3 },
};
function armorOf(t) {
  if (t.arch === 'tank' || t.arch === 'davinci') return 'tank';
  if (t.speed >= 33) return t.hp >= 64 ? 'hcav' : 'cav';
  if (t.hp >= 85 || (t.range <= 10 && t.hp >= 70)) return 'heavy';
  return 'light';
}
function weaponClass(t) {
  if (t.range <= 10) return t.range >= 3 ? 'pike' : (t.speed >= 33 ? 'charge' : 'blade');
  if (t.gun === 1) return 'bullet';
  if (t.gun === 2) return 'shell';
  if (t.splash) return t.dmg >= 60 ? 'shell' : 'bomb';
  return t.dmg >= 20 ? 'bolt' : 'arrow';
}
const wcOf = t => t.wcls || (t.wcls = weaponClass(t));
function inTrench(x, y) {   // стоит ли точка в траншее карты (форма как в paintBackground)
  const kx = W / 1440, ky = H / 810;
  for (const t of MAP.trenches) if (y >= t[1] * ky && y < t[2] * ky && Math.abs(x - (t[0] * kx + Math.sin(y / 16) * 9 * kx)) < 5) return true;
  return false;
}
function hit(target, dmg, dx = 0, dy = 0, knock = 0, wc) {
  if (target.dead) return;
  if (wc) { const tt = target.t, ac = tt.ac || (tt.ac = armorOf(tt)); dmg *= WMUL[wc][ac]; }
  if (target.gar) dmg *= target.gar.kind === 'corner' ? 0.7 : 0.5;   // укрытие в здании
  if (wc && wc !== 'shell' && MAP.trenches && inTrench(target.x, target.y)) dmg *= 0.5;   // в траншее: пули и стрелы вдвое слабее
  target.hp -= dmg;
  target.flash = 0.09;
  if (target.hp <= 0) {
    target.dead = true;   // без крови: юнит просто тает и поднимает пыль
    ghosts.push({ x: target.x, y: target.y, size: target.t.size, color: colorOf(target), life: GHOST_LIFE,
                  vx: dx * knock, vy: dy * knock });
    puff(target.x, target.y, 3, MAP.dust);
    shards(target, dx, dy, knock);
    sparks(target.x, target.y, 3, dx, dy, 50);
    Snd.play('death', target.x);
  } else sparks(target.x, target.y, 2, dx, dy, 40);
}

// Попадание ядра: полный урон цели и половина соседним врагам в радиусе.
function ignite(u, b) {   // стрела застряла: горит, урон тиками; новые стрелы усиливают и продлевают огонь
  if (u.dead) return;
  u.burnN = Math.min(4, (u.burnN || 0) + 1);
  u.burnD = b.dps * u.burnN; u.burnT = b.dur;
  if (u.burnTick === undefined || u.burnTick <= 0) u.burnTick = 0.5;
}
function splash(p) {
  hit(p.target, p.dmg);
  const g = gridTeam[1 - p.team];
  const c0 = cellIndex(p.x, p.y), cx = c0 % COLS, cy = (c0 / COLS) | 0, r2 = p.splash * p.splash, rr = Math.max(1, Math.ceil(p.splash / CELL));   // большие радиусы (бомбарды, Берта) шире 3x3 клеток
  for (let gy = cy - rr; gy <= cy + rr; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - rr; gx <= cx + rr; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      const cell = g[gy * COLS + gx];
      for (let i = 0; i < cell.length; i++) {
        const o = cell[i];
        if (o.dead || o === p.target) continue;
        const dx = o.x - p.x, dy = o.y - p.y;
        if (dx * dx + dy * dy <= r2) hit(o, p.dmg * (p.smul || 0.5));
      }
    }
  }
  blast(p.x, p.y, Math.max(8, p.splash || 10), true);
  puff(p.x, p.y, 3, MAP.dust);
}

// Ближайший живой враг к точке (x, y) в радиусе r (плюс половина размера юнита). Нужен для падающих стрел и ядер.
function enemyAt(team, x, y, r) {
  const g = gridTeam[1 - team], c0 = cellIndex(x, y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
  let best = null, bd = Infinity;
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      for (const o of g[gy * COLS + gx]) {
        if (o.dead) continue;
        const dx = o.x - x, dy = o.y - y, d = dx * dx + dy * dy, rr = r + o.t.size * 0.5;
        if (d <= rr * rr && d < bd) { bd = d; best = o; }
      }
    }
  }
  return best;
}
// Падение снаряда с дугой: стрела бьёт ближайшего у точки падения (или втыкается в землю), ядро и бомба рвутся по площади.
function landArc(p) {
  const wc = p.wc;
  if (p.splash) {
    const x = p.ex, y = p.ey, r2 = p.splash * p.splash, direct = enemyAt(p.team, x, y, 4);
    const g = gridTeam[1 - p.team], c0 = cellIndex(x, y), cx = c0 % COLS, cy = (c0 / COLS) | 0, rr = Math.max(1, Math.ceil(p.splash / CELL));
    for (let gy = cy - rr; gy <= cy + rr; gy++) {
      if (gy < 0 || gy >= ROWS) continue;
      for (let gx = cx - rr; gx <= cx + rr; gx++) {
        if (gx < 0 || gx >= COLS) continue;
        for (const o of g[gy * COLS + gx]) {
          if (o.dead) continue;
          const dx = o.x - x, dy = o.y - y;
          if (o === direct || dx * dx + dy * dy <= r2) hit(o, o === direct ? p.dmg : p.dmg * p.smul, 0, 0, 0, wc);
        }
      }
    }
    Snd.play(p.hitSfx || 'boom', x);
    blast(x, y, Math.max(8, p.splash || 10), true);
    puff(x, y, 3, MAP.dust);
    return;
  }
  const o = enemyAt(p.team, p.ex, p.ey, 3);
  if (o) {
    Snd.play(p.hitSfx || (p.gun ? 'bullet' : 'arrow'), o.x);
    hit(o, p.dmg, p.dx, p.dy, 0, wc);
    if (p.burn) ignite(o, p.burn);
  } else puff(p.ex, p.ey, 1, MAP.dust);   // ушла в землю
}
// След за летящим по дуге снарядом на высоте z.
function trailAt(x, y, z) { const n = parts.length; trail(x, y); if (parts.length > n) parts[parts.length - 1].y = -z; }
const gauss = () => (rnd() + rnd() + rnd() - 1.5) * 2;
// Снаряд по дуге: целится с упреждением (куда цель придёт за время полёта), разброс растёт с дальностью.
function makeArc(u, tt, t) {
  const sp = t.pspeed || 150;
  let ax = tt.x, ay = tt.y;
  for (let i = 0; i < 2; i++) { const T = Math.hypot(ax - u.x, ay - u.y) / sp; ax = tt.x + (tt.vx || 0) * T; ay = tt.y + (tt.vy || 0) * T; }
  let d = Math.hypot(ax - u.x, ay - u.y);
  const sc = (0.8 + d * 0.02) * (u.player ? 0.5 : 1);
  ax += gauss() * sc; ay += gauss() * sc;
  const ex = ax - u.x, ey = ay - u.y; d = Math.hypot(ex, ey) || 0.001;
  return { arc: true, sx: u.x, sy: u.y, x: u.x, y: u.y, ex: ax, ey: ay, t: 0, T: Math.max(0.12, d / sp), D: Math.max(10, d), z: 3,
           H: t.splash ? Math.min(75, 12 + d * 0.38) : Math.min(34, 5 + d * 0.22), dx: ex / d, dy: ey / d, team: u.team, dmg: t.dmg, speed: sp,
           gun: t.gun || 0, splash: t.splash || 0, smul: t.splashMul || 0.5, hitSfx: t.hitSfx, fire: !!t.fire, burn: t.burn, wc: wcOf(t) };
}

// Случайный живой враг рядом с целью (в соседних клетках сетки): по ним разлетаются стрелы залпа.
function pickNear(tg, team) {
  const g = gridTeam[1 - team], c0 = cellIndex(tg.x, tg.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
  const pool = [];
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      for (const o of g[gy * COLS + gx]) if (!o.dead) pool.push(o);
    }
  }
  return pool.length ? pool[(Math.random() * pool.length) | 0] : tg;
}

// Пуля или ядро летит по прямой и убивает до p.pierce врагов на пути. Шаг мелкий, чтобы не проскочить сквозь юнита.
// Возвращает true, когда снаряд закончил полёт.
function stepLine(p, dt) {
  const dist = Math.min(p.speed * dt, p.left);
  const n = Math.max(1, Math.ceil(dist / 3)), sd = dist / n;
  const g = gridTeam[1 - p.team], rr = p.gun === 2 ? 2.5 : 1.5;
  let done = false;
  for (let s = 0; s < n && !done; s++) {
    p.x += p.dx * sd; p.y += p.dy * sd; p.left -= sd;
    if (WALLB && WALLB[navI(p.x, p.y)]) { done = true; break; }
    const c0 = cellIndex(p.x, p.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
    for (let gy = cy - 1; gy <= cy + 1 && !done; gy++) {
      if (gy < 0 || gy >= ROWS) continue;
      for (let gx = cx - 1; gx <= cx + 1 && !done; gx++) {
        if (gx < 0 || gx >= COLS) continue;
        const cell = g[gy * COLS + gx];
        for (let i = 0; i < cell.length; i++) {
          const o = cell[i];
          if (o.dead || o.hitBy === p) continue;
          const ex = o.x - p.x, ey = o.y - p.y, reach = o.t.size / 2 + rr;
          if (ex * ex + ey * ey > reach * reach) continue;
          o.hitBy = p; p.hits++;
          hit(o, p.dmg, p.dx, p.dy, p.knock, p.wc);
          if (p.burn) ignite(o, p.burn);
          Snd.play(p.hitSfx || (p.gun === 2 ? 'boom' : 'bullet'), o.x);
          puff(o.x, o.y, 2, MAP.dust);
          if (p.gun === 2) blast(o.x, o.y, 6, false);
          if (--p.pierce <= 0) { done = true; break; }
        }
      }
    }
    if (p.left <= 0 || p.x < 0 || p.x > W || p.y < 0 || p.y > H) done = true;
  }
  if (p.gun === 2 && Math.random() < 0.7) trail(p.x - p.dx * 2, p.y - p.dy * 2);
  if (done && !p.hits && p.gun === 1) Snd.play('whiz', p.x);   // пуля ушла мимо
  return done;
}

function separate(u) {
  const c0 = cellIndex(u.x, u.y), cx = c0 % COLS, cy = (c0 / COLS) | 0;
  for (let gy = cy - 1; gy <= cy + 1; gy++) {
    if (gy < 0 || gy >= ROWS) continue;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      if (gx < 0 || gx >= COLS) continue;
      const cell = gridAll[gy * COLS + gx];
      for (let i = 0; i < cell.length; i++) {
        const o = cell[i];
        if (o === u || o.dead) continue;
        const dx = u.x - o.x, dy = u.y - o.y;
        const md = (u.t.size + o.t.size) / 2 + 0.5;
        const d2 = dx * dx + dy * dy;
        if (d2 >= md * md) continue;
        if (d2 < 0.0001) { u.x += Math.random() - 0.5; u.y += Math.random() - 0.5; continue; }
        const d = Math.sqrt(d2), push = (md - d) * 0.5;
        u.x += dx / d * push; u.y += dy / d * push;
      }
    }
  }
}

function drown(u) {
  u.dead = true;
  ghosts.push({ x: u.x, y: u.y, size: u.t.size, color: colorOf(u), life: GHOST_LIFE, vx: 0, vy: 0 });
  puff(u.x, u.y, 4, '#e4f4fb');
  for (let i = 0; i < 8; i++)
    fx(u.x, u.y, (rnd() - 0.5) * 36, -30 - rnd() * 40, 0.45 + rnd() * 0.3, i % 2 ? '#cfeefc' : '#ffffff', '#6fb8d6', 1 + (i % 3 === 0), { g: 110, d: 0.97, top: true });
  Snd.play('splash', u.x);
}

function breakIce(s) {
  iceBroken[s] = 1; iceStress[s] = 1;
  updateCrossings();
  const y0 = s * ICE_SEG, y1 = Math.min(H, y0 + ICE_SEG);
  for (let k = 0; k < 34; k++) {
    const y = y0 + Math.random() * (y1 - y0), h = riverHalf(y), x = riverCenter(y) + (Math.random() * 2 - 1) * h;
    const a = rnd() * 6.283, v = 15 + rnd() * 55;
    fx(x, y, Math.cos(a) * v, Math.sin(a) * v - 25, 0.5 + rnd() * 0.5, k % 3 ? '#e4f4fb' : '#ffffff', '#9fd0e6', 2, { g: 80, d: 0.95, top: true });
  }
  shake = Math.min(1.6, shake + 0.5);
  Snd.play('icebreak', riverCenter((y0 + y1) / 2));
  toast('Лёд проломился!');
}

// Опасности реки: нагрузка на лёд и утопление (упали с моста в давке, провалились под лёд).
// Пруд (Аустерлиц): лёд трещит от толпы и от ядер; проломился - все на нём тонут, пруд становится водой.
function breakPond(p) {
  p.broken = 1; p.stress = 1;
  for (const u of units) if (!u.dead && ((u.x - p.cx) / p.rx) ** 2 + ((u.y - p.cy) / p.ry) ** 2 < 1) drown(u);
  for (let k = 0; k < 40; k++) {
    const a = rnd() * 6.283, r = Math.sqrt(rnd()), x = p.cx + Math.cos(a) * p.rx * r, y = p.cy + Math.sin(a) * p.ry * r, v = 15 + rnd() * 55, b = rnd() * 6.283;
    fx(x, y, Math.cos(b) * v, Math.sin(b) * v - 25, 0.5 + rnd() * 0.5, k % 3 ? '#e4f4fb' : '#ffffff', '#9fd0e6', 2, { g: 80, d: 0.95, top: true });
  }
  shake = Math.min(1.6, shake + 0.5);
  Snd.play('icebreak', p.cx);
  toast('Лёд на пруду проломился!');
}
function pondHit(x, y, w) {
  if (!PONDS) return;
  for (const p of PONDS) {
    if (p.broken || ((x - p.cx) / p.rx) ** 2 + ((y - p.cy) / p.ry) ** 2 > 1.1) continue;
    const before = p.stress; p.stress += w;
    if (before < 0.4 && p.stress >= 0.4) Snd.play('crack', p.cx);
    if (p.stress >= 1) breakPond(p);
  }
}
function pondStep(dt) {
  for (const p of PONDS) {
    if (p.broken) continue;
    let n = 0;
    for (const u of units) if (!u.dead && ((u.x - p.cx) / p.rx) ** 2 + ((u.y - p.cy) / p.ry) ** 2 < 1) n++;
    const before = p.stress, over = n - p.cap;
    p.stress = over > 0 ? before + over * 0.05 * dt : Math.max(0, before - 0.2 * dt);
    if (before < 0.4 && p.stress >= 0.4) Snd.play('crack', p.cx);
    if (p.stress >= 1) breakPond(p);
  }
}
function terrainStep(dt) {
  if (PONDS) pondStep(dt);
  if (!MAP.river) return;
  if (MAP.ice) {
    iceLoad.fill(0);
    let aliveAll = 0;
    for (const u of units) if (!u.dead) aliveAll++;
    if (aliveAll > icePeak) icePeak = aliveAll;
    ICE_CAP = Math.max(4, Math.round(icePeak / ICE_RATIO));
    for (const u of units) {
      if (u.dead) continue;
      if (Math.abs(u.x - riverCenter(u.y)) < riverHalf(u.y)) iceLoad[iceSeg(u.y)]++;
    }
    for (let s = 0; s < ICE_N; s++) {
      if (iceBroken[s]) continue;
      const before = iceStress[s], over = iceLoad[s] - ICE_CAP;
      iceStress[s] = over > 0 ? before + over * ICE_RATE * dt : Math.max(0, before - 0.25 * dt);
      if (before < 0.4 && iceStress[s] >= 0.4) Snd.play('crack', riverCenter((s + 0.5) * ICE_SEG));
      if (iceStress[s] >= 1) breakIce(s);
    }
  }
  for (const u of units) if (!u.dead && isWater(u.x, u.y, 1.5)) drown(u);
}

// Удар или выстрел юнита u по цели tg. tt: тип с изменёнными свойствами (для умений), по умолчанию тип юнита.
function doAttack(u, tg, tt) {
  let t = tt || u.t;
  if (u.gar) { u.rev = 2.5; if (!u.amb) { u.amb = 1; t = Object.assign({}, t, { dmg: t.dmg * 1.6 }); } }   // засада: первый выстрел сильнее, стрелок выдаёт себя
  if (t.range > 10) {
    const miss = t.acc && !u.player ? Math.random() > t.acc : false;
    const ox = miss ? (Math.random() - 0.5) * 16 : 0, oy = miss ? (Math.random() - 0.5) * 16 : 0;

function step(dt) {

  if (roles[3]) {   // тяжёлый отряд позади поддержки (например пороховые телеги), 2 колонны
    const { type, n, sp = 22 } = roles[3], rows = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) place(type, 122 + ((i / rows) | 0) * 12, mid - (rows - 1) * sp / 2 + (i % rows) * sp, 12, sp); }
  if (roles[4]) {   // пятый тип: резерв в самом тылу, 2 колонны
    const { type, n, sp = 10.5 } = roles[4], rows = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) place(type, 152 + ((i / rows) | 0) * 10, mid - (rows - 1) * sp / 2 + (i % rows) * sp, 10, sp); }
  for (let ri = 5; ri < roles.length; ri++) {   // шестой и далее: свободные блоки. x: правый край блока (старые координаты), cols: колонн, flank: два фланга вместо блока по центру
    const { type, n, sp = 10.5, x = 70, cols = 2, flank = false } = roles[ri], rows = Math.ceil(n / cols);
    for (let i = 0; i < n; i++) {
      if (flank) place(type, 240 - x + (i >> 1) * 9, (i & 1) ? mid + 83 : mid - 83, 9, sp);
      else place(type, 240 - x + ((i / rows) | 0) * 9, mid - (rows - 1) * sp / 2 + (i % rows) * sp, 9, sp);
    }
  }
}
// ==== SIM END ====

// ==== AUDIO START ====  (Web Audio API, все звуки синтезируются кодом, файлов нет)
// Snd.play(имя, x) — одноразовый звук с панорамой по x. Частые звуки прореживаются:
// у каждого есть минимальный интервал (gap), плюс общий лимит одновременных голосов.
// Чтобы добавить звук: новая запись в SFX. fn(d, t, r): d — выход, t — время старта, r — случайная высота 0.88..1.12.
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null, ambG = null, ambF = null, dinG = null, hasPan = false;
  let muted = false, gapMul = 1, scene = { on: false, windy: false };
  const VOL = 0.8, MAX_VOICES = 36;
  const lastAt = {}, ends = [];
  try { muted = localStorage.getItem('ula-mute') === '1'; } catch (e) { /* не страшно */ }

  function loopNoise() {
    const s = ac.createBufferSource();
    s.buffer = noiseBuf; s.loop = true;
    s.start(0, Math.random() * 2);
    return s;
  }

  function init() {
    if (ac && ac.state === 'closed') { ac = null; master = null; }   // закрыт системой — создадим заново
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* не страшно */ }
    if (ac) {
      wake();
      if (ac.state !== 'running') setTimeout(() => { if (ac && ac.state !== 'running' && !document.hidden) rebuild(); }, 400);
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    hasPan = !!ac.createStereoPanner;

    // шум на 3 секунды — основа ударов, выстрелов, ветра
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

    // мастер: громкость → компрессор (чтобы залпы не клиппились) → выход
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ac.createGain();
    master.gain.value = muted ? 0 : VOL;
    master.connect(comp); comp.connect(ac.destination);

    // фон: ветер (Сибирь) или река (Нил), с медленным «дыханием» фильтра
    ambF = ac.createBiquadFilter();
    ambG = ac.createGain(); ambG.gain.value = 0;
    loopNoise().connect(ambF); ambF.connect(ambG); ambG.connect(master);
    const lfo = ac.createOscillator(), lfoG = ac.createGain();
    lfo.frequency.value = 0.12; lfoG.gain.value = 140;
    lfo.connect(lfoG); lfoG.connect(ambF.frequency); lfo.start();

    // гул битвы: низкий шум, громкость растёт с числом живых юнитов
    const dinF = ac.createBiquadFilter();
    dinF.type = 'lowpass'; dinF.frequency.value = 260;
    dinG = ac.createGain(); dinG.gain.value = 0;
    loopNoise().connect(dinF); dinF.connect(dinG); dinG.connect(master);

    // разблокировка звука на iOS
    const b = ac.createBufferSource();
    b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);

    ac.onstatechange = () => { if (ac && ac.state !== 'running' && !document.hidden) wake(); };
    wake();
    applyScene();
  }

  // Полностью пересоздаёт аудио, если контекст завис или умер и не просыпается.
  function rebuild() {
    const old = ac;
    ac = null; master = null; ambG = null; ambF = null; dinG = null; ends.length = 0;
    for (const k in lastAt) delete lastAt[k];
    try { if (old && old.state !== 'closed') old.close().catch(() => {}); } catch (e) { /* уже закрыт */ }
    init();
  }
  let lastT = -1, stuck = 0;
  function watchdog() {
    if (!ac || document.hidden || muted) { stuck = 0; return; }
    if (ac.state !== 'running') { wake(); if (++stuck >= 4) { stuck = 0; rebuild(); } return; }
    if (ac.currentTime === lastT) { if (++stuck >= 2) { stuck = 0; rebuild(); } }   // часы стоят — выход мёртв
    else stuck = 0;
    lastT = ac.currentTime;
  }

  // Будит контекст из suspended / interrupted (iOS: звонок, Siri, блокировка) / closed.
  function wake() {
    if (!ac) return;
    if (ac.state === 'closed') { init(); return; }
    if (ac.state !== 'running') { try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* ждём следующего жеста */ } }
  }

  // ---- кирпичики ----
  function bus(pan, v) {
    const g = ac.createGain(); g.gain.value = v;
    if (hasPan) {
      const p = ac.createStereoPanner(); p.pan.value = pan;
      g.connect(p); p.connect(master);
    } else g.connect(master);
    return g;
  }

  function env(g, t, dur, vol, att) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function noise(d, t, dur, type, f0, f1, q, vol, att = 0.003) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); env(g, t, dur, vol, att);
    s.connect(f); f.connect(g); g.connect(d);
    s.start(t, Math.random() * 2); s.stop(t + dur + 0.02);
  }

  function tone(d, t, dur, type, f0, f1, vol, att = 0.004) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); env(g, t, dur, vol, att);
    o.connect(g); g.connect(d);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // духовая нота: два слегка расстроенных пилообразных голоса + раскрывающийся фильтр
  function brass(t, f, dur, vol) {
    const d = bus(0, 1);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1;
    lp.frequency.setValueAtTime(f * 2, t);
    lp.frequency.linearRampToValueAtTime(f * 6, t + Math.min(0.2, dur / 2));
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.06);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(d);
    for (const det of [-7, 7]) {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.05);
    }
  }

  // дробь барабана, ускоряется и нарастает, в конце акцент
  function drumRoll(t) {
    const d = bus(0, 0.9);
    let tt = t;
    for (let i = 0; i < 16; i++) {
      noise(d, tt, 0.06, 'bandpass', 1700, 900, 1.1, 0.25 + i * 0.035);
      tone(d, tt, 0.06, 'triangle', 190, 120, 0.25);
      tt += 0.075 - i * 0.002;
    }
    noise(d, tt, 0.3, 'lowpass', 1200, 120, 0.8, 0.9);
    tone(d, tt, 0.35, 'sine', 90, 40, 0.9);
  }

  // ---- каталог звуков ----
  const SFX = {
    melee:  { gap: 0.03, vol: 0.30, dur: 0.12, fn(d, t, r) {         // копьё, меч, сабля
      noise(d, t, 0.07, 'bandpass', 2200 * r, 900 * r, 1.2, 0.9);
      tone(d, t, 0.08, 'triangle', 210 * r, 90 * r, 0.7);
      if (Math.random() < 0.4) tone(d, t, 0.06, 'sine', 1500 * r, 1100 * r, 0.18);  // лязг металла
    } },
    bow:    { gap: 0.05, vol: 0.28, dur: 0.20, fn(d, t, r) {         // выстрел из лука
      noise(d, t, 0.16, 'bandpass', 900 * r, 2600 * r, 1.5, 0.5, 0.02);
      tone(d, t, 0.09, 'triangle', 260 * r, 150 * r, 0.35);
    } },
    arrow:  { gap: 0.04, vol: 0.25, dur: 0.08, fn(d, t, r) {         // попадание стрелы
      noise(d, t, 0.05, 'bandpass', 2800 * r, 1800 * r, 2, 0.7);
      tone(d, t, 0.05, 'sine', 320 * r, 200 * r, 0.3);
    } },
    musket: { gap: 0.04, vol: 0.50, dur: 0.32, fn(d, t, r) {         // залп мушкета
      noise(d, t, 0.28, 'lowpass', 4200 * r, 350, 0.7, 1.0, 0.002);
      tone(d, t, 0.18, 'sine', 150 * r, 45, 0.9, 0.002);
    } },
    bullet: { gap: 0.035, vol: 0.22, dur: 0.10, fn(d, t, r) {        // попадание пули
      noise(d, t, 0.06, 'bandpass', 1500 * r, 700, 1.5, 0.8);
      tone(d, t, 0.05, 'sine', 240 * r, 130, 0.4);
    } },
    whiz:   { gap: 0.08, vol: 0.12, dur: 0.12, fn(d, t, r) {         // пуля пролетела мимо
      noise(d, t, 0.1, 'bandpass', 3200 * r, 1800 * r, 3, 0.8, 0.01);
    } },
    cannon: { gap: 0.12, vol: 0.90, dur: 1.00, fn(d, t, r) {         // выстрел пушки
      noise(d, t, 0.9, 'lowpass', 1400 * r, 70, 0.7, 1.0, 0.004);
      tone(d, t, 0.8, 'sine', 85 * r, 28, 1.2, 0.004);
      tone(d, t, 0.25, 'sawtooth', 120 * r, 40, 0.25);
    } },
    boom:   { gap: 0.06, vol: 0.55, dur: 0.42, fn(d, t, r) {         // разрыв ядра
      noise(d, t, 0.38, 'lowpass', 900 * r, 90, 0.7, 1.0);
      tone(d, t, 0.3, 'sine', 100 * r, 38, 1.0);
    } },
    ballista: { gap: 0.15, vol: 0.45, dur: 0.30, fn(d, t, r) {       // баллиста: щелчок и гулкий бросок
      tone(d, t, 0.2, 'triangle', 140 * r, 70, 0.9, 0.002);
      noise(d, t, 0.12, 'bandpass', 700 * r, 300, 1.2, 0.7);
      tone(d, t, 0.08, 'sawtooth', 900 * r, 300, 0.2, 0.002);
    } },
    trebuchet: { gap: 0.2, vol: 0.5, dur: 0.60, fn(d, t, r) {        // требюше: скрип и глухой удар
      noise(d, t, 0.4, 'bandpass', 300 * r, 900 * r, 3, 0.5, 0.05);
      tone(d, t, 0.3, 'sine', 90 * r, 45, 1.0, 0.01);
    } },
    splash: { gap: 0.05, vol: 0.30, dur: 0.30, fn(d, t, r) {         // упал в воду
      noise(d, t, 0.25, 'lowpass', 1800 * r, 300, 0.8, 0.9, 0.01);
      tone(d, t, 0.2, 'sine', 300 * r, 120, 0.3);
    } },
    crack:  { gap: 0.12, vol: 0.35, dur: 0.15, fn(d, t, r) {         // лёд трещит
      noise(d, t, 0.05, 'highpass', 2500 * r, 4000, 2, 0.9, 0.001);
      tone(d, t, 0.06, 'square', 1800 * r, 700, 0.2, 0.001);
    } },
    icebreak: { gap: 0.2, vol: 0.7, dur: 0.8, fn(d, t, r) {          // лёд проламывается
      noise(d, t, 0.6, 'lowpass', 2200 * r, 150, 0.8, 1.0, 0.002);
      tone(d, t, 0.5, 'sine', 120 * r, 35, 1.0, 0.003);
      noise(d, t, 0.15, 'highpass', 3000, 5000, 1.5, 0.6, 0.001);
    } },
    death:  { gap: 0.05, vol: 0.20, dur: 0.16, fn(d, t, r) {         // гибель юнита
      tone(d, t, 0.14, 'sine', 170 * r, 60, 0.7);
      noise(d, t, 0.1, 'lowpass', 700, 200, 0.7, 0.4);
    } },
    click:  { gap: 0.03, vol: 0.12, dur: 0.06, fn(d, t, r) {         // кнопки интерфейса
      tone(d, t, 0.04, 'square', 560 * r, 400, 0.8, 0.002);
    } },
    place:  { gap: 0.035, vol: 0.18, dur: 0.07, fn(d, t, r) {        // поставить юнита
      tone(d, t, 0.05, 'triangle', 380 * r, 300, 0.8, 0.002);
    } },
    hwacha: { gap: 0.15, vol: 0.5, dur: 0.6, fn(d, t, r) {           // хвачха: свист залпа огненных стрел
      noise(d, t, 0.5, 'bandpass', 600 * r, 2800 * r, 1.2, 0.8, 0.03);
      for (let i = 0; i < 4; i++) tone(d, t + i * 0.03, 0.1, 'triangle', 300 * r, 150, 0.25);
    } },
    mg:     { gap: 0.045, vol: 0.30, dur: 0.09, fn(d, t, r) {        // пулемёт: короткая сухая очередь
      noise(d, t, 0.06, 'lowpass', 3800 * r, 500, 0.8, 1.0, 0.001);
      tone(d, t, 0.05, 'sine', 190 * r, 70, 0.6, 0.001);
    } },
    hiss:   { gap: 0.3, vol: 0.35, dur: 0.65, fn(d, t, r) {          // перегрев: пар из кожуха ствола
      noise(d, t, 0.6, 'highpass', 3500 * r, 7000, 1.0, 0.7, 0.03);
      tone(d, t, 0.3, 'sine', 220 * r, 90, 0.2, 0.01);
    } },
    erase:  { gap: 0.06, vol: 0.25, dur: 0.10, fn(d, t, r) {         // стереть
      noise(d, t, 0.08, 'bandpass', 1200 * r, 500, 1, 0.8);
    } },
  };

  function take(dur) {   // общий лимит голосов, чтобы армия в 800 юнитов не убила телефон
    const now = ac.currentTime;
    for (let i = ends.length - 1; i >= 0; i--) {
      if (ends[i] <= now) { ends[i] = ends[ends.length - 1]; ends.pop(); }
    }
    if (ends.length >= MAX_VOICES) return false;
    ends.push(now + dur);
    return true;
  }

  function play(name, x = W / 2) {
    if (ac && !muted && ac.state !== 'running') wake();
    if (!ac || muted || ac.state !== 'running') return;
    const s = SFX[name];
    if (!s) return;
    const now = ac.currentTime;
    if (now - (lastAt[name] === undefined ? -1 : lastAt[name]) < s.gap * gapMul) return;
    if (!take(s.dur)) return;
    lastAt[name] = now;
    const r = 0.88 + Math.random() * 0.24;
    const pan = Math.max(-1, Math.min(1, (x / W * 2 - 1) * 0.75));
    try { s.fn(bus(pan, s.vol), now + 0.005, r); } catch (e) { /* не даём одному звуку убить остальные */ }
  }

  // старт боя: рог в древности, барабанная дробь в эпоху пороха
  function start(modern) {
    if (!ac || muted || ac.state !== 'running') return;
    const t = ac.currentTime + 0.02;
    if (modern) drumRoll(t);
    else { brass(t, 110, 1.1, 0.35); brass(t + 0.5, 165, 1.3, 0.35); }
  }

  // конец боя: фанфара победителя или низкий долгий гудок при ничьей
  function end(winner, modern) {
    if (!ac || muted || ac.state !== 'running') return;
    const t = ac.currentTime + 0.1;
    if (winner < 0) { brass(t, 98, 1.6, 0.3); return; }
    if (modern) {
      [[261.6, 0], [329.6, 0.22], [392, 0.44], [523.3, 0.66]].forEach(([f, dt], i) => brass(t + dt, f, i === 3 ? 1.4 : 0.3, 0.28));
    } else {
      [[146.8, 0], [220, 0.5], [293.7, 1.0]].forEach(([f, dt], i) => brass(t + dt, f, i === 2 ? 1.6 : 0.6, 0.3));
    }
  }

  function applyScene() {
    if (!ac) return;
    const now = ac.currentTime, windy = scene.windy;
    ambF.type = windy ? 'lowpass' : 'bandpass';
    ambF.Q.value = windy ? 0.7 : 0.6;
    ambF.frequency.setTargetAtTime(windy ? 500 : 900, now, 0.3);
    ambG.gain.setTargetAtTime(scene.on ? (windy ? 0.10 : 0.06) : 0, now, 0.5);
  }

  return {
    init, play, start, end,
    scene(on, windy) { scene = { on, windy: !!windy }; applyScene(); },   // фон: ветер (windy) или река
    din(n) { if (ac) dinG.gain.setTargetAtTime(Math.min(1, n / 500) * 0.16, ac.currentTime, 0.4); },
    speed(s) { gapMul = s; },
    isMuted() { return muted; },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('ula-mute', muted ? '1' : '0'); } catch (e) { /* не страшно */ }
      if (!muted) { if (!ac) init(); else { wake(); setTimeout(() => { if (ac && !muted && ac.state !== 'running') rebuild(); }, 300); } }
      if (master && ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(muted ? 0 : VOL, ac.currentTime, 0.05); master.gain.value = muted ? 0 : VOL; }
      return muted;
    },
    suspend() { if (ac && ac.state === 'running') ac.suspend(); },
    resume() { wake(); },
    watchdog,
    rebuild,
  };
})();

// Браузер даёт включить звук только после жеста пользователя.
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => Snd.init(), { capture: true, passive: true }));
window.addEventListener('focus', () => Snd.resume());
window.addEventListener('pageshow', () => Snd.resume());
setInterval(() => Snd.watchdog(), 1000);   // сторож: звук не должен молча пропадать
document.addEventListener('visibilitychange', () => { document.hidden ? Snd.suspend() : (Snd.resume(), setTimeout(Snd.watchdog, 700)); });
// ==== AUDIO END ====

// ==== UI И ОТРИСОВКА ====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const rowTools = document.getElementById('rowTools');
const menu = document.getElementById('menu');
const btn = id => document.getElementById(id);
const tabs = document.querySelectorAll('.tab');

let mode = 'camp', msgNew = '';   // camp: кампания, sand: песочница
let state = 'menu';             // menu → setup → battle → done
let tool = { team: 0, type: 0 };  // type: номер юнита или 'erase'
let speed = 1, acc = 0, winner = -1, snapshot = null, msg = null;
const cfg = { map: 0, fac: [FI('Рим'), FI('Монголы')] };
try {
  const s = JSON.parse(localStorage.getItem('ula-cfg6'));
  const a = s && s.fac ? FI(s.fac[0]) : -1, b = s && s.fac ? FI(s.fac[1]) : -1;
  const mi = s && typeof s.map === 'string' ? MAPS.findIndex(m => m.name === s.map) : -1;
  if (s && mi >= 0 && a >= 0 && b >= 0) { cfg.map = mi; cfg.fac = [a, b]; }
} catch (e) { /* localStorage может быть недоступен */ }

// Эпоха пороха, если хоть у одной стороны не древность: от этого зависят рог/барабан и фанфара.
function isModern() { return cfg.fac.some(f => FACTIONS[f].modern); }

// Фон каждой карты рисуем один раз: земля, берега, река, декор.
function paintBackground(map) {
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  let bctx = bg.getContext('2d');
  const bgCtx = bctx; map.decor = []; let curSpr = null;
  const sprBegin = (sw = 16, sh = 14) => { curSpr = document.createElement('canvas'); curSpr.width = sw; curSpr.height = sh; bctx = curSpr.getContext('2d'); };
  const sprEnd = (wx, wy, ax, ay, ns) => { map.decor.push({ x: wx, y: wy, c: curSpr, ax, ay, ns }); bctx = bgCtx; };
  const img = bctx.createImageData(W, H);
  const px = new Uint32Array(img.data.buffer);
  let seed = 12345;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const pack = h => (255 << 24) | (parseInt(h.slice(5, 7), 16) << 16) | (parseInt(h.slice(3, 5), 16) << 8) | parseInt(h.slice(1, 3), 16);
  const hexShade = (h, k) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * k))).toString(16).padStart(2, '0')).join('');

// Лёд: трещины на перегруженных отрезках и тёмная вода на обрушенных.
function drawIce() {
  for (let s = 0; s < ICE_N; s++) {
    const y0 = s * ICE_SEG, y1 = Math.min(H, y0 + ICE_SEG);
    if (iceBroken[s]) {
      for (let y = y0; y < y1; y++) {
        const c = riverCenter(y), h = riverHalf(y);
        ctx.fillStyle = (y & 1) ? '#1d4663' : '#235370';
        ctx.fillRect(Math.round(c - h), y, Math.round(h * 2), 1);
      }
      ctx.fillStyle = '#e9f5fb';
      for (let k = 0; k < 6; k++) {   // льдинки
        const y = y0 + ((s * 71 + k * 29) % ICE_SEG), c = riverCenter(y), h = riverHalf(y);
        ctx.fillRect(Math.round(c - h + (((s * 131 + k * 57) % 97) / 97) * (h * 2 - 4)), y, 3, 2);
      }
    } else if (iceStress[s] > 0.08) {
      const st = iceStress[s], n = Math.ceil(st * 6);
      ctx.strokeStyle = 'rgba(25,65,95,' + (0.35 + 0.55 * st).toFixed(2) + ')';
      ctx.lineWidth = 1;
      for (let k = 0; k < n; k++) {
        let y = y0 + ((s * 37 + k * 53) % ICE_SEG);
        const c = riverCenter(y), h = riverHalf(y);
        let x = c + ((((s * 17 + k * 31) % 11) / 11) - 0.5) * h * 1.6;
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let j = 1; j <= 4; j++) { x += (((s + k + j * 5) % 5) - 2) * 2; y += 3; ctx.lineTo(x, y); }
        ctx.stroke();
      }
    }
  }
}

// Пруды: трещины на перегруженном льду, тёмная вода с льдинками на проломленном (рисуется в мировых координатах).
function drawPonds() {
  if (MAP.lake) return;
  for (const p of PONDS) {
    if (p.broken) {
      ctx.fillStyle = '#1d4663'; ctx.beginPath(); ctx.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#235370'; ctx.beginPath(); ctx.ellipse(p.cx, p.cy, p.rx * 0.82, p.ry * 0.82, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = '#e9f5fb';
      for (let k = 0; k < 10; k++) { const a = k * 2.399, r = 0.15 + ((k * 37) % 70) / 100; ctx.fillRect(Math.round(p.cx + Math.cos(a) * p.rx * r * 0.8), Math.round(p.cy + Math.sin(a) * p.ry * r * 0.8), 3, 2); }
    } else if (p.stress > 0.08) {
      const n = Math.ceil(p.stress * 9);
      ctx.strokeStyle = 'rgba(25,65,95,' + (0.35 + 0.55 * p.stress).toFixed(2) + ')'; ctx.lineWidth = 1;
      for (let k = 0; k < n; k++) {
        const a = k * 2.399 + 0.7, r0 = ((k * 53) % 40) / 100;
        let x = p.cx + Math.cos(a) * p.rx * r0, y = p.cy + Math.sin(a) * p.ry * r0;
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let j = 1; j <= 4; j++) { x += Math.cos(a) * p.rx * 0.14 + (((k + j * 5) % 5) - 2); y += Math.sin(a) * p.ry * 0.14 + (((k * 3 + j) % 5) - 2); ctx.lineTo(x, y); }
        ctx.stroke();
      }
    }
  }
}
function drawDisc(cx, cy, r) {
  r = Math.max(1, Math.round(r));
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(cx) - w, Math.round(cy) + dy, w * 2 + 1, 1); }
}
// ---- пиксельные люди: 4 стороны (0 вниз/к зрителю, 1 вверх/от зрителя, 2 вправо, 3 влево), без лиц ----
const SKIN = '#d9ab7c', STEEL = '#b4bdc9', STEEL_D = '#6e7886', WOOD = '#8a5a2b', WOOD_L = '#b98545', INK = '#23262d',
      LEATHER = '#5b3d22', BOOT = '#2a2118', HAIR = '#3b2a1d', HORSE = '#7a4a26', HORSE_D = '#55321a', BRASS = '#d8b04a';
const SPR = new Map();
let RW = null;   // если задано: сжатие по x к оси cx в sx раз (делает фигуру стройнее), каждый прямоугольник остаётся минимум 1 px
function R(g, x, y, w, h, c) {
  if (RW) { const x0 = Math.floor(RW.cx + (x - RW.cx) * RW.sx), x1 = Math.round(RW.cx + (x + w - RW.cx) * RW.sx); x = x0; w = Math.max(1, x1 - x0); }
  g.fillStyle = c; g.fillRect(x, y, w, h);
}

function archOf0(t) {
  if (t.sfx === 'hwacha') return 'hwacha';
  if (t.sfx === 'trebuchet') return 'treb';
  if (t.sfx === 'mg') return 'mg';
  if (t.sfx === 'ballista') return 'ball';
  if (t.gun === 2) return 'cannon';
  if (t.name.indexOf('Колесниц') >= 0) return t.range > 10 ? 'chariotbow' : 'chariot';
  if (t.gun === 1) return 'musk';
  if (t.range > 10) return t.speed >= 30 ? 'hbow' : 'bow';
  if (t.speed >= 34) return 'cav';
  return 'melee';
}

// Пехота (копьё, лук, ружьё) всех фракций рисуется крупным спрайтом 'line'; t.wk запоминает исходный тип.
function archOf(t) {
  const a = archOf0(t);
  if ((a === 'melee' || a === 'musk' || a === 'bow') && coatOf(t.fname)) { t.wk = a; return 'line'; }
  return a;
}

function line(g, x0, y0, x1, y1, c) {   // пиксельная линия
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx - dy;
  for (;;) {
    R(g, x0, y0, 1, 1, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 > -dy) { e -= dy; x0 += sx; }
    if (e2 < dx) { e += dx; y0 += sy; }
  }
}

// ---- игровой интерфейс ----

    t.querySelector('.nm').textContent = FACTIONS[cfg.fac[i]].name;
  });
  for (let i = 0; i < 2; i++) {
    if (shown[i] !== alive[i]) { btn('c' + i).textContent = alive[i]; shown[i] = alive[i]; }
  }
  rowTools.hidden = state !== 'setup';
  btn('btnErase').hidden = state !== 'setup';
  btn('btnErase').classList.toggle('on', tool.type === 'erase');
  btn('btnAuto').hidden = btn('btnClear').hidden = btn('btnGo').hidden = state !== 'setup';
  btn('btnSpeed').hidden = state !== 'battle';
  btn('btnReset').hidden = state === 'setup';
  btn('btnSpeed').textContent = '×' + speed;
  btn('btnPoss').hidden = state !== 'battle' || !!poss.u;
  btn('btnPoss').classList.toggle('on', poss.pick);
  btn('possUI').hidden = !poss.u;

function refreshSnd() {

  btn('btnSnd').textContent = off ? '🔇' : '🔊';
  btn('btnSndMenu').textContent = (off ? '🔇' : '🔊') + ' Звук: ' + (off ? 'выкл' : 'вкл');
}
btn('btnSnd').onclick = btn('btnSndMenu').onclick = () => { Snd.toggle(); refreshSnd(); };
// щелчок на любой кнопке (после переключателя звука, чтобы при включении он тоже щёлкнул)
document.addEventListener('click', e => { if (e.target.closest('button')) Snd.play('click'); });

  const f = FACTIONS[cfg.fac[tool.team]], colors = SIDE_COLORS[tool.team];
  f.units.forEach((u, i) => {
    const b = document.createElement('button');
    b.className = 'tool' + (tool.type === i ? ' on' : '');
    b.innerHTML = '<i class="sq" style="background:' + colors[u.shade] +
      ';width:' + (u.size + 4) + 'px;height:' + (u.size + 4) + 'px"></i>' + u.name + (mode === 'camp' ? ' · ' + u.cost : '');

btn('btnErase').onclick = () => { if (state !== 'setup') return; tool.type = tool.type === 'erase' ? 0 : 'erase'; renderTools(); refreshUI(); };

tabs.forEach(t => t.addEventListener('click', () => {
  if (state !== 'setup' || (mode === 'camp' && +t.dataset.team === 1)) return;
  tool.team = +t.dataset.team;
  if (tool.type !== 'erase') tool.type = 0;
  renderTools(); refreshUI();

function paint(e, first) {
  const [x, y] = pointerPos(e);
  if (tool.type === 'erase') {
    const before = units.length;
    let w = 0;
    for (let i = 0; i < units.length; i++) {
      const u = units[i], dx = u.x - x, dy = u.y - y;
      if (dx * dx + dy * dy > 100 || (mode === 'camp' && u.team === 1)) units[w++] = u;
    }
    units.length = w;
    if (w < before) Snd.play('erase', x);
    countAlive(); refreshUI();
    return;
  }
  const team = tool.team;
  if (MAP.posts) {   // здание рядом: стрелка ставим на пост (угол, окно, балкон)
    const post = nearestPost(team, x, y);
    if (post) {
      const ut = FACTIONS[cfg.fac[team]].units[tool.type];
      if (ut.range <= 10) { if (first) toast('В окна и на углы - только стрелки'); return; }
      if (alive[team] >= CAP) { if (first) toast('Лимит: ' + CAP + ' на сторону'); return; }
      if (mode === 'camp' && spent + ut.cost > budget) { if (first) toast('Бюджет исчерпан'); return; }
      const nu = makeUnit(team, cfg.fac[team], tool.type, post.x, post.y); nu.gar = post; units.push(nu);
      Snd.play('place', x); countAlive(); refreshUI();
      return;
    }
  }
  if (!sideOK(team, x, y)) { if (first) toast('Только на своей стороне'); return; }
  if (alive[team] >= CAP) { if (first) toast('Лимит: ' + CAP + ' на сторону'); return; }
  if (mode === 'camp' && spent + FACTIONS[cfg.fac[team]].units[tool.type].cost > budget) { if (first) toast('Бюджет исчерпан'); return; }
  const nsz = FACTIONS[cfg.fac[team]].units[tool.type].size;
  for (const u of units) { const dx = u.x - x, dy = u.y - y; if (dx * dx + dy * dy < Math.max(42, ((nsz + u.t.size) / 2) ** 2 * 0.8)) return; }

  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  { const k = Math.min(1, dt * 9), da = cam.angT - cam.ang;   // плавный доворот камеры и плавная смена вида
    if (Math.abs(da) > 0.0005) cam.ang += da * k; else cam.ang = cam.angT;
    const dk = VIEWS[viewMode].K - viewK; viewK = Math.abs(dk) > 0.002 ? viewK + dk * k : VIEWS[viewMode].K; }
  if (state !== 'menu') {
    if (state === 'battle') {
      acc += dt * speed;
      let n = 0;
      while (acc >= STEP && n < 6) { step(STEP); acc -= STEP; n++; }
      if (n === 6) acc = 0;
      kbJoy();
      if (poss.u) {
        if (poss.u.dead) possEnd('Одержимый юнит погиб. Выбери нового кнопкой «Одержимость»');
        else {   // камера плавно следует за юнитом
          const k = Math.min(1, dt * 8);
          cam.x += (poss.u.x - cam.x) * k; cam.y += (poss.u.y - cam.y) * k; clampCam();
          updatePossHud();
        }
      }
      Snd.din(alive[0] + alive[1]);
      if (alive[0] === 0 || alive[1] === 0) {
        winner = alive[0] > 0 ? 0 : (alive[1] > 0 ? 1 : -1);
        state = 'done'; possEnd();
        onBattleEnd(); Snd.din(0); Snd.end(winner, isModern());
      }
      refreshUI();
    }
    updateFx(dt);
    if (msg) { msg.t -= dt; if (msg.t <= 0) msg = null; }
    draw();
  }
  requestAnimationFrame(frame);
}

setMap(cfg.map);
buildMenu(); refreshMenu();
requestAnimationFrame(frame);
</script>
