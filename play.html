  if (lying) {                       // лежащий игрок: силуэт повёрнут на 90°
    outCv = document.createElement('canvas');
    outCv.width = SPR_H; outCv.height = SPR_W;
    const h = outCv.getContext('2d');
    h.translate(SPR_H, 0); h.rotate(Math.PI / 2);
    h.drawImage(cv, 0, 0);
  }
  spriteCache[key] = outCv;
  return outCv;
}

// отрисовка всех канвасов с классом fig внутри root: цвет и номер берутся из data-атрибутов
// ===== Фигуры толпы: та же сетка 16×24, что и у игроков, с вариантами: вид сзади, жилет, сидя, захват, камера =====
// o — опции: back (вид со спины — волосы вместо лица), vest (цвет жилета, вместо футболки), sit (сидя),
// grab (рука вперёд), cam (камера в руках)
function buildFigure(frame, o = {}) {
  const g = Array.from({ length: SPR_H }, () => Array(SPR_W).fill(' '));
  const put = (x0, y0, x1, y1, ch) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (y >= 0 && y < SPR_H && x >= 0 && x < SPR_W) g[y][x] = ch; };
  const P = LEG_POSES[frame] || LEG_POSES.stand;
  // голова: при виде сзади — только волосы
  for (let y = 1; y <= 8; y++) for (let x = 3; x <= 12; x++) {
    const dx = (x - 7.5) / 4.6, dy = (y - 4.5) / 4.2;
    if (dx * dx + dy * dy > 1) continue;
    let ch = 's';
    if (y <= 3 || (x <= 4 && y <= 5) || o.back) ch = 'h';
    if (ch === 'h' && y <= 2 && x >= 6 && x <= 9) ch = 'H';
    if (ch === 'h' && x >= 11) ch = 'd';
    if (ch === 's' && x >= 11) ch = 'S';
    g[y][x] = ch;
  }
  put(6, 9, 9, 9, 'S');                                              // шея
  // торс: футболка или жилет
  if (o.vest) { put(5, 10, 10, 15, 'v'); put(5, 10, 5, 15, 'v'); put(10, 10, 10, 15, 'V'); put(3, 10, 4, 11, 'k'); put(11, 10, 12, 11, 'k'); }
  else { put(5, 10, 10, 15, 'k'); put(5, 10, 5, 15, 'L'); put(10, 10, 10, 15, 'K'); put(3, 10, 4, 11, 'k'); put(11, 10, 12, 11, 'K'); }
  put(5, 16, 10, 16, 'e');
  // руки: при захвате — вперёд, иначе — вдоль тела
  put(3, 12, 4, 14, 's'); put(3, 15, 4, 15, 'S');
  if (o.grab) { put(11, 11, 15, 12, 'k'); put(13, 12, 15, 13, 's'); put(15, 12, 15, 13, 'S'); }
  else { put(11, 12, 12, 14, 's'); put(11, 15, 12, 15, 'S'); }
  if (o.cam) { put(11, 12, 13, 13, 'C'); put(12, 12, 13, 12, 'B'); }   // камера в руке
  // шорты
  put(5, 17, 10, 19, 'w'); put(10, 17, 10, 19, 'W');
  if (o.sit) {                                                       // сидит: бедро вперёд, голень вниз
    put(8, 18, 13, 19, 'w'); put(12, 20, 13, 22, 's'); put(12, 23, 14, 23, 'b');
  } else {
    ['L', 'R'].forEach(side => {
      const l = P[side];
      put(l.x, 20, l.x + 1, 21 + l.dy, 's');
      put(l.x + l.fx, 22 + l.dy, l.x + l.fx + 2, 23, 'b');
      put(l.x + l.fx, 22 + l.dy, l.x + l.fx + 2, 22 + l.dy, 'B');
    });
  }
  // контур
  const out = g.map(r => r.slice());
  for (let y = 0; y < SPR_H; y++) for (let x = 0; x < SPR_W; x++) {
    if (g[y][x] !== ' ') continue;
    const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const yy = y + dy, xx = x + dx;
      return yy >= 0 && yy < SPR_H && xx >= 0 && xx < SPR_W && g[yy][xx] !== ' ';
    });
    if (near) out[y][x] = 'o';
  }
  return out;
}

// спрайт фигуры толпы: внешний вид берётся из look, жилет и камера — из опций
const crowdCache = {};
function getCrowdSprite(look, frame, o, flip) {
  const key = [look.color, look.skin, look.hair, look.shorts, frame, JSON.stringify(o), o.vest || '', flip ? 'F' : 'R'].join('|');
  if (crowdCache[key]) return crowdCache[key];
  if (Object.keys(crowdCache).length > 800) for (const k in crowdCache) delete crowdCache[k];
  let grid = buildFigure(frame, o);
  if (flip) grid = grid.map(r => r.slice().reverse());
  const sh = look.shorts;
  const vest = o.vest || look.color;
  const pal = { o: '#111111', h: look.hair, H: lighten(look.hair), d: shade(look.hair), s: look.skin, S: shade(look.skin),
                k: look.color, K: shade(look.color), L: lighten(look.color), w: sh, W: shade(sh), e: '#4a3626',
                b: '#1a1a1a', B: '#3a3a3a', v: vest, V: shade(vest), C: '#262626' };
  const cv = document.createElement('canvas');
  cv.width = SPR_W; cv.height = SPR_H;
  const g = cv.getContext('2d');
  grid.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ' ') { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  crowdCache[key] = cv;
  return cv;
}

function drawFigs(root) {
  root.querySelectorAll('canvas.fig').forEach(cv => {
    const n = +cv.dataset.n, skin = cv.dataset.skin || SKINS[n % SKINS.length], hair = cv.dataset.hair || HAIRS[0];
    const spr = getSprite(cv.dataset.c, n, false, skin, 'stand', cv.dataset.s, hair, cv.dataset.hs || (cv.dataset.afro === '1' ? 'afro' : 'short'));
    const g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    g.imageSmoothingEnabled = false;
    g.drawImage(spr, 0, 0, cv.width, cv.height);
  });
}


function drawPitch(c, x, y, w, h) {
  const s = 8;
  for (let i = 0; i < w; i += s) {
    c.fillStyle = (i / s) % 2 ? '#2e8b3e' : '#34a047';
    c.fillRect(x + i, y, Math.min(s, w - i), h);
  }
  c.strokeStyle = '#ffffff'; c.lineWidth = 1;
  c.strokeRect(x + .5, y + .5, w - 1, h - 1);
  c.beginPath(); c.moveTo(x + w / 2, y); c.lineTo(x + w / 2, y + h); c.stroke();
  c.beginPath(); c.arc(x + w / 2, y + h / 2, h * .15, 0, Math.PI * 2); c.stroke();
}

function drawStadium(c) {
  const W = 320, H = 200;
  const pal = ['#e74c3c', '#f1c40f', '#ecf0f1', '#3498db'];
  for (let y = 0; y < H; y += 6) {
    c.fillStyle = (y / 6) % 2 ? '#3b3f47' : '#4a4f59';
    c.fillRect(0, y, W, 6);
    for (let x = 0; x < W; x += 4) {
      if ((x * 7 + y * 3) % 11 < 3) { c.fillStyle = pal[(x + y) % 4]; c.fillRect(x, y + 1, 2, 2); }
    }
  }
  drawPitch(c, 14, 14, W - 28, H - 28);
}

// ===== Быстрый матч: тот же движок, управление и ИИ, что в карьере; матч короче, без карьеры =====
const QUICK_DUR = 45;   // секунд на матч (5 на 5)
const QUICK_DUR_CLASSIC = 90;   // секунд на матч в классике 11 на 11
const QUICK_FORM5 = [[.03, .5], [.14, .3], [.14, .7], [.3, .5], [.42, .5]];   // расстановка 5 на 5: вратарь, 2 защитника, полузащитник, нападающий
let QUICK = { mode: 'classic', home: 0, away: 1, err: false };
let QUICK_RESULT = null, QM_CFG = null;
const QUICK_SQUADS = {};
const quickL = () => L() === 'kz'
  ? { title: 'Жылдам матч', hint: QUICK.mode === 'five' ? `Матч ${QUICK_DUR} секунд · карьерадағыдай басқару` : `2 тайм × ${QUICK_DUR_CLASSIC / 2} секунд · үзілісте ауыстыру`, home: 'Үй иесі', away: 'Қонақ',
      classic: 'Классика · 11 на 11', five: '5 на 5 · мини-поле', play: 'Ойнау', again: 'Тағы матч', menu: 'Мәзірге',
      sameClub: 'Екі түрлі клуб таңдаңыз' }
  : { title: 'Быстрый матч', hint: QUICK.mode === 'five' ? `Матч ${QUICK_DUR} секунд · управление и ИИ как в карьере` : `2 тайма по ${QUICK_DUR_CLASSIC / 2} секунд · перерыв на замены`, home: 'Хозяева', away: 'Гости',
      classic: 'Классика · 11 на 11', five: '5 на 5 · мини-поле', play: 'Играть', again: 'Ещё матч', menu: 'В меню',
      sameClub: 'Выберите два разных клуба' };

// состав клуба для быстрого матча: из лиги, сохраняется между матчами
function quickSquad(i) {
  if (!QUICK_SQUADS[i]) {
    QUICK_SQUADS[i] = makeSquad(CLUBS[i], i);
    QUICK_SQUADS[i].forEach(p => { p.inj = p.inj || 0; p.hp = p.hp ?? 100; p.mor = p.mor ?? 70; });   // как в карьере: состояние игрока задано
  }
  return QUICK_SQUADS[i];
}
// 5 на 5: вратарь, два защитника, полузащитник, нападающий — из здоровых игроков клуба
function quickFive(i) {
  const sq = quickSquad(i), fit = p => p.inj <= 0;
  const by = pos => sq.filter(p => p.pos === pos && fit(p)).sort((x, y) => y.ovr - x.ovr);
  const out = [], used = new Set();
  const take = list => { const p = list.find(q => !used.has(q)); if (p) { used.add(p); out.push(p); } };
  take(by('GK')); take(by('DF')); take(by('DF')); take(by('MF')); take(by('FW'));
  sq.filter(fit).forEach(p => { if (out.length < 5 && !used.has(p)) { used.add(p); out.push(p); } });
  return out;
}

function quickStart() {
  if (QUICK.home === QUICK.away) { QUICK.err = true; return go('quick'); }
  QUICK.err = false;
  const h = CLUBS[QUICK.home], a = CLUBS[QUICK.away];
  const five = QUICK.mode === 'five';
  let mySquad, oppSquad;
  if (five) { mySquad = quickFive(QUICK.home); oppSquad = quickFive(QUICK.away); }
  else {
    prepareLineup(quickSquad(QUICK.home), false);
    prepareLineup(quickSquad(QUICK.away), false);
    mySquad = quickSquad(QUICK.home); oppSquad = quickSquad(QUICK.away);
  }
  QM_CFG = {
    lang: L(), quick: true, duration: five ? QUICK_DUR : QUICK_DUR_CLASSIC, n: five ? 5 : 11, form: five ? QUICK_FORM5 : undefined,
    myClub: nm(h), oppClub: nm(a), myColor: h.color, oppColor: a.color, myShorts: h.shorts, oppShorts: a.shorts,
    mySquad, oppSquad,
    tactic: 'balanced', coach: 0, friendly: true,
    onEnd: (gm, gop) => {
      QUICK_RESULT = { gm, gop, home: nm(h), away: nm(a) };
      go('quickresult');
    }
  };
  go('quickmatch');
}

// ===== Аркада 11 на 11: большое поле, камера, аут, подкаты, фолы, штрафные =====
const Match = (() => {
  const VW = 480, VH = 270;                    // видимая часть поля (экран камеры), в логических единицах
  const RES = 2;                               // внутреннее разрешение канваса: вдвое чётче
  let W = 960, H = 540, GH = 38;               // размер поля в игровых единицах (зависит от режима, см. setField)
  const DUR = 90;
  let GT, GB;
  let BOX_W = 120, BOX_H = 220, SPOT = 80;     // штрафная площадь и точка пенальти
  const STREET_W = 400, STREET_H = 300;        // размер площадки 5 на 5 (глина, кольца над воротами)
  let STREET = false;
  const SPRINT = 1.5;                           // множитель скорости при спринте
  const SHOT_FULL_MS = 900, SWING_FULL = 900, SPIN_MAX = .9;   // удержание кнопки удара до полной силы (мс), скорость замаха для «быстрого» (px/с), макс. подкрутка (рад/с)
  const IDLE_MS = 10000, AUTO_SPEED = 2;        // без касаний 10 с — авто-игра; авто-игра идёт в 2 раза быстрее
  const CAM = { zoom: 1, lerp: 4 };             // zoom < 1 — камера отдаляется, > 1 — приближается
  const GK_COLOR = '#ff8fd8';
  const FORM = [[.03, .5], [.15, .18], [.15, .4], [.15, .6], [.15, .82],
                [.3, .25], [.3, .5], [.3, .75], [.42, .3], [.42, .5], [.42, .7]];
  const KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyJ', 'KeyK', 'Sprint'];
  const MAP = { KeyW: 'ArrowUp', KeyS: 'ArrowDown', KeyA: 'ArrowLeft', KeyD: 'ArrowRight',
                ShiftLeft: 'Sprint', ShiftRight: 'Sprint' };

  let c, cfg, teams, ball, score, timeLeft, last, raf, running = false, ref = null;
  let keys = {}, joy = { x: 0, y: 0 }, joyId = null, ox = 0, oy = 0;
  let ctrl = null, kickCd = 0, cpuCd = [0, 0], tackleCd = [0, 0];
  let flash = 0, flashKey = 'goal', pen = null;
  let benches = [[], []], subsUsed = [0, 0], subOpen = false, subPick = null;
  let half = 1, brk = null, SUBLOG = [], subSel = null, subMsg = '';   // тайм (1 или 2); brk — готовность сторон в перерыве; SUBLOG — журнал замен
  let fk = null;        // свободный удар: {t — команда, которая бьёт, timer}
  let thr = null;       // аут: {t — команда, которая вбрасывает, taker, timer}
  let lastTeam = 0;     // команда, которая последней касалась мяча (для аутов)
  let switchCd = 0;     // пауза между автоматическими сменами игрока
  let camX = W / 2, camY = H / 2;
  let passPulse = false, slidePulse = false, switchPulse = false;
  let net = null, ctrl2 = null, FLIP = false;   // сеть: net — каналы связи, ctrl2 — игрок гостя на хосте, FLIP — гость видит поле зеркально
  let drill = null, coachP = null;   // тренировка героя: drill — очки и состояние упражнения, coachP — тренер у бровки
  let grabLock = 0, shootBuf = null, passDir = null, aim = null;   // aim — прицел кнопок удара и паса (перетаскивание, как в Brawl Stars)
  let auto = false, lastInput = 0, autoCd = 0;
  let phase = 'play', photoT = 0, photoHold = 0, finishing = false;   // play → photo (построение перед фотографами) → результат
  let fans = [], stewards = [], photogs = [], nextFan = Infinity, nextPhotog = 6;
  let injuries = [];                            // травмы за матч: {side, id, dmg, days}

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const cl = (v, a, b) => Math.min(b, Math.max(a, v));

  // игрок выходит на матч с показателями, которые зависят от морали и ХП; тактика тренера сдвигает команду
  function makeTeam(squad, side, tac) {
    return squad.map((p, i) => {
      const f = ((cfg && cfg.form) || FORM)[i] || [.2, .5];   // запасные стоят у своей скамейки
      const bx = side === 0 ? f[0] * W : (1 - f[0]) * W;
      const by = f[1] * H;
      const k = (0.92 + 0.08 * (p.mor ?? 70) / 100) * (0.85 + 0.15 * (p.hp ?? 100) / 100);
      const st = s => clamp(Math.round(p[s] * k + (tac ? (tac[s] || 0) : 0)));
      return { pid: p.id, inj: (p.inj || 0) > 0, pendingSub: false,
               num: p.num, label: p.name.split(' ').pop(), pos: p.pos,
               pace: st('pace'), shot: st('shot'), def: st('def'), side, bx, by, x: bx, y: by,
               ax: side === 0 ? 1 : -1, ay: 0, down: 0, slide: 0, hit: false, diveY: by,
               kickT: 0, px: bx, py: by, spd: 0,
               skin: lookOf(p).skin, hair: lookOf(p).hair, afro: !!lookOf(p).afro, hs: lookOf(p).hs || (lookOf(p).afro ? 'afro' : 'short') };
    });
  }

  // поле режима: 11 на 11 — полное, 5 на 5 — мини-поле (2/3 от большого)
  function setField(n) {
    STREET = n === 5;
    if (STREET) {
      W = STREET_W; H = STREET_H; GH = 24;      // уличная площадка: размер меняется двумя константами выше
      BOX_W = 64; BOX_H = 140; SPOT = 46;
    } else {
      W = 960; H = 540; GH = 38;
      BOX_W = 120; BOX_H = 220; SPOT = 80;
    }
    GT = H / 2 - GH; GB = H / 2 + GH;
    LINE_Y = H - 46;
    CAM.zoom = STREET ? Math.max(.75, Math.min(1.4, VW * .92 / (W * 1.15), VH * .8 / (H * TILT * 1.15))) : 1;   // площадка целиком в кадре
  }

  const alive = team => team.filter(p => p.down <= 0);

  function nearest(team, pt) {
    let best = null, bd = Infinity;
    alive(team).forEach(p => { const d = dist(p, pt); if (d < bd) { bd = d; best = p; } });
    return best;
  }

  function nearestOpp(p, r) {
    let best = null, bd = r;
    alive(teams[1 - p.side]).forEach(q => { const d = dist(p, q); if (d < bd) { bd = d; best = q; } });
    return best;
  }

  function stepTo(p, tx, ty, sp, dt) {
    const dx = tx - p.x, dy = ty - p.y, l = Math.hypot(dx, dy);
    if (l > 1) {
      const k = Math.min(l, sp * dt) / l;
      p.x += dx * k; p.y += dy * k;
      p.ax = dx / l; p.ay = dy / l;
    }
    p.x = cl(p.x, 4, W - 4); p.y = cl(p.y, 4, H - 4);
  }

  function formTarget(p) {
    return { x: cl(p.bx + (ball.x - W / 2) * .25, 6, W - 6), y: cl(p.by + (ball.y - H / 2) * .25, 6, H - 6) };
  }

  // удар: направление нормализуется, team — кто ударил (для аутов)
  // сила зажатия → высота полёта: сильный удар уходит по воздуху над защитой, слабый катится по земле
  function shotAir(c) { return c > .6 ? (c - .6) / .4 * .7 : 0; }   // секунды полёта по воздуху (0 — по земле)
  function kick(dx, dy, power, team, spin, air) {
    const l = Math.hypot(dx, dy) || 1;
    ball.vx = dx / l * power; ball.vy = dy / l * power; ball.sp = spin || 0; ball.air = air || 0; ball.airT = air || 0;
    ball.owner = null; grabLock = .25;           // после удара мяч свободен
    if (team !== undefined) lastTeam = team;
  }

  // сила удара игрока: его стат «Удар», удержание кнопки (c: 0..1) и скорость замаха (s: 0 — медленно, 1 — быстро)
  function shotPower(p, c, s) {
    const base = 120 + p.shot * .5;
    return base * Math.min(1.5, (.85 + .4 * c) * (.9 + .2 * Math.min(1, s)) * 1.3);
  }
  // стрелка направления удара на кнопке — показывает, куда полетит мяч
  function aimArrow(el, b) {
    const a = document.createElement('div');
    a.style.cssText = 'position:absolute;height:5px;width:90px;background:#e0b000;border-radius:3px;transform-origin:0 50%;pointer-events:none;display:none;z-index:8;box-shadow:0 0 6px rgba(0,0,0,.6)';
    el.appendChild(a);
    return (dir, dx, dy) => {
      if (!dir) { a.style.display = 'none'; return; }
      const r = b.getBoundingClientRect(), pr = el.getBoundingClientRect();
      a.style.left = (r.left - pr.left + r.width / 2) + 'px'; a.style.top = (r.top - pr.top + r.height / 2) + 'px';
      a.style.transform = 'rotate(' + Math.atan2(dy, dx) + 'rad)'; a.style.display = '';
    };
  }

  function aimAt(goalX, power, spread, team) {
    const dx = goalX - ball.x, dy = H / 2 + (Math.random() - .5) * spread - ball.y;
    kick(dx, dy, power, team);
  }

  function touch(p) {
    if (p.down > 0) return;
    const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy) || .01;
    if (d < 7) {
      ball.x = p.x + dx / d * 7; ball.y = p.y + dy / d * 7;
      ball.vx += dx / d * 30; ball.vy += dy / d * 30;
      lastTeam = p.side;
    }
  }

  // пас от игрока p своим: выбирает лучшего партнёра впереди, иначе бьёт по направлению взгляда
  function passFrom(p, team, dir) {
    p.kickT = .3;
    if (drill && p.pid === 'hero') drill.pass = { t: drill.now, from: p };
    const ax = dir ? dir.x : p.ax, ay = dir ? dir.y : p.ay;
    let best = null, bs = -Infinity;
    alive(team).forEach(q => {
      if (q === p) return;
      const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
      if (d < 20 || d > (dir ? 240 : 180)) return;
      const cs = (dx * ax + dy * ay) / d;
      if (dir && cs < .85) return;                 // при прицеле — только партнёр в выбранную сторону
      const sc = cs - d / 400;
      if (sc > bs) { bs = sc; best = q; }
    });
    if (best) {
      const dx = best.x - p.x, dy = best.y - p.y, d = Math.hypot(dx, dy);
      kick(dx / d, dy / d, 90 + d * .3, p.side);
    } else {
      kick(ax, ay, dir ? 120 : 90, p.side);
    }
  }

  function setFlash(k) { flashKey = k; flash = 1.2; }

  function kickoff() {
    ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    teams.forEach(team => team.forEach(p => { p.x = p.bx; p.y = p.by; p.slide = 0; p.hit = false; }));
    ctrl = null; ctrl2 = null; thr = null;
    camX = W / 2; camY = H / 2;
    if (drill) drillReset();
  }

  function goal(team) {
    score[team]++;
    if (drill && team === 'me') {
      if (drill.kind === 'shot' && drill.now - drill.lastShotT < 4) drill.pts += 3;                       // гол после моего удара
      if (drill.kind === 'pass' && drill.assist && drill.now - drill.assist.t < 8) drill.pts += 3;       // голевая передача
    }
    setFlash('goal');
    kickoff();
  }

  // физика мяча: 'goal' — гол засчитан, 'out' — мяч за боковой линией, иначе null
  function ballPhysics(dt) {
    if (ball.air > 0) ball.air -= dt;
    if (ball.sp) { const a = ball.sp * dt, vx = ball.vx, vy = ball.vy; ball.vx = vx - vy * a; ball.vy = vy + vx * a; ball.sp *= Math.pow(.35, dt); if (Math.abs(ball.sp) < .01) ball.sp = 0; }   // подкрутка: мяч плавно уходит в сторону

    if (ball.x <= 2 && mouth) { goal('cpu'); return 'goal'; }
    if (ball.x < 2) { ball.x = 2; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - 2) { ball.x = W - 2; ball.vx = -Math.abs(ball.vx); }
    return null;
  }

  // ----- игра по сети: хост считает матч и ведёт первую команду, гость ведёт вторую и получает картинку -----
  const r1 = v => Math.round(v * 10) / 10;
  function netSend(ch, obj) { try { if (ch && ch.readyState === 'open') ch.send(JSON.stringify(obj)); } catch (e) {} }
  function netClose() {                                       // матч окончен: соединение остаётся для реванша

  function netWire() {
    net.inp = { dx: 0, dy: 0, sp: 0, pc: 0, shc: 0, slc: 0, swc: 0 };

    net.k = { pc: 0, shc: 0, slc: 0, swc: 0, sd: null, pd: null, sdown: false };   // гость: счётчики нажатий
    net.snap = null; net.ts = 0; net.sts = 0; net.kcd = 0; net.sw2 = 0; net.dead = false;
    net.g.onmessage = e => {
      try { const m = JSON.parse(e.data); if (!net) return; if (net.role === 'host') net.inp = m; else net.snap = m; } catch (x) {}
    };
    net.c.onmessage = e => {
      try {
        const m = JSON.parse(e.data);
        if (m.t === 'end' && net && net.role === 'guest') { score.me = m.me; score.cpu = m.cpu; finish(); }
        else if (m.t === 'brk' || m.t === 'sub' || m.t === 'isub' || m.t === 'ready' || m.t === 'go2') netMatchMsg(m);

    };

      if (!net) return;

    };

  }
  function netSendState(now) {                               // хост: снимок матча 20 раз в секунду
    if (now - net.sts < 50) return; net.sts = now;
    const o = ball.owner, oc = o ? (teams[0].indexOf(o) >= 0 ? teams[0].indexOf(o) : 100 + teams[1].indexOf(o)) : -1;
    const P = [];
    teams.forEach(team => team.forEach(p => P.push([r1(p.x), r1(p.y), Math.round(p.ax * 100) / 100, Math.round(p.ay * 100) / 100,
      (p.down > 0 ? 1 : 0) | (p.slide > 0 ? 2 : 0) | (p.kickT > 0 ? 4 : 0)])));
    netSend(net.g, { tm: r1(timeLeft), sc: [score.me, score.cpu], fk: flash > 0 ? flashKey : '', fl: Math.round(flash * 100) / 100,
      g: ctrl2 ? teams[1].indexOf(ctrl2) : -1, b: [r1(ball.x), r1(ball.y)], o: oc, p: P });
  }
  function netApplySnap(dt) {                                // гость: рисует то, что насчитал хост
    const s = net.snap; if (!s) return;
    timeLeft = s.tm; score.me = s.sc[0]; score.cpu = s.sc[1];
    if (s.fk) { flashKey = s.fk; flash = s.fl; } else flash = 0;
    const k = Math.min(1, dt * 18);
    let i = 0;
    teams.forEach(team => team.forEach(p => {
      const d = s.p[i++]; if (!d) return;
      if (Math.hypot(d[0] - p.x, d[1] - p.y) > 60) { p.x = d[0]; p.y = d[1]; } else { p.x += (d[0] - p.x) * k; p.y += (d[1] - p.y) * k; }
      p.ax = d[2]; p.ay = d[3]; p.down = d[4] & 1 ? 1 : 0; p.slide = d[4] & 2 ? 1 : 0;
      if (d[4] & 4) p.kickT = Math.max(p.kickT, .12);
    }));
    if (Math.hypot(s.b[0] - ball.x, s.b[1] - ball.y) > 40) { ball.x = s.b[0]; ball.y = s.b[1]; } else { ball.x += (s.b[0] - ball.x) * k; ball.y += (s.b[1] - ball.y) * k; }
    ball.owner = s.o < 0 ? null : s.o < 100 ? teams[0][s.o] : teams[1][s.o - 100];
    ctrl = s.g >= 0 ? teams[1][s.g] : null;
  }
  function netSendInput(now) {                               // гость: стик и нажатия кнопок хосту, 30 раз в секунду
    if (now - net.ts < 33) return; net.ts = now;
    const k = net.k;
    if (shootBuf) { k.shc++; k.sd = shootBuf.dir; k.sc = shootBuf.c; k.ss = shootBuf.s; k.sw = shootBuf.spin; shootBuf = null; }
    if (keys.Space && !k.sdown) { k.shc++; k.sd = null; k.sc = 0; k.ss = 0; k.sw = 0; }
    k.sdown = !!keys.Space;
    if (passPulse) { k.pc++; k.pd = passDir; passPulse = false; passDir = null; }
    if (slidePulse) { k.slc++; slidePulse = false; }
    if (switchPulse) { k.swc++; switchPulse = false; }
    let dx = joy.x, dy = joy.y;
    const kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); dx = kx / l; dy = ky / l; }
    if (FLIP) dx = -dx;
    netSend(net.g, { dx: Math.round(dx * 100) / 100, dy: Math.round(dy * 100) / 100, sp: keys.Sprint ? 1 : 0,
      pc: k.pc, pd: k.pd, shc: k.shc, sd: k.sd, sc: k.sc, ss: k.ss, sw: k.sw, slc: k.slc, swc: k.swc });
  }
  function humanTake(p) {                                    // игрок получил мяч: управление переходит к нему
    if (p.side === 0 && teams[0][0] !== p && !(cfg && cfg.lockPid)) { ctrl = p; switchCd = .4; }
    else if (net && net.role === 'host' && p.side === 1 && teams[1][0] !== p) { ctrl2 = p; net.sw2 = .4; }
  }
  function pickSide(side, exclude) {                         // ближайший к мячу игрок команды; вратарь — только у своих ворот
    const own = side === 0 ? ball.x <= BOX_W + 60 : ball.x >= W - BOX_W - 60;
    let best = null, bd = Infinity, gk = null;
    teams[side].forEach((p, i) => {
      if (p.down > 0 || p === exclude) return;
      if (i === 0) { gk = p; if (!own) return; }
      const d = dist(p, ball); if (d < bd) { bd = d; best = p; }
    });
    return best || gk;
  }
  function driveGuest(dt) {                                  // хост: управление игроком гостя, те же правила, что у хоста
    const inp = net.inp, sn = net.seen, T1 = teams[1];
    net.sw2 -= dt; net.kcd -= dt;
    if (!ctrl2 || ctrl2.down > 0) ctrl2 = pickSide(1, null);
    const p = ctrl2; if (!p) return;
    if (inp.swc !== sn.swc) { sn.swc = inp.swc; const nx = pickSide(1, p); if (nx) { ctrl2 = nx; net.sw2 = .6; return; } }
    else if (net.sw2 <= 0 && p.slide <= 0 && ball.owner !== p) {
      const b = pickSide(1, null);
      if (b && b !== p && dist(p, ball) > 30 && dist(b, ball) < dist(p, ball) - 25) { ctrl2 = b; net.sw2 = .5; return; }
    }
    const dx = inp.dx || 0, dy = inp.dy || 0, mag = Math.min(1, Math.hypot(dx, dy));
    if (inp.slc !== sn.slc) { sn.slc = inp.slc; if (p.slide <= 0 && p.down <= 0) { p.slide = .55; p.hit = false; } }
    if (p.slide > 0) {
      p.slide -= dt;
      const v = 170 * Math.max(0, p.slide / .55);
      p.x = cl(p.x + p.ax * v * dt, 4, W - 4); p.y = cl(p.y + p.ay * v * dt, 4, H - 4);
      if (!p.hit) { const victim = nearestOpp(p, 14); if (victim) { p.hit = true; resolveTackle(p, victim); } }
    } else if (mag > .15) {
      const l = Math.hypot(dx, dy); p.ax = dx / l; p.ay = dy / l;
      const sp = (30 + p.pace * .35) * mag * (inp.sp ? SPRINT : 1);
      p.x = cl(p.x + p.ax * sp * dt, 4, W - 4); p.y = cl(p.y + p.ay * sp * dt, 4, H - 4);
    }

    if (inp.shc !== sn.shc) { sn.shc = inp.shc; net.shb = { dir: inp.sd, t: .25, c: inp.sc, s: inp.ss, spin: inp.sw }; }

  }

  // ----- тренировка героя: полноценная игра в жилетках, очки зависят от выбранного упражнения -----
  const PACE_N = 6;
  const paceGates = () => Array.from({ length: PACE_N }, (_, i) => ({ x: W * (.28 + .09 * i), y: H / 2 + (i % 2 ? 1 : -1) * H * .16 }));
  function paceGate(seq) {                                  // ворота из конусов: туда, потом обратно
    const dir = Math.floor(seq / PACE_N) % 2 === 0 ? 1 : -1, i = dir > 0 ? seq % PACE_N : PACE_N - 1 - seq % PACE_N;
    return { ...paceGates()[i], i, dir };
  }
  function drillReset() {
    const hero = teams[0].find(p => p.pid === 'hero');
    if (!hero) return;
    const give = (p, x, y, d) => { p.x = x; p.y = y; p.ax = d; p.ay = 0; ball.owner = p; ball.x = x + d * 6; ball.y = y; ball.vx = ball.vy = 0; lastTeam = p.side; };
    if (drill.kind === 'def') {                              // мяч у соперника, герой встаёт у него на пути
      const o = teams[1].find((q, i) => i > 0) || teams[1][0];
      hero.x = W * .38; hero.y = H / 2; hero.ax = 1; hero.ay = 0;
      give(o, W * .5, H / 2, -1);
    } else give(hero, drill.kind === 'pace' ? W * .14 : drill.kind === 'shot' ? W * .62 : W * .45, H / 2, 1);
    if (drill.kind === 'pace') drill.seq = 0;
    drill.tGate = drill.now; drill.px = undefined; ctrl = hero;
  }
  function drillPickup(b) {
    if (drill.kind === 'pass' && drill.pass && b.side === 0 && b !== drill.pass.from && drill.now - drill.pass.t < 4) {
      drill.pts += 1; drill.assist = { t: drill.now }; drill.pass = null;           // точная передача партнёру
    }
    if (drill.kind === 'shot' && b === teams[1][0] && drill.now - drill.lastShotT < 3) { drill.pts += 1; drill.lastShotT = -99; }   // удар в створ
    if (drill.kind === 'def' && b.pid === 'hero' && lastTeam === 1) { drill.pts += 1; drill.resetAt = drill.now + 2.5; }          // перехват
  }
  function drillTick(dt) {
    drill.now += dt;
    if (drill.kind === 'shot' && !pen && !fk && !thr && drill.penAt !== undefined && drill.now >= drill.penAt) { drill.penAt += 20; startPenalty(0); }   // в тренировке на удар судья назначает пенальти каждые 20 секунд
    if (coachP) {                                            // тренер ходит вдоль бровки за мячом
      const d = cl(ball.x, 50, W - 50) - coachP.x;
      coachP.x += Math.sign(d) * Math.min(Math.abs(d), 28 * dt); coachP.ax = Math.sign(d) || coachP.ax; coachP.spd = Math.abs(d) > 2 ? 20 : 0;
    }
    if (drill.resetAt && drill.now >= drill.resetAt) { drill.resetAt = 0; kickoff(); }
    if (drill.kind === 'pace') {
      const g = paceGate(drill.seq), bx = ball.x;
      if (ball.owner && ball.owner.pid === 'hero' && drill.px !== undefined && Math.abs(ball.y - g.y) < 17 && (drill.px - g.x) * (bx - g.x) <= 0 && (bx - drill.px) * g.dir > 0) {

        drill.tGate = drill.now; drill.seq++;
      }
      drill.px = bx;
    }
  }
  function drawCone(x, y, hot) {
    const q = proj(x, y), s = q.s;
    c.fillStyle = hot ? '#ffd200' : '#ff7a1a';
    c.beginPath(); c.moveTo(q.x, q.y - 10 * s); c.lineTo(q.x - 4 * s, q.y); c.lineTo(q.x + 4 * s, q.y); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.fillRect(q.x - 2.4 * s, q.y - 5 * s, 4.8 * s, 1.4 * s);
  }
  function drillItems(items) {
    if (drill.kind === 'pace') {
      const cur = paceGate(drill.seq);
      items.push({ y: -999, fn: () => groundArrow(cur.x - cur.dir * 8, cur.y, cur.dir, 0, 16, 9, 'rgba(255,210,0,.55)') });
      paceGates().forEach((g, i) => [-1, 1].forEach(sd => items.push({ y: g.y + sd * 17, fn: () => drawCone(g.x, g.y + sd * 17, i === cur.i) })));
    }
    items.push({ y: coachP.y, fn: () => player(coachP, '#1f3a5f', '#1f3a5f') });
  }

  // ----- владение: мяч «прилипает» к ногам, отбирают подкатом или встав перед игроком; вратарь ловит руками -----
  function updatePossession(dt) {
    grabLock -= dt;
    if (ball.air > 0) return;                              // мяч в воздухе — его не отбирают
    const o = ball.owner;
    if (o && (o.down > 0 || o.slide > 0)) {                 // упал или в подкате — мяч отпущен
      ball.vx = o.ax * 50; ball.vy = o.ay * 50; ball.owner = null; grabLock = .2; o.noGrab = .5;
      return;
    }
    if (o) {
      ball.x = o.x + o.ax * 6; ball.y = o.y + o.ay * 6; ball.vx = 0; ball.vy = 0; lastTeam = o.side;
      if (o === teams[o.side][0]) return;                   // вратарь держит мяч в руках
      if (drill && drill.kind === 'pace') return;           // тренировка скорости: мяч не отбирают
      for (const q of alive(teams[1 - o.side])) {
        const d = dist(q, o);
        if (d > 11 || q.slide > 0 || (q.noGrab || 0) > 0) continue;
        if (((q.x - o.x) * o.ax + (q.y - o.y) * o.ay) / (d || 1) < .3) continue;   // отбирает тот, кто встал перед игроком
        if (Math.random() < (.7 + (q.def - o.pace * .5) / 200) * dt) {
          o.noGrab = .7; ball.owner = q; lastTeam = q.side;
          if (drill && drill.kind === 'def' && q.pid === 'hero') { drill.pts += 2; drill.resetAt = drill.now + 2.5; }
          humanTake(q);
          break;
        }
      }
      return;
    }
    if (grabLock > 0) return;
    const sp = Math.hypot(ball.vx, ball.vy);
    let best = null, bd = Infinity;
    teams.forEach(team => team.forEach((p, i) => {
      if (p.down > 0 || p.slide > 0 || (p.noGrab || 0) > 0) return;
      const d = dist(p, ball);
      if (d > (i === 0 ? 13 : 10) || d >= bd) return;
      if (i === 0 ? sp < 260 : (sp < 110 || p.side === lastTeam)) { best = p; bd = d; }
    }));
    if (best) {
      if (drill) drillPickup(best);
      ball.owner = best; lastTeam = best.side; best.holdT = 0;
      humanTake(best);
    }
  }

  // ----- аут: мяч за боковой линией, вбрасывает команда, которая не касалась мяча последней -----
  function startThrow() {
    const t = 1 - lastTeam;
    const y = ball.y < H / 2 ? 8 : H - 8, x = cl(ball.x, 10, W - 10);
    ball = { x, y, vx: 0, vy: 0 };
    const taker = nearest(teams[t], ball);
    if (!taker) { kickoff(); return; }
    const inward = y < H / 2 ? 1 : -1;
    taker.x = x; taker.y = y + inward * 8;
    taker.ax = t === 0 ? 1 : -1; taker.ay = inward;
    thr = { t, taker, timer: 1.2 };
    ctrl = t === 0 ? taker : null;
    setFlash('throwIn');
  }

  function updateThrow(dt) {
    const { t, taker } = thr;
    thr.timer -= dt;
    alive(teams[1 - t]).forEach(p => {   // соперники отходят от места аута
      const d = dist(p, ball) || 1;
      if (d < 40) stepTo(p, ball.x + (p.x - ball.x) / d * 40, ball.y + (p.y - ball.y) / d * 40, 150, dt);
    });
    const human = t === 0;
    if (!human) passPulse = false;                        // нажатие «Пас» во время чужого аута не должно копиться
    if (thr.timer > 0 && !(human && passPulse)) return;   // человек может вбросить раньше, кнопкой «Пас»
    passPulse = false;
    thr = null;
    if (human) ctrl = taker;
    passFrom(taker, teams[t], human ? passDir : null);
    passDir = null;
  }

  // ----- фолы и штрафные -----
  // травма: шанс выше у подката; ХП и дни восстановления зависят от силы удара
  function maybeInjure(tk, v) {
    if (v.pendingSub) return false;
    if (Math.random() > (tk.slide > 0 ? .15 : .05)) return false;
    const dmg = 8 + Math.floor(Math.random() * 23);            // 8–30 ХП
    v.pendingSub = true;
    injuries.push({ side: v.side, id: v.pid, dmg, days: Math.round(dmg * 1.2) + 4 });
    return true;
  }

  // травмированный уходит с поля: на его место встаёт запасной того же амплуа, если есть
  function injurySub(t, p) {
    p.pendingSub = false;
    const field = teams[t], bench = benches[t];
    let j = bench.findIndex(q => q.pos === p.pos);
    if (j < 0 && p.pos !== 'GK') j = bench.findIndex(q => q.pos !== 'GK');
    if (j < 0) return;                       // замен нет — игрок доигрывает с пониженными ХП
    const fi = field.indexOf(p);
    applyInjury(t, fi, j);
    if (net && net.role === 'host') netSend(net.c, { t: 'isub', tm: t, fi, bi: j });   // гость должен знать ту же замену
  }
  function applyInjury(t, fi, bi) {
    const field = teams[t], bench = benches[t], p = field[fi];
    if (!p || !bench[bi]) return;
    const inn = bench.splice(bi, 1)[0];
    inn.x = p.x; inn.y = p.y; inn.bx = p.bx; inn.by = p.by;
    inn.down = 0; inn.slide = 0; inn.hit = false;
    p.down = 0; p.slide = 0; p.pendingSub = false;
    field[fi] = inn;
    if (ctrl === p) ctrl = inn;
    if (ctrl2 === p) ctrl2 = inn;
    setFlash('injury');
  }

  function resolveTackle(tk, v) {
    const clean = Math.random() < .4 + (tk.def - v.pace * .5) / 150;
    if (clean) {
      if (drill && drill.kind === 'def' && tk.pid === 'hero' && ball.owner === v) { drill.pts += 2; drill.resetAt = drill.now + 2.5; }
      if (ball.owner === v || (dist(v, ball) < 14 && !(ball.air > 0))) { v.noGrab = .6; kick(tk.ax, tk.ay, 70, tk.side); }   // отобрал мяч
      return;
    }
    if (!drill) foul(tk, v);                                   // на тренировке фолов нет
  }

  function foul(tk, v) {
    v.down = 1.3;
    setFlash('foul');
    maybeInjure(tk, v);
    const inBox = tk.side === 0
      ? (v.x < BOX_W && Math.abs(v.y - H / 2) < BOX_H / 2)
      : (v.x > W - BOX_W && Math.abs(v.y - H / 2) < BOX_H / 2);
    if (inBox) { startPenalty(1 - tk.side); return; }
    ball = { x: cl(v.x, 6, W - 6), y: cl(v.y, 6, H - 6), vx: 0, vy: 0 };
    fk = { t: 1 - tk.side, timer: 1.5 };   // свободный удар команде, которой сделали фол
  }

  function startPenalty(t) {
    const spotX = t === 0 ? W - SPOT : SPOT;   // точка пенальти, внутри штрафной
    pen = { t, spotX, timer: t === 0 ? 6 : 1.6, shot: false, after: 0, saved: false, saveDone: false, gk: null };
    ball = { x: spotX, y: H / 2, vx: 0, vy: 0 };
    teams.forEach(team => team.forEach(p => { p.x = p.bx; p.y = p.by; p.slide = 0; }));
    ctrl = null;
    setFlash('pen');
  }

  function shootPen() {
    const t = pen.t, gk = teams[1 - t][0], taker = (drill && t === 0 && teams[0].find(p => p.pid === 'hero')) || teams[t][Math.min(8, teams[t].length - 1)];
    if (drill && drill.kind === 'shot') drill.lastShotT = drill.now;   // гол с пенальти считается как гол после удара   // в 5 на 5 игроков меньше девяти
    // направление: у человека — стиком (вверх/вниз), у ИИ — случайно
    const dirY = t === 0
      ? (joy.y < -.25 ? -1 : joy.y > .25 ? 1 : (Math.random() < .5 ? -1 : 1))
      : (Math.random() < .5 ? -1 : 1);
    const guess = Math.random() < .5 ? -1 : 1;     // куда бросился вратарь
    const correct = guess === dirY;
    const saveP = correct ? .55 + gk.def / 300 - (taker.shot - 60) / 300 : .06;
    taker.kickT = .3; pen.shot = true; pen.after = 1.6; pen.saved = Math.random() < saveP; pen.gk = gk;
    gk.diveY = H / 2 + guess * 22;
    const tx = t === 0 ? W : 0, ty = H / 2 + dirY * 22;
    const dx = tx - pen.spotX, dy = ty - H / 2;
    kick(dx, dy, 200 + taker.shot * .4, t);
  }

  function updatePen(dt) {
    if (!pen.shot) {
      pen.timer -= dt;
      if ((pen.t === 0 && (auto || keys.Space) && kickCd <= 0) || pen.timer <= 0) { shootPen(); kickCd = .3; }
      return;
    }
    const gk = pen.gk;
    stepTo(gk, gk.x, gk.diveY, 220, dt);
    if (pen.saved && !pen.saveDone && Math.abs(ball.x - gk.x) < 14) {
      pen.saveDone = true;
      ball.vx = 0; ball.vy = 0;
      if (drill && drill.kind === 'shot') { drill.pts += 1; drill.lastShotT = -99; }   // сейв вратаря — удар в створ
      setFlash('save');
    }
    const r = ballPhysics(dt);
    if (r === 'out') { pen = null; kickoff(); return; }   // мяч ушёл за линию: матч продолжается с центра
    pen.after -= dt;
    if (r === 'goal') { pen = null; return; }
    if (pen.after <= 0) { pen = null; kickoff(); }
  }

  // свободный удар: мяч стоит на месте фола, соперники отходят на 60 px, затем бьёт команда
  function updateFK(dt) {
    fk.timer -= dt;
    alive(teams[1 - fk.t]).forEach(p => {
      const d = dist(p, ball), l = d || 1;
      if (d < 60) stepTo(p, ball.x + (p.x - ball.x) / l * 60, ball.y + (p.y - ball.y) / l * 60, 150, dt);
    });
    if (fk.timer > 0) return;
    const t = fk.t;
    fk = null;
    const taker = nearest(teams[t], ball);
    if (!taker) return;
    taker.x = ball.x; taker.y = ball.y - 8;   // исполнитель стоит у мяча
    taker.kickT = .3;
    if (t === 0) { ctrl = taker; return; }     // человек бьёт сам ⚽ или пасом
    aimAt(t === 0 ? W : 0, 90 + taker.shot * .4, 90, t);     // ИИ пробивает в ворота соперника
  }

  // ----- выбор управляемого игрока -----
  // вратарь участвует в выборе только когда мяч в его штрафной
  function pickCtrl(exclude) {
    if (cfg && cfg.lockPid) { const me = teams[0].find(p => p.pid === cfg.lockPid); if (me && me.down <= 0) return me; }   // карьера игрока: только свой игрок
    let best = null, bd = Infinity, gk = null;
    teams[0].forEach((p, i) => {
      if (p.down > 0 || p === exclude) return;
      if (i === 0) gk = p;
      if (i === 0 && ball.x > BOX_W + 60) return;
      const d = dist(p, ball);
      if (d < bd) { bd = d; best = p; }
    });
    return best || gk;   // если в поле остался только вратарь, управляем им
  }

  // умная смена: фокус остаётся на текущем игроке, пока он бежит или ведёт мяч;
  // переключаемся, только если кто-то из команды заметно ближе к мячу; ручная смена — кнопкой «Смена»
  function selectCtrl(mag, dt) {
    switchCd -= dt;
    if (!ctrl || ctrl.down > 0) { ctrl = pickCtrl(null); switchCd = .4; return; }
    if (switchPulse) {
      switchPulse = false;
      const nx = pickCtrl(ctrl);
      if (nx) { ctrl = nx; switchCd = .6; }
      return;
    }
    const dCur = dist(ctrl, ball);
    if (switchCd > 0 || dCur < 30 || ctrl.slide > 0) return;   // ведём мяч или в борьбе
    if (mag > .15 && dCur < 110) return;                       // активно бежим — не перескакиваем
    const best = pickCtrl(null);
    if (best && best !== ctrl && dist(best, ball) < dCur - 25) { ctrl = best; switchCd = .6; }
  }

  // ----- камера: следит за мячом и управляемым игроком, не выходит за поле -----
  function updateCam(dt) {
    const z = CAM.zoom, hw = VW / (2 * z), hh = VH / (2 * z * TILT);   // TILT — сжатие по вертикали (ниже)
    const fx = v => FLIP ? W - v : v;
    let tx = ctrl ? fx(ball.x) * .6 + fx(ctrl.x) * .4 : fx(ball.x);
    let ty = ctrl ? ball.y * .6 + ctrl.y * .4 : ball.y;
    if (phase === 'photo') { tx = W / 2; ty = H + 20; }                  // камера уходит к построению
    const k = Math.min(1, dt * CAM.lerp);
    const cl2 = (v, a, b) => (a > b ? (a + b) / 2 : cl(v, a, b));         // поле меньше экрана — камера по центру
    camX = cl2(camX + (tx - camX) * k, hw, W - hw);
    camY = cl2(camY + (ty - camY) * k, hh - 28, H - hh + (phase === 'photo' ? 78 : 40));              // чуть выше и ниже поля — видны фотографы
  }

  // ----- замены: игрок с скамейки выходит вместо игрока на поле -----
  function openSub() {
    subOpen = true; subPick = null; subSel = null; subMsg = '';
    keys = {}; passPulse = false; slidePulse = false; switchPulse = false;   // сбрасываем нажатия, сделанные до панели
    document.getElementById('subPanel').style.display = 'flex';
    renderSub();
  }

  function closeSub() {
    subOpen = false; subPick = null;
    document.getElementById('subPanel').style.display = 'none';
  }

  // в матче по сети хост ведёт первую команду, гость — вторую; в матче с ИИ — первую
  const myTeam = () => (net && net.role === 'guest' ? 1 : 0);
  const subsLeftFor = t => ((cfg.n || 11) === 11 ? 3 - subsUsed[t] : 0);
  const escS = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const subName = p => `${p.num}. ${escS(p.label)}`;

  function renderSub() {
    const box = document.getElementById('subPanel'), tx = T[cfg.lang], mt = myTeam();
    const bench = benches[mt], field = teams[mt];
    const brkMode = phase === 'break' && !!brk;
    const locked = brkMode && brk.mine;
    const color = mt === 0 ? cfg.myColor : cfg.oppColor, shorts = mt === 0 ? cfg.myShorts : cfg.oppShorts;
    const left = subsLeftFor(mt);
    // позиции на поле — как в расстановке: вратарь внизу, нападающие вверху
    const place = (p, t) => {
      const depth = t === 0 ? p.bx / W : 1 - p.bx / W, across = p.by / H;
      return `left:${(across * 100).toFixed(1)}%;top:${(6 + (1 - depth / .45) * 86).toFixed(1)}%`;
    };
    const figAttrs = (p, c, sh) => `width="16" height="24" data-c="${c}" data-s="${sh}" data-n="${p.num}" data-skin="${p.skin}" data-hair="${p.hair}" data-afro="${p.afro ? 1 : ''}" data-hs="${p.hs || ''}"`;
    const fieldCards = field.map((p, i) => `<div class="slot${subSel && subSel.side === 'f' && subSel.i === i ? ' sel' : ''}" data-side="f" data-i="${i}" style="${place(p, mt)}">
        <canvas class="fig" ${figAttrs(p, color, shorts)}></canvas><b>${p.num}. ${escS(p.label)}</b><br><small>${tx.pos[p.pos]}</small></div>`).join('');
    const benchCards = bench.map((p, i) => `<div class="slot${subSel && subSel.side === 'b' && subSel.i === i ? ' sel' : ''}" data-side="b" data-i="${i}">
        <canvas class="fig" ${figAttrs(p, color, shorts)}></canvas><b>${p.num}. ${escS(p.label)}</b><br><small>${tx.pos[p.pos]}</small></div>`).join('');
    let html = `<h3>${brkMode ? tx.halftime + ' · ' : ''}${tx.sub} · ${tx.subsLeft}: ${left}</h3>`;
    if (brkMode) {
      html += `<p>${escS(cfg.myClub)} ${score.me} : ${score.cpu} ${escS(cfg.oppClub)}${net ? ' · ' + (brk.opp ? tx.oppReady : tx.oppWorking) : ''}</p>`;
    }
    html += `<div class="sub-wrap"><div class="sub-pitch">${fieldCards}</div><div class="sub-side">`;
    if (!locked && left > 0 && bench.length) html += `<p class="hint">${tx.subHint}</p>`;
    if (subMsg) html += `<p class="sub-msg">${subMsg}</p>`;
    if (!bench.length) html += `<p>${tx.noBench}</p>`;
    else html += `<h3>${tx.benchTitle}</h3><div class="bench-row sub-bench">${benchCards}</div>`;
    if (brkMode && SUBLOG.length) html += `<p class="sublog"><b>${tx.subLog}</b><br>${SUBLOG.slice(-4).join('<br>')}</p>`;
    html += `</div></div>`;
    html += brkMode
      ? (locked ? `<p>${tx.waitOpp}</p>` : `<button data-go="1">${tx.startHalf2}</button>`)
      : `<button class="ghost" data-close="1">${tx.cancel}</button>`;
    box.innerHTML = html;
    drawFigs(box);
    if (!locked) box.querySelectorAll('.slot').forEach(el => { el.onclick = () => subTap(el.dataset.side, +el.dataset.i); });
    const cl = box.querySelector('[data-close]'); if (cl) cl.onclick = closeSub;
    const go = box.querySelector('[data-go]'); if (go) go.onclick = breakReady;
  }
  function subTap(side, i) {                          // первый тап — выбор, второй — обмен (с любой стороны)
    subMsg = '';
    if (!subSel || subSel.side === side) { subSel = { side, i }; return renderSub(); }
    const mt = myTeam(), f = subSel.side === 'f' ? subSel.i : i, b = subSel.side === 'b' ? subSel.i : i;
    subSel = null;
    if (subsLeftFor(mt) <= 0) { subMsg = T[cfg.lang].subNoLeft; return renderSub(); }
    if ((benches[mt][b].pos === 'GK') !== (f === 0)) { subMsg = T[cfg.lang].subGK; return renderSub(); }
    doSub(b, f);
  }

  function doSub(bi, fi) {
    const r = applySub(myTeam(), bi, fi);
    if (!r) return;
    if (net) netSend(net.c, { t: 'sub', bi, fi });   // соперник увидит замену и сделает у себя то же
    if (phase === 'break') renderSub(); else closeSub();
  }
  function applySub(t, bi, fi) {                   // одна и та же замена на обеих машинах: списки команд совпадают по индексам
    const field = teams[t], bench = benches[t];
    const out = field[fi], inn = bench[bi];
    if (!out || !inn) return null;
    bench.splice(bi, 1);
    inn.x = out.x; inn.y = out.y; inn.bx = out.bx; inn.by = out.by;
    inn.down = 0; inn.slide = 0; inn.hit = false;
    out.down = 0; out.slide = 0;
    field[fi] = inn;
    bench.push(out);
    if (ctrl === out) ctrl = null;
    if (ctrl2 === out) ctrl2 = null;
    subsUsed[t]++;
    SUBLOG.push(`${escS(t === 0 ? cfg.myClub : cfg.oppClub)}: ${subName(inn)} ${T[cfg.lang].subInstead} ${subName(out)}`);
    return { out, inn };
  }

  // перерыв — только в быстрой классике 11 на 11; тайм — половина времени матча
  function breakOn() { return !!cfg.quick && (cfg.n || 11) === 11 && !STREET && !drill && !cfg.drill; }
  function halfLen() { return breakOn() ? (cfg.duration || DUR) / 2 : (cfg.duration || DUR); }

  function startBreak() {
    phase = 'break'; pen = null; fk = null; thr = null; timeLeft = 0;
    brk = { mine: false, opp: !net };
    if (net && net.role === 'host') netSend(net.c, { t: 'brk' });
    openSub();
  }
  function breakReady() {
    if (phase !== 'break' || !brk || brk.mine) return;
    brk.mine = true;
    if (net) netSend(net.c, { t: 'ready' });
    tryStartHalf2();
    if (phase === 'break') renderSub();
  }
  function tryStartHalf2() {                       // второй тайм начинает хост, когда готовы обе стороны
    if (phase !== 'break' || !brk || !brk.mine || !brk.opp) return;
    if (net && net.role === 'guest') return;
    if (net) netSend(net.c, { t: 'go2' });
    startHalf2();
  }
  function startHalf2() {
    if (phase !== 'break') return;
    half = 2; phase = 'play'; brk = null;
    closeSub();
    timeLeft = halfLen();
    kickoff();
  }
  function netMatchMsg(m) {                        // сообщения перерыва от соперника
    if (!net) return;
    if (m.t === 'brk') { if (phase === 'play') startBreak(); }
    else if (m.t === 'sub') { applySub(1 - myTeam(), m.bi, m.fi); subSel = null; }
    else if (m.t === 'isub') applyInjury(m.tm, m.fi, m.bi);
    else if (m.t === 'ready') { if (brk) brk.opp = true; tryStartHalf2(); }
    else if (m.t === 'go2') startHalf2();
    if (phase === 'break' && subOpen) renderSub();
  }

  function onKey(e) {
    inputNow();
    if (subOpen) return;   // пока открыта панель замен, клавиши не действуют
    const k = MAP[e.code] || e.code;
    if (KEYS.includes(k)) { keys[k] = true; e.preventDefault(); }
    if (e.code === 'KeyJ') { passPulse = true; passDir = null; }
    if (e.code === 'KeyK') slidePulse = true;
    if (e.code === 'KeyQ') switchPulse = true;
  }
  function onKeyUp(e) { keys[MAP[e.code] || e.code] = false; }

  function stop() {
    running = false;
    cancelAnimationFrame(raf);
    removeEventListener('keydown', onKey);
    removeEventListener('keyup', onKeyUp);
    netClose();
  }

  function finish() {
    if (finishing) return;
    finishing = true;
    if (net && net.role === 'host') netSend(net.c, { t: 'end', me: score.me, cpu: score.cpu });
    stop();
    if (drill) cfg.onEnd(drill.pts); else cfg.onEnd(score.me, score.cpu, injuries);
  }

  // ----- фанаты на поле и фотографы у бровки -----
  const rnd = (a, b) => a + Math.random() * (b - a);
  const CREW_X = [150, 480, 810];

  function spawnFan() {
    fanHalt = true;                                        // судья останавливает игру
    const look = randomLook(), top = Math.random() < .5, y0 = top ? -10 : H + 10, x0 = rnd(150, 810);
    fans.push({ x: x0, y: y0, tx: ball.x, ty: ball.y, state: 'run', t: 0, retarget: 0,
                skin: look.skin, hair: look.hair, color: look.color, shorts: look.shorts,
                num: '', label: '', ax: 1, ay: 0, down: 0, slide: 0, kickT: 0, px: 0, py: 0, spd: 0, speed: rnd(58, 70) });
    // два охранника в жилетах выбегают с той же стороны и догоняют фаната
    [-1, 1].forEach(d => {
      const l = randomLook();
      stewards.push({ x: x0 + d * 70, y: y0, side: d, state: 'wait', delay: rnd(1.2, 2),
                      skin: l.skin, hair: l.hair, color: '#b7f000', shorts: '#1c1f24',
                      num: '', label: '', ax: 1, ay: 0, down: 0, slide: 0, kickT: 0, px: 0, py: 0, spd: 0, speed: 80 });
    });
    if (flash <= 0) setFlash('fan');
  }

  function spawnPhotog(tx, life, bottom) {
    const look = randomLook(), fromLeft = Math.random() < .5;
    const atBottom = bottom !== undefined ? bottom : Math.random() < .5;
    photogs.push({ x: fromLeft ? -26 : W + 26, y: atBottom ? H + 6 : -6, top: !atBottom, tx, state: 'in', life, kneel: Math.random() < .4,
                   cd: rnd(.3, 1.2), fl: 0, vest: pick(['#ff7a1a', '#ffd200', '#33c0ff', '#e8e8e8']),
                   skin: look.skin, hair: look.hair, px: 0, py: 0, spd: 0 });
  }

  function updateFans(dt) {
    fans.forEach(f => {
      f.t += dt; f.retarget -= dt;
      if (f.state === 'run') {
        if (f.retarget <= 0) { f.tx = ball.x + rnd(-70, 70); f.ty = ball.y + rnd(-50, 50); f.retarget = rnd(.8, 1.6); }
        const caught = stewards.some(s => s.state === 'chase' && Math.hypot(s.x - f.x, s.y - f.y) < 8);
        if (caught || f.t > 16) {                       // фаната остановили: ведут к ближней бровке
          f.state = 'caught'; f.tx = f.x; f.ty = f.y < H / 2 ? -22 : H + 22; f.speed = 38;
          stewards.forEach(s => { s.state = 'escort'; });
        }
      }
      const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy);
      if (d > 1) { const st = Math.min(d, f.speed * dt); f.x += dx / d * st; f.y += dy / d * st; f.ax = dx / d; f.ay = dy / d; }
    });
    stewards.forEach(s => {
      const f = fans[0];
      if (s.state === 'wait') { s.delay -= dt; if (s.delay <= 0) s.state = 'chase'; return; }
      if (!f) return;
      if (s.state === 'escort') { s.x += (f.x + s.side * 7 - s.x) * Math.min(1, dt * 6); s.y += (f.y - 1 - s.y) * Math.min(1, dt * 6); s.ax = f.ax; s.ay = f.ay; return; }
      const dx = f.x - s.x, dy = f.y - s.y, d = Math.hypot(dx, dy);
      if (d > 1) { const st = Math.min(d, s.speed * dt); s.x += dx / d * st; s.y += dy / d * st; s.ax = dx / d; s.ay = dy / d; }
    });
    if (fans.length && fans[0].state === 'caught' && (fans[0].y < -14 || fans[0].y > H + 14)) { fans = []; stewards = []; }
  }

  function updatePhotogs(dt) {
    photogs.forEach(g => {
      g.fl = Math.max(0, g.fl - dt);
      if (g.state === 'in' || g.state === 'out') {
        const dx = g.tx - g.x, st = Math.min(Math.abs(dx), 46 * dt);
        g.x += Math.sign(dx) * st;
        if (g.state === 'in' && Math.abs(dx) < 2) g.state = 'stay';
      }
      if (g.state === 'stay') {
        g.life -= dt;
        g.cd -= dt;
        if (g.cd <= 0) { g.fl = .15; g.cd = phase === 'photo' ? rnd(.45, 1.3) : rnd(.7, 2.6); }
        if (g.life <= 0) { g.state = 'out'; g.tx = g.x < W / 2 ? -30 : W + 30; }
      }
    });
    photogs = photogs.filter(g => !(g.state === 'out' && (g.x < -28 || g.x > W + 28)));
  }

  function updateAmbient(dt) {
    if (phase === 'play') {
      nextFan -= dt; nextPhotog -= dt;
      if (nextFan <= 0) { spawnFan(); nextFan = Infinity; }   // фанат — максимум один раз за матч
      if (nextPhotog <= 0) {
        if (photogs.length < 3) {
          let tx = rnd(70, 890);
          for (let i = 0; i < 6 && CREW_X.some(cx => Math.abs(cx - tx) < 34); i++) tx = rnd(70, 890);
          spawnPhotog(tx, rnd(8, 16));
        }
        nextPhotog = rnd(6, 14);
      }
    }
    updateFans(dt);
    updatePhotogs(dt);
  }

  // ----- после финального свистка: обе команды строятся в ряд перед фотографами -----
  let LINE_Y = H - 46;
  function startPhoto() {
    phase = 'photo'; photoT = 0; photoHold = 0;
    pen = null; fk = null; thr = null; ctrl = null;
    teams.forEach((team, t) => {
      team.forEach(p => { p.down = 0; p.slide = 0; p.kickT = 0; p.pendingSub = false; });
      const order = team.slice().sort((a, b) => a.x - b.x);
      order.forEach((p, i) => { p.slot = { x: W / 2 + (t === 0 ? -34 - (10 - i) * 16.6 : 34 + i * 16.6), y: LINE_Y }; });
    });
    [-170, -110, -60, 60, 110, 170].forEach(dx => spawnPhotog(W / 2 + dx, 999, true));   // место у центра занято камерой
    setFlash('fullTime'); flash = 3;
    const sk = document.getElementById('skipBtn');
    if (sk) sk.parentElement.classList.add('m-photo');
  }
  function updatePhoto(dt) {
    photoT += dt;
    flash = Math.max(0, flash - dt);
    let allIn = true;

  function update(dt) {

  // ----- авто-игра и управление -----

  // ----- отрисовка: камера телетрансляции, поле видно под углом 40° -----

  // уличная площадка: асфальтовая кромка и сетка-рабица вдоль дальней стороны
  function drawStreetSurround() {

    poly([proj(-M, -M), proj(W + M, -M), proj(W + M, H + M), proj(-M, H + M)], '#575b63', null);
    const FH = 34, a = proj(-M, -M), b = proj(W + M, -M);

    c.strokeStyle = 'rgba(190,200,210,.45)'; c.lineWidth = .8;

  // кольцо на щите за воротами: щит, обод и сетка над перекладиной

    const hx = x0 + dir * 20, cy = H / 2, at = (x, y, h) => { const q = proj(x, y); return { x: q.x, y: q.y - h * q.s, s: q.s }; };
    const g = proj(hx + dir * 5, cy), top = at(hx + dir * 5, cy, 62);

    c.beginPath(); c.moveTo(g.x, g.y); c.lineTo(top.x, top.y); c.stroke();

  function drawField() {
    if (STREET) {                                                                     // глиняное покрытие
      for (let x = 0, i = 0; x < W; x += 8, i++) {
        poly([proj(x, 0), proj(x + 8, 0), proj(x + 8, H), proj(x, H)], i % 2 ? '#b8683c' : '#be6e42');
      }
      poly([proj(W * .38, H * .3), proj(W * .62, H * .3), proj(W * .62, H * .7), proj(W * .38, H * .7)], 'rgba(120,60,30,.18)', null);   // вытоптанный центр
      let r = 7;

  // ворота: белые стойки и перекладина, сетка на задней и боковых стенках; dir — куда уходит сетка от линии ворот

    const spr = getCrowdSprite(look, frame, o, flip);
    const w = SPR_W * s, h = SPR_H * s;
    c.imageSmoothingEnabled = false;
    c.drawImage(spr, q.x - w / 2, q.y + 5 * s - h, w, h);
    c.imageSmoothingEnabled = true;
  }
  function drawFan(f) {                                    // болельщики только бегут
    drawFig(f.x, f.y, { skin: f.skin, hair: f.hair, color: f.color, shorts: f.shorts },
      (performance.now() / 160 | 0) % 2 ? 'run2' : 'run1', {}, f.ax < 0);
  }
  function drawSteward(s) {                                // охрана: бежит, идёт за фанатом или хватает его
    const f = fans[0];
    const grab = s.state === 'chase' && !!f && Math.hypot(s.x - f.x, s.y - f.y) < 14;
    let frame = 'stand';
    if (!grab && s.state === 'escort') frame = (performance.now() / 260 | 0) % 2 ? 'walk2' : 'walk';
    else if (!grab && s.state === 'chase') frame = (performance.now() / 160 | 0) % 2 ? 'run2' : 'run1';
    drawFig(s.x, s.y, { skin: s.skin, hair: s.hair, color: s.color, shorts: s.shorts }, frame, { grab }, s.ax < 0);
  }
  // операторы у камер: нижние — со спины, верхние — спереди; в жилетах; стоят, сидят, медленно ходят
  const OP_VEST = '#f08a1c';
  let ops = [];
  function initOps() {
    ops = [];
    if (STREET || (cfg && cfg.drill)) return;
    CREW_X.forEach(cx => {
      const look = { skin: pickOf(SKINS), hair: pickOf(HAIRS), color: '#2b2b2b', shorts: '#1a1a1a' };
      [{ y: H + 16, back: true }, { y: -8, back: false }].forEach(v => ops.push({
        x: cx - 18, y: v.y, back: v.back, look, lo: cx - 40, hi: cx - 14, speed: 9, dir: 1,
        mode: 'stand', wait: rnd(1, 4), t: 0, frame: 'stand', flip: false
      }));
    });
  }
  // фанат на поле: игра стоит, игроки отходят к бровке и смотрят, судья подходит к фанату;
  // матч возобновляется, когда охрана поймала фаната и увела его с поля
  let fanHalt = false;
  function updateHalt(dt) {
    const f = fans[0];
    teams.forEach(team => team.forEach(p => {
      stepTo(p, cl(p.x, 60, W - 60), p.y < H / 2 ? -26 : H + 26, 70, dt);
      if (f) p.ax = f.x < p.x ? -1 : 1;                   // смотрят в сторону фаната
    }));
    if (ref && f) stepTo(ref, cl(f.x, 60, W - 60), cl(f.y, 40, H - 40), 85, dt);
    updateFans(dt); updatePhotogs(dt);
    if (!fans.length) fanHalt = false;                    // фаната увели — матч продолжается
  }
  function updateOps(dt) {
    ops.forEach(o => {
      o.t += dt; o.wait -= dt;
      if (o.wait <= 0) {
        const r = Math.random();
        o.mode = r < .4 ? 'stand' : r < .7 ? 'sit' : 'walk';
        o.wait = o.mode === 'stand' ? 4 + Math.random() * 3 : o.mode === 'sit' ? 5 + Math.random() * 4 : 4 + Math.random() * 2;
        if (o.mode === 'walk') o.dir = Math.random() < .5 ? 1 : -1;
      }
      if (o.mode === 'walk') {
        o.x += o.dir * o.speed * dt;
        if (o.x < o.lo || o.x > o.hi) { o.dir = -o.dir; o.x = Math.max(o.lo, Math.min(o.hi, o.x)); }
        o.flip = o.dir < 0;
        o.frame = (o.t / .8 | 0) % 2 ? 'walk2' : 'walk';
      } else { o.frame = 'stand'; o.flip = false; }
    });
  }
  function drawOp(o) {
    drawFig(o.x, o.y, o.look, o.frame, { back: o.back, vest: OP_VEST, sit: o.mode === 'sit' }, o.flip);
  }
  // судья: бежит вдоль линии за мячом, в чёрной форме
  function updateRef(dt) {
    if (!ref) ref = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, spd: 0, skin: '#a86d43', hair: '#111111', num: '', label: '', down: 0, slide: 0, kickT: 0 };
    const tx = W / 2 + (ball.x - W / 2) * .55, ty = Math.max(50, Math.min(H - 50, ball.y));
    const dx = tx - ref.x, dy = ty - ref.y, d = Math.hypot(dx, dy), step = Math.min(d, 85 * dt);
    if (d > 0) { ref.x += dx / d * step; ref.y += dy / d * step; }
  }
  function marker(p) {                          // жёлтый треугольник над управляемым игроком
    if (p.down > 0 || p.slide > 0) return;
    const q = proj(p.x, p.y), top = q.y + 5 * q.s - SPR_H * q.s;
    c.fillStyle = '#ffd200';
    c.beginPath();
    c.moveTo(q.x, top - 10 * q.s); c.lineTo(q.x - 3 * q.s, top - 15 * q.s); c.lineTo(q.x + 3 * q.s, top - 15 * q.s);
    c.fill();
  }
  function player(p, color, shorts) {
    const q = proj(p.x, p.y), s = q.s;
    const lying = p.down > 0 || p.slide > 0;
    let frame = 'stand';
    if (!lying) {
      if (p.kickT > 0) frame = 'kick';
      else if (p.spd > 35) frame = (performance.now() / 110 | 0) % 2 ? 'run2' : 'run1';
      else if (p.spd > 8) frame = (performance.now() / 220 | 0) % 2 ? 'walk2' : 'walk';
    }
    const spr = getSprite(color, p.num, lying, p.skin, frame, shorts, p.hair, p.hs || !!p.afro);
    let topY;
    c.imageSmoothingEnabled = false;                      // игроки остаются пиксельными
    if (lying) {
      const w = SPR_H * s, h = SPR_W * s;
      c.drawImage(spr, q.x - w / 2, q.y - h / 2, w, h);
      topY = q.y - h / 2;
    } else {
      const w = SPR_W * s, h = SPR_H * s;
      c.drawImage(spr, q.x - w / 2, q.y + 5 * s - h, w, h);
      topY = q.y + 5 * s - h;
    }
    c.imageSmoothingEnabled = true;
    if (phase !== 'photo') {                                  // в построении подписи не нужны
      c.font = Math.round(5 * s) + 'px monospace'; c.textAlign = 'center';
      c.fillStyle = '#000'; c.fillText(p.label, q.x + 1, topY - 1);
      c.fillStyle = '#fff'; c.fillText(p.label, q.x, topY - 2);
    }
  }

  function draw() {
    c.setTransform(RES, 0, 0, RES, 0, 0);
    c.fillStyle = STREET ? '#3d4047' : '#2a2e35'; c.fillRect(0, 0, VW, VH);       // трибуны и асфальт за полем
    if (STREET) drawStreetSurround();
    drawField();
    drawGoal(0, -1); drawGoal(W, 1);
    if (STREET) { drawHoop(0, -1); drawHoop(W, 1); }
    // игроки, мяч, судья и камеры — от дальних к ближним, чтобы ближние перекрывали дальних
    const items = [{ y: ball.y, fn: drawBall }];
    if (!STREET && !(cfg && cfg.drill)) [150, 480, 810].forEach(x => {               // операторы за обеими боковыми линиями
      items.push({ y: -12, fn: () => drawCrew(x, -12) });
      items.push({ y: H + 12, fn: () => drawCrew(x, H + 12) });
    });
    if (ref) items.push({ y: ref.y, fn: () => player(ref, '#1c1c1c', '#1c1c1c') });
    ops.forEach(o => items.push({ y: o.y, fn: () => drawOp(o) }));
    fans.forEach(f => items.push({ y: f.y, fn: () => drawFan(f) }));
    stewards.forEach(s => items.push({ y: s.y, fn: () => drawSteward(s) }));
    photogs.forEach(g => items.push({ y: g.y, fn: () => drawPhotog(g) }));
    teams.forEach((team, t) => team.forEach((p, i) => {
      if (p === ctrl) return;
      items.push({ y: p.y, fn: () => player(p, i === 0 ? GK_COLOR : (t === 0 ? cfg.myColor : cfg.oppColor), i === 0 ? '#111111' : (t === 0 ? cfg.myShorts : cfg.oppShorts)) });
    }));
    if (drill) drillItems(items);
    if (ctrl) items.push({ y: ctrl.y, fn: () => {                  // управляемый игрок — в форме своей команды (у гостя это вторая команда)
      ctrlOverlay();
      const gk = ctrl === teams[0][0] || ctrl === teams[1][0], own = ctrl.side === 0;
      player(ctrl, gk ? GK_COLOR : (own ? cfg.myColor : cfg.oppColor), gk ? '#111111' : (own ? cfg.myShorts : cfg.oppShorts)); marker(ctrl);
    } });
    items.sort((a, b) => a.y - b.y).forEach(it => it.fn());

    // надписи на экране (без камеры)
    c.setTransform(RES, 0, 0, RES, 0, 0);
    if (flash > 0) {
      c.font = 'bold 22px monospace'; c.textAlign = 'center'; c.fillStyle = '#ffd200';
      c.fillText(T[cfg.lang][flashKey], VW / 2, flashKey === 'fullTime' ? 80 : 34);
    }
    if (pen && !pen.shot && pen.t === 0) {   // подсказка при пенальти у человека
      c.font = '12px monospace'; c.textAlign = 'center'; c.fillStyle = '#ffd200';
      c.fillText('⚽ ' + T[cfg.lang].pen, VW / 2, VH - 8);
    }
    document.getElementById('hTime').textContent = phase === 'break' ? T[cfg.lang].halftime : `${T[cfg.lang].time}: ${Math.ceil(timeLeft)}`;
    document.getElementById('hScore').textContent = drill ? `${cfg.drillLabel} · ${cfg.drillPtsWord}: ${drill.pts}${drill.kind === 'pace' ? ' · ' + drill.seq : ''}` : `${cfg.myClub} ${score.me} : ${score.cpu} ${cfg.oppClub}`;
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (subOpen || brk) lastInput = now;   // замены и перерыв — не бездействие
    if (net && net.role === 'guest') { netApplySnap(dt); if (phase === 'play') updateRef(dt); updateCam(dt); netSendInput(now); }
    else if (!subOpen && !matchMedia('(orientation: portrait)').matches) {
      if (!auto && now - lastInput > IDLE_MS) setAuto(true);   // никто не касался — играет авто-игра
      const k = auto ? AUTO_SPEED : 1;
      if (phase === 'photo') { updatePhoto(dt); updateCam(dt); updateOps(dt); }
      else if (fanHalt) { updateHalt(dt * k); updateCam(dt * k); updateOps(dt * k); }
      else { update(dt * k); if (phase === 'play') updateRef(dt * k); updateAmbient(dt * k); updateCam(dt * k); updateOps(dt * k); }
    }
    // скорость и таймер удара для выбора позы спрайта
    teams.forEach(team => team.forEach(p => {
      p.spd = Math.hypot(p.x - p.px, p.y - p.py) / Math.max(dt, .001);
      p.px = p.x; p.py = p.y;
      p.kickT = Math.max(0, p.kickT - dt);
    }));
    if (ref) { ref.spd = Math.hypot(ref.x - ref.px, ref.y - ref.py) / Math.max(dt, .001); ref.px = ref.x; ref.py = ref.y; }
    fans.concat(stewards, photogs).forEach(q => { q.spd = Math.hypot(q.x - q.px, q.y - q.py) / Math.max(dt, .001); q.px = q.x; q.py = q.y; });
    if (net && net.role === 'host') netSendState(now);
    if (running) { draw(); raf = requestAnimationFrame(frame); }
  }

  function start(el, config) {
    stop();
    cfg = config; running = true; keys = {}; joy = { x: 0, y: 0 }; joyId = null;
    net = cfg.net || null; FLIP = !!(net && net.role === 'guest'); ctrl2 = null; if (net) netWire();
    auto = false; autoCd = 0; lastInput = performance.now();
    grabLock = 0; shootBuf = null; passDir = null; aim = null;
    passPulse = false; slidePulse = false; switchPulse = false;
    setField(cfg.n || 11);
    const a = makeTeam(cfg.mySquad, 0, tacticMods(cfg.tactic, cfg.coach)), b = makeTeam(cfg.oppSquad, 1, null);
    const n = cfg.n || 11;
    teams = [a.slice(0, n), b.slice(0, n)];
    benches = n === 11 ? [a.slice(11).filter(p => !p.inj), b.slice(11).filter(p => !p.inj)] : [[], []];
    injuries = [];
    subsUsed = [0, 0]; SUBLOG = []; half = 1; brk = null; subOpen = false; subPick = null;
    score = { me: 0, cpu: 0 };
    phase = 'play'; photoT = 0; photoHold = 0; finishing = false; fans = []; stewards = []; photogs = []; initOps(); fanHalt = false; nextFan = !STREET && Math.random() < .3 ? rnd(12, 70) : Infinity; nextPhotog = STREET ? Infinity : rnd(3, 8);
    timeLeft = halfLen(); kickCd = 0; cpuCd = [0, 0]; tackleCd = [0, 0]; flash = 0; pen = null;
    fk = null; thr = null; lastTeam = 0; switchCd = 0;
    drill = cfg.drill ? { kind: cfg.drill, pts: 0, now: 0, seq: 0, tGate: 0, lastShotT: -99, pass: null, assist: null, resetAt: 0, px: undefined, penAt: cfg.drill === 'shot' ? 12 : undefined } : null;
    coachP = null;
    if (net) nextFan = Infinity;
    if (drill) {
      nextFan = Infinity; nextPhotog = Infinity;
      const lk = teams[1][1] || teams[1][0];
      coachP = { x: W / 2, y: -14, ax: 1, ay: 0, down: 0, slide: 0, kickT: 0, spd: 0, num: '', label: cfg.coachName || 'Coach', skin: lk.skin, hair: lk.hair, afro: false, hs: 'short', side: 0 };
    }
    kickoff();

    const tx = T[cfg.lang];
    el.innerHTML = `
      <div class="m-screen">
        <canvas id="pitch" width="${VW * RES}" height="${VH * RES}"></canvas>
        <div class="m-hud"><span id="hTime"></span><span id="hScore"></span></div>
        <button class="m-top-btn m-sub-btn" id="subBtn">${tx.sub}</button>
        <button class="m-top-btn m-auto-btn" id="autoBtn">${tx.auto}</button>
        <button class="m-top-btn m-fs" id="fsBtn">⛶</button>
        <button class="m-top-btn m-exit" id="exitBtn">${tx.exit}</button>
        <button class="m-top-btn m-skip" id="skipBtn">${tx.next}</button>
        <div class="m-sub-panel" id="subPanel"></div>
        <div class="m-joy" id="joyZone"><div class="joy-base" id="joyBase"></div><div class="joy-knob" id="joyKnob"></div></div>
        <div class="m-btns">
          <button class="round b-sw" id="btnSwitch">${tx.switchP}</button>
          <button class="round b-sp" id="btnSprint">${tx.sprint}</button>
          <button class="round b-sl" id="btnSlide">${tx.slide}</button>
          <button class="round b-pa" id="btnPass">${tx.pass}</button>
          <button class="round big b-sh" id="btnShoot">⚽</button>
        </div>
      </div>
      <div class="rotate">${tx.rotate}</div>`;

    layApply(el);
    c = el.querySelector('#pitch').getContext('2d');
    c.imageSmoothingEnabled = true;

    el.querySelector('#skipBtn').onclick = () => finish();
    if (cfg.lockPid) { el.querySelector('#subBtn').style.display = 'none'; el.querySelector('#autoBtn').style.display = 'none'; }
    if (cfg.drill || net) el.querySelector('#skipBtn').style.display = 'none';
    if (net) { el.querySelector('#subBtn').style.display = 'none'; el.querySelector('#autoBtn').style.display = 'none'; }
    el.querySelector('#exitBtn').onclick = () => { stop(); if (cfg.net) { netLeave(); go('net'); return; } go(cfg.drill ? 'heroTrain' : cfg.quick ? 'quick' : 'hub'); };
    el.querySelector('#subBtn').onclick = () => { if (!pen) openSub(); };
    el.querySelector('#autoBtn').onclick = () => setAuto(!auto);
    el.querySelector('#fsBtn').onclick = () => {
      const d = document.documentElement;
      if (d.requestFullscreen) d.requestFullscreen().catch(() => {});
    };

    // джойстик: плавающий, появляется там, где касается палец
    const zone = el.querySelector('#joyZone');
    const base = el.querySelector('#joyBase'), knob = el.querySelector('#joyKnob');
    const show = (x, y) => {
      base.style.display = knob.style.display = 'block';
      base.style.left = knob.style.left = x + 'px';
      base.style.top = knob.style.top = y + 'px';
    };
    const hide = () => {
      base.style.display = knob.style.display = 'none';
      joy = { x: 0, y: 0 }; joyId = null;
    };
    zone.addEventListener('pointerdown', e => {
      inputNow();
      joyId = e.pointerId;
      const r = zone.getBoundingClientRect();
      ox = e.clientX; oy = e.clientY;
      show(ox - r.left, oy - r.top);
      zone.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== joyId) return;
      const dx = e.clientX - ox, dy = e.clientY - oy, d = Math.hypot(dx, dy) || 1;
      const m = Math.min(d, 50), r = zone.getBoundingClientRect();
      joy = { x: dx / d * m / 50, y: dy / d * m / 50 };
      knob.style.left = (ox - r.left + dx / d * m) + 'px';
      knob.style.top = (oy - r.top + dy / d * m) + 'px';
    });
    ['pointerup', 'pointercancel'].forEach(ev => zone.addEventListener(ev, e => { if (e.pointerId === joyId) hide(); }));

    // кнопки удара, спринта, паса, подката и смены игрока
    const hold = (sel, key) => {
      const b = el.querySelector(sel);
      b.addEventListener('pointerdown', e => { inputNow(); keys[key] = true; e.preventDefault(); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[key] = false; }));
    };
    // удар и пас как атака в Brawl Stars: тап — авто-направление, потянул и отпустил — бьёшь/пасуешь туда, пока идёшь стиком
    const aimBtn = (sel, kind) => {
      const b = el.querySelector(sel); let id = null, ox = 0, oy = 0, t0 = 0, pts = [], ring = 0;
      const arrow = kind === 'shoot' ? aimArrow(el, b) : null;
      const vec = e => { const dx = e.clientX - ox, dy = e.clientY - oy, d = Math.hypot(dx, dy); return d > 14 ? { x: (FLIP ? -dx : dx) / d, y: dy / d } : null; };
      const paintRing = () => { b.style.background = 'conic-gradient(#e0b000 ' + Math.round(Math.min(1, (performance.now() - t0) / SHOT_FULL_MS) * 100) + '%, rgba(46,139,62,.85) 0)'; };
      b.addEventListener('pointerdown', e => {
        inputNow(); id = e.pointerId; ox = e.clientX; oy = e.clientY; t0 = performance.now(); pts = [{ x: ox, y: oy, t: t0 }];
        aim = { kind, dir: null }; b.setPointerCapture(id); e.preventDefault();
        if (kind === 'shoot') { paintRing(); ring = setInterval(paintRing, 40); }
      });
      b.addEventListener('pointermove', e => {
        if (e.pointerId !== id || !aim) return;
        aim.dir = vec(e);
        pts.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (pts.length > 12) pts.shift();
        if (arrow) arrow(aim.dir, e.clientX - ox, e.clientY - oy);
      });
      ['pointerup', 'pointercancel'].forEach(ev => b.addEventListener(ev, e => {
        if (e.pointerId !== id) return;
        id = null; const dir = e.type === 'pointerup' ? vec(e) : null; aim = null;
        clearInterval(ring); ring = 0; if (kind === 'shoot') b.style.background = ''; if (arrow) arrow(null);
        if (e.type === 'pointercancel') return;
        if (kind === 'shoot') {
          const now = performance.now(), c = Math.min(1, (now - t0) / SHOT_FULL_MS);   // c — сила от удержания
          const recent = pts.filter(q => now - q.t <= 120);
          let s = 0, spin = 0;                       // s — скорость замаха, spin — подкрутка
          if (recent.length >= 2) {
            const a = recent[0], z = recent[recent.length - 1];
            const sx = z.x - a.x, sy = z.y - a.y, len = Math.hypot(sx, sy), dt = Math.max(.02, (z.t - a.t) / 1000);
            s = len / dt / SWING_FULL;
            const rx = e.clientX - ox, ry = e.clientY - oy;   // направление удара на экране
            if (Math.hypot(rx, ry) > 30 && len > 30) spin = Math.sign(rx * sy - ry * sx) * (FLIP ? -1 : 1) * (1 - Math.min(1, s)) * SPIN_MAX;
          }
          shootBuf = { dir, t: .25, c, s, spin };
        } else { passPulse = true; passDir = dir; }
      }));
    };
    aimBtn('#btnShoot', 'shoot');
    aimBtn('#btnPass', 'pass');
    hold('#btnSprint', 'Sprint');
    el.querySelector('#btnSlide').addEventListener('pointerdown', e => { inputNow(); slidePulse = true; e.preventDefault(); });
    el.querySelector('#btnSwitch').addEventListener('pointerdown', e => { inputNow(); switchPulse = true; e.preventDefault(); });

    addEventListener('keydown', onKey);
    addEventListener('keyup', onKeyUp);
    el.addEventListener('pointerdown', () => inputNow(), true);   // любое касание экрана — игрок активен
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  // команды тестировщика: доступны только через скрытое меню
  return { start, stop, dbg: {
    spawnFan: () => { if (phase === 'play' && !fans.length) spawnFan(); },
    endNow: () => { timeLeft = 0.01; },
    drillNow: t => { if (drill) drill.now = t; },
    drillState: () => ({ pen: !!pen, pts: drill && drill.pts, now: drill && Math.round(drill.now), penAt: drill && drill.penAt }),
    state: () => ({ phase, half, subsUsed, t0: teams[0].map(p => p.num + p.label), t1: teams[1].map(p => p.num + p.label), b0: benches[0].map(p => p.num + p.label), b1: benches[1].map(p => p.num + p.label), log: SUBLOG.slice(), brk, timeLeft: Math.round(timeLeft) })
  } };
})();

</script>
<script>
// ===== Карьера тренера: создаёшь тренера, клубы присылают предложения или ты договариваешься сам =====
const tc = (ru, kz) => L() === 'kz' ? kz : ru;
// ===== раскладка кнопок в матче: положение, размер и прозрачность — настраиваются и сохраняются на устройстве =====
const LAY_REF = { w: 844, h: 390 };                  // опорный размер экрана: доли считаются от него
const LAY_BTN = { sw: 'btnSwitch', sp: 'btnSprint', sl: 'btnSlide', pa: 'btnPass', sh: 'btnShoot', sub: 'subBtn', auto: 'autoBtn' };
const LAY_W = { sw: 84, sp: 84, sl: 84, pa: 84, sh: 108, sub: 70, auto: 70 };          // ширина по умолчанию, для зеркального режима
const LAY_LABEL = { sw: 'Смена', sp: 'Спринт', sl: 'Подкат', pa: 'Пас', sh: '⚽', sub: 'Замена', auto: 'Авто' };
function layDefaults() {                              // стандартная раскладка; при «джойстик слева» зеркальна
  const left = ctlSide() === 'left';
  const px = { sw: [626, 172], sp: [732, 172], sl: [532, 290], pa: [626, 290], sh: [720, 266], sub: [8, 8], auto: [96, 8] };
  const d = {};
  Object.keys(px).forEach(k => {
    const x = left ? LAY_REF.w - LAY_W[k] - px[k][0] : px[k][0];
    d[k] = { x: x / LAY_REF.w, y: px[k][1] / LAY_REF.h, s: 1, o: 1 };
  });
  d.js = { s: 1, o: 1 };
  return d;
}
function layLoad() {
  const d = layDefaults();
  try {
    const s = JSON.parse(localStorage.getItem('steppe-layout') || 'null');
    if (s) Object.keys(d).forEach(k => { if (s[k]) Object.assign(d[k], s[k]); });
  } catch (e) {}
  return d;
}
function layApply(el) {                               // применяем раскладку к кнопкам матча
  const L = layLoad();
  Object.keys(LAY_BTN).forEach(k => {
    const n = el.querySelector('#' + LAY_BTN[k]); if (!n) return;
    const v = L[k];
    n.style.left = (v.x * 100).toFixed(2) + '%'; n.style.top = (v.y * 100).toFixed(2) + '%';
    n.style.right = 'auto'; n.style.bottom = 'auto';
    n.style.transform = `scale(${v.s})`; n.style.opacity = v.o;

}
function layoutView(el) {                             // редактор раскладки
  const cur = layLoad(), k = { };

  el.innerHTML = `<h2>${tc('Раскладка кнопок', 'Түймелер орналасуы')}</h2>

    </div></div>
    <section class="card lay-ctl" id="layCtl"></section>
    <div class="opts">
      <button class="big" id="laySave">${tc('Сохранить', 'Сақтау')}</button>
      <button class="big" id="layReset">${tc('Вернуть стандартную', 'Стандартқа қайтару')}</button>
      <button class="ghost big" onclick="go('settings')">${tc('Назад', 'Артқа')}</button>

  const fit = () => { kk = Math.min(1, wrap.clientWidth / LAY_REF.w); prev.style.transform = `scale(${kk})`; wrap.style.height = (LAY_REF.h * kk) + 'px'; };
  const items = () => [...prev.querySelectorAll('.lay-it')];

    items().forEach(n => {
      const v = cur[n.dataset.k];
      n.style.left = (v.x * LAY_REF.w) + 'px'; n.style.top = (v.y * LAY_REF.h) + 'px';
      n.style.transform = `scale(${v.s})`; n.style.transformOrigin = '0 0'; n.style.opacity = v.o;
      n.style.right = 'auto'; n.style.bottom = 'auto';

    const left = ctlSide() === 'left';
    jz.style.left = left ? '50%' : '0'; jz.style.opacity = L.o;
    jz.querySelector('.lay-base').style.transform = `translate(-50%,-50%) scale(${L.s})`;
    ctl.innerHTML = sel === 'js'
      ? `<h3>${tc('Джойстик', 'Джойстик')}</h3>${sliders('js')}`
      : `<h3>${tc('Кнопка', 'Түйме')}: ${LAY_LABEL[sel]}</h3>${sliders(sel)}`;
    ctl.querySelector('#laySz').oninput = e => { cur[sel].s = +e.target.value; clampAll(); paint(); };
    ctl.querySelector('#layOp').oninput = e => { cur[sel].o = +e.target.value; paint(); };
  };
  const sliders = key => `<label>${tc('Размер', 'Өлшемі')}: <input type="range" id="laySz" min="0.6" max="1.6" step="0.05" value="${cur[key].s}"></label>

  const visW = key => (items().find(n => n.dataset.k === key) || {}).offsetWidth * cur[key].s || 0;
  const visH = key => (items().find(n => n.dataset.k === key) || {}).offsetHeight * cur[key].s || 0;

  items().forEach(n => {
    const key = n.dataset.k;
    n.addEventListener('pointerdown', e => {
      sel = key; n.setPointerCapture(e.pointerId);

      k.oy = (e.clientY - r.top) / kk - cur[key].y * LAY_REF.h;
      k.key = key; k.r = r; paint(); e.preventDefault();
    });
    n.addEventListener('pointermove', e => {
      if (k.key !== key || !n.hasPointerCapture(e.pointerId)) return;
      const px = (e.clientX - k.r.left) / kk - k.ox, py = (e.clientY - k.r.top) / kk - k.oy;
      cur[key].x = Math.min(Math.max(0, px), LAY_REF.w - visW(key)) / LAY_REF.w;
      cur[key].y = Math.min(Math.max(0, py), LAY_REF.h - visH(key)) / LAY_REF.h;
      paint();
    });
    n.addEventListener('click', () => { sel = key; paint(); });
    const end = () => { k.key = null; };
    n.addEventListener('pointerup', end); n.addEventListener('pointercancel', end);
  });
  el.querySelector('#laySave').onclick = () => { clampAll(); save(); go('settings'); };
  el.querySelector('#layReset').onclick = () => { Object.assign(cur, layDefaults()); paint(); };
  fit(); clampAll(); paint();

}
