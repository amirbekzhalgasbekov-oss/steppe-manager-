<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Steppe Manager — football management and arcade game">
  <title>Steppe Manager</title>
  <style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f1a14;color:#eef;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#14241b;border-bottom:3px solid #2e8b3e}
main{padding:16px;max-width:900px;margin:auto}
h1,h2{text-align:center;font-family:monospace;letter-spacing:1px}
button{font:inherit;background:#2e8b3e;color:#fff;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;margin:4px}
button:hover{filter:brightness(1.1)}
button.big{width:100%;font-size:18px;padding:16px}
button.ghost{background:#2a3a30}
.card{background:#16281e;border-left:6px solid var(--c,#2e8b3e);padding:12px;border-radius:8px;margin:10px 0}
button.card{display:block;text-align:left;width:100%;color:#eef}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pcard{position:relative;background:#16281e;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;text-align:center}
canvas.fig{width:48px;height:72px;image-rendering:auto;align-self:center;background:#22382b;border-radius:6px;flex:none}
.frow{display:flex;gap:10px;align-items:center}
canvas.stadium{width:100%;max-width:960px;image-rendering:pixelated;display:block;margin:auto;border:3px solid #000}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:6px;border-bottom:1px solid #2a3a30;text-align:center}
.tbl tr.me{background:#244d33}
.hud{display:flex;justify-content:space-between;font-family:monospace;font-size:18px;max-width:960px;margin:8px auto}
.hint{text-align:center;opacity:.7;font-size:14px}
.score{font-size:44px;text-align:center;font-family:monospace}
.fx{font-size:18px;text-align:center}
small{display:block;opacity:.8}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}

/* ===== матч: во весь экран, поле на всю площадь, управление поверх поля ===== */
.m-screen{position:fixed;inset:0;background:#000;z-index:10;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
.m-screen canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.m-hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:16px;font-family:monospace;font-size:15px;color:#fff;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:6px;white-space:nowrap;pointer-events:none}
.m-top-btn{position:absolute;top:8px;z-index:6;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:6px;padding:6px 10px;margin:0;font-size:14px}
.m-exit{right:8px}
.m-fs{right:84px}
.m-joy{position:absolute;left:0;top:0;bottom:0;width:50%;touch-action:none}
.m-btns{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:84px 84px 108px;grid-template-rows:84px 108px;gap:10px;align-items:end;justify-items:center}
.m-btns .b-sw{grid-column:2;grid-row:1}
.m-btns .b-sp{grid-column:3;grid-row:1}
.m-btns .b-sl{grid-column:1;grid-row:2}
.m-btns .b-pa{grid-column:2;grid-row:2}
.m-btns .b-sh{grid-column:3;grid-row:2}
.joy-base,.joy-knob{position:absolute;border-radius:50%;display:none;transform:translate(-50%,-50%);pointer-events:none}
.joy-base{width:130px;height:130px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
.joy-knob{width:60px;height:60px;background:rgba(255,255,255,.45)}
.round{width:84px;height:84px;border-radius:50%;font-size:20px;margin:0;background:rgba(46,139,62,.85)}
.round.big{width:108px;height:108px;font-size:32px}
.rotate{display:none}
.m-sub-btn{left:8px;right:auto}
.m-auto-btn{left:96px;right:auto}
.m-auto-btn.on{background:#2e8b3e}
.m-sub-panel{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;overflow:auto;color:#fff;text-align:center}
.m-sub-panel button{width:min(340px,80vw);margin:0;padding:10px;font-size:15px}
.m-sub-panel h3{margin:0;font-family:monospace}
.m-sub-panel p{margin:4px 0}
@media (orientation: portrait){
  .rotate{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0f1a14;z-index:20;font-size:22px}
}

.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #2a3a30}
.prow>div{flex:1 1 220px}
.prow input{width:90px;padding:6px;border-radius:6px;border:0}
details summary{cursor:pointer;padding:6px 0}

/* ===== карьера: сетка меню, вкладки, полоски, почта ===== */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.tabs button{margin:0}
.tabs button.on{background:#e0b000;color:#111}
button:disabled{opacity:.45;cursor:default;filter:none}
select{font:inherit;padding:6px;border-radius:6px;border:0;margin:4px 0;max-width:100%}
label{display:block;margin:6px 0}
.bar{height:10px;background:#2a3a30;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#2e8b3e}
.bad{color:#ff8a80}
details.mail{background:#16281e;border-radius:8px;padding:8px 12px;margin:6px 0;border-left:4px solid #2a3a30}
details.mail.unread{border-left-color:#e0b000}
details.mail summary{font-weight:normal}
details.mail.unread summary{font-weight:bold}
details.mail p{margin:8px 0 0}

.save-btn{background:#e0b000;color:#111;margin:0 6px 0 0;padding:6px 10px;font-weight:bold}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px;margin:8px 0}
label.pick{display:flex;gap:6px;align-items:center;margin:0;font-size:14px;cursor:pointer}
label.pick input{width:18px;height:18px}

.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.ctrl input{width:130px;padding:6px;border-radius:6px;border:0}
.ok{color:#8fe39d}

.m-skip{display:none;top:auto;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 26px;font-size:16px;background:rgba(46,139,62,.92)}
.m-photo .m-skip{display:block}
.m-photo .m-btns,.m-photo .m-joy,.m-photo .m-sub-btn,.m-photo .m-auto-btn{display:none}

/* ===== оформление меню: ночное поле, мел, золото степи ===== */
:root{--grass:#2e8b3e;--night:#0b1510;--chalk:#f2efe6;--wheat:#e0b000}
body{background:radial-gradient(1200px 600px at 50% -10%,#173424 0%,var(--night) 70%) fixed;color:var(--chalk)}
h1,h2{font-family:Impact,'Arial Narrow Bold','Arial Black',system-ui,sans-serif;font-weight:400;letter-spacing:1.5px}
button{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
button:active{transform:translateY(1px) scale(.99)}
button:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.top{background:rgba(11,21,16,.85);backdrop-filter:blur(6px);border-bottom:2px solid var(--grass)}
.v-start .top{display:none}

/* главное меню */
.hero{position:relative;overflow:hidden;border-radius:18px;margin:8px 0 16px;padding:40px 18px 28px;
  background:repeating-linear-gradient(90deg,#14301f 0 56px,#123a22 56px 112px);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 2px rgba(242,239,230,.28)}
.hero::before{content:"";position:absolute;inset:14px;border:2px solid rgba(242,239,230,.28);border-radius:8px;pointer-events:none}
.hero::after{content:"";position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);
  border:2px solid rgba(242,239,230,.18);border-radius:50%;pointer-events:none}
.hero{min-height:min(80vh,640px);display:flex;align-items:center}
.hero-in{position:relative;z-index:1;width:100%;max-width:460px;margin:auto}
.hero h1{font-size:clamp(42px,11vw,72px);line-height:1;margin:6px 0 4px;color:var(--chalk);text-shadow:0 3px 0 #0a2414,0 10px 24px rgba(0,0,0,.5)}
.hero .ball{display:block;text-align:center;font-size:44px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.lang{position:absolute;top:22px;right:24px;z-index:2;margin:0;padding:6px 12px;font-size:14px;background:rgba(11,21,16,.6);border:1px solid rgba(242,239,230,.3)}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;margin:0;padding:14px 16px;font-size:19px;font-weight:700;text-align:left;
  border-radius:14px;color:var(--chalk);background:rgba(11,21,16,.78);border:1px solid rgba(242,239,230,.22);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.menu button .ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:22px;background:rgba(242,239,230,.12)}
.menu button.primary{background:var(--wheat);color:#1a1400;border-color:#ffd84d;box-shadow:0 6px 0 #8a6d00}
.menu button.primary .ic{background:rgba(26,20,0,.15)}
.menu button.green{background:var(--grass);border-color:#57c06a;box-shadow:0 6px 0 #1b5226}
.menu button.green .ic{background:rgba(255,255,255,.18)}
.menu button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.menu button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}

/* меню карьеры: плитки */
nav.grid3 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;margin:0;font-weight:600;
  background:linear-gradient(180deg,#1d3a29,#16281e);border:1px solid rgba(242,239,230,.14);border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
nav.grid3 button .ic{font-size:26px;line-height:1}
nav.grid3 button:hover{border-color:var(--wheat);transform:translateY(-2px)}
nav.grid3 button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}

/* выбор клуба и общие карточки */
button.card{transition:transform .12s ease,box-shadow .12s ease;border:1px solid rgba(242,239,230,.1);border-left:6px solid var(--c,#2e8b3e);box-shadow:0 4px 0 rgba(0,0,0,.3)}
button.card:hover{transform:translateX(4px);filter:none;box-shadow:0 4px 0 rgba(0,0,0,.3),-4px 0 0 var(--c,#2e8b3e)}
button.card b{font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

canvas.portrait{width:56px;height:56px;image-rendering:pixelated;background:#1a2a20;border-radius:8px;flex:none}
.inj-x{position:absolute;top:4px;right:8px;color:#ff4d4d;font-size:22px;font-weight:bold;line-height:1}
.pitch{position:relative;width:100%;max-width:420px;aspect-ratio:4/5;margin:8px auto;background:#3c9a4a;border:2px solid #e8f5e9;border-radius:8px}
.pitch:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.6)}
.slot{position:absolute;transform:translate(-50%,-50%);width:74px;background:#16281e;border:2px solid #2b4a38;border-radius:8px;padding:3px;text-align:center;font-size:11px;color:#fff;cursor:pointer}
.slot.sel{border-color:#ffd200;box-shadow:0 0 0 2px #ffd200}
.slot canvas.fig{width:32px;height:48px}
.slot .inj-x{font-size:16px;top:2px;right:4px}
.bench-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-width:520px;margin:8px auto}
.bench-row .slot{position:relative;transform:none;width:auto}
.stats-wrap{overflow-x:auto;max-width:100%;margin-top:10px}
table.stats{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;color:#e8efe9}
table.stats th,table.stats td{padding:4px 6px;border-bottom:1px solid #2a3a30;text-align:center}
table.stats td.nm{text-align:left}
table.stats tr.bench td{opacity:.75}

/* ===== главное меню: сцена матча, кнопки справа (как в PC-менеджерах) ===== */
.hero{display:flex;min-height:min(92vh,720px);padding:0;margin:0;border-radius:18px;background:#0b1510;overflow:hidden;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.hero::before,.hero::after{display:none}
.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.scene svg{width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,21,16,.15) 0%,rgba(11,21,16,.55) 55%,rgba(11,21,16,.95) 100%)}
@media (min-width:720px){.scene::after{background:linear-gradient(90deg,rgba(11,21,16,.2) 0%,rgba(11,21,16,.55) 45%,rgba(11,21,16,.94) 100%)}}
.hero-in{position:relative;z-index:1;width:100%;max-width:none;margin:0;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:28px 20px 24px}
.hero .title-block{padding-top:24px}
.hero .ball{display:block;text-align:left;font-size:36px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.hero h1{text-align:left;font-size:clamp(44px,12vw,84px);margin:4px 0 0}
.hero .tagline{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--wheat);margin:10px 0 0;font-weight:700}
.hero .menu{margin:0 0 0 auto;width:min(340px,100%);gap:10px}
.lang{top:18px;right:18px}
.opts{display:grid;gap:12px;margin-top:20px}
button.danger{background:#7a2a20;border:1px solid #c0503c}
.help{line-height:1.6;margin-top:18px}
.club-banner{background:repeating-linear-gradient(90deg,#14301f 0 56px,#123a22 56px 112px);border-left-width:6px;padding:18px}
/* раскладка управления: джойстик и кнопки слева (для левшей) */
body.ctl-left .m-joy{left:auto;right:0}
body.ctl-left .m-btns{right:auto;left:16px}
body.ctl-left .m-sub-btn{left:auto;right:8px}
body.ctl-left .m-auto-btn{left:auto;right:96px}
/* создание своего клуба */
.field{display:grid;gap:6px;margin-top:14px}
.field > span{font-size:14px;opacity:.85}
.field input[type=text],.field select{width:100%;padding:12px;font:inherit;font-size:16px;border-radius:10px;border:1px solid rgba(242,239,230,.3);background:#0b1510;color:var(--chalk)}
.field input[type=color]{width:64px;height:44px;border:0;padding:0;background:none;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;padding:0;margin:0;border-radius:50%;border:2px solid rgba(242,239,230,.5)}
.club-preview{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px;border-radius:14px;background:rgba(11,21,16,.7);border:1px solid rgba(242,239,230,.2)}
.club-preview canvas.portrait{width:96px;height:96px;image-rendering:pixelated;background:#14301f;border-radius:10px}
</style>
</head>

// Расписание: [домашний, гостевой] — индексы в CLUBS. Двухкруговой турнир 8 клубов: 56 матчей,
// по 14 у каждого клуба (7 домашних и 7 выездных). Каждый элемент — один матч; матч, где не играет человек, моделируется кнопкой «Сыграть тур».
const FIXTURES = (() => {
  const n = CLUBS.length, rounds = [], ids = CLUBS.map((_, i) => i);
  for (let r = 0; r < n - 1; r++) {
    const round = [];
    for (let i = 0; i < n / 2; i++) {
      const x = ids[i], y = ids[n - 1 - i];
      round.push((r + i) % 2 ? [x, y] : [y, x]);
    }
    rounds.push(round);
    ids.splice(1, 0, ids.pop());           // вращение: первый клуб стоит на месте
  }
  const back = rounds.map(rd => rd.map(([h, a]) => [a, h]));
  return rounds.concat(back).flat();
})();

// ===== Вымышленные игроки (без реальных имён и лиц) =====
const FIRST = ['Айдар', 'Нурлан', 'Данияр', 'Темирлан', 'Ерлан', 'Азамат', 'Руслан', 'Бауыржан', 'Марат', 'Алихан', 'Санжар'];
const LAST  = ['Омаров', 'Сейтов', 'Карим', 'Ахметов', 'Бекмуратов', 'Жумабаев', 'Тулегенов', 'Касымов', 'Есенов', 'Нуржанов', 'Ибраев'];
const POS = ['GK', 'DF', 'DF', 'DF', 'DF', 'MF', 'MF', 'MF', 'FW', 'FW', 'FW'];
const BIAS = {
  GK: { pace: -8, shot: -15, pass: -2, def: 8 },
  DF: { pace: -2, shot: -8,  pass: -2, def: 6 },
  MF: { pace: 0,  shot: -2,  pass: 6,  def: 0 },
  FW: { pace: 4,  shot: 6,   pass: -3, def: -8 }
};

function clamp(v, a = 1, b = 99) { return Math.max(a, Math.min(b, v)); }
function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
// общий рейтинг зависит от амплуа: у вратаря важнее защита и передача, у нападающего — удар и скорость
const OVR_W = { GK: { pace: .1, shot: .05, pass: .25, def: .6 }, DF: { pace: .2, shot: .05, pass: .2, def: .55 },
                MF: { pace: .2, shot: .2, pass: .35, def: .25 }, FW: { pace: .3, shot: .45, pass: .15, def: .1 } };
function ovrOf(p) {
  const w = OVR_W[p.pos] || { pace: .25, shot: .25, pass: .25, def: .25 };
  return Math.round(p.pace * w.pace + p.shot * w.shot + p.pass * w.pass + p.def * w.def);
}

function makeFictionalSquad(club, idx) {
  const r = seeded(idx * 977 + club.ovr * 13 + 7);
  return POS.map((pos, i) => {
    const base = club.ovr + Math.round(r() * 8 - 4);
    const st = k => clamp(Math.round(base + BIAS[pos][k] + r() * 8 - 4));
    const p = {
      num: i + 1,
      name: FIRST[(i * 3 + idx) % FIRST.length] + ' ' + LAST[(i * 5 + idx * 2) % LAST.length],
      pos, pace: st('pace'), shot: st('shot'), pass: st('pass'), def: st('def')
    };
    p.ovr = ovrOf(p);
    return p;
  });
}

  S.budget -= staffSalary() + wageCost();
}

// автоуправление: врач лечит, психолог поддерживает, тренер тренирует — без участия игрока
function autoStaffWeek() {
  const doc = staffLvl('doctor'), psy = staffLvl('psych'), co = staffLvl('coach');
  const sq = S.squads[S.me];
  if (doc) sq.forEach(p => heal(p, 3 + doc));
  if (psy) sq.forEach(p => { p.mor = Math.min(100, p.mor + 3 + psy); });
  if (co) sq.forEach(p => {
    if (Math.random() < co / 5) { ['pace', 'shot', 'pass', 'def'].forEach(k => { p[k] = clamp(p[k] + 1); }); p.ovr = ovrOf(p); }
  });
}

// ----- письма игроков раз в неделю: зависят от морали и места в составе -----
function playerMails() {
  if (Math.random() > 0.5) return;
  const all = S.squads[S.me];
  const low = all.slice(0, 11).filter(p => p.mor < 45);
  const bench = all.slice(11).filter(p => p.inj === 0);
  const hi = all.slice(0, 11).filter(p => p.mor > 90);
  if (low.length) {
    const p = pick(low);
    mail(bi(p.name, p.name), bi('Хочу играть', 'Ойнағым келеді'),
      bi('Тренер, моё настроение падает. Мне нужна игровая практика или поддержка психолога.', 'Жаттықтырушы, көңіл-күйім түсіп барады. Маған ойын тәжірибесі немесе психолог қолдауы керек.'));
  } else if (bench.length) {
    const p = pick(bench);
    mail(bi(p.name, p.name), bi('Вопрос о месте в составе', 'Құрамдағы орын туралы сұрақ'),
      bi('Я готов выйти на поле в любой момент. Буду признателен за шанс в ближайших матчах.', 'Мен кез келген уақытта алаңға шығуға дайынмын. Жақын матчтарда мүмкіндік берсеңіз, рахмет болады.'));
  } else if (hi.length) {
    const p = pick(hi);
    mail(bi(p.name, p.name), bi('Отличная форма', 'Тамаша форма'),
      bi('Команда в отличной форме, мы готовы к следующему матчу!', 'Команда тамаша формада, келесі матчқа дайынбыз!'));
  }
}

// еженедельный цикл: зарплаты, спонсоры, PR, скаут, почта
function weekly() {
  paySalaries();
  S.budget += sponsorIncome();
  S.pr = Math.min(100, S.pr + 0.3 + 0.3 * staffLvl('pr'));
  if (S.autoStaff) autoStaffWeek();
  const sc = staffLvl('scout');
  if (sc) {
    S.pool.push(randPlayer(pick(['MF', 'FW', 'DF', 'GK']), 56 + sc * 3));   // трансферный директор находит игрока
    S.pool = S.pool.slice(-12);
  }
  if (S.plan && S.plan !== 'none' && staffLvl('coach')) applyPlan(S.plan);
  playerMails();
  S.cands = genCands();
}

// ----- мораль и травмы после матча -----
// клуб после матча: победа +4, поражение −4 всем, кто выходил в старте
function moraleAfter(idA, gA, idB, gB) {
  const d = gA > gB ? [4, -4] : gA < gB ? [-4, 4] : [0, 0];
  [[idA, d[0]], [idB, d[1]]].forEach(([id, x]) => {
    S.squads[id].slice(0, 11).forEach(p => { p.mor = clamp(p.mor + x, 0, 100); });
  });
}

// травмы из матча: ХП падает, игрок выбывает на несколько недель; возвращает строки для экрана результата
function applyInjuries(list, oppId) {
  const names = [];
  list.forEach(r => {
    const clubId = r.side === 0 ? S.me : oppId;
    const p = S.squads[clubId].find(q => q.id === r.id);
    if (!p) return;
    p.hp = Math.max(20, p.hp - r.dmg);
    p.inj = r.days;
    p.injK = 'inj';
    if (r.side === 0) {
      names.push(`${p.name} (${r.days} ${t('days')})`);
      mail(bi('Медицинский центр', 'Медициналық орталық'), bi(`Травма: ${p.name}`, `Жарақат: ${p.name}`),
        bi(`Игрок выбыл на ${r.days} дн. ХП: ${Math.round(p.hp)}. Врач может ускорить лечение.`,
           `Ойыншы ${r.days} күнге шықпайды. ХП: ${Math.round(p.hp)}. Дәрігер емді жеделдете алады.`));
    }
  });
  return names;
}

// состав перед матчом: травмированных заменяем здоровыми запасными; ассистент ставит сильнейших
function prepareLineup(sq, isMe) {
  const fit = p => p.inj <= 0;
  for (let i = 0; i < 11; i++) {
    if (fit(sq[i])) continue;
    let j = sq.findIndex((q, k) => k >= 11 && fit(q) && q.pos === sq[i].pos);
    if (j < 0 && sq[i].pos !== 'GK') j = sq.findIndex((q, k) => k >= 11 && fit(q) && q.pos !== 'GK');
    if (j < 0 && sq[i].pos === 'GK') j = sq.findIndex((q, k) => k >= 11 && fit(q));   // нет здорового вратаря — в ворота встаёт полевой игрок
    if (j >= 0) [sq[i], sq[j]] = [sq[j], sq[i]];
  }
  if (isMe && staffLvl('assistant')) {
    for (let i = 1; i < 11; i++) {
      let best = -1;
      sq.forEach((q, k) => {
        if (k >= 11 && fit(q) && q.pos === sq[i].pos && q.ovr > sq[i].ovr + 2 && (best < 0 || q.ovr > sq[best].ovr)) best = k;
      });
      if (best >= 0) [sq[i], sq[best]] = [sq[best], sq[i]];
    }
  }
}

// тактика тренера: атака — больше удара и скорости, меньше защиты; защита — наоборот
function tacticMods(tactic, lvl) {
  if (!lvl || !tactic || tactic === 'balanced') return null;
  const k = 1.5 * lvl;
  return tactic === 'attack' ? { shot: k, pace: 0.4 * k, def: -k } : { def: k, pace: -0.4 * k, shot: -k };
}

// ----- взаимодействия со штатом (из состава) -----
// не больше 5 игроков в одной беседе
function limitPick(el) {
  const checked = document.querySelectorAll('.psel:checked');
  const hint = document.getElementById('talkHint');
  if (checked.length > 5) {
    el.checked = false;
    if (hint) hint.textContent = t('talkMax');
  } else if (hint) {
    hint.textContent = '';
  }
}
function act(kind) {
  if (kind === 'psych') {
    if (!staffLvl('psych')) return flashView('squad', t('needStaff'));
    const ids = Array.from(document.querySelectorAll('.psel:checked')).map(e => e.value).slice(0, 5);
    if (!ids.length) return flashView('squad', t('talkPick'));
    const cost = 1e7 * ids.length;
    if (S.budget < cost) return flashView('squad', t('noMoney'));
    S.budget -= cost;
    ids.forEach(id => {
      const p = S.squads[S.me].find(q => q.id === id);
      if (p) p.mor = Math.min(100, p.mor + 6 + 3 * staffLvl('psych'));
    });
    save(); return flashView('squad', t('supported'));
  }
  const sel = document.getElementById('ap');
  const p = sel && S.squads[S.me].find(q => q.id === sel.value);
  if (kind === 'doctor') {
    if (!staffLvl('doctor') || !p) return flashView('squad', t('needStaff'));
    if (!p.inj) return flashView('squad', t('noInjury'));
    if (S.budget < 2e7) return flashView('squad', t('noMoney'));
    S.budget -= 2e7;
    const d = staffLvl('doctor');
    heal(p, 3 + 2 * d);
    p.hp = Math.min(100, p.hp + 10 + 3 * d);
    save(); return flashView('squad', t('treated'));
  }
  if (kind === 'coach') return train('squad');
}

// ----- слоты сохранений: три ручных слота поверх автосохранения -----
function slotRead(n) { try { return JSON.parse(localStorage.getItem('steppe-slot-' + n)); } catch (e) { return null; } }
function slotSave(n) {
  try {
    localStorage.setItem('steppe-slot-' + n, JSON.stringify({
      meta: { club: nm(CLUBS[myIdx()]), round: S.round, day: S.day, at: new Date().toLocaleString('ru-RU') },
      data: S
    }));
    flashView('save', t('savedOk'));
  } catch (e) { flashView('save', t('saveErr')); }
}
function slotLoad(n) {
  const s = slotRead(n);
  if (!s || !s.data) return;
  S = s.data; migrate(); save();
  go('hub');
}
function slotDel(n) {
  try { localStorage.removeItem('steppe-slot-' + n); } catch (e) {}
  go('load');
}
function slotsHTML(saving) {
  return Array.from({ length: SLOTS }, (_, i) => i + 1).map(n => {
    const s = slotRead(n);
    const info = s && s.meta ? `${s.meta.club} · ${t('round')} ${s.meta.round + 1} · ${t('day')} ${s.meta.day} · ${s.meta.at}` : t('emptySlot');
    let btns = '';
    if (saving) btns = `<button onclick="slotSave(${n})">${t('saveHere')}</button>`;
    else if (s) btns = `<button onclick="slotLoad(${n})">${t('load')}</button><button class="ghost" onclick="slotDel(${n})">${t('del')}</button>`;
    return `<section class="card"><b>${t('slot')} ${n}</b><small>${info}</small>${btns}</section>`;
  }).join('');
}


// ===== Переговоры: клубы, агенты игроков, спонсоры и PR-менеджер отвечают письмами с задержкой =====
const REPLY_DAYS = { club: 1, staff: 2, sponsor: 2, pr: 2 };   // через сколько дней приходит ответ
const WAIT_DAYS = 3;                                             // сколько ждут ответа пользователя, прежде чем сделка срывается
const wageOf = p => Math.max(1e5, Math.round(worth(p) * 0.02 / 1e5) * 1e5);   // зарплата игрока в неделю
const demandOf = p => Math.max(1e5, Math.round(wageOf(p) * (p.m || 1) / 1e5) * 1e5);   // требование агента
const wageCost = () => S.squads[S.me].reduce((a, p) => a + (p.wage || 0), 0);
const negFor = id => (S.neg || []).find(n => !n.done && (n.pid === id || (n.cand && n.cand.id === id)));
const amountOf = el => Math.round(+(el && el.value));
const agentFrom = bi('Агент игрока', 'Ойыншының агенті');
const dealFrom = bi('Отдел трансферов', 'Трансфер бөлімі');
const sponsorFrom = bi('Отдел спонсорства', 'Демеушілер бөлімі');
const prFrom = bi('PR-менеджер', 'PR-менеджер');
const staffFrom = bi('Отдел кадров', 'Кадр бөлімі');

function startNeg(o, stage, delay) {
  o.id = newId(); o.stage = stage; o.ans = S.day + delay;
  S.neg.push(o); save();
  return o;
}
// письмо, привязанное к переговорам: если нужен ответ, в письме появятся кнопки
function letter(n, from, subj, body) {
  mail(from, subj, body);
  if (n) S.mail[0].nid = n.id;
}
const dealPlayer = n => (n.kind === 'free' ? S.pool.find(q => q.id === n.pid)
  : n.kind === 'sell' ? S.squads[S.me].find(q => q.id === n.pid)
  : S.squads[n.clubId].find(q => q.id === n.pid));

// ----- действия пользователя -----
function offerStaff(candId) {
  const c = S.cands.find(x => x.id === candId);
  const amount = amountOf(document.getElementById('so-st-' + candId));
  if (!c) return flashView('squad', t('needStaff'));
  if (!(amount > 0)) return flashView('squad', t('badSum'));
  S.cands = S.cands.filter(x => x.id !== candId);
  startNeg({ kind: 'staff', cand: c, amount, done: false }, 'club', REPLY_DAYS.staff);
  flashView('squad', t('offerSent').replace('{x}', REPLY_DAYS.staff));
}

// покупка у клуба: сначала клуб отвечает на сумму, затем агент игрока пришлёт требования к зарплате
function offerBuy(id, clubId) {
  const p = S.squads[clubId].find(q => q.id === id);
  const amount = amountOf(document.getElementById('bo-' + id));
  if (!p) return finNote(t('none'));
  if (!(amount > 0)) return finNote(t('badSum'));
  if (negFor(id)) return finNote(t('alreadyPending'));
  if (!canGive(clubId, id)) return finNote(t('cantGive'));
  startNeg({ kind: 'buy', pid: id, clubId, fee: amount, done: false }, 'club', REPLY_DAYS.club);
  finNote(t('offerSent').replace('{x}', REPLY_DAYS.club));
}

// свободный агент: клуба нет, сразу пишем агенту для переговоров о зарплате
function offerFree(id) {
  const p = S.pool.find(q => q.id === id);
  if (!p) return finNote(t('none'));
  if (negFor(id)) return finNote(t('alreadyPending'));
  startNeg({ kind: 'free', pid: id, clubId: 'pool', fee: 0, done: false }, 'askWage', 1);
  finNote(t('offerSent').replace('{x}', 1));
}

// продажа клубу: клуб ответит, согласен ли он на сумму
function offerSell(id, clubId) {
  const p = S.squads[S.me].find(q => q.id === id);
  const amount = amountOf(document.getElementById('so-' + id));
  if (!p) return finNote(t('none'));
  if (!(amount > 0)) return finNote(t('badSum'));
  if (negFor(id)) return finNote(t('alreadyPending'));
  if (!canGive(S.me, id)) return finNote(t('cantGive'));
  startNeg({ kind: 'sell', pid: id, clubId, fee: amount, done: false }, 'club', REPLY_DAYS.club);
  finNote(t('offerSent').replace('{x}', REPLY_DAYS.club));
}

// письмо спонсору с предложением сотрудничества
function proposeSponsor(id) {
  const sp = SPONSORS.find(s => s.id === id);
  if (!sp || S.sponsors.includes(id)) return;
  if (negFor(id)) return finNote(t('alreadyPending'));
  startNeg({ kind: 'sponsor', pid: id, done: false }, 'club', REPLY_DAYS.sponsor);
  finNote(t('offerSent').replace('{x}', REPLY_DAYS.sponsor));
}

// PR-кампания: оплачивается сразу, PR-менеджер присылает отчёт через 2 дня
function publicity(kind) {
  if (!staffLvl('pr')) return flashView('finance', t('needPRMgr'));
  const P = PUBLICITY[kind];
  if (S.budget < P.cost) return finNote(t('noMoney'));
  S.budget -= P.cost;
  startNeg({ kind: 'pr', gain: Math.round(P.gain * (1 + 0.25 * staffLvl('pr'))), label: P.label, done: false }, 'club', REPLY_DAYS.pr);
  finNote(t('offerSent').replace('{x}', REPLY_DAYS.pr));
}

// ответ пользователя на письмо: требования агента или условия спонсора
function respondNeg(nid, action) {
  const n = (S.neg || []).find(x => x.id === nid);
  if (!n || n.stage !== 'wait') return;
  if (n.kind === 'sponsor') {
    if (action === 'accept') {
      if (!S.sponsors.includes(n.pid)) S.sponsors.push(n.pid);
      letter(null, sponsorFrom, bi('Контракт подписан', 'Келісімшарт қол қойылды'), bi('Спонсорский договор вступил в силу.', 'Демеушілік келісімшарт күшіне енді.'));
    } else {
      letter(null, sponsorFrom, bi('Переговоры завершены', 'Келіссөздер аяқталды'), bi('Вы отказались от условий. Спонсор ждёт нового предложения.', 'Сіз шарттардан бас тарттыңыз. Демеуші жаңа ұсынысты күтеді.'));
    }
    n.done = true;
  } else if (action === 'decline') {
    n.done = true;
    letter(null, agentFrom, bi('Переговоры завершены', 'Келіссөздер аяқталды'), bi('Вы отказались от условий. Игрок уходит.', 'Сіз шарттардан бас тарттыңыз. Ойыншы кетеді.'));
  } else {
    const amt = action === 'accept' ? n.demand : amountOf(document.getElementById('nw-' + nid));
    if (!(amt > 0)) return;
    n.offer = amt;
    n.stage = 'decide';
    n.ans = S.day + 1;
  }
  S.neg = S.neg.filter(x => !x.done);
  save();
  go('mail');
}

// ----- автоматические шаги: по сроку ответа -----
function stepNeg(n) {
  if (n.stage === 'wait') {   // пользователь не ответил в срок
    n.done = true;
    letter(null, n.kind === 'sponsor' ? sponsorFrom : agentFrom, bi('Переговоры сорваны', 'Келіссөздер бұзылды'), bi('Срок ответа истёк.', 'Жауап беру мерзімі өтті.'));
    return;
  }
  if (n.kind === 'staff') return stepStaff(n);
  if (n.kind === 'pr') {
    S.pr = Math.min(100, S.pr + n.gain);
    n.done = true;
    letter(null, prFrom, bi(`Отчёт: ${loc(n.label)}`, `Есеп: ${loc(n.label)}`), bi(`Кампания прошла. PR вырос на ${n.gain}, сейчас ${Math.round(S.pr)}.`, `Науқан өтті. PR ${n.gain} өсті, қазір ${Math.round(S.pr)}.`));
    return;
  }
  if (n.kind === 'sponsor') {
    const sp = SPONSORS.find(s => s.id === n.pid);
    if (!sp) { n.done = true; return; }
    if (S.pr >= sp.need) {
      n.stage = 'wait'; n.ans = S.day + WAIT_DAYS;
      letter(n, sponsorFrom, bi(`Условия: ${sp.name}`, `Шарттар: ${sp.name}`),
        bi(`Мы готовы платить ${money(sp.inc)} в неделю. Ответьте в течение ${WAIT_DAYS} дн.`, `Біз аптасына ${money(sp.inc)} төлеуге дайынбыз. ${WAIT_DAYS} күн ішінде жауап беріңіз.`));
    } else {
      n.done = true;
      letter(null, sponsorFrom, bi(`Отказ: ${sp.name}`, `Бас тарту: ${sp.name}`), bi(`Нужен PR ${sp.need}, у вас ${Math.round(S.pr)}. Усильте публичность и пишите снова.`, `PR ${sp.need} керек, сізде ${Math.round(S.pr)}. Жариялылықты күшейтіп, қайта жазыңыз.`));
    }
    return;
  }
  stepDeal(n);
}

function stepStaff(n) {
  const c = n.cand, want = c.want;
  const ok = n.amount >= want || (n.amount >= want * 0.85 && Math.random() < 0.5);
  n.done = true;
  if (ok && !S.staff[c.role]) {
    S.staff[c.role] = { name: c.name, lvl: c.lvl, salary: n.amount, look: c.look };
    letter(null, staffFrom, bi(`Контракт подписан: ${c.name}`, `Келісімшарт қол қойылды: ${c.name}`),
      bi(`${c.name} принял предложение: ${money(n.amount)} в неделю.`, `${c.name} ұсынысты қабылдады: аптасына ${money(n.amount)}.`));
  } else {
    if (!ok) S.cands.push(c);   // кандидат остаётся доступен для нового предложения
    letter(null, staffFrom, bi(`Отказ: ${c.name}`, `Бас тарту: ${c.name}`),
      bi(`${c.name} отказался: ожидал ${money(want)} в неделю, вы предложили ${money(n.amount)}.`, `${c.name} бас тартты: ${money(want)} күтті, сіз ${money(n.amount)} ұсындыңыз.`));
  }
}

// конкурент за свободного игрока: другой клуб с деньгами предлагает свою зарплату, обычно выше требований
const rivalCan = (r, p) => S.squads[r.clubId].length < 20 && (S.cash[r.clubId] || 0) >= worth(p);
function rivalFor(p, demand) {
  if (Math.random() < 0.4) return null;                    // в 40% случаев конкурентов нет
  const ids = CLUBS.map(c => c.id).filter(id => id !== S.me && S.squads[id].length < 20 && (S.cash[id] || 0) >= worth(p));
  if (!ids.length) return null;
  return { clubId: pick(ids), wage: Math.round(demand * (1.1 + Math.random() * 0.25) / 1e5) * 1e5 };
}
const rivalTxt = (n, lang) => (n.rival ? ' ' + T[lang].rivalInfo.replace('{c}', clubName(n.rival.clubId)).replace('{w}', money(n.rival.wage)) : '');

// сделки с игроком: клуб → агент с требованиями → ответ пользователя → решение игрока
function stepDeal(n) {
  const p = dealPlayer(n);
  const fail = why => { n.done = true; letter(null, dealFrom, bi(`Сделка сорвана: ${p ? p.name : '—'}`, `Мәміле бұзылды: ${p ? p.name : '—'}`), why); };
  if (!p) return fail(bi('Игрок уже недоступен.', 'Ойыншы қолжетімсіз.'));

  if (n.stage === 'club') {   // клуб отвечает
    if (n.kind === 'sell') {
      const max = bidFor(p, n.clubId);
      n.done = true;
      if (n.fee > max) return letter(null, dealFrom, bi(`Отказ: ${p.name}`, `Бас тарту: ${p.name}`), bi(`${clubName(n.clubId)} готов платить максимум ${money(max)}.`, `${clubName(n.clubId)} ең көбі ${money(max)} төлеуге дайын.`));
      if (S.cash[n.clubId] < n.fee || S.squads[n.clubId].length >= 20) return letter(null, dealFrom, bi(`Отмена: ${p.name}`, `Болдырмау: ${p.name}`), bi('У клуба не хватает денег или места.', 'Клубта ақша немесе орын жетіспейді.'));
      return moveTo(p.id, S.me, n.clubId, n.fee);
    }
    const ask = askFor(p);
    const ok = n.fee >= ask || (n.fee >= ask * 0.9 && Math.random() < 0.5);
    if (!ok) return fail(bi(`Клуб отказал: минимум ${money(ask)}, вы предложили ${money(n.fee)}.`, `Клуб бас тартты: ең аз ${money(ask)}, сіз ${money(n.fee)} ұсындыңыз.`));
    n.stage = 'askWage'; n.ans = S.day + 1;
    letter(null, dealFrom, bi(`Клуб согласен: ${p.name}`, `Клуб келісті: ${p.name}`), bi(`Клуб принял сумму ${money(n.fee)}. Агент игрока свяжется с требованиями.`, `Клуб ${money(n.fee)} сомасын қабылдады. Ойыншының агенті талаптарын жібереді.`));
    return;
  }
  if (n.stage === 'askWage') {   // агент присылает требования к зарплате
    n.demand = demandOf(p);
    n.rival = n.kind === 'free' ? rivalFor(p, n.demand) : null;
    n.stage = 'wait'; n.ans = S.day + WAIT_DAYS;
    letter(n, agentFrom, bi(`Требования: ${p.name}`, `Талаптар: ${p.name}`),
      bi(`Игрок ждёт ${money(n.demand)} в неделю. Ответьте в течение ${WAIT_DAYS} дн.: примите требования или предложите свою сумму.` + rivalTxt(n, 'ru'),
         `Ойыншы аптасына ${money(n.demand)} күтеді. ${WAIT_DAYS} күн ішінде жауап беріңіз: талапты қабылдаңыз немесе өз соманы ұсыныңыз.` + rivalTxt(n, 'kz')));
    return;
  }
  if (n.stage === 'decide') {   // решение игрока по предложенной зарплате
    n.done = true;
    if (n.rival && rivalCan(n.rival, p) && n.offer < n.rival.wage) {   // конкурент предложил больше — игрок уходит к нему
      moveTo(p.id, 'pool', n.rival.clubId, worth(p));
      const w = money(n.rival.wage), c = clubName(n.rival.clubId);
      return letter(null, agentFrom, bi(`Игрок ушёл: ${p.name}`, `Ойыншы кетті: ${p.name}`),
        bi(T.ru.rivalWon.replace('{c}', c).replace('{w}', w), T.kz.rivalWon.replace('{c}', c).replace('{w}', w)));
    }
    const ok = n.offer >= n.demand || (n.offer >= n.demand * 0.9 && Math.random() < 0.5);
    if (!ok) return letter(null, agentFrom, bi(`Отказ: ${p.name}`, `Бас тарту: ${p.name}`), bi(`Игрок отказался: ждал ${money(n.demand)} в неделю.`, `Ойыншы бас тартты: аптасына ${money(n.demand)} күтті.`));
    if (n.kind === 'buy' && n.fee > S.budget) return letter(null, dealFrom, bi(`Отмена: ${p.name}`, `Болдырмау: ${p.name}`), bi('На счёте не хватает денег.', 'Шотта ақша жеткіліксіз.'));
    if (S.squads[S.me].length >= 20) return letter(null, dealFrom, bi(`Отмена: ${p.name}`, `Болдырмау: ${p.name}`), bi('В составе уже 20 игроков.', 'Құрамда 20 ойыншы бар.'));
    const from = n.kind === 'free' ? 'pool' : n.clubId;
    moveTo(p.id, from, S.me, n.kind === 'free' ? 0 : n.fee);
    p.wage = n.offer;
  }
}

// каждый день: проверяем, кому пришёл срок ответа
function resolveNeg() {
  if (!S || !S.neg || !S.neg.length) return;
  S.neg.filter(n => !n.done && S.day >= n.ans).forEach(stepNeg);
  S.neg = S.neg.filter(n => !n.done);
}

// список переговоров для экранов: group = 'staff' | 'transfers' | 'sponsors'
const NEG_GROUP = { staff: ['staff'], transfers: ['buy', 'free', 'sell'], sponsors: ['sponsor', 'pr'] };
function negTitle(n) {
  if (n.kind === 'staff') return `${n.cand.name} (${t('roles')[n.cand.role]})`;
  if (n.kind === 'sponsor') return (SPONSORS.find(s => s.id === n.pid) || { name: '—' }).name;
  if (n.kind === 'pr') return loc(n.label);
  const p = dealPlayer(n);
  const name = p ? p.name : '—';
  return n.kind === 'sell' ? `${t('sell')}: ${name} → ${clubName(n.clubId)}` : `${t('buy')}: ${name}`;
}
function stageText(n) {
  return { club: t('stClub'), askWage: t('stAgent'), wait: t('stWait'), decide: t('stDecide') }[n.stage] || '';
}
function pendingHTML(group) {
  const list = (S.neg || []).filter(n => NEG_GROUP[group].includes(n.kind));
  if (!list.length) return '';
  return `<section class="card"><b>${t('pendingOffers')}</b>` +
    list.map(n => `<small>${negTitle(n)} · ${n.fee ? money(n.fee) : ''} · ${stageText(n)} · ${Math.max(0, n.ans - S.day)} ${t('days')}</small>`).join('') +
    `</section>`;
}

</script>
  <script>
// ===== Состояние и сохранение =====
const SAVE_KEY = 'steppe-league-v2';
let S = null;          // текущая карьера
let RESULT = null;     // результат последнего матча
let MATCH_CFG = null;  // настройки текущего матча
let NOTICE = '';       // сообщение на экране (вместо alert); экран читает его и очищает
let SQ_TAB = 'players';     // вкладка состава: players | staff | actions
let FIN_TAB = 'transfers';  // вкладка финансов: transfers | sponsors

const L = () => localStorage.getItem('steppe-lang') || 'ru';
const t = k => T[L()][k];
Object.assign(T.ru, { playerName: 'Игрок', posShort: 'Поз.' });
Object.assign(T.kz, { playerName: 'Ойыншы', posShort: 'Ойын' });
Object.assign(T.ru, { renameClub: 'Название клуба', renameBtn: 'Сохранить название', nameEmpty: 'Название не может быть пустым.', nameSaved: 'Название клуба изменено.', formation: 'Схема' });
Object.assign(T.kz, { renameClub: 'Клуб атауы', renameBtn: 'Атауды сақтау', nameEmpty: 'Атау бос болмауы керек.', nameSaved: 'Клуб атауы өзгертілді.', formation: 'Схема' });
Object.assign(T.ru, { backToActions: 'Назад к взаимодействиям', lineupTitle: 'Расстановка', lineupOpen: 'Открыть расстановку', lineupNote: 'Нажмите игрока, затем другого — они поменяются местами. Травмированные не выходят в основной состав.', injNoStart: 'Травмированный игрок не может стоять в основе.' });
Object.assign(T.kz, { backToActions: 'Әрекеттерге оралу', lineupTitle: 'Орналасу', lineupOpen: 'Орналасуды ашу', lineupNote: 'Ойыншыны басыңыз, сосын басқасын — олар орын ауыстырады. Жарақаттылар негізгі құрамға шықпайды.', injNoStart: 'Жарақатты ойыншы негізгі құрамда тұра алмайды.' });
Object.assign(T.ru, { hireInFinance: 'Нанимать и увольнять сотрудников можно в разделе «Финансы» → «Найм сотрудников».', hiring: 'Найм сотрудников', rivalInfo: ' Клуб {c} тоже предлагает {w} в неделю: предложите больше, иначе игрок уйдёт.', rivalWon: 'Игрок ушёл в клуб {c}: ваше предложение ниже {w} в неделю.' });
Object.assign(T.kz, { hireInFinance: 'Қызметкерлерді «Қаржы» → «Қызметкерлерді жалдау» бөлімінен жалдауға және босатуға болады.', hiring: 'Қызметкерлерді жалдау', rivalInfo: ' {c} клубы да аптасына {w} ұсынады: көбірек ұсыныңыз, әйтпесе ойыншы кетеді.', rivalWon: 'Ойыншы {c} клубына кетті: сіздің ұсынысыңыз аптасына {w}-дан төмен.' });
const $ = s => document.querySelector(s);
const nm = c => (S && c.id === S.me && S.clubName) ? S.clubName : c.name[L()];   // свое название игрок может менять
const myIdx = () => CLUBS.findIndex(c => c.id === S.me);
// схемы: линии от вратаря к нападению — [x на поле, амплуа, число игроков]; первый всегда вратарь
const FORMATION_LINES = {
  '4-3-3': [[.03, 'GK', 1], [.15, 'DF', 4], [.3, 'MF', 3], [.42, 'FW', 3]],
  '4-4-2': [[.03, 'GK', 1], [.15, 'DF', 4], [.3, 'MF', 4], [.42, 'FW', 2]],
  '3-4-3': [[.03, 'GK', 1], [.15, 'DF', 3], [.3, 'MF', 4], [.42, 'FW', 3]],
  '5-4-1': [[.03, 'GK', 1], [.15, 'DF', 5], [.3, 'MF', 4], [.42, 'FW', 1]],
  '4-2-3-1': [[.03, 'GK', 1], [.15, 'DF', 4], [.26, 'MF', 2], [.36, 'MF', 3], [.44, 'FW', 1]]
};
// координаты слотов по схеме; для 4-3-3 — точные координаты матча
const DEFAULT_433 = [[.03, .5], [.15, .18], [.15, .4], [.15, .6], [.15, .82], [.3, .25], [.3, .5], [.3, .75], [.42, .3], [.42, .5], [.42, .7]];
const formCoords = name => (name === '4-3-3' ? DEFAULT_433 : FORMATION_LINES[name || '4-3-3'].flatMap(([x, , n]) => Array.from({ length: n }, (_, k) => [x, (k + 1) / (n + 1)])));
const formRoles = name => FORMATION_LINES[name || '4-3-3'].flatMap(([, pos, n]) => Array(n).fill(pos));
// смена схемы: на слоты ставятся лучшие здоровые игроки нужного амплуа, остальные — на скамейку
function applyFormation(name) {
  if (!FORMATION_LINES[name]) return;
  const sq = S.squads[S.me];
  const pool = sq.slice().sort((a, b) => b.ovr - a.ovr);
  const healthy = p => p.inj <= 0;
  const chosen = [];
  formRoles(name).forEach(role => {
    const q = pool.find(p => !chosen.includes(p) && healthy(p) && p.pos === role)
      || pool.find(p => !chosen.includes(p) && healthy(p) && role !== 'GK' && p.pos !== 'GK')
      || pool.find(p => !chosen.includes(p) && healthy(p));
    if (q) chosen.push(q);
  });
  pool.forEach(p => { if (chosen.length < 11 && !chosen.includes(p)) chosen.push(p); });   // не хватает здоровых — дополняем травмированными
  const rest = sq.filter(p => !chosen.includes(p));
  sq.splice(0, sq.length, ...chosen.slice(0, 11), ...rest);
  S.formation = name; LINEUP_SEL = null; save();
  go('squad');
}
function renameClub() {
  const v = ((document.getElementById('clubName') || {}).value || '').trim().slice(0, 30);
  if (!v) { NOTICE = t('nameEmpty'); return go('squad'); }
  S.clubName = v; save(); NOTICE = t('nameSaved'); go('squad');
}
const squadOvr = id => Math.round(S.squads[id].reduce((a, p) => a + p.ovr, 0) / S.squads[id].length);
const save = () => localStorage.setItem(SAVE_KEY, JSON.stringify(S));
const load = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } };
// тёмную форму в таблице подсвечиваем светлым текстом
const readable = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 < .25 ? '#d0d0d0' : hex; };
// деньги хранятся в тенге, показываются как «10млн₸», «10тыс₸», «10 ₸»
const money = v => {
  const a = Math.abs(v), kz = L() === 'kz';
  const fx = x => (Math.abs(x) < 10 ? x.toFixed(1) : Math.round(x).toString()).replace(/\.0$/, '');
  if (a >= 1e9) return fx(v / 1e9) + 'млрд₸';
  if (a >= 1e6) return fx(v / 1e6) + 'млн₸';
  if (a >= 1e3) return fx(v / 1e3) + (kz ? 'мың₸' : 'тыс₸');
  return v + ' ₸';
};

function newGame(i) {
  const squads = {}, table = {};
  CLUBS.forEach((c, k) => { squads[c.id] = makeSquad(c, k); });
  CLUBS.forEach(c => { table[c.id] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }; });
  S = { me: CLUBS[i].id, round: 0, day: 1, budget: 2e9, squads, table, cash: {}, pool: [],
        mail: [], staff: {}, sponsors: [], pr: CLUBS[i].pr, tactic: 'balanced', autoStaff: false, cands: [], neg: [], plan: 'none',
        customClub: CLUBS[CLUBS.length - 1].id === 'custom' ? CLUBS[CLUBS.length - 1] : null };
  CLUBS.forEach(c => { if (c.id !== S.me) S.cash[c.id] = 2e9; });
  ensureIds(); refreshPool();
  S.cands = genCands();
  welcomeMail();
  save();
  go('hub');
}

function applyResult(h, a, gh, ga) {
  const H = S.table[CLUBS[h].id], A = S.table[CLUBS[a].id];
  H.p++; A.p++; H.gf += gh; H.ga += ga; A.gf += ga; A.ga += gh;
  if (gh > ga) { H.w++; H.pts += 3; A.l++; }
  else if (gh < ga) { A.w++; A.pts += 3; H.l++; }
  else { H.d++; A.d++; H.pts++; A.pts++; }
}

function simRound() {
  const [h, a] = FIXTURES[S.round];
  const g = o => Math.max(0, Math.round(Math.random() * 2.5 + (o - 65) / 15 - 0.5));
  const gh = g(squadOvr(CLUBS[h].id)), ga = g(squadOvr(CLUBS[a].id));
  applyResult(h, a, gh, ga);
  moraleAfter(CLUBS[h].id, gh, CLUBS[a].id, ga);
  S.round++;
  afterRound();
  save();
  go('hub');
}

// подготовка матча: состав (травмированные заменяются), тактика тренера, обработчик итога
function matchCfg(oppId, friendly, onDone) {
  const mine = CLUBS.find(c => c.id === S.me), opp = CLUBS.find(c => c.id === oppId);
  prepareLineup(S.squads[S.me], true);
  prepareLineup(S.squads[oppId], false);
  return {
    lang: L(),
    myClub: nm(mine), oppClub: nm(opp),
    myColor: mine.color, oppColor: opp.color, myShorts: mine.shorts, oppShorts: opp.shorts,
    mySquad: S.squads[S.me], oppSquad: S.squads[oppId],
    tactic: S.tactic, coach: staffLvl('coach'), friendly, form: formCoords(S.formation),
    onEnd: (gm, gop, injuries) => onDone(gm, gop, injuries)
  };
}

// в основе после замен не хватает здоровых игроков: матч не играется
const lineupBroken = () => { prepareLineup(S.squads[S.me], true); return S.squads[S.me].slice(0, 11).some(p => p.inj > 0); };
function techLoss(h, a, meHome, oppId, friendly) {
  const opp = CLUBS.find(c => c.id === oppId);
  mail(bi('Администрация клуба', 'Клуб әкімшілігі'), bi(`Техническое поражение: ${nm(opp)}`, `Техникалық жеңіліс: ${nm(opp)}`),
    bi('В основе не хватает здоровых игроков: матч засчитан 0:3.', 'Негізгі құрамда сау ойыншылар жетіспейді: матч 0:3 есебімен есептелді.'));
  if (friendly) passDays(1);
  else { applyResult(h, a, meHome ? 0 : 3, meHome ? 3 : 0); S.round++; afterRound(); }
  RESULT = { gm: 0, gop: 3, out: 'loss', reward: 0, opp: nm(opp), injured: [], friendly };
  save(); go('result');
}

function startMatch() {
  const [h, a] = FIXTURES[S.round];
  const meHome = CLUBS[h].id === S.me;
  const oppId = meHome ? CLUBS[a].id : CLUBS[h].id;
  const opp = CLUBS.find(c => c.id === oppId);
  if (lineupBroken()) return techLoss(h, a, meHome, oppId, false);
  MATCH_CFG = matchCfg(oppId, false, (gm, gop, injuries) => {
    const gh = meHome ? gm : gop, ga = meHome ? gop : gm;
    applyResult(h, a, gh, ga);
    moraleAfter(CLUBS[h].id, gh, CLUBS[a].id, ga);
    const out = gm > gop ? 'win' : gm < gop ? 'loss' : 'draw';
    const reward = (out === 'win' ? 6e8 : out === 'draw' ? 2.5e8 : 1e8) + 1e8 * gm;
    S.budget += reward;
    const injured = applyInjuries(injuries, oppId);
    mail(bi('Администрация клуба', 'Клуб әкімшілігі'), bi(`Матч ${gm}:${gop} (${nm(opp)})`, `Матч ${gm}:${gop} (${nm(opp)})`),
      bi(`Призовые: ${money(reward)}.`, `Сыйақы: ${money(reward)}.`));
    S.round++;
    afterRound();
    RESULT = { gm, gop, out, reward, opp: nm(opp), injured, friendly: false };
    save();
    go('result');
  });
  go('match');
}

// товарищеский матч: не влияет на таблицу, призовые скромнее, идёт один день
function startFriendly(oppId) {
  const opp = CLUBS.find(c => c.id === oppId);
  if (lineupBroken()) return techLoss(null, null, false, oppId, true);
  MATCH_CFG = matchCfg(oppId, true, (gm, gop, injuries) => {
    const out = gm > gop ? 'win' : gm < gop ? 'loss' : 'draw';
    const reward = 2e7 + 1e7 * gm;
    S.budget += reward;
    moraleAfter(S.me, gm, oppId, gop);
    const injured = applyInjuries(injuries, oppId);
    mail(bi('Администрация клуба', 'Клуб әкімшілігі'), bi(`Товарищеский матч ${gm}:${gop} (${nm(opp)})`, `Досттық матч ${gm}:${gop} (${nm(opp)})`),
      bi(`Призовые: ${money(reward)}. Таблица не изменилась.`, `Сыйақы: ${money(reward)}. Кесте өзгерген жоқ.`));
    passDays(1);
    RESULT = { gm, gop, out, reward, opp: nm(opp), injured, friendly: true };
    save();
    go('result');
  });
  go('match');
}

// тренировка: при тренере бесплатно, без него 50 млн; занимает весь состав
function train(back = 'hub') {
  const cost = staffLvl('coach') ? 0 : 5e7;
  if (S.budget < cost) return flashView(back, t('noMoney'));
  S.budget -= cost;
  S.squads[S.me].forEach(p => {
    ['pace', 'shot', 'pass', 'def'].forEach(k => p[k] = clamp(p[k] + 1));
    p.ovr = ovrOf(p);
  });
  save();
  flashView(back, t('trainDone'));
}

function tableHTML() {
  const rows = CLUBS.map(c => ({ c, s: S.table[c.id] }))
    .sort((x, y) => y.s.pts - x.s.pts || (y.s.gf - y.s.ga) - (x.s.gf - x.s.ga) || y.s.gf - x.s.gf);
  return `<table class="tbl"><tr><th>#</th><th>${t('club')}</th><th>${t('played')}</th><th>${t('w')}</th>
    <th>${t('d')}</th><th>${t('l')}</th><th>${t('gf')}</th><th>${t('ga')}</th><th>${t('pts')}</th><th>${t('ovr')}</th></tr>` +
    rows.map((r, i) => `<tr class="${r.c.id === S.me ? 'me' : ''}"><td>${i + 1}</td>
      <td style="color:${readable(r.c.color)}">${nm(r.c)}</td><td>${r.s.p}</td><td>${r.s.w}</td><td>${r.s.d}</td>
      <td>${r.s.l}</td><td>${r.s.gf}</td><td>${r.s.ga}</td><td>${r.s.pts}</td><td>${squadOvr(r.c.id)}</td></tr>`).join('') +
    `</table>`;
}

// ===== Трансферы =====
// цена игрока зависит от показателей; у каждого игрока свой коэффициент m (настроение клуба), он хранится в сохранении
const worth = p => Math.max(1e6, Math.round(1e7 * Math.pow(1.2177, p.ovr - 60) / 1e5) * 1e5);
const askPrice = p => Math.round(worth(p) * p.m);                       // что просит клуб
const askFor = p => Math.round(askPrice(p) * discount());               // с учётом скидки менеджера
const poolPrice = p => Math.round(worth(p) * discount());               // свободный агент
const bidFor = (p, clubId) => Math.max(1, Math.min(S.cash[clubId] || 0, Math.round(worth(p) * (0.85 - (p.m - 1))))); // что клуб готов дать
const newId = () => 'p' + Math.random().toString(36).slice(2, 9);
const clubName = id => nm(CLUBS.find(c => c.id === id));
const finNote = s => flashView('finance', s);

// фигурка игрока для карточек и списков: цвет формы передаётся явно (клуба или свободного агента)
function figHTML(p, color, shorts) {
  const l = lookOf(p);
  return `<canvas class="fig" width="16" height="24" data-c="${color}" data-s="${shorts}" data-n="${p.num}" data-skin="${l.skin}" data-hair="${l.hair}" data-afro="${l.afro ? 1 : ''}"></canvas>`;
}

// заготовки головы по амплуа: цвета волос и причёска (стили сохраняются у игрока)
const HEAD_TPL = {
  GK: { style: 'buzz', hair: ['#111111', '#2a1d12', '#5a3720'] },
  DF: { style: 'short', hair: ['#2a1d12', '#4a3020', '#8b5a2b'] },
  MF: { style: 'side', hair: ['#4a3020', '#8b5a2b', '#c9a46a'] },
  FW: { style: 'spiky', hair: ['#c9a46a', '#9a9a9a', '#111111'] }
};
function randPlayer(pos, base) {
  const st = k => clamp(Math.round(base + BIAS[pos][k] + Math.random() * 10 - 5));
  const p = { id: newId(), num: 20 + Math.floor(Math.random() * 79), name: pick(FIRST) + ' ' + pick(LAST), pos,
              pace: st('pace'), shot: st('shot'), pass: st('pass'), def: st('def'),
              m: +(1 + Math.random() * .25).toFixed(2) };
  p.ovr = ovrOf(p);
  p.look = randomLook();   // свободный агент получает случайный внешний вид и форму
  p.look.hair = pick(HEAD_TPL[pos].hair); p.head = HEAD_TPL[pos].style;   // заготовка головы по амплуа
  fixPlayer(p);
  return p;
}

function refreshPool() {
  S.pool = ['GK', 'DF', 'MF', 'FW', 'DF', 'MF'].map(pos => randPlayer(pos, 50 + Math.floor(Math.random() * 14)));
}

function ensureIds() {
  const fix = p => {
    if (!p.id) p.id = newId();
    if (p.m === undefined) p.m = +(1 + Math.random() * .25).toFixed(2);
    fixPlayer(p);
  };
  Object.values(S.squads).forEach(sq => sq.forEach(fix));
  S.pool.forEach(fix);
}

function pay(clubId, d) {
  if (clubId === S.me) S.budget += d;
  else S.cash[clubId] = (S.cash[clubId] || 0) + d;
}

// убрать игрока из состава; если он был в старте, на его место встаёт запасной того же амплуа
function takePlayer(clubId, id) {
  const sq = S.squads[clubId];
  const i = sq.findIndex(q => q.id === id);
  if (i < 0) return null;
  const [p] = sq.splice(i, 1);
  if (i < 11) {
    const j = sq.findIndex((q, k) => k >= 10 && q.pos === p.pos);
    if (j >= 0) { const [r] = sq.splice(j, 1); sq.splice(i, 0, r); }
  }
  return p;
}

// можно ли отдать игрока: в составе должно остаться 11 игроков и вратарь
function canGive(clubId, id) {
  const sq = S.squads[clubId], i = sq.findIndex(q => q.id === id);
  if (i < 0 || sq.length - 1 < 11) return false;
  if (i < 11 && sq[i].pos === 'GK' && !sq.some((q, k) => k >= 11 && q.pos === 'GK')) return false;
  return true;
}

// перевод игрока: from — клуб или 'pool' (свободный агент), price — сумма, которую платит to
function moveTo(id, from, to, price) {
  let p;
  if (from === 'pool') {
    const i = S.pool.findIndex(q => q.id === id);
    if (i < 0) return false;
    [p] = S.pool.splice(i, 1);
  } else {
    p = takePlayer(from, id);
    if (!p) return false;
    pay(from, price);
  }
  S.squads[to].push(p);
  const club = CLUBS.find(c => c.id === to);
  if (club) p.look = { ...lookOf(p), color: club.color, shorts: club.shorts };   // после перехода — форма нового клуба
  pay(to, -price);
  logMove(p, from, to, price);
  return true;
}

// ИИ-клуб продаёт запасного только если в запасе остаётся игрок того же амплуа
const hasBackup = (clubId, p) => S.squads[clubId].slice(11).some(q => q !== p && q.pos === p.pos);

// клубы иногда сами продают запасных друг другу
function aiTrade() {
  if (Math.random() > .35) return;
  const ids = CLUBS.map(c => c.id).filter(id => id !== S.me);
  const sellers = ids.filter(id => S.squads[id].length > 12);
  if (!sellers.length) return;
  const from = pick(sellers);
  const to = pick(ids.filter(id => id !== from && S.squads[id].length < 20));
  if (!to) return;
  const cands = S.squads[from].slice(11).filter(p => hasBackup(from, p) && (S.cash[to] || 0) >= askPrice(p));
  if (!cands.length) return;
  const p = pick(cands);
  moveTo(p.id, from, to, askPrice(p));
}

// ИИ покупает свободного игрока, если тот сильнее слабейшего основного на его позиции и хватает тенге
function aiBuyFree() {
  CLUBS.map(c => c.id).filter(id => id !== S.me).forEach(id => {
    const sq = S.squads[id];
    if (sq.length >= 20 || Math.random() > 0.15) return;     // клуб не каждый тур ищет игрока
    const cands = S.pool.filter(p => !negFor(p.id) && (S.cash[id] || 0) >= worth(p) && p.ovr > Math.min(...sq.slice(0, 11).filter(q => q.pos === p.pos).map(q => q.ovr)));
    if (!cands.length) return;
    const best = cands.reduce((x, y) => (y.ovr > x.ovr ? y : x));
    moveTo(best.id, 'pool', id, worth(best));
    // новичок встаёт в основу вместо самого слабого игрока своей позиции
    const q = S.squads[id];
    const starters = q.map((p, i) => [p, i]).filter(([p, i]) => i < 11 && p.pos === best.pos);
    const weakest = starters.reduce((x, y) => (y[0].ovr < x[0].ovr ? y : x), starters[0]);
    if (weakest && best.ovr > weakest[0].ovr) {
      const last = q.length - 1;
      [q[weakest[1]], q[last]] = [q[last], q[weakest[1]]];
    }
  });
}

// после каждого тура: деньги и трансферы ИИ, затем неделя календаря (дни, зарплаты, спонсоры, почта)
function afterRound() {
  CLUBS.forEach(c => { if (c.id !== S.me) S.cash[c.id] = (S.cash[c.id] || 0) + 1e8; });   // доход клубов за тур
  aiBuyFree();
  aiTrade();
  passDays(DAYS_PER_ROUND);
  weekly();
}

// миграция старых сохранений: касса клубов, свободные игроки, id, коэффициенты, новые поля карьеры
function migrate() {
  if (!S) return;
  if (!CLUBS.some(c => c.id === S.me)) { S = null; return; }   // неизвестный клуб: сохранение не подходит
  if (!S.brotherAdded && S.squads.stolichny && !S.squads.stolichny.some(p => p.id === 'altynbekov-7')) {
    addBrother(S.squads.stolichny, CLUBS.find(c => c.id === 'stolichny'));
    S.brotherAdded = true;
  }
  CLUBS.forEach((c, k) => {
    if (!S.squads[c.id]) S.squads[c.id] = makeSquad(c, k);
    if (!S.table[c.id]) S.table[c.id] = { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
  });
  S.cash = S.cash || {};
  S.pool = S.pool || [];
  S.mail = S.mail || [];
  S.staff = S.staff || {};
  S.sponsors = S.sponsors || [];
  if (S.pr === undefined) S.pr = 25;
  if (!S.day) S.day = S.round * DAYS_PER_ROUND + 1;
  S.tactic = S.tactic || 'balanced';
  if (S.autoStaff === undefined) S.autoStaff = false;
  S.neg = S.neg || [];
  S.offers = null;   // старая схема предложений больше не используется
  S.plan = S.plan || 'none';
  S.formation = S.formation || '4-3-3';
  if (S.budget < 1e6) { S.budget *= 1e6; Object.keys(S.cash).forEach(k => { S.cash[k] *= 1e6; }); }   // старые сохранения: единицы в млн
  CLUBS.forEach(c => { if (c.id !== S.me && S.cash[c.id] === undefined) S.cash[c.id] = 2e9; });
  ensureIds();
  if (!S.pool.length) refreshPool();
  if (!S.cands) S.cands = genCands();
  (S.cands || []).forEach(c => { if (c.look) c.name = fitName(c.name, c.look.gender); });
  Object.values(S.staff || {}).forEach(h => { if (h && h.look) h.name = fitName(h.name, h.look.gender); });
}

// вкладка «Штат»: предложение контракта с зарплатой; ответ придёт письмом через OFFER_DAYS дней
// ===== Портреты сотрудников: пиксельная голова и плечи 16×16 =====
const PORT_SKIN = ['#f1c7a5', '#e0ac84', '#c68a5e', '#a86d43', '#7d4e2c', '#5a3720'];
const PORT_HAIR = ['#2a1d12', '#4a3020', '#111111', '#8b5a2b', '#c9a46a', '#9a9a9a'];
const CASUAL = ['#4f6d8a', '#8a6d4f', '#6b8a4f', '#8a4f6b', '#5a5a5a', '#2f4f5f', '#a0805a', '#7a3b3b', '#3f5f7f'];
const UNIFORM = ['#c62828', '#1565c0', '#2e7d32', '#f9a825', '#6a1b9a', '#00838f', '#ef6c00', '#ad1457'];
const TRACKSUIT = ['#1f4fa3', '#2e7d32', '#37474f', '#7a1f1f', '#2b2b2b'];
const pickP = a => a[Math.floor(Math.random() * a.length)];
// внешность по роли; пол случайный для всех
function staffLook(role) {
  const base = { skin: pickP(PORT_SKIN), hair: pickP(PORT_HAIR), gender: Math.random() < .5 ? 'm' : 'f' };
  if (role === 'coach') return { ...base, top: pickP(TRACKSUIT), style: 'tracksuit' };          // однотонные спортивки
  if (role === 'doctor' || role === 'psych') return { ...base, top: '#f4f4f4', style: 'coat' };  // белый халат
  if (role === 'scout') return { ...base, top: pickP(UNIFORM), style: 'uniform' };              // случайная форма
  if (role === 'assistant') return { ...base, top: pickP(CASUAL), style: Math.random() < .5 ? 'shirt' : 'stripe' }; // случайная одежда
  return { ...base, top: pickP(CASUAL), style: 'shirt' };                                      // менеджер и PR: обычная одежда
}
const portraitHTML = look => `<canvas class="portrait" width="16" height="16" data-look='${JSON.stringify(look)}'></canvas>`;
const dkHex = (hex, f = .7) => { const n = parseInt(hex.slice(1), 16); return `rgb(${Math.round((n >> 16) * f)},${Math.round(((n >> 8) & 255) * f)},${Math.round((n & 255) * f)})`; };
function drawPortraits(root) {
  root.querySelectorAll('canvas.portrait').forEach(cv => {
    const L = JSON.parse(cv.dataset.look), g = cv.getContext('2d');
    const r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    g.clearRect(0, 0, 16, 16);
    g.imageSmoothingEnabled = false;
    if (L.afro) { r(3, 0, 10, 2, L.hair); r(2, 2, 12, 7, L.hair); }   // афро за головой
    const f = L.gender === 'f';
    if (f) r(3, 3, 10, 9, L.hair);                              // длинные волосы сзади
    r(5, 3, 6, 7, L.skin); r(4, 4, 8, 5, L.skin);               // лицо (без черт)
    r(4, 2, 8, 2, L.hair);                                      // волосы сверху
    if (!f) { r(4, 4, 1, 2, L.hair); r(11, 4, 1, 2, L.hair); }  // короткие виски
    r(6, 10, 4, 1, dkHex(L.skin));                              // шея
    r(2, 11, 12, 5, L.top); r(1, 12, 1, 3, L.top); r(14, 12, 1, 3, L.top);   // плечи и рукава
    if (L.style === 'coat') { r(7, 11, 2, 5, '#d0d0d0'); r(6, 11, 1, 3, '#bdbdbd'); r(9, 11, 1, 3, '#bdbdbd'); }
    if (L.style === 'tracksuit') { r(8, 11, 1, 5, '#e8e8e8'); r(1, 12, 1, 3, dkHex(L.top)); r(14, 12, 1, 3, dkHex(L.top)); }
    if (L.style === 'uniform') r(6, 11, 4, 1, '#ffffff');
    if (L.style === 'shirt') r(6, 11, 4, 1, '#e8e8e8');
    if (L.style === 'stripe') { r(3, 13, 10, 1, dkHex(L.top)); r(3, 15, 10, 1, dkHex(L.top)); }
  });
}

    ? S.pool.map(p => `<div class="prow"><div class="frow">${figHTML(p, lookOf(p).color, lookOf(p).shorts)}<div>${row(p)}</div></div><button onclick="offerFree('${p.id}')">${t('offerBtn')} ${money(poolPrice(p))}</button></div>`).join('')
    : `<p class="hint">${t('none')}</p>`;
  html += `</section>`;
  others.forEach(c => {
    html += `<details class="card" style="--c:${c.color}"><summary><b>${nm(c)}</b> · ${t('clubBudget')}: ${money(S.cash[c.id])}</summary>` +
      S.squads[c.id].map(p => `<div class="prow"><div>${row(p)}</div>` +
        `<input type="number" id="bo-${p.id}" value="${askFor(p)}" title="${t('bidFrom')}">` +
        `<button onclick="offerBuy('${p.id}','${c.id}')">${t('offerBtn')}</button></div>`).join('') +
      `</details>`;
  });
  html += `<section class="card"><h3>${t('sell')}</h3>`;
  html += S.squads[me].map(p => {
    const best = Math.max(...others.map(c => bidFor(p, c.id)));
    return `<div class="prow"><div>${row(p)}</div><input type="number" id="so-${p.id}" value="${best}" title="${t('bidFrom')}">` +
      others.map(c => `<button onclick="offerSell('${p.id}','${c.id}')">${nm(c)}</button>`).join('') + `</div>`;
  }).join('');
  return html + `</section>`;
}

// вкладка «Рекламодатели»: PR, публичность через PR-менеджера и три уровня спонсоров
function sponsorsHTML() {
  const pr = Math.round(S.pr);
  const ok = !!staffLvl('pr');
  let html = pendingHTML('sponsors') + `<section class="card"><b>PR: ${pr}/100</b><div class="bar"><i style="width:${pr}%"></i></div>
    <small>${t('sponsorIncome')}: ${money(sponsorIncome())} ${t('perWeek')}</small></section>`;
  html += `<section class="card"><b>${t('publicity')}</b><small>${ok ? t('publicityNote') : t('needPRMgr')}</small>` +
    Object.entries(PUBLICITY).map(([k, P]) => `<button ${ok ? '' : 'disabled'} onclick="publicity('${k}')">${loc(P.label)} · ${money(P.cost)} · PR +${P.gain}</button>`).join('') +
    `</section>`;
  [['A', t('tierA')], ['B', t('tierB')], ['C', t('tierC')]].forEach(([tier, label]) => {
    html += `<h3>${label}</h3>` + SPONSORS.filter(s => s.tier === tier).map(sp => {
      const on = S.sponsors.includes(sp.id);
      const inTalk = !!negFor(sp.id);
      const action = on ? `<small class="ok">${t('active')}</small>`
        : inTalk ? `<small>${t('inReply')}</small>`
        : `<button onclick="proposeSponsor('${sp.id}')">${t('sponsorProposal')}</button>`;
      return `<section class="card"><b>${sp.name}</b> <small>${t('ind')[sp.ind]} · ${t('needPR')}: ${sp.need} · ${money(sp.inc)} ${t('perWeek')}</small>${action}</section>`;
    }).join('');
  });
  return html;
}

// кнопки ответа прямо в письме: требования агента или условия спонсора
function mailControls(m) {
  const n = m.nid && (S.neg || []).find(x => x.id === m.nid);
  if (!n || n.stage !== 'wait') return '';
  if (n.kind === 'sponsor') return `<div class="ctrl"><button onclick="respondNeg('${n.id}','accept')">${t('signIt')}</button>
    <button class="ghost" onclick="respondNeg('${n.id}','decline')">${t('decline')}</button></div>`;
  return `<div class="ctrl"><small>${t('demand')}: ${money(n.demand)} ${t('perWeek')}</small>
    <input type="number" id="nw-${n.id}" value="${n.demand}">
    <button onclick="respondNeg('${n.id}','offer')">${t('counter')}</button>
    <button onclick="respondNeg('${n.id}','accept')">${t('acceptDemand')}</button>
    <button class="ghost" onclick="respondNeg('${n.id}','decline')">${t('decline')}</button></div>`;
}

// ===== Скрытое меню тестировщика =====
// открывается: 7 нажатий по названию игры за 3 секунды или Ctrl+Shift+D
const DBG = { taps: [], panel: null };
const dbgInMatch = () => !!document.querySelector('.m-screen');
function dbgToggle() {
  if (DBG.panel) { DBG.panel.remove(); DBG.panel = null; return; }
  dbgRender();
}
function dbgRender() {
  if (!DBG.panel) {
    DBG.panel = document.createElement('div');
    DBG.panel.id = 'dbgPanel';
    DBG.panel.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;color:#fff;font:14px monospace;overflow:auto';
    document.body.appendChild(DBG.panel);
  }
  const btn = (a, label) => `<button onclick="dbgAct('${a}')" style="width:min(340px,80vw);padding:10px;font:14px monospace;background:#1d3a2a;color:#fff;border:1px solid #4a7a5a;border-radius:6px">${label}</button>`;
  const info = S ? `клуб: ${S.me} · бюджет: ${Math.round(S.budget).toLocaleString('ru')} · игроков: ${S.squads[S.me].length}` : 'карьера не начата';
  DBG.panel.innerHTML = `<b style="font-size:16px">Меню тестировщика</b><div style="opacity:.7">${info}</div>
    ${S ? btn('money', '+10 млн в бюджет') + btn('fit', 'Все игроки: здоровы, мораль 100') + btn('days', 'Пропустить 7 дней') : ''}
    ${dbgInMatch() ? btn('fan', 'Фанат на поле (в матче)') + btn('end', 'Закончить матч (в матче)') : ''}
    ${S ? btn('reset', 'Сбросить карьеру') : ''}
    ${btn('close', 'Закрыть')}`;
}
function dbgAct(a) {
  if (a === 'close') return dbgToggle();
  if (a === 'reset') {
    if (!confirm('Удалить карьеру?')) return dbgRender();
    S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
