      if (q === p) return;
      const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
      if (d < 20 || d > 180) return;
      const s = (dx * p.ax + dy * p.ay) / d - d / 400;
      if (s > bs) { bs = s; best = q; }
    });
    if (best) {
      const dx = best.x - p.x, dy = best.y - p.y, d = Math.hypot(dx, dy);
      kick(dx / d, dy / d, 90 + d * .3, p.side);
    } else {
      kick(p.ax, p.ay, 90, p.side);
    }
  }

  function setFlash(k) { flashKey = k; flash = 1.2; }

  function kickoff() {
    ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
    teams.forEach(team => team.forEach(p => { p.x = p.bx; p.y = p.by; p.slide = 0; p.hit = false; }));
    ctrl = null; thr = null;
    camX = W / 2; camY = H / 2;
  }

  function goal(team) {
    score[team]++;
    setFlash('goal');
    kickoff();
  }

  // физика мяча: 'goal' — гол засчитан, 'out' — мяч за боковой линией, иначе null
  function ballPhysics(dt) {
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    const f = Math.pow(.4, dt); ball.vx *= f; ball.vy *= f;
    if (ball.y <= 3 || ball.y >= H - 3) { ball.y = cl(ball.y, 3, H - 3); return 'out'; }
    const mouth = ball.y > GT && ball.y < GB;
    if (ball.x >= W - 2 && mouth) { goal('me'); return 'goal'; }
    if (ball.x <= 2 && mouth) { goal('cpu'); return 'goal'; }
    if (ball.x < 2) { ball.x = 2; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - 2) { ball.x = W - 2; ball.vx = -Math.abs(ball.vx); }
    return null;
  }

  // ----- аут: мяч за боковой линией, вбрасывает команда, которая не касалась мяча последней -----
  function startThrow() {
    const t = 1 - lastTeam;
    const y = ball.y < H / 2 ? 8 : H - 8, x = cl(ball.x, 10, W - 10);
    ball = { x, y, vx: 0, vy: 0 };
    const taker = nearest(teams[t], ball);
    if (!taker) { kickoff(); return; }
    const inward = y < H / 2 ? 1 : -1;
    taker.x = x; taker.y = y + inward * 8;
    taker.ax = t === 0 ? 1 : -1; taker.ay = inward;
    thr = { t, taker, timer: 1.2 };
    ctrl = t === 0 ? taker : null;
    setFlash('throwIn');
  }

  function updateThrow(dt) {
    const { t, taker } = thr;
    thr.timer -= dt;
    alive(teams[1 - t]).forEach(p => {   // соперники отходят от места аута
      const d = dist(p, ball) || 1;
      if (d < 40) stepTo(p, ball.x + (p.x - ball.x) / d * 40, ball.y + (p.y - ball.y) / d * 40, 150, dt);
    });
    const human = t === 0;
    if (!human) passPulse = false;                        // нажатие «Пас» во время чужого аута не должно копиться
    if (thr.timer > 0 && !(human && passPulse)) return;   // человек может вбросить раньше, кнопкой «Пас»
    passPulse = false;
    thr = null;
    if (human) ctrl = taker;
    passFrom(taker, teams[t]);
  }

  // ----- фолы и штрафные -----
  // травма: шанс выше у подката; ХП и дни восстановления зависят от силы удара
  function maybeInjure(tk, v) {
    if (v.pendingSub) return false;
    if (Math.random() > (tk.slide > 0 ? .15 : .05)) return false;
    const dmg = 8 + Math.floor(Math.random() * 23);            // 8–30 ХП
    v.pendingSub = true;
    injuries.push({ side: v.side, id: v.pid, dmg, days: Math.round(dmg * 1.2) + 4 });
    return true;
  }

  // травмированный уходит с поля: на его место встаёт запасной того же амплуа, если есть
  function injurySub(t, p) {
    p.pendingSub = false;
    const field = teams[t], bench = benches[t];
    let j = bench.findIndex(q => q.pos === p.pos);
    if (j < 0 && p.pos !== 'GK') j = bench.findIndex(q => q.pos !== 'GK');
    if (j < 0) return;                       // замен нет — игрок доигрывает с пониженными ХП
    const inn = bench.splice(j, 1)[0];
    inn.x = p.x; inn.y = p.y; inn.bx = p.bx; inn.by = p.by;
    inn.down = 0; inn.slide = 0; inn.hit = false;
    p.down = 0; p.slide = 0;
    field[field.indexOf(p)] = inn;
    if (ctrl === p) ctrl = inn;
    setFlash('injury');
  }

  function resolveTackle(tk, v) {
    const clean = Math.random() < .4 + (tk.def - v.pace * .5) / 150;
    if (clean) {
      if (dist(v, ball) < 14) kick(tk.ax, tk.ay, 70, tk.side);   // отобрал мяч
      return;
    }
    foul(tk, v);
  }

  function foul(tk, v) {
    v.down = 1.3;
    setFlash('foul');
    maybeInjure(tk, v);
    const inBox = tk.side === 0
      ? (v.x < BOX_W && Math.abs(v.y - H / 2) < BOX_H / 2)
      : (v.x > W - BOX_W && Math.abs(v.y - H / 2) < BOX_H / 2);
    if (inBox) { startPenalty(1 - tk.side); return; }
    ball = { x: cl(v.x, 6, W - 6), y: cl(v.y, 6, H - 6), vx: 0, vy: 0 };
    fk = { t: 1 - tk.side, timer: 1.5 };   // свободный удар команде, которой сделали фол
  }

  function startPenalty(t) {
    const spotX = t === 0 ? W - SPOT : SPOT;   // точка пенальти, внутри штрафной
    pen = { t, spotX, timer: t === 0 ? 6 : 1.6, shot: false, after: 0, saved: false, saveDone: false, gk: null };
    ball = { x: spotX, y: H / 2, vx: 0, vy: 0 };
    teams.forEach(team => team.forEach(p => { p.x = p.bx; p.y = p.by; p.slide = 0; }));
    ctrl = null;
    setFlash('pen');
  }

  function shootPen() {
    const t = pen.t, gk = teams[1 - t][0], taker = teams[t][8];
    // направление: у человека — стиком (вверх/вниз), у ИИ — случайно
    const dirY = t === 0
      ? (joy.y < -.25 ? -1 : joy.y > .25 ? 1 : (Math.random() < .5 ? -1 : 1))
      : (Math.random() < .5 ? -1 : 1);
    const guess = Math.random() < .5 ? -1 : 1;     // куда бросился вратарь
    const correct = guess === dirY;
    const saveP = correct ? .55 + gk.def / 300 - (taker.shot - 60) / 300 : .06;
    taker.kickT = .3; pen.shot = true; pen.after = 1.6; pen.saved = Math.random() < saveP; pen.gk = gk;
    gk.diveY = H / 2 + guess * 22;
    const tx = t === 0 ? W : 0, ty = H / 2 + dirY * 22;
    const dx = tx - pen.spotX, dy = ty - H / 2;
    kick(dx, dy, 200 + taker.shot * .4, t);
  }

  function updatePen(dt) {
    if (!pen.shot) {
      pen.timer -= dt;
      if ((pen.t === 0 && (auto || keys.Space) && kickCd <= 0) || pen.timer <= 0) { shootPen(); kickCd = .3; }
      return;
    }
    const gk = pen.gk;
    stepTo(gk, gk.x, gk.diveY, 220, dt);
    if (pen.saved && !pen.saveDone && Math.abs(ball.x - gk.x) < 14) {
      pen.saveDone = true;
      ball.vx = 0; ball.vy = 0;
      setFlash('save');
    }
    const r = ballPhysics(dt);
    if (r === 'out') { pen = null; kickoff(); return; }   // мяч ушёл за линию: матч продолжается с центра
    pen.after -= dt;
    if (r === 'goal') { pen = null; return; }
    if (pen.after <= 0) { pen = null; kickoff(); }
  }

  // свободный удар: мяч стоит на месте фола, соперники отходят на 60 px, затем бьёт команда
  function updateFK(dt) {
    fk.timer -= dt;
    alive(teams[1 - fk.t]).forEach(p => {
      const d = dist(p, ball), l = d || 1;
      if (d < 60) stepTo(p, ball.x + (p.x - ball.x) / l * 60, ball.y + (p.y - ball.y) / l * 60, 150, dt);
    });
    if (fk.timer > 0) return;
    const t = fk.t;
    fk = null;
    const taker = nearest(teams[t], ball);
    if (!taker) return;
    taker.x = ball.x; taker.y = ball.y - 8;   // исполнитель стоит у мяча
    taker.kickT = .3;
    if (t === 0) { ctrl = taker; return; }     // человек бьёт сам ⚽ или пасом
    aimAt(t === 0 ? W : 0, 90 + taker.shot * .4, 90, t);     // ИИ пробивает в ворота соперника
  }

  // ----- выбор управляемого игрока -----
  // вратарь участвует в выборе только когда мяч в его штрафной
  function pickCtrl(exclude) {
    let best = null, bd = Infinity, gk = null;
    teams[0].forEach((p, i) => {
      if (p.down > 0 || p === exclude) return;
      if (i === 0) gk = p;
      if (i === 0 && ball.x > BOX_W + 60) return;
      const d = dist(p, ball);
      if (d < bd) { bd = d; best = p; }
    });
    return best || gk;   // если в поле остался только вратарь, управляем им
  }

  // умная смена: фокус остаётся на текущем игроке, пока он бежит или ведёт мяч;
  // переключаемся, только если кто-то из команды заметно ближе к мячу; ручная смена — кнопкой «Смена»
  function selectCtrl(mag, dt) {
    switchCd -= dt;
    if (!ctrl || ctrl.down > 0) { ctrl = pickCtrl(null); switchCd = .4; return; }
    if (switchPulse) {
      switchPulse = false;
      const nx = pickCtrl(ctrl);
      if (nx) { ctrl = nx; switchCd = .6; }
      return;
    }
    const dCur = dist(ctrl, ball);
    if (switchCd > 0 || dCur < 30 || ctrl.slide > 0) return;   // ведём мяч или в борьбе
    if (mag > .15 && dCur < 110) return;                       // активно бежим — не перескакиваем
    const best = pickCtrl(null);
    if (best && best !== ctrl && dist(best, ball) < dCur - 25) { ctrl = best; switchCd = .6; }
  }

  // ----- камера: следит за мячом и управляемым игроком, не выходит за поле -----
  function updateCam(dt) {
    const z = CAM.zoom, hw = VW / (2 * z), hh = VH / (2 * z * TILT);   // TILT — сжатие по вертикали (ниже)
    let tx = ctrl ? ball.x * .6 + ctrl.x * .4 : ball.x;
    let ty = ctrl ? ball.y * .6 + ctrl.y * .4 : ball.y;
    if (phase === 'photo') { tx = W / 2; ty = H + 20; }                  // камера уходит к построению
    const k = Math.min(1, dt * CAM.lerp);
    camX = cl(camX + (tx - camX) * k, hw, W - hw);
    camY = cl(camY + (ty - camY) * k, hh - 28, H - hh + (phase === 'photo' ? 78 : 40));              // чуть выше и ниже поля — видны фотографы
  }

  // ----- замены: игрок с скамейки выходит вместо игрока на поле -----
  function openSub() {
    subOpen = true; subPick = null;
    keys = {}; passPulse = false; slidePulse = false; switchPulse = false;   // сбрасываем нажатия, сделанные до панели
    document.getElementById('subPanel').style.display = 'flex';
    renderSub();
  }

  function closeSub() {
    subOpen = false; subPick = null;
    document.getElementById('subPanel').style.display = 'none';
  }

  function renderSub() {
    const box = document.getElementById('subPanel'), tx = T[cfg.lang], bench = benches[0];
    let html = `<h3>${tx.benchTitle}</h3><p>${tx.subsLeft}: ${subsLeft}</p>`;
    if (!bench.length) html += `<p>${tx.noBench}</p>`;
    else if (subsLeft <= 0) html += `<p>${tx.subsLeft}: 0</p>`;
    else if (subPick === null) {
      bench.forEach((p, i) => { html += `<button data-b="${i}">${p.num}. ${p.label} · ${tx.pos[p.pos]}</button>`; });
    } else {
      html += `<p>${tx.pickField}</p>`;
      const isGK = bench[subPick].pos === 'GK';
      teams[0].forEach((p, i) => {
        if ((i === 0) !== isGK) return;   // вратарь заменяет только вратаря
        html += `<button data-f="${i}">${p.num}. ${p.label} · ${tx.pos[p.pos]}</button>`;
      });
    }
    html += `<button class="ghost" data-close="1">${tx.cancel}</button>`;
    box.innerHTML = html;
    box.querySelectorAll('[data-b]').forEach(b => { b.onclick = () => { subPick = +b.dataset.b; renderSub(); }; });
    box.querySelectorAll('[data-f]').forEach(b => { b.onclick = () => doSub(subPick, +b.dataset.f); });
    box.querySelector('[data-close]').onclick = closeSub;
  }

  function doSub(bi, fi) {
    const field = teams[0], bench = benches[0];
    const out = field[fi], inn = bench.splice(bi, 1)[0];
    inn.x = out.x; inn.y = out.y; inn.bx = out.bx; inn.by = out.by;
    inn.down = 0; inn.slide = 0; inn.hit = false;
    out.down = 0; out.slide = 0;
    field[fi] = inn;
    bench.push(out);
    if (ctrl === out) ctrl = null;
    subsLeft--;
    closeSub();
  }

  function onKey(e) {
    inputNow();
    if (subOpen) return;   // пока открыта панель замен, клавиши не действуют
    const k = MAP[e.code] || e.code;
    if (KEYS.includes(k)) { keys[k] = true; e.preventDefault(); }
    if (e.code === 'KeyJ') passPulse = true;
    if (e.code === 'KeyK') slidePulse = true;
    if (e.code === 'KeyQ') switchPulse = true;
  }
  function onKeyUp(e) { keys[MAP[e.code] || e.code] = false; }

  function stop() {
    running = false;
    cancelAnimationFrame(raf);
    removeEventListener('keydown', onKey);
    removeEventListener('keyup', onKeyUp);
  }

  function finish() {
    if (finishing) return;
    finishing = true;
    stop();
    cfg.onEnd(score.me, score.cpu, injuries);
  }

  // ----- фанаты на поле и фотографы у бровки -----
  const rnd = (a, b) => a + Math.random() * (b - a);
  const CREW_X = [150, 480, 810];

  function spawnFan() {
    fanHalt = true;                                        // судья останавливает игру
    const look = randomLook(), top = Math.random() < .5, y0 = top ? -10 : H + 10, x0 = rnd(150, 810);
    fans.push({ x: x0, y: y0, tx: ball.x, ty: ball.y, state: 'run', t: 0, retarget: 0,
                skin: look.skin, hair: look.hair, color: look.color, shorts: look.shorts,
                num: '', label: '', ax: 1, ay: 0, down: 0, slide: 0, kickT: 0, px: 0, py: 0, spd: 0, speed: rnd(58, 70) });
    // два охранника в жилетах выбегают с той же стороны и догоняют фаната
    [-1, 1].forEach(d => {
      const l = randomLook();
      stewards.push({ x: x0 + d * 70, y: y0, side: d, state: 'wait', delay: rnd(1.2, 2),
                      skin: l.skin, hair: l.hair, color: '#b7f000', shorts: '#1c1f24',
                      num: '', label: '', ax: 1, ay: 0, down: 0, slide: 0, kickT: 0, px: 0, py: 0, spd: 0, speed: 80 });
    });
    if (flash <= 0) setFlash('fan');
  }

  function spawnPhotog(tx, life, bottom) {
    const look = randomLook(), fromLeft = Math.random() < .5;
    const atBottom = bottom !== undefined ? bottom : Math.random() < .5;
    photogs.push({ x: fromLeft ? -26 : W + 26, y: atBottom ? H + 6 : -6, top: !atBottom, tx, state: 'in', life, kneel: Math.random() < .4,
                   cd: rnd(.3, 1.2), fl: 0, vest: pick(['#ff7a1a', '#ffd200', '#33c0ff', '#e8e8e8']),
                   skin: look.skin, hair: look.hair, px: 0, py: 0, spd: 0 });
  }

  function updateFans(dt) {
    fans.forEach(f => {
      f.t += dt; f.retarget -= dt;
      if (f.state === 'run') {
        if (f.retarget <= 0) { f.tx = ball.x + rnd(-70, 70); f.ty = ball.y + rnd(-50, 50); f.retarget = rnd(.8, 1.6); }
        const caught = stewards.some(s => s.state === 'chase' && Math.hypot(s.x - f.x, s.y - f.y) < 8);
        if (caught || f.t > 16) {                       // фаната остановили: ведут к ближней бровке
          f.state = 'caught'; f.tx = f.x; f.ty = f.y < H / 2 ? -22 : H + 22; f.speed = 38;
          stewards.forEach(s => { s.state = 'escort'; });
        }
      }
      const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy);
      if (d > 1) { const st = Math.min(d, f.speed * dt); f.x += dx / d * st; f.y += dy / d * st; f.ax = dx / d; f.ay = dy / d; }
    });
    stewards.forEach(s => {
      const f = fans[0];
      if (s.state === 'wait') { s.delay -= dt; if (s.delay <= 0) s.state = 'chase'; return; }
      if (!f) return;
      if (s.state === 'escort') { s.x += (f.x + s.side * 7 - s.x) * Math.min(1, dt * 6); s.y += (f.y - 1 - s.y) * Math.min(1, dt * 6); s.ax = f.ax; s.ay = f.ay; return; }
      const dx = f.x - s.x, dy = f.y - s.y, d = Math.hypot(dx, dy);
      if (d > 1) { const st = Math.min(d, s.speed * dt); s.x += dx / d * st; s.y += dy / d * st; s.ax = dx / d; s.ay = dy / d; }
    });
    if (fans.length && fans[0].state === 'caught' && (fans[0].y < -14 || fans[0].y > H + 14)) { fans = []; stewards = []; }
  }

  function updatePhotogs(dt) {
    photogs.forEach(g => {
      g.fl = Math.max(0, g.fl - dt);
      if (g.state === 'in' || g.state === 'out') {
        const dx = g.tx - g.x, st = Math.min(Math.abs(dx), 46 * dt);
        g.x += Math.sign(dx) * st;
        if (g.state === 'in' && Math.abs(dx) < 2) g.state = 'stay';
      }
      if (g.state === 'stay') {
        g.life -= dt;
        g.cd -= dt;
        if (g.cd <= 0) { g.fl = .15; g.cd = phase === 'photo' ? rnd(.45, 1.3) : rnd(.7, 2.6); }
        if (g.life <= 0) { g.state = 'out'; g.tx = g.x < W / 2 ? -30 : W + 30; }
      }
    });
    photogs = photogs.filter(g => !(g.state === 'out' && (g.x < -28 || g.x > W + 28)));
  }

  function updateAmbient(dt) {
    if (phase === 'play') {
      nextFan -= dt; nextPhotog -= dt;
      if (nextFan <= 0) { spawnFan(); nextFan = Infinity; }   // фанат — максимум один раз за матч
      if (nextPhotog <= 0) {
        if (photogs.length < 3) {
          let tx = rnd(70, 890);
          for (let i = 0; i < 6 && CREW_X.some(cx => Math.abs(cx - tx) < 34); i++) tx = rnd(70, 890);
          spawnPhotog(tx, rnd(8, 16));
        }
        nextPhotog = rnd(6, 14);
      }
    }
    updateFans(dt);
    updatePhotogs(dt);
  }

  // ----- после финального свистка: обе команды строятся в ряд перед фотографами -----
  const LINE_Y = H - 46;
  function startPhoto() {
    phase = 'photo'; photoT = 0; photoHold = 0;
    pen = null; fk = null; thr = null; ctrl = null;
    teams.forEach((team, t) => {
      team.forEach(p => { p.down = 0; p.slide = 0; p.kickT = 0; p.pendingSub = false; });
      const order = team.slice().sort((a, b) => a.x - b.x);
      order.forEach((p, i) => { p.slot = { x: W / 2 + (t === 0 ? -34 - (10 - i) * 16.6 : 34 + i * 16.6), y: LINE_Y }; });
    });
    [-170, -110, -60, 60, 110, 170].forEach(dx => spawnPhotog(W / 2 + dx, 999, true));   // место у центра занято камерой
    setFlash('fullTime'); flash = 3;
    const sk = document.getElementById('skipBtn');
    if (sk) sk.parentElement.classList.add('m-photo');
  }
  function updatePhoto(dt) {
    photoT += dt;
    flash = Math.max(0, flash - dt);
    let allIn = true;
    teams.forEach(team => team.forEach(p => {
      stepTo(p, p.slot.x, p.slot.y, 95, dt);
      if (Math.hypot(p.slot.x - p.x, p.slot.y - p.y) > 1.5) allIn = false; else { p.ax = 0; p.ay = 1; }
    }));
    if (ref) stepTo(ref, W / 2, LINE_Y, 85, dt);
    updateFans(dt); updatePhotogs(dt);
    const here = photogs.filter(g => g.state === 'stay' && g.life > 100).length >= 4;
    if (allIn && here) photoHold += dt;
    if (photoHold > 4 || photoT > 16) finish();
  }

  function update(dt) {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; startPhoto(); return; }
    flash = Math.max(0, flash - dt);
    kickCd -= dt; cpuCd[0] -= dt; cpuCd[1] -= dt; tackleCd[0] -= dt; tackleCd[1] -= dt;
    teams.forEach(team => team.forEach(p => { p.down = Math.max(0, p.down - dt); }));
    teams.forEach((team, t) => team.forEach(p => { if (p.pendingSub && p.down <= 0) injurySub(t, p); }));

    if (pen) { updatePen(dt); return; }
    if (fk) { updateFK(dt); return; }
    if (thr) { updateThrow(dt); return; }

    // ввод: джойстик или стрелки/WASD
    let dx = joy.x, dy = joy.y;
    const kx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    const ky = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); dx = kx / l; dy = ky / l; }
    if (auto) { const ai = autoInput(dt); dx = ai.dx; dy = ai.dy; keys.Space = ai.shoot; if (ai.pass) passPulse = true; }
    const mag = Math.min(1, Math.hypot(dx, dy));

    selectCtrl(mag, dt);
    if (!ctrl) return;

    // подкат: короткий рывок вперёд, игрок падает
    if (slidePulse && ctrl.slide <= 0 && ctrl.down <= 0) { ctrl.slide = .55; ctrl.hit = false; }
    slidePulse = false;

    if (ctrl.slide > 0) {
      ctrl.slide -= dt;
      const v = 170 * Math.max(0, ctrl.slide / .55);
      ctrl.x += ctrl.ax * v * dt; ctrl.y += ctrl.ay * v * dt;
      ctrl.x = cl(ctrl.x, 4, W - 4); ctrl.y = cl(ctrl.y, 4, H - 4);
      if (!ctrl.hit) {
        const victim = nearestOpp(ctrl, 14);
        if (victim) { ctrl.hit = true; resolveTackle(ctrl, victim); }
      }
    } else if (mag > .15) {
      const l = Math.hypot(dx, dy);
      ctrl.ax = dx / l; ctrl.ay = dy / l;
      const sp = (30 + ctrl.pace * .35) * mag * (keys.Sprint ? SPRINT : 1);
      ctrl.x += ctrl.ax * sp * dt; ctrl.y += ctrl.ay * sp * dt;
    }
    if (!ctrl || pen || fk) return;   // подкат мог назначить пенальти или фол
    ctrl.x = cl(ctrl.x, 4, W - 4); ctrl.y = cl(ctrl.y, 4, H - 4);

    // удар и пас
    if (keys.Space && kickCd <= 0 && ctrl.slide <= 0 && dist(ctrl, ball) < 16) {
      if (mag > .15) kick(ctrl.ax, ctrl.ay, 120 + ctrl.shot * .5, 0);
      else kick(W - ball.x, H / 2 - ball.y, 120 + ctrl.shot * .5, 0);
      kickCd = .4; ctrl.kickT = .3;
    }
    if (passPulse && dist(ctrl, ball) < 18) passFrom(ctrl, teams[0]);
    passPulse = false;

    // остальные игроки
    teams.forEach((team, t) => {
      let chaser = null, cd = Infinity;
      alive(team).forEach((p, i) => {
        if (i === 0 || p === ctrl) return;
        const d = dist(p, ball);
        if (d < cd) { cd = d; chaser = p; }
      });
      team.forEach((p, i) => {
        if (p === ctrl || p.down > 0) return;
        if (i === 0) {  // вратарь у ворот, выбегает на мяч рядом с штрафной
          const gx = t === 0 ? 8 : W - 8;
          if (dist(p, ball) < 45) stepTo(p, ball.x, ball.y, 45, dt);
          else stepTo(p, gx, cl(ball.y, GT, GB), 40, dt);
        } else if (p === chaser) {
          stepTo(p, ball.x, ball.y, 30 + p.pace * .3, dt);
        } else if (p.slide <= 0) {
          const tg = formTarget(p);
          stepTo(p, tg.x, tg.y, 22 + p.pace * .22, dt);
        }
      });

      // ИИ иногда делает подкат, если рядом соперник с мячом
      if (chaser && tackleCd[t] <= 0 && dist(chaser, ball) < 12 && Math.random() < .08) {
        const v = nearestOpp(chaser, 11);
        if (v) {
          tackleCd[t] = 2;
          resolveTackle(chaser, v);
        }
      }

      // удар ИИ у мяча
      const kicker = alive(team).find((p, i) => i > 0 && p !== ctrl && dist(p, ball) < 12);
      if (kicker && cpuCd[t] <= 0 && !fk && !pen && !thr) {
        const goalX = t === 0 ? W : 0;
        const inZone = t === 0 ? ball.x > W * .55 : ball.x < W * .45;
        if (inZone) aimAt(goalX, 120 + kicker.shot * .5, 50, t);
        else aimAt(goalX, 80 + kicker.shot * .4, 90, t);
        cpuCd[t] = 1.2; kicker.kickT = .3;
      }
    });
    if (pen || fk || thr) return;

    // касания мяча и движение мяча
    teams.forEach(team => team.forEach(touch));
    if (ballPhysics(dt) === 'out') startThrow();
  }

  // ----- авто-игра и управление -----
  function setAuto(v) {
    auto = v;
    if (v) setFlash('autoOn');
    const b = document.getElementById('autoBtn');
    if (b) b.classList.toggle('on', v);
  }
  function inputNow() {
    lastInput = performance.now();
    if (auto) setAuto(false);
  }
  // решения вместо игрока: бежать к мячу; у мяча — пас или удар к воротам соперника
  function autoInput(dt) {
    const out = { dx: 0, dy: 0, shoot: false, pass: false };
    autoCd -= dt;
    if (!ctrl) return out;
    const bx = ball.x - ctrl.x, by = ball.y - ctrl.y, bl = Math.hypot(bx, by) || 1;
    if (dist(ctrl, ball) > 14) { out.dx = bx / bl; out.dy = by / bl; return out; }
    const gx = W - ball.x, gy = H / 2 - ball.y, gl = Math.hypot(gx, gy) || 1;
    out.dx = gx / gl; out.dy = gy / gl;
    if (autoCd <= 0) { autoCd = .5; if (Math.random() < .4) out.pass = true; else out.shoot = true; }
    return out;
  }

  // ----- отрисовка: камера телетрансляции, поле видно под углом 40° -----
  const TILT = Math.sin(40 * Math.PI / 180);   // сжатие по вертикали = синус угла камеры
  const PERSP = .3;                             // перспектива: ближняя к зрителю часть поля крупнее
  function proj(x, y) {
    const f = 1 + PERSP * (y / H - .5), z = CAM.zoom;
    return { x: VW / 2 + (x - camX) * z * f, y: VH / 2 + (y - camY) * z * TILT * f, s: z * f };
  }
  function poly(pts, fill, stroke) {
    c.beginPath();
    pts.forEach((q, i) => (i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y)));
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1.4; c.lineJoin = 'round'; c.stroke(); }
  }
  function drawField() {
    for (let x = 0, i = 0; x < W; x += 8, i++) {
      poly([proj(x, 0), proj(x + 8, 0), proj(x + 8, H), proj(x, H)], i % 2 ? '#6fb85a' : '#7cc46a');
    }
    const rect = (x0, y0, x1, y1) => [proj(x0, y0), proj(x1, y0), proj(x1, y1), proj(x0, y1)];
    const ln = '#ffffff';
    poly(rect(0, 0, W, H), null, ln);
    poly(rect(0, H / 2 - BOX_H / 2, BOX_W, H / 2 + BOX_H / 2), null, ln);
    poly(rect(W - BOX_W, H / 2 - BOX_H / 2, W, H / 2 + BOX_H / 2), null, ln);
    poly([proj(W / 2, 0), proj(W / 2, H)], null, ln);
    const circ = [];
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * Math.PI * 2;
      circ.push(proj(W / 2 + Math.cos(a) * H * .15, H / 2 + Math.sin(a) * H * .15));
    }
    poly(circ, null, ln);
  }
  // ворота: белые стойки и перекладина, сетка на задней и боковых стенках; dir — куда уходит сетка от линии ворот
  function drawGoal(x0, dir) {
    const LIFT = 26, back = x0 + dir * 14;
    const at = (x, y, h) => { const q = proj(x, y); return { x: q.x, y: q.y - h * q.s, s: q.s }; };
    // сетка: заливка и узор
    poly([proj(back, GT), proj(back, GB), at(back, GB, LIFT), at(back, GT, LIFT)], 'rgba(255,255,255,.16)', null);
    c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = .7;
    c.beginPath();
    for (let k = 0; k <= 8; k++) {                          // вертикали сетки
      const y = GT + (GB - GT) * k / 8;
      const b = proj(back, y), t = at(back, y, LIFT);
      c.moveTo(b.x, b.y); c.lineTo(t.x, t.y);
    }
    for (let j = 0; j <= 5; j++) {                          // горизонтали сетки
      const h = LIFT * j / 5, a = at(back, GT, h), b = at(back, GB, h);
      c.moveTo(a.x, a.y); c.lineTo(b.x, b.y);
    }
    for (const y of [GT, GB]) {                             // сетка по верхнему краю и бокам
      const a = at(x0, y, LIFT), b = at(back, y, LIFT);
      c.moveTo(a.x, a.y); c.lineTo(b.x, b.y);
      const p0 = proj(x0, y), p1 = proj(back, y);
      c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y);
    }
    for (let k = 1; k < 5; k++) {                           // вертикальные нити боковых стенок
      const h = LIFT * k / 5, a = at(x0, GT, h), b = at(back, GT, h), d = at(x0, GB, h), e = at(back, GB, h);
      c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.moveTo(d.x, d.y); c.lineTo(e.x, e.y);
    }
    c.stroke();
    // белые стойки и перекладина
    c.strokeStyle = '#ffffff'; c.lineCap = 'round';
    const q1 = proj(x0, GT), q2 = proj(x0, GB), t1 = at(x0, GT, LIFT), t2 = at(x0, GB, LIFT);
    c.lineWidth = 2.2 * q1.s;
    c.beginPath(); c.moveTo(q1.x, q1.y); c.lineTo(t1.x, t1.y); c.moveTo(q2.x, q2.y); c.lineTo(t2.x, t2.y); c.stroke();
    c.beginPath(); c.moveTo(t1.x, t1.y); c.lineTo(t2.x, t2.y); c.stroke();
    c.lineWidth = 1; c.strokeStyle = '#ffffff';
  }
  function drawBall() {
    const q = proj(ball.x, ball.y);
    c.fillStyle = 'rgba(0,0,0,.3)';
    c.beginPath(); c.ellipse(q.x, q.y + 1, 3 * q.s, 1.2 * q.s, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath(); c.arc(q.x, q.y - 2.5 * q.s, 2.5 * q.s, 0, Math.PI * 2); c.fill();
  }
  // чёрная камера на стойке с оператором, как на стадионах; стоит за боковой линией
  function drawCrew(x, y) {
    const q = proj(x, y), s = q.s;
    c.fillStyle = '#121316'; c.fillRect(q.x - 12 * s, q.y - 6 * s, 24 * s, 6 * s);             // основание
    c.fillStyle = '#23262d'; c.fillRect(q.x - 2.2 * s, q.y - 34 * s, 4.4 * s, 28 * s);        // стойка
    c.fillStyle = '#0b0c0e'; c.fillRect(q.x - 9 * s, q.y - 42 * s, 18 * s, 9 * s);            // кабина
    c.fillStyle = '#000000'; c.beginPath(); c.arc(q.x + 10 * s, q.y - 38 * s, 4 * s, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(120,150,200,.55)'; c.beginPath(); c.arc(q.x + 9 * s, q.y - 39 * s, 1.4 * s, 0, Math.PI * 2); c.fill();
  }
  // фотограф: пиксельная фигура как у игроков; идёт к месту, стоит и снимает; вспышка у камеры
  function drawPhotog(g) {
    const moving = g.state === 'in' || g.state === 'out';
    const frame = moving ? ((performance.now() / 420 | 0) % 2 ? 'walk2' : 'walk') : 'stand';
    const flip = g.tx < g.x;
    drawFig(g.x, g.y, { skin: g.skin, hair: g.hair, color: g.vest, shorts: '#22262e' }, frame, { cam: true, back: !g.top }, flip);
    if (g.fl > 0) {                                        // вспышка у камеры
      const q = proj(g.x, g.y), s = q.s, a = Math.min(1, g.fl / .15), fx = q.x + (flip ? -4 : 4) * s, fy = q.y - 13 * s, r = 11 * s;
      const gr = c.createRadialGradient(fx, fy, 0, fx, fy, r);
      gr.addColorStop(0, 'rgba(255,255,255,' + a + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(fx, fy, r, 0, Math.PI * 2); c.fill();
    }
  }
  // фигура толпы на поле: спрайт 16×24 с текущей позой; y — ноги
  function drawFig(x, y, look, frame, o, flip) {
    const q = proj(x, y), s = q.s;
    const spr = getCrowdSprite(look, frame, o, flip);
    const w = SPR_W * s, h = SPR_H * s;
    c.imageSmoothingEnabled = false;
    c.drawImage(spr, q.x - w / 2, q.y + 5 * s - h, w, h);
    c.imageSmoothingEnabled = true;
  }
  function drawFan(f) {                                    // болельщики только бегут
    drawFig(f.x, f.y, { skin: f.skin, hair: f.hair, color: f.color, shorts: f.shorts },
      (performance.now() / 160 | 0) % 2 ? 'run2' : 'run1', {}, f.ax < 0);
  }
  function drawSteward(s) {                                // охрана: бежит, идёт за фанатом или хватает его
    const f = fans[0];
    const grab = s.state === 'chase' && !!f && Math.hypot(s.x - f.x, s.y - f.y) < 14;
    let frame = 'stand';
    if (!grab && s.state === 'escort') frame = (performance.now() / 260 | 0) % 2 ? 'walk2' : 'walk';
    else if (!grab && s.state === 'chase') frame = (performance.now() / 160 | 0) % 2 ? 'run2' : 'run1';
    drawFig(s.x, s.y, { skin: s.skin, hair: s.hair, color: s.color, shorts: s.shorts }, frame, { grab }, s.ax < 0);
  }
  // операторы у камер: нижние — со спины, верхние — спереди; в жилетах; стоят, сидят, медленно ходят
  const OP_VEST = '#f08a1c';
  let ops = [];
  function initOps() {
    ops = [];
    CREW_X.forEach(cx => {
      const look = { skin: pickOf(SKINS), hair: pickOf(HAIRS), color: '#2b2b2b', shorts: '#1a1a1a' };
      [{ y: H + 16, back: true }, { y: -8, back: false }].forEach(v => ops.push({
        x: cx - 18, y: v.y, back: v.back, look, lo: cx - 40, hi: cx - 14, speed: 9, dir: 1,
        mode: 'stand', wait: rnd(1, 4), t: 0, frame: 'stand', flip: false
      }));
    });
  }
  // фанат на поле: игра стоит, игроки отходят к бровке и смотрят, судья подходит к фанату;
  // матч возобновляется, когда охрана поймала фаната и увела его с поля
  let fanHalt = false;
  function updateHalt(dt) {
    const f = fans[0];
    teams.forEach(team => team.forEach(p => {
      stepTo(p, cl(p.x, 60, W - 60), p.y < H / 2 ? -26 : H + 26, 70, dt);
      if (f) p.ax = f.x < p.x ? -1 : 1;                   // смотрят в сторону фаната
    }));
    if (ref && f) stepTo(ref, cl(f.x, 60, W - 60), cl(f.y, 40, H - 40), 85, dt);
    updateFans(dt); updatePhotogs(dt);
    if (!fans.length) fanHalt = false;                    // фаната увели — матч продолжается
  }
  function updateOps(dt) {
    ops.forEach(o => {
      o.t += dt; o.wait -= dt;
      if (o.wait <= 0) {
        const r = Math.random();
        o.mode = r < .4 ? 'stand' : r < .7 ? 'sit' : 'walk';
        o.wait = o.mode === 'stand' ? 4 + Math.random() * 3 : o.mode === 'sit' ? 5 + Math.random() * 4 : 4 + Math.random() * 2;
        if (o.mode === 'walk') o.dir = Math.random() < .5 ? 1 : -1;
      }
      if (o.mode === 'walk') {
        o.x += o.dir * o.speed * dt;
        if (o.x < o.lo || o.x > o.hi) { o.dir = -o.dir; o.x = Math.max(o.lo, Math.min(o.hi, o.x)); }
        o.flip = o.dir < 0;
        o.frame = (o.t / .8 | 0) % 2 ? 'walk2' : 'walk';
      } else { o.frame = 'stand'; o.flip = false; }
    });
  }
  function drawOp(o) {
    drawFig(o.x, o.y, o.look, o.frame, { back: o.back, vest: OP_VEST, sit: o.mode === 'sit' }, o.flip);
  }
  // судья: бежит вдоль линии за мячом, в чёрной форме
  function updateRef(dt) {
    if (!ref) ref = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, spd: 0, skin: '#a86d43', hair: '#111111', num: '', label: '', down: 0, slide: 0, kickT: 0 };
    const tx = W / 2 + (ball.x - W / 2) * .55, ty = Math.max(50, Math.min(H - 50, ball.y));
    const dx = tx - ref.x, dy = ty - ref.y, d = Math.hypot(dx, dy), step = Math.min(d, 85 * dt);
    if (d > 0) { ref.x += dx / d * step; ref.y += dy / d * step; }
  }
  function marker(p) {                          // жёлтый треугольник над управляемым игроком
    if (p.down > 0 || p.slide > 0) return;
    const q = proj(p.x, p.y), top = q.y + 5 * q.s - SPR_H * q.s;
    c.fillStyle = '#ffd200';
    c.beginPath();
    c.moveTo(q.x, top - 10 * q.s); c.lineTo(q.x - 3 * q.s, top - 15 * q.s); c.lineTo(q.x + 3 * q.s, top - 15 * q.s);
    c.fill();
  }
  function player(p, color, shorts) {
    const q = proj(p.x, p.y), s = q.s;
    const lying = p.down > 0 || p.slide > 0;
    let frame = 'stand';
    if (!lying) {
      if (p.kickT > 0) frame = 'kick';
      else if (p.spd > 35) frame = (performance.now() / 110 | 0) % 2 ? 'run2' : 'run1';
      else if (p.spd > 8) frame = (performance.now() / 220 | 0) % 2 ? 'walk2' : 'walk';
    }
    const spr = getSprite(color, p.num, lying, p.skin, frame, shorts, p.hair, !!p.afro);
    let topY;
    c.imageSmoothingEnabled = false;                      // игроки остаются пиксельными
    if (lying) {
      const w = SPR_H * s, h = SPR_W * s;
      c.drawImage(spr, q.x - w / 2, q.y - h / 2, w, h);
      topY = q.y - h / 2;
    } else {
      const w = SPR_W * s, h = SPR_H * s;
      c.drawImage(spr, q.x - w / 2, q.y + 5 * s - h, w, h);
      topY = q.y + 5 * s - h;
    }
    c.imageSmoothingEnabled = true;
    if (phase !== 'photo') {                                  // в построении подписи не нужны
      c.font = Math.round(5 * s) + 'px monospace'; c.textAlign = 'center';
      c.fillStyle = '#000'; c.fillText(p.label, q.x + 1, topY - 1);
      c.fillStyle = '#fff'; c.fillText(p.label, q.x, topY - 2);
    }
  }

  function draw() {
    c.setTransform(RES, 0, 0, RES, 0, 0);
    c.fillStyle = '#2a2e35'; c.fillRect(0, 0, VW, VH);       // трибуны и асфальт за полем
    drawField();
    drawGoal(0, -1); drawGoal(W, 1);
    // игроки, мяч, судья и камеры — от дальних к ближним, чтобы ближние перекрывали дальних
    const items = [{ y: ball.y, fn: drawBall }];
    [150, 480, 810].forEach(x => {                            // операторы за обеими боковыми линиями
      items.push({ y: -12, fn: () => drawCrew(x, -12) });
      items.push({ y: H + 12, fn: () => drawCrew(x, H + 12) });
    });
    if (ref) items.push({ y: ref.y, fn: () => player(ref, '#1c1c1c', '#1c1c1c') });
    ops.forEach(o => items.push({ y: o.y, fn: () => drawOp(o) }));
    fans.forEach(f => items.push({ y: f.y, fn: () => drawFan(f) }));
    stewards.forEach(s => items.push({ y: s.y, fn: () => drawSteward(s) }));
    photogs.forEach(g => items.push({ y: g.y, fn: () => drawPhotog(g) }));
    teams.forEach((team, t) => team.forEach((p, i) => {
      if (p === ctrl) return;
      items.push({ y: p.y, fn: () => player(p, i === 0 ? GK_COLOR : (t === 0 ? cfg.myColor : cfg.oppColor), i === 0 ? '#111111' : (t === 0 ? cfg.myShorts : cfg.oppShorts)) });
    }));
    if (ctrl) items.push({ y: ctrl.y, fn: () => { player(ctrl, ctrl === teams[0][0] ? GK_COLOR : cfg.myColor, ctrl === teams[0][0] ? '#111111' : cfg.myShorts); marker(ctrl); } });
    items.sort((a, b) => a.y - b.y).forEach(it => it.fn());

    // надписи на экране (без камеры)
    c.setTransform(RES, 0, 0, RES, 0, 0);
    if (flash > 0) {
      c.font = 'bold 22px monospace'; c.textAlign = 'center'; c.fillStyle = '#ffd200';
      c.fillText(T[cfg.lang][flashKey], VW / 2, flashKey === 'fullTime' ? 80 : 34);
    }
    if (pen && !pen.shot && pen.t === 0) {   // подсказка при пенальти у человека
      c.font = '12px monospace'; c.textAlign = 'center'; c.fillStyle = '#ffd200';
      c.fillText('⚽ ' + T[cfg.lang].pen, VW / 2, VH - 8);
    }
    document.getElementById('hTime').textContent = `${T[cfg.lang].time}: ${Math.ceil(timeLeft)}`;
    document.getElementById('hScore').textContent = `${cfg.myClub} ${score.me} : ${score.cpu} ${cfg.oppClub}`;
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (!subOpen && !matchMedia('(orientation: portrait)').matches) {
      if (!auto && now - lastInput > IDLE_MS) setAuto(true);   // никто не касался — играет авто-игра
      const k = auto ? AUTO_SPEED : 1;
      if (phase === 'photo') { updatePhoto(dt); updateCam(dt); updateOps(dt); }
      else if (fanHalt) { updateHalt(dt * k); updateCam(dt * k); updateOps(dt * k); }
      else { update(dt * k); if (phase === 'play') updateRef(dt * k); updateAmbient(dt * k); updateCam(dt * k); updateOps(dt * k); }
    }
    // скорость и таймер удара для выбора позы спрайта
    teams.forEach(team => team.forEach(p => {
      p.spd = Math.hypot(p.x - p.px, p.y - p.py) / Math.max(dt, .001);
      p.px = p.x; p.py = p.y;
      p.kickT = Math.max(0, p.kickT - dt);
    }));
    if (ref) { ref.spd = Math.hypot(ref.x - ref.px, ref.y - ref.py) / Math.max(dt, .001); ref.px = ref.x; ref.py = ref.y; }
    fans.concat(stewards, photogs).forEach(q => { q.spd = Math.hypot(q.x - q.px, q.y - q.py) / Math.max(dt, .001); q.px = q.x; q.py = q.y; });
    if (running) { draw(); raf = requestAnimationFrame(frame); }
  }

  function start(el, config) {
    stop();
    cfg = config; running = true; keys = {}; joy = { x: 0, y: 0 }; joyId = null;
    auto = false; autoCd = 0; lastInput = performance.now();
    passPulse = false; slidePulse = false; switchPulse = false;
    const a = makeTeam(cfg.mySquad, 0, tacticMods(cfg.tactic, cfg.coach)), b = makeTeam(cfg.oppSquad, 1, null);
    teams = [a.slice(0, 11), b.slice(0, 11)];
    benches = [a.slice(11).filter(p => !p.inj), b.slice(11).filter(p => !p.inj)];
    injuries = [];
    subsLeft = 3; subOpen = false; subPick = null;
    score = { me: 0, cpu: 0 };
    phase = 'play'; photoT = 0; photoHold = 0; finishing = false; fans = []; stewards = []; photogs = []; initOps(); fanHalt = false; nextFan = Math.random() < .3 ? rnd(12, 70) : Infinity; nextPhotog = rnd(3, 8);
    timeLeft = DUR; kickCd = 0; cpuCd = [0, 0]; tackleCd = [0, 0]; flash = 0; pen = null;
    fk = null; thr = null; lastTeam = 0; switchCd = 0;
    kickoff();

    const tx = T[cfg.lang];
    el.innerHTML = `
      <div class="m-screen">
        <canvas id="pitch" width="${VW * RES}" height="${VH * RES}"></canvas>
        <div class="m-hud"><span id="hTime"></span><span id="hScore"></span></div>
        <button class="m-top-btn m-sub-btn" id="subBtn">${tx.sub}</button>
        <button class="m-top-btn m-auto-btn" id="autoBtn">${tx.auto}</button>
        <button class="m-top-btn m-fs" id="fsBtn">⛶</button>
        <button class="m-top-btn m-exit" id="exitBtn">${tx.exit}</button>
        <button class="m-top-btn m-skip" id="skipBtn">${tx.next}</button>
        <div class="m-sub-panel" id="subPanel"></div>
        <div class="m-joy" id="joyZone"><div class="joy-base" id="joyBase"></div><div class="joy-knob" id="joyKnob"></div></div>
        <div class="m-btns">
          <button class="round b-sw" id="btnSwitch">${tx.switchP}</button>
          <button class="round b-sp" id="btnSprint">${tx.sprint}</button>
          <button class="round b-sl" id="btnSlide">${tx.slide}</button>
          <button class="round b-pa" id="btnPass">${tx.pass}</button>
          <button class="round big b-sh" id="btnShoot">⚽</button>
        </div>
      </div>
      <div class="rotate">${tx.rotate}</div>`;

    c = el.querySelector('#pitch').getContext('2d');
    c.imageSmoothingEnabled = true;

    el.querySelector('#skipBtn').onclick = () => finish();
    el.querySelector('#exitBtn').onclick = () => { stop(); go('hub'); };
    el.querySelector('#subBtn').onclick = () => { if (!pen) openSub(); };
    el.querySelector('#autoBtn').onclick = () => setAuto(!auto);
    el.querySelector('#fsBtn').onclick = () => {
      const d = document.documentElement;
      if (d.requestFullscreen) d.requestFullscreen().catch(() => {});
    };

    // джойстик: плавающий, появляется там, где касается палец
    const zone = el.querySelector('#joyZone');
    const base = el.querySelector('#joyBase'), knob = el.querySelector('#joyKnob');
    const show = (x, y) => {
      base.style.display = knob.style.display = 'block';
      base.style.left = knob.style.left = x + 'px';
      base.style.top = knob.style.top = y + 'px';
    };
    const hide = () => {
      base.style.display = knob.style.display = 'none';
      joy = { x: 0, y: 0 }; joyId = null;
    };
    zone.addEventListener('pointerdown', e => {
      inputNow();
      joyId = e.pointerId;
      const r = zone.getBoundingClientRect();
      ox = e.clientX; oy = e.clientY;
      show(ox - r.left, oy - r.top);
      zone.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== joyId) return;
      const dx = e.clientX - ox, dy = e.clientY - oy, d = Math.hypot(dx, dy) || 1;
      const m = Math.min(d, 50), r = zone.getBoundingClientRect();
      joy = { x: dx / d * m / 50, y: dy / d * m / 50 };
      knob.style.left = (ox - r.left + dx / d * m) + 'px';
      knob.style.top = (oy - r.top + dy / d * m) + 'px';
    });
    ['pointerup', 'pointercancel'].forEach(ev => zone.addEventListener(ev, e => { if (e.pointerId === joyId) hide(); }));

    // кнопки удара, спринта, паса, подката и смены игрока
    const hold = (sel, key) => {
      const b = el.querySelector(sel);
      b.addEventListener('pointerdown', e => { inputNow(); keys[key] = true; e.preventDefault(); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { keys[key] = false; }));
    };
    hold('#btnShoot', 'Space');
    hold('#btnSprint', 'Sprint');
    el.querySelector('#btnPass').addEventListener('pointerdown', e => { inputNow(); passPulse = true; e.preventDefault(); });
    el.querySelector('#btnSlide').addEventListener('pointerdown', e => { inputNow(); slidePulse = true; e.preventDefault(); });
    el.querySelector('#btnSwitch').addEventListener('pointerdown', e => { inputNow(); switchPulse = true; e.preventDefault(); });

    addEventListener('keydown', onKey);
    addEventListener('keyup', onKeyUp);
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  // команды тестировщика: доступны только через скрытое меню
  return { start, stop, dbg: {
    spawnFan: () => { if (phase === 'play' && !fans.length) spawnFan(); },
    endNow: () => { timeLeft = 0.01; }
  } };
})();

</script>
</body>
</html>
