<script>
// ===== Карьера игрока: один футболист, свободный агент, контракты, тренировки-мини-игра; штатом и составом управляет клуб =====
const HSTAT = k => ({ pace: tc('Скорость', 'Жылдамдық'), shot: tc('Удар', 'Соққы'), pass: tc('Пас', 'Пас'), def: tc('Защита', 'Қорғаныс') })[k];
let HERO_PICK = null, HERO_SCENE = null, HT = null;
const heroObj = () => S.squads[S.me].find(p => p.id === 'hero');
function heroSync() {
  const h = S.hero, p = S.squads[S.me].find(x => x.id === 'hero');
  if (p) { ['pace', 'shot', 'pass', 'def', 'ovr'].forEach(k => { p[k] = h[k]; }); }
}
// тренер решает, ставить ли игрока в старт; возвращает true, если он в основе и здоров
function heroLineup() {
  const h = S.hero, sq = S.squads[S.me];
  const hi = sq.findIndex(p => p.id === 'hero');
  if (hi < 0) return false;
  const hp = sq[hi], fit = hp.inj <= 0;
  const same = sq.map((p, i) => i).filter(i => i < 11 && i !== hi && sq[i].pos === h.pos);
  const weakest = same.length ? Math.min(...same.map(i => sq[i].ovr)) : 0;
  const wants = fit && h.ovr + h.pop / 20 >= weakest;
  if (wants && hi >= 11) {
    const j = same.length ? same.reduce((a, b) => sq[a].ovr <= sq[b].ovr ? a : b) : sq.findIndex((p, i) => i > 0 && i < 11);
    if (j >= 0) [sq[hi], sq[j]] = [sq[j], sq[hi]];
  } else if (!wants && hi < 11) {
    let j = -1;
    sq.forEach((p, i) => { if (i >= 11 && p.inj <= 0 && p.pos === h.pos && (j < 0 || p.ovr > sq[j].ovr)) j = i; });
    if (j < 0) sq.forEach((p, i) => { if (i >= 11 && p.inj <= 0 && (h.pos === 'GK' || p.pos !== 'GK') && (j < 0 || p.ovr > sq[j].ovr)) j = i; });
    if (j >= 0) [sq[hi], sq[j]] = [sq[j], sq[hi]];
  }
  return sq.findIndex(p => p.id === 'hero') < 11 && fit;
}
const heroFit = c => S.hero.ovr + S.hero.pop / 5 >= c.ovr - 12;               // клуб берёт по рейтингу и популярности
const heroSalary = c => Math.round(((S.hero.ovr - 40) * 6e5 + S.hero.pop * 2e5 + (c.ovr - 60) * 2e5) / 1e5) * 1e5;
function heroOfferIds() {
  let ok = CLUBS.filter(heroFit);
  if (!ok.length) ok = [CLUBS.slice().sort((a, b) => a.ovr - b.ovr)[0]];
  return ok.sort(() => Math.random() - .5).slice(0, 3).map(c => c.id);
}
function heroAfterMatch(out) {

  heroSync();
}

<script>
// ===== Сетевая игра: короткий код из 6 символов. Соединение через открытый брокер PeerJS (нужен интернет на обоих телефонах).
// Свой сервер не нужен: брокер только знакомит двух игроков, дальше данные идут напрямую между телефонами.
const NET_PREFIX = 'steppe-manager-';                       // к коду добавляется префикс, чтобы идентификатор был уникален в общей сети
const NET_CODE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let NET = null;                        // { role: 'host'|'guest', peer, c, g, code, ready }
let NET_CFG = null, NET_RESULT = null;
const NETCTL = { onMsg: null };        // сообщения между матчами: старт, и т.п.
const netIsView = () => /^net/.test(($('#app') && $('#app').className || '').replace('v-', ''));

// передача по каналу, если он открыт
function netPost(ch, obj) { try { if (ch && ch.readyState === 'open') ch.send(JSON.stringify(obj)); } catch (e) {} }
function netCode6() {
  const a = new Uint32Array(6); crypto.getRandomValues(a);
  let s = ''; for (const x of a) s += NET_CODE_CHARS[x % NET_CODE_CHARS.length];
  return s;
}
function netCopy(id) {
  const ta = document.getElementById(id); if (!ta) return;
  ta.select();
  try { navigator.clipboard.writeText(ta.value).catch(() => document.execCommand('copy')); } catch (e) { try { document.execCommand('copy'); } catch (x) {} }
}

// ----- PeerJS: открываем свой идентификатор у брокера
function netOpenPeer(id) {
  return new Promise((res, rej) => {
    if (typeof Peer === 'undefined') return rej({ type: 'nolib' });
    const p = id ? new Peer(id, { debug: 0 }) : new Peer({ debug: 0 });
    let done = false;
    p.on('open', () => { done = true; res(p); });
    p.on('error', e => { if (!done) { done = true; try { p.destroy(); } catch (x) {} rej(e); } else netPeerError(e); });
  });
}
// ошибки брокера и соединения: понятный текст и возврат на нужный экран
function netPeerError(e) {
  const type = e && e.type;
  if (!NET || type === 'unavailable-id') return;   // сессии уже нет или код занят: ничего не делаем                  // такой код уже занят — хост выберет другой
  const guest = NET && NET.role === 'guest' && !NET.ready;
  NET_LOST_MSG = type === 'peer-unavailable' ? tc('Игра с таким кодом не найдена.', 'Мұндай кодпен ойын табылмады.')
    : type === 'nolib' ? tc('Сетевой модуль не загрузился. Нужен интернет.', 'Желілік модуль жүктелмеді. Интернет қажет.')
    : type === 'network' || type === 'server-error' || type === 'socket-error' || type === 'socket-closed' || type === 'browser-incompatible'
      ? tc('Нет связи с сервером соединений. Проверьте интернет.', 'Қосылу серверімен байланыс жоқ. Интернетті тексеріңіз.')
      : tc('Соединение не удалось. Попробуйте ещё раз.', 'Қосылу сәтсіз. Қайта көріңіз.');
  if (NET && NET.ready) return;                           // во время игры решает netLost
  netLeave();

}
// обёртка над соединением PeerJS: тот же интерфейс, что у RTCDataChannel (send, readyState, onmessage, onopen, onclose)
function netWrap(conn) {
  const w = { conn, onmessage: null, onopen: null, onclose: null,
    get readyState() { return conn.open ? 'open' : 'closed'; },
    send(str) { conn.send(str); } };
  conn.on('data', d => { if (w.onmessage) w.onmessage({ data: d }); });
  conn.on('open', () => { if (w.onopen) w.onopen(); });
  conn.on('close', () => { if (w.onclose) w.onclose(); });
  return w;
}

// ----- соединение
function netWireChannels() {
  if (!NET || !NET.c) return;
  const c = NET.c;
  c.onmessage = e => { let m = null; try { m = JSON.parse(e.data); } catch (x) {} if (m && NETCTL.onMsg) NETCTL.onMsg(m); };
  c.onopen = () => netOpened();
  c.onclose = () => netLost();

}
function netOpened() {
  if (!NET || NET.ready) return;
  NET.ready = true;
  if (NET.role === 'host' && /netHost/.test(document.getElementById('app').className)) go('netLobby');
  if (NET.role === 'guest' && /netGuest/.test(document.getElementById('app').className)) go('netWait');
}
function netLost() {
  if (!NET) return;

  if (netIsView()) { NET_LOST_MSG = tc('Связь потеряна. Создайте игру заново.', 'Байланыс үзілді. Ойынды қайта құрыңыз.'); netLeave(); go('net'); }
}
let NET_LOST_MSG = '';
function netLeave() {
  const n = NET; NET = null; NETCTL.onMsg = null;
  if (n) setTimeout(() => { try { n.c && n.c.conn.close(); n.g && n.g.conn.close(); n.peer && n.peer.destroy(); } catch (e) {} }, 300);
}

// хост: открывает игру под коротким кодом и ждёт гостя
async function netHostCreate() {
  netLeave();
  NET = { role: 'host', peer: null, c: null, g: null, code: '', ready: false };
  NETCTL.onMsg = netHostMsg;
  go('netHost');                                          // сразу показываем экран, код появится, когда брокер ответит
  let peer = null;
  for (let i = 0; i < 8 && !peer; i++) {
    const code = netCode6();
    try { peer = await netOpenPeer(NET_PREFIX + code); NET.code = code; }
    catch (e) { if (e && e.type === 'unavailable-id') continue; if (!NET || NET.role !== 'host') return; netPeerError(e); return; }
  }
  if (!peer || !NET || NET.role !== 'host') { if (peer) peer.destroy(); return; }
  NET.peer = peer;
  peer.on('connection', conn => netHostConn(conn));
  peer.on('error', e => netPeerError(e));
  if (/netHost/.test(document.getElementById('app').className)) go('netHost');   // перерисовываем с кодом
}
// хост: принимает два канала гостя — управление ('c') и снимки/нажатия ('g')
function netHostConn(conn) {
  if (!NET || NET.role !== 'host') { conn.close(); return; }
  if (conn.label === 'g') { NET.g = netWrap(conn); return; }
  if (NET.c && NET.c.readyState === 'open') { conn.close(); return; }   // второй гость не нужен
  if (NET.c) { try { NET.c.conn.close(); } catch (e) {} }
  NET.ready = false; NET.c = netWrap(conn);
  netWireChannels();
}
// гость: вводит код, подключает два канала к хосту
async function netGuestAccept(codeRaw) {
  const code = (codeRaw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) { const m = document.getElementById('netMsg'); if (m) m.textContent = tc('Код состоит из 6 символов.', 'Код 6 таңбадан тұрады.'); return; }
  netLeave();
  NET = { role: 'guest', peer: null, c: null, g: null, code, ready: false };
  NETCTL.onMsg = netGuestMsg;
  go('netGuest');
  let peer;
  try { peer = await netOpenPeer(null); }
  catch (e) { netPeerError(e); return; }
  if (!NET || NET.code !== code) { peer.destroy(); return; }
  NET.peer = peer;
  peer.on('error', e => netPeerError(e));
  const c = peer.connect(NET_PREFIX + code, { label: 'c', reliable: true, serialization: 'json' });
  const g = peer.connect(NET_PREFIX + code, { label: 'g', reliable: false, serialization: 'json' });
  NET.c = netWrap(c); NET.g = netWrap(g);
  netWireChannels();
}

  netPost(NET.c, pack);

}

}

      text: tc('Тренируйся и поднимай популярность. Клубы начнут писать.', 'Жаттығып, танымалдылығыңды арттыр. Клубтар жаза бастайды.') },
    { bg: 'stadium', cap: tc('Утро. Газета', 'Таң. Газет'), icon: '📰', cast: ['hero'], sp: 'hero', who: name,
      text: tc('«Новичок из Степи: кто он?» — первая статья о тебе.', '«Дала жаңалығы: ол кім?» — сен туралы алғашқы мақала.') }
  ];
}
function heroArriveSteps(c) {
  const h = S.hero, sc = HERO_SCENE;
  const crowd = h.pop >= 40 ? ['fan1', 'fan2', 'fan3'] : h.pop >= 20 ? ['fan1'] : [];
  return [
    { bg: 'stadium', cap: `${nm(c)}`, cast: [...crowd, 'hero'], who: crowd.length ? tc('Болельщики', 'Жанкүйерлер') : tc('Охранник', 'Күзетші'),
      text: h.pop >= 40 ? tc('Тебя узнали! Кто-то снимает на телефон.', 'Сені таныды! Біреу телефонға түсіріп жатыр.')
        : h.pop >= 20 ? tc('Несколько болельщиков машут шарфами.', 'Бірнеше жанкүйер шарфтарын желпіп тұр.')
        : tc('Охранник показывает дорогу внутрь.', 'Күзетші ішке жолды көрсетеді.') },
    { bg: 'office', cap: tc('Раздевалка', 'Киімшең'), cast: ['coach', 'hero'], sp: 'coach', who: `${tc('Тренер', 'Бапкер')} ${sc.coach}`,
      text: tc('Рады тебя видеть. Будем смотреть на тренировках.', 'Сені көргенімізге қуаныштымыз. Жаттығуларда қараймыз.') },
    { bg: 'office', cap: tc('Кабинет директора', 'Директор кабинеті'), cast: ['ceo', 'hero'], sp: 'ceo', who: `${tc('Директор', 'Директор')} ${sc.ceo}`,
      text: tc(`Добро пожаловать в ${c.name.ru}! Контракт на столе, подписывай, когда будешь готов.`, `${c.name.kz} клубына қош келдің! Келісімшарт үстелде, дайын болғанда қол қой.`) }
  ];
}
function heroSignedSteps(c, starter) {
  const coach = `${tc('Тренер', 'Бапкер')} ${HERO_SCENE.coach}`;
  return [
    { bg: 'field', cap: tc('Подпись', 'Қолтаңба'), cast: ['hero'], sp: 'hero', who: S.hero.name,
      text: tc(`Контракт с ${c.name.ru} подписан. Первая тренировка уже завтра.`, `${c.name.kz} клубымен келісімшарт қол қойылды. Бірінші жаттығу ертең.`) },
    starter
      ? { bg: 'field', cast: ['coach', 'hero'], sp: 'coach', who: coach, text: tc('Ты в основном составе. Не подведи.', 'Сен негізгі құрамдасың. Жолдан таю.') }
      : { bg: 'dark', cast: ['coach', 'hero'], sp: 'coach', who: coach, text: tc('Пока ты на скамейке. Заработай место тренировками.', 'Әзірге скамейкадасың. Жаттығып, орныңды ал.') }
  ];
}
function contractSteps() {
  return { bg: 'office', cap: tc('Контракт', 'Келісімшарт'), cast: ['agent', 'hero'], sp: 'agent', who: tc('Агент', 'Агент'),
    text: tc('Контракт закончился. Ты свободный агент, звонки уже идут.', 'Келісімшарт аяқталды. Сен еркін агентсің, қоңыраулар басталды.') };
}

// --- тренер
// облик тренера: один на всю карьеру (пиксельный бюст, как у штата)
let COACH_LOOK = null;
function coachLookOf() {
  if (S && S.coach) { if (!S.coach.look) S.coach.look = COACH_LOOK || (COACH_LOOK = staffLook('coach')); return S.coach.look; }
  return COACH_LOOK || (COACH_LOOK = staffLook('coach'));
}
// редактор внешности тренера: пол, хиджаб (для женщин), цвет и причёска, цвет спортивки
function coachStyleOpts(gender) {
  return gender === 'f' ? FEMALE_STYLES : MALE_STYLES;
}
function coachLookRead() {
  const v = id => document.getElementById(id)?.value;
  const g = v('ckGender') || 'm';
  return { gender: g, skin: v('ckSkin') || SKIN_OPTS[1][0], hair: v('ckHair') || HAIR_OPTS[2][0], hs: v('ckStyle') || 'short',
    hijab: g === 'f' ? (v('ckHijab') || '') : '', top: v('ckTop') || TRACK_OPTS[0][0], style: 'tracksuit' };
}
function coachLookFormHTML(l) {
  const styles = coachStyleOpts(l.gender);
  const hs = styles.some(x => x[0] === l.hs) ? l.hs : 'short';
  return `<style>#ckWrap canvas.portrait{width:128px;height:128px;image-rendering:pixelated}</style>
    <div style="text-align:center">${portraitHTML({ ...l, hs })}</div>
    <label class="field"><span>${tc('Пол', 'Жынысы')}</span><select id="ckGender" onchange="coachLookChange()">${lookOpts(GENDER_OPTS, l.gender)}</select></label>
    <label class="field"><span>${tc('Цвет кожи', 'Тері түсі')}</span><select id="ckSkin" onchange="coachLookChange()">${lookOpts(SKIN_OPTS, l.skin)}</select></label>
    <label class="field"><span>${tc('Цвет волос', 'Шаш түсі')}</span><select id="ckHair" onchange="coachLookChange()">${lookOpts(HAIR_OPTS, l.hair)}</select></label>
    <label class="field"><span>${tc('Причёска', 'Шаш пішімі')}</span><select id="ckStyle" onchange="coachLookChange()">${lookOpts(styles, hs)}</select></label>
    ${l.gender === 'f' ? `<label class="field"><span>${tc('Хиджаб', 'Хиджаб')}</span><select id="ckHijab" onchange="coachLookChange()">${lookOpts(HIJAB_OPTS, l.hijab || '')}</select></label>` : ''}
    <label class="field"><span>${tc('Цвет спортивки', 'Спорт костюмнің түсі')}</span><select id="ckTop" onchange="coachLookChange()">${lookOpts(TRACK_OPTS, l.top)}</select></label>`;
}
function coachLookChange() {
  const w = document.getElementById('ckWrap');
  if (!w) return;
  w.innerHTML = coachLookFormHTML(coachLookRead());
  drawPortraits(w);
}
VIEWS.coachLook = el => {
  el.innerHTML = `<h2>🎨 ${tc('Внешность тренера', 'Бапкер сыртқы түрі')}</h2>
    <section class="card" id="ckWrap">${coachLookFormHTML(coachLookOf())}</section>
    <button class="big" onclick="coachLookSave()">${tc('Сохранить', 'Сақтау')}</button>
    <button class="ghost big" onclick="coachLookBack()">${t('back')}</button>`;
  drawPortraits(el);
};
function coachLookSave() {
  const l = coachLookRead();
  if (S && S.coach) { S.coach.look = l; save(); return go('coach'); }
  COACH_LOOK = l; go('coachNew');
}
function coachLookBack() { go(S && S.mode === 'coach' ? 'coach' : (S ? 'hub' : 'coachNew')); }

function coachIntroSteps() {
  return [
    { bg: 'night', cap: tc('Ночь. Без клуба', 'Түн. Клубсыз'), cast: ['cme'], sp: 'cme', who: tc('Тренер', 'Бапкер'),
      text: tc('Ты тренер без клуба. Репутация низкая, но клубы уже интересуются.', 'Сен клубсыз бапкерсің. Бедел төмен, бірақ клубтар қызығушылық танытып жатыр.') },
    { bg: 'office', cap: tc('Телефон', 'Телефон'), cast: ['agent', 'cme'], sp: 'agent', who: tc('Агент', 'Агент'),
      text: tc('Есть предложения. Выбирай клуб или договаривайся сам.', 'Ұсыныстар бар. Клуб таңда немесе өзің келіс.') }
  ];
}
function coachArriveSteps(c) {
  return [
    { bg: 'stadium', cap: nm(c), cast: ['cme'], sp: 'cme', who: tc('Тренер', 'Бапкер'),
      text: tc(`Ты приехал в ${c.name.ru}. Поле, трибуны и новая команда.`, `${c.name.kz} клубына келдің. Алаң, трибуналар және жаңа команда.`) },
    { bg: 'office', cap: tc('Кабинет директора', 'Директор кабинеті'), cast: ['ceo', 'cme'], sp: 'ceo', who: tc('Директор', 'Директор'),
      text: tc('Штатом и наймом занимается директор. Твоя задача — команда на поле.', 'Штатпен және жалдаумен директор айналысады. Сенің міндетің — команда алаңда.') },
    { bg: 'field', cap: tc('Поле', 'Алаң'), cast: ['cme'], sp: 'cme', who: tc('Тренер', 'Бапкер'),
      text: tc('Тактику, покупки и продажи решаешь сам.', 'Тактиканы, сатып алу мен сатуды өзің шешесің.') }
  ];
}
function firedSteps() {
  return { bg: 'dark', cap: tc('Увольнение', 'Босату'), cast: ['ceo', 'cme'], sp: 'ceo', who: tc('Директор', 'Директор'),
    text: tc('Цель сезона не выполнена. Контракт расторгнут.', 'Маусым мақсаты орындалмады. Келісімшарт бұзылды.') };
}

// --- конец сезона (общая часть для игрока и тренера)
function seasonSteps(done, myCup, kind, extra) {
  const me = S && S.mode === 'coach' ? 'cme' : 'hero';
  const steps = [{ bg: 'sun', cap: tc(`Сезон ${done} завершён`, `${done}-маусым аяқталды`), cast: [me], sp: me,
    text: tc('Сезон окончен. Подводим итоги.', 'Маусым аяқталды. Қорытынды шығарамыз.') }];
  if (myCup) steps.push({ bg: 'sun', cap: tc('Кубок', 'Кубок'), cast: [me], sp: me,
    text: tc('Кубок чемпиона у вашего клуба! Команда празднует на поле.', 'Чемпион кубогы сіздің клубта! Команда алаңда мереке жасайды.') });
  if (kind === 'up') steps.push({ bg: 'field', cap: tc('Повышение', 'Көтерілу'), cast: [me], sp: me,
    text: tc('Клуб поднялся в дивизион выше. Новые соперники ждут.', 'Клуб жоғары дивизионға көтерілді. Жаңа қарсыластар күтеді.') });
  if (kind === 'down') steps.push({ bg: 'dark', cap: tc('Вылет', 'Төмендеу'), cast: [me], sp: me,
    text: tc('Клуб вылетел. Теперь задача — вернуться.', 'Клуб түсіп кетті. Енді міндет — қайту.') });
  return steps.concat(extra || []);
}

VIEWS.achv = el => {
  const me = CLUBS[myIdx()];
  const ovr = squadOvr(me.id), titles = (S.trophies || []).filter(x => x.id === me.id).length;
  const list = [
    { ok: titles >= 1, ic: '🏆', ru: 'Первый титул', kz: 'Алғашқы титул', d: 'Выиграть чемпионат', dk: 'Чемпионатты жеңу' },
    { ok: titles >= 3, ic: '👑', ru: 'Династия', kz: 'Әулет', d: 'Выиграть чемпионат 3 раза', dk: 'Чемпионатты 3 рет жеңу' },
    { ok: (S.season || 1) >= 2, ic: '📅', ru: 'Второй сезон', kz: 'Екінші маусым', d: 'Дойти до второго сезона', dk: 'Екінші маусымға жету' },
    { ok: (S.day || 0) >= 100, ic: '⏳', ru: 'Сто дней у руля', kz: 'Жүз күн басқару', d: 'Провести 100 игровых дней', dk: '100 ойын күнін өткізу' },
    { ok: ovr >= 70, ic: '💪', ru: 'Сильный состав', kz: 'Күшті құрам', d: 'Рейтинг состава 70 и выше', dk: 'Құрам рейтингі 70 және жоғары' },
    { ok: ovr >= 80, ic: '⭐', ru: 'Элита', kz: 'Элита', d: 'Рейтинг состава 80 и выше', dk: 'Құрам рейтингі 80 және жоғары' },
    { ok: Math.round(S.pr || 0) >= 80, ic: '📣', ru: 'Уважение', kz: 'Құрмет', d: 'Репутация (PR) 80 и выше', dk: 'Беделі (PR) 80 және жоғары' },
  ];
  const done = list.filter(a => a.ok).length;
  el.innerHTML = `<h2>${tc('Достижения', 'Жетістіктер')}: ${nm(me)}</h2>
    <p class="hint">${done} / ${list.length}</p>
    <div class="achv-list">${list.map(a => `<div class="card achv ${a.ok ? 'on' : ''}"><span class="ic">${a.ok ? a.ic : '🔒'}</span><div><b>${tc(a.ru, a.kz)}</b><small>${tc(a.d, a.dk)}</small></div></div>`).join('')}</div>
    <button class="ghost big" onclick="go('hub')">${t('back')}</button>`;
};
</script>
</body>
</html>
