const c=Math.floor((lo+hi)/2);TS={on:1,i:0,ev:{},ok:0,hl:[],key:'',Z:ZMAKE(c)};
document.documentElement.classList.add('tuton');tutStep(0)}
function tutStep(i){if(i>=TST.length)return tutEnd(1);TS.i=i;TS.ev={};TS.ok=0;TS.key='';const s=TST[i];if(s.on){if(mo&&!s.mh)closeMenu();s.on()}tutRender()}
function tutMini(){TS.mini=!TS.mini;$('adv').classList.toggle('mini',!!TS.mini);tutRender()}
function tutPos(){const a=$('adv');if(a.style.display=='none')return;const t=$('top');let y=t?t.getBoundingClientRect().bottom+4:96;if(!(y>0))y=96;a.style.top=Math.round(y)+'px';document.documentElement.style.setProperty('--ah',Math.round(y+a.offsetHeight+8)+'px')}
function tutRender(){const s=TST[TS.i],a=$('adv');a.style.display='block';a.classList.toggle('mini',!!TS.mini);
a.innerHTML='<div class="ah"><span class="av">🧑‍💼</span><span class="at">'+s.t+'</span><span class="an">'+(TS.i+1)+'/'+TST.length+'</span><button class="mb2" onclick="tutMini()">'+(TS.mini?'▾':'▴')+'</button></div><div class="pr"><i style="width:'+Math.round(TS.i/(TST.length-1)*100)+'%"></i></div>'+s.h()+'<div id="apr" class="st"></div><div class="bt">'+(s.m?'<button class="m" onclick="tutStep('+(TS.i+1)+')">'+(s.mt||'Далее ▶')+'</button>':'<button onclick="tutStep('+(TS.i+1)+')">Пропустить шаг ▶</button>')+(TS.i<TST.length-1?'<button onclick="tutEnd()">✖ Выйти</button>':'')+'</div>';
TS.key=s.h();tutPos()}
function tutEnd(done){TS.on=0;tutHlClear();document.documentElement.classList.remove('tuton');$('adv').style.display='none';try{localStorage.setItem('gsTut','1')}catch(e){}if(done)toast('Обучение завершено. Удачи, мэр!')}
function tutHlClear(){for(const q of TS.hl){q[0].classList.remove('tg');q[0].removeAttribute('data-c')}TS.hl=[]}
function tmenuHL(m){const bs=[...$('mb').querySelectorAll(m.sel||'button.mb')];let r=[];if(m.all)return bs.map(e=>[e,'green']);const e=m.ex?bs.find(b=>b.textContent.trim()==m.ex):bs.find(b=>b.textContent.includes(m.txt));if(e)r.push([e,'green']);return r}
function tutTick(){if(!TS.on)return;tutPos();const s=TST[TS.i];if(!s)return;let L=[];
if(!TS.ok){if(s.hl)L=L.concat(s.hl());if(mo&&s.mh){const m=s.mh(TS_menu);if(m)L=L.concat(tmenuHL(m))}}
L=L.filter(q=>q[0]);
for(const q of TS.hl.slice()){if(!L.some(n=>n[0]==q[0]&&n[1]==q[1])){q[0].classList.remove('tg');q[0].removeAttribute('data-c');TS.hl.splice(TS.hl.indexOf(q),1)}}
for(const n of L){if(!TS.hl.some(q=>q[0]==n[0]&&q[1]==n[1])){n[0].classList.add('tg');n[0].dataset.c=n[1];TS.hl.push(n)}}
const h=s.h();if(h!==TS.key&&!TS.ok)tutRender();
const pe=$('apr');if(pe&&s.pr&&!TS.ok)pe.textContent='📋 '+s.pr();
if(!TS.ok&&s.done&&s.done()){TS.ok=1;const idx=TS.i;if(pe)pe.innerHTML='<span class="ok">✅ Отлично! Задание выполнено</span>';tutHlClear();toast('✅ Задание выполнено');setTimeout(()=>{if(TS.on&&TS.i==idx)tutStep(idx+1)},1100)}}
setInterval(tutTick,250);
function tutDraw(){if(!TS.on||mo||TS.ok)return;const s=TST[TS.i];if(!s||!s.z)return;const a=.5+.5*Math.sin(tm*4),cx=Math.round(cam.x),cy=Math.round(cam.y);
const P=(u,v)=>tp?[cx+u*Q,cy+v*Q]:[(u-v)*16+cx,(u+v)*8+cy];
X.save();X.lineJoin='round';
for(const z of s.z()){const col=TC[z.k],set=new Set(),cl=[];for(const q of z.c){const r=R(q[0],q[1]);set.add(r[0]*1000+r[1]);cl.push(r)}
const has=(u,v)=>set.has(u*1000+v);
if(z.f!==0){X.globalAlpha=.16+.16*a;X.fillStyle=col;X.beginPath();for(const r of cl){const p1=P(r[0],r[1]),p2=P(r[0]+1,r[1]),p3=P(r[0]+1,r[1]+1),p4=P(r[0],r[1]+1);X.moveTo(p1[0],p1[1]);X.lineTo(p2[0],p2[1]);X.lineTo(p3[0],p3[1]);X.lineTo(p4[0],p4[1]);X.closePath()}X.fill()}
X.beginPath();let top=1e9,sxm=0;for(const r of cl){const u=r[0],v=r[1];
if(!has(u,v-1)){const p=P(u,v),q=P(u+1,v);X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1])}
if(!has(u+1,v)){const p=P(u+1,v),q=P(u+1,v+1);X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1])}
if(!has(u,v+1)){const p=P(u,v+1),q=P(u+1,v+1);X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1])}
if(!has(u-1,v)){const p=P(u,v),q=P(u,v+1);X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1])}
const c0=P(u+.5,v+.5);if(c0[1]<top)top=c0[1];sxm+=c0[0]}
X.strokeStyle=col;X.globalAlpha=.3+.25*a;X.lineWidth=4;X.stroke();X.globalAlpha=1;X.lineWidth=1.6;X.stroke();
if(z.l){sxm/=cl.length;const by=top-10-2*a;X.font='bold 9px system-ui,sans-serif';X.textAlign='center';X.lineWidth=3;X.strokeStyle='rgba(0,0,0,.75)';X.strokeText(z.l,sxm,by);X.fillStyle=col;X.fillText(z.l,sxm,by);X.fillText('▼',sxm,by+9)}}
X.restore()}
function tutAuto(){if(!ls('gsTut'))tutAsk()}
acc=0;menu('main');tutAuto();
requestAnimationFrame(loop);
